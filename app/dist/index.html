uptions of this kind.\n\nQuestions to the site office, ground floor, Building B, or facilities@rivergatepark.example."},{"t":"TX.EMAIL","h":"To: facilities@rivergatepark.example\nFrom: p.oyelaran@sundermeyer-actuarial.example\nDate: 18 February\nSubject: Generator hire — Building C","x":"Dear site office,\n\nThank you for the notice. Sundermeyer Actuarial occupies the third and fourth floors of Building C, and the day you have given us is the last day of our quarterly reporting cycle. Our analysts cannot lose it, so I would like to book a portable generator.\n\nPlease confirm that the fee covers the whole building, as the wording suggests. The recruitment agency on our ground floor would also like to keep working and would share the cost with us.\n\nTwo further points. Our server room is cooled by a unit that draws far more power than ordinary office equipment, and I need to know whether the generator will support it. And since our staff will be on site all day, could you confirm that the stairwell doors will unlock from the inside while the entry system is running on battery?\n\nI am writing well inside your deadline, but tell me at once if anything further is needed.\n\nKind regards,\n\nPaulo Oyelaran\nOperations Manager"}],"qs":["MXC-T05-176","MXC-T05-177","MXC-T05-178","MXC-T05-179","MXC-T05-180"]},{"id":"MXC-T05-P7-D2","p":7,"f":"MXT05","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Visitor levy to fund coastal path\nBy Ingrid Sælen, 12 May\n\nKaldvik will introduce a visitor levy of €2.50 per guest per night from 1 October, the town council confirmed on Tuesday. The charge will apply to hotels, guesthouses and licensed short-term rentals, and will be collected by the operator and passed to the council each quarter.\n\nOfficials expect the levy to raise about €1.4 million in its first full year. Roughly two-thirds is earmarked for the long-delayed coastal path between the harbour and Storneset, with the remainder going to public toilets, waste collection and the summer shuttle bus.\n\nGuests staying more than fourteen consecutive nights will be exempt from the fifteenth night onwards, as will anyone travelling for medical treatment.\n\nKaldvik recorded 310,000 overnight stays last year, 18 percent more than five years ago. Councillor Renata Bielawska, who chairs the tourism committee, said the town had “reached the point where visitors must contribute to the infrastructure they use”.\n\nA consultation on the collection procedure closes on 30 June."},{"t":"TX.LETTER","h":"Letter to the editor","x":"To the editor,\n\nI have run a nine-room guesthouse in Kaldvik for twenty-two years, and I am not against the levy in principle. The path your article describes has been promised since before I opened, and the state of the harbour toilets is no advertisement for us. If €2.50 a night buys those things, my guests will pay it without complaint.\n\nMy objection is to who does the collecting. Under this scheme I become an unpaid tax collector: I must add the charge, decide who is exempt, hold the money and file a return four times a year. A hotel with a finance office can absorb that. I cannot, and neither can the eleven other small operators I have spoken to.\n\nThere is an obvious alternative. The council already licenses every operator in the town. Bill the levy once a year, based on the previous year's declared occupancy, and send us a single invoice. The council collects the same money and I get my evenings back.\n\nI would urge the committee to look at this before the consultation closes.\n\nHalldór Jónsson\nSjøhuset Guesthouse"}],"qs":["MXC-T05-181","MXC-T05-182","MXC-T05-183","MXC-T05-184","MXC-T05-185"]},{"id":"MXC-T05-P7-T1","p":7,"f":"MXT05","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.AD","h":"Advertisement","x":"KIRUNA TRANSLATION PARTNERS\nCertified business translation since 2004\n\nStandard — €0.14 per word — delivered in five working days\nPriority — €0.19 per word — delivered in two working days\nSame day — €0.28 per word — ordered before 10:00, delivered by 18:00\n\nCertification for official use, including the sworn translator's stamp and declaration: €45 per document.\n\nVolume agreement: clients who commit to 100,000 words in a calendar year pay the Standard rate on every job, whatever the delivery speed, and are invoiced monthly rather than order by order.\n\nAll prices exclude VAT. Word counts are taken from the source document. Minimum charge €90 per order.\n\nWe work into and out of twenty-two languages, with sworn translators available for eleven of them. Financial, insurance and engineering texts are our specialisms.\n\nQuotations within two hours during office hours: quotes@kirunatranslation.example or +46 8 550 3120."},{"t":"TX.INVOICE","h":"Invoice","x":"KIRUNA TRANSLATION PARTNERS\nInvoice 2024-1187\n\nBill to: Vestberg Marine Insurance, 14 Kaisalmi, Turku\nIssued: 7 April\nPayment due: 7 May\n\nKTP-9042  Policy wording, Swedish into English\n          6,400 words, priority delivery — €1,216.00\n\nKTP-9058  Survey report, English into Finnish\n          2,150 words, standard delivery — €301.00\n\nKTP-9061  Board minutes, English into Swedish\n          900 words, same-day delivery — €126.00\n\n          Certification, 2 documents — €90.00\n\nSubtotal — €1,733.00\nVAT 24% — €415.92\nTotal due — €2,148.92\n\nPlease transfer to the account below, quoting the invoice number. A late payment charge of 1.5% per month applies after the due date."},{"t":"TX.EMAIL","h":"To: accounts@kirunatranslation.example\nFrom: h.vestberg@vestbergmarine.example\nDate: 11 April\nSubject: Invoice 2024-1187 — query","x":"Dear colleagues,\n\nThank you for the invoice. Two of the three order lines are correct; the first is not.\n\nWe signed the volume agreement on 8 January and have sent you just over 40,000 words since then, so every order should be billed at your lowest per-word rate however quickly we need it back. The policy wording has been charged at the faster rate instead. The board minutes were delivered the same day and were billed correctly, which is why I assume the first line is simply an oversight.\n\nCould you reissue the invoice with that line corrected? I would rather pay one corrected invoice than pay this one and wait for a credit note.\n\nOne further question. The certification charge covers two documents, but only the policy wording was returned to us with a stamp, and the survey report is not marked for certification on your order confirmation. Please confirm which two documents you certified.\n\nKind regards,\n\nHanna Vestberg\nHead of Underwriting Support"}],"qs":["MXC-T05-186","MXC-T05-187","MXC-T05-188","MXC-T05-189","MXC-T05-190"]},{"id":"MXC-T05-P7-T2","p":7,"f":"MXT05","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"FJALLSTIGEN GUIDED WALKS — Autumn programme\nfjallstigen.example/book\n\nRidge Traverse — 3 days, 2 nights in mountain huts — €430 per person\n  Departures: 5, 12, 19 and 26 September\n\nLake Circuit — 2 days, 1 night — €245 per person\n  Departures: every Saturday from 6 September to 25 October\n\nValley Walk — 1 day, no overnight stay — €95 per person\n  Departures: Wednesdays and Sundays throughout the season\n\nEvery price includes the guide, hut accommodation, evening meals and baggage transfer between huts. Boots and waterproofs are not supplied; a kit list is sent when you book.\n\nGroups are limited to twelve walkers, and four is the minimum for a departure to run. If fewer than four have booked seven days before departure, we will offer you a transfer to another date or a full refund.\n\nTravel insurance is strongly recommended and is not included in the price. Please read our booking conditions before you pay."},{"t":"TX.NOTICE","h":"Policy","x":"FJALLSTIGEN GUIDED WALKS — Booking conditions (extract)\n\n3. Payment\nA deposit of 30 percent is due when the booking is made. The balance is due 30 days before departure. Bookings made within 30 days of departure must be paid in full at once.\n\n4. Cancellation by the walker\nMore than 60 days before departure: the deposit is refunded in full.\nBetween 60 and 30 days: the deposit is retained; nothing further is charged.\nBetween 29 and 8 days: 50 percent of the total price is retained.\nWithin 7 days: no refund is given.\n\n5. Change of date by the walker\nOne change of date may be made free of charge up to 30 days before departure, subject to availability on the new date. A later change, or a second change, is treated as a cancellation under clause 4 followed by a new booking.\n\n6. Weather\nWe do not cancel for rain. If a route is closed by the authorities, walkers are offered an alternative route on the same dates or a full refund."},{"t":"TX.EMAIL","h":"To: bookings@fjallstigen.example\nFrom: m.aguirre@correo.example\nDate: 2 August\nSubject: Booking FJ-4471 — change of date","x":"Hello,\n\nOn 12 July I booked the three-day walk leaving on 12 September for two people and paid the deposit that day. My colleague has since been called to a client meeting that week, so we would like to move to the last September departure instead.\n\nAs I read your conditions, this is our first change and we are still comfortably outside the limit, so there should be nothing extra to pay. Please tell me if I have misunderstood.\n\nTwo other things. On what date exactly will the balance be taken for the new departure? And the long-range forecast for late September looks poor — if it rains hard for three days, do we simply walk in it?\n\nThank you,\n\nMariana Aguirre"}],"qs":["MXC-T05-191","MXC-T05-192","MXC-T05-193","MXC-T05-194","MXC-T05-195"]},{"id":"MXC-T05-P7-T3","p":7,"f":"MXT05","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\nSolvind Energi to extend evening service hours\n\nBergen, 14 October — Solvind Energi, which supplies electricity to 480,000 households across the western region, announced today that its telephone service centre will stay open until 21:00 on weekdays from 5 January, three hours later than at present.\n\nThe decision follows the company's annual customer survey, completed in September by 6,200 households. “Our customers told us plainly that they cannot call us between nine and six because they are at work,” said Ingvild Røstad, Director of Customer Operations. “Answering that is the single most useful thing we can do this year.”\n\nFrom the same date the company's home page will display estimated waiting times, so that callers can choose a quieter moment.\n\nSolvind has recruited 45 additional advisers, who begin training in November. No existing role will be affected by the change.\n\nMedia contact: press@solvindenergi.example"},{"t":"TX.APP_FORM","h":"Survey results","x":"SOLVIND ENERGI — Annual customer survey, September\n6,200 responses\n\n“Which single change would improve your experience most?” (one answer only)\n\n1. Longer telephone service hours — 34%\n2. A clearer bill — 27%\n3. Shorter waiting times when calling — 19%\n4. An app for submitting meter readings — 12%\n5. More payment dates to choose from — 8%\n\n“How would you rate your last contact with us?”\nVery satisfied 21% — Satisfied 38% — Neither 22% — Dissatisfied 13% — Very dissatisfied 6%\n\nSubjects raised most often in free-text comments: opening hours (1,940 mentions), bill layout (1,505), meter-reading errors (870), the tone of advisers (240)."},{"t":"TX.MEMO","h":"To: All service centre advisers\nFrom: Ingvild Røstad\nDate: 20 October\nSubject: Evening shifts from January","x":"You will have seen last week's announcement. I want to set out what it means for this team.\n\nFrom 5 January the centre closes at 21:00 on weekdays. Saturday hours are unchanged and we will still not open on Sundays.\n\nNo one currently on the team is required to work the new evening slot. The 45 advisers we are recruiting are being hired for it, and they join us for training on 3 November. If you would like to move to evenings, the allowance is €4.20 per hour worked after 18:00; speak to your team leader before 15 November.\n\nThe second item on the survey list is not being ignored either. It is with the printers now and will reach customers in March.\n\nFrom 5 January the home page will also show live waiting times, which makes the third item on that list visible to every caller. Please read the briefing note before then."}],"qs":["MXC-T05-196","MXC-T05-197","MXC-T05-198","MXC-T05-199","MXC-T05-200"]},{"id":"MXC-T06-P6-B1","p":6,"f":"MXT06","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO RESIDENTS\nLift modernisation — Marden Court, north tower\n\nWork to replace the building's two passenger lifts will begin on Monday 6 April and is {{131}} to take eleven weeks.\n\nThroughout the programme only one lift will be in service at any time, so waiting times will be longer than usual. Residents are asked to allow extra time {{132}} the morning rush, particularly between 8 A.M. and 9 A.M.\n\nThe goods lift will remain available for deliveries and house moves, but it must be booked at the concierge desk at least twenty-four hours ahead. {{133}} Bookings are taken between 7 A.M. and 7 P.M., seven days a week.\n\nWe recognise that the disruption is considerable. The new cars will be quieter, faster and step-free at every landing, and by the end of June both lifts {{134}} back in service. The service charge will not increase as a result of the work.\n\nKestrel Property Services"}],"qs":["MXC-T06-131","MXC-T06-132","MXC-T06-133","MXC-T06-134"]},{"id":"MXC-T06-P6-B2","p":6,"f":"MXT06","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Production supervisors\nFrom: Dilnoza Karimova, Learning and Development\nDate: 12 February\nSubject: Places on the March safety-leadership course","x":"Eight places on the two-day safety-leadership course have been reserved for our site, and every place must be filled by 26 February. {{135}} Nominations should therefore reach me by the end of next week.\n\nThe course is run at the Ferrow Institute and {{136}} both classroom sessions and a supervised walk-round of a working plant. Anyone who finishes it receives a certificate recognised across the sector.\n\nTravel and accommodation are arranged centrally, so please do not book tickets yourself. Supervisors are reminded {{137}} their team rotas before putting a name forward, as the two days are consecutive.\n\nIf more than eight names come in, priority {{138}} to supervisors who have not attended external training in the past two years. The $640 fee is met by the departmental budget."}],"qs":["MXC-T06-135","MXC-T06-136","MXC-T06-137","MXC-T06-138"]},{"id":"MXC-T06-P6-B3","p":6,"f":"MXT06","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\n\nTalvern Drivetrain opens rebuilt foundry in Gliwice\n\nGLIWICE, 3 May — Talvern Drivetrain today opened its rebuilt light-alloy foundry in Gliwice, eighteen months after production was transferred to a temporary site so that the original works could be demolished. The new plant is {{139}} larger than the one it replaces and will employ 210 people, forty more than before.\n\nThe rebuild cost $46 million and puts two electric melting furnaces in place of the gas units used previously. Talvern says the change will cut energy consumption per tonne by roughly a third {{140}} shortening the time needed to switch between alloys.\n\n“We could have rebuilt what we had,” said plant director Sunniva Aarø. “We chose instead to design a foundry {{141}} will still be competitive in ten years' time.”\n\nOutput will build up over the summer, with full production expected in September. {{142}}"}],"qs":["MXC-T06-139","MXC-T06-140","MXC-T06-141","MXC-T06-142"]},{"id":"MXC-T06-P6-B4","p":6,"f":"MXT06","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All staff, Alderway House\nFrom: Facilities Management\nDate: 19 October\nSubject: Move to Unit 7, Ashgrove Park\n\nOur lease on Alderway House ends on 31 January and will not be renewed. From 3 February we will occupy the ground floor of Unit 7, Ashgrove Park, which gives us 1,400 square metres on a single level. For the first time {{143}} of the four departments will have a meeting room of its own.\n\n{{144}} A shuttle bus will run from the station to the park every fifteen minutes between 7:30 A.M. and 9:30 A.M., and again from 4:30 P.M.\n\nCrates will be delivered to each floor in the third week of January. Personal items left in the building after the final Friday {{145}} be recovered, since the keys are handed to the landlord the following morning.\n\nFloor plans are on the intranet. Please send seating requests to me by 15 November so that they can be taken into account {{146}} the layout is fixed."}],"qs":["MXC-T06-143","MXC-T06-144","MXC-T06-145","MXC-T06-146"]},{"id":"MXC-T06-P7-S1","p":7,"f":"MXT06","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All production supervisors\nFrom: Ingrid Halvorsen, Plant Operations Manager\nDate: 12 March\nSubject: Calibration of line 4\n\nThe optical inspection unit on line 4 will be recalibrated on Thursday 19 March. Engineers from Kesselring Systems arrive at 6:00 A.M. and expect the work to take about seven hours, so line 4 will not run that day.\n\nPlease move your Thursday output targets for line 4 to Friday and Saturday. Overtime for Saturday has been approved; send me the names by Monday 16 March so that the canteen can be staffed.\n\nLine 3 keeps its normal schedule. However, the calibration rig draws on the same compressed-air supply, so line 3 operators may notice slightly slower tool cycling between 9:00 A.M. and noon.\n\nSupervisors do not need to be present for the calibration itself, but I will need one person from each shift to sign off the first inspection run on Friday morning."}],"qs":["MXC-T06-147","MXC-T06-148"]},{"id":"MXC-T06-P7-S2","p":7,"f":"MXT06","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Petra Wojcik (10:14 A.M.)\nThe tenants in 6B have reported that the balcony door will not lock. Is there anyone on the approved list who could come today?\n\nDaniel Okonkwo (10:16 A.M.)\nVale Hardware usually can, but they charge a call-out fee for anything booked after 11:00. Shall I ring them now?\n\nPetra Wojcik (10:18 A.M.)\nPlease do. It is a ground-floor unit, so I would rather not leave it open overnight.\n\nDaniel Okonkwo (10:23 A.M.)\nBooked for 12:40. The fee applied, but they waived it because we have three buildings on their contract.\n\nPetra Wojcik (10:25 A.M.)\nThat is the third balcony door in that block this year. Let us have the whole row looked at before the winter.\n\nDaniel Okonkwo (10:26 A.M.)\nI will ask them to quote for it while they are on site."}],"qs":["MXC-T06-149","MXC-T06-150"]},{"id":"MXC-T06-P7-S3","p":7,"f":"MXT06","k":"single","tt":"TX.AD","docs":[{"t":"TX.AD","h":"Advertisement","x":"ASHGROVE TECHNICAL INSTITUTE\nEvening certificate programmes — autumn intake\n\nSix courses, all taught on our Riverside campus between 6:00 P.M. and 9:00 P.M.\n\nIndustrial Maintenance — Mondays, 14 weeks — $980\nQuality Systems Auditing — Tuesdays, 10 weeks — $720\nWarehouse and Inventory Control — Tuesdays, 12 weeks — $760\nTechnical Drawing (CAD) — Wednesdays, 16 weeks — $1,140\nWorkplace Health and Safety — Thursdays, 8 weeks — $540\nProject Coordination — Thursdays, 12 weeks — $860\n\nFees cover all materials and the final examination. Learners whose employer pays the fee directly are invoiced when the course ends rather than in advance.\n\nEvery course leads to a certificate recognised by the regional manufacturers' association, and class sizes are capped at eighteen.\n\nRegistration closes on 5 September. Applicants who register before 22 August pay no administration charge; after that date a charge of $45 applies.\n\nAsk about our Saturday laboratory sessions, open free of charge to anyone enrolled in a Wednesday course."}],"qs":["MXC-T06-151","MXC-T06-152","MXC-T06-153"]},{"id":"MXC-T06-P7-S4","p":7,"f":"MXT06","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Beatriz Salgado <b.salgado@northfieldlabs.example>\nFrom: Karolina Brzezinska <k.brzezinska@harborstone.example>\nDate: 3 October\nSubject: Lift modernisation — Fenwick Court","x":"Dear Ms. Salgado,\n\nBoth passenger lifts at Fenwick Court are original to the 1978 building and have become steadily more expensive to maintain. The owners have now released funds to replace the drive systems and controllers in both cars.\n\nWork begins on 2 November and will run for roughly nine weeks. The contractor takes one lift out of service at a time, so a single car stays available throughout. During the changeover week of 21 December, however, both cars will be down for four days.\n\nBecause your laboratory occupies the fifth and sixth floors, this will be more disruptive for you than for our ground-floor tenants. If you would like to bring deliveries of heavy equipment forward, the goods entrance on Marlow Lane can be reserved for your exclusive use on any weekday in October at no cost.\n\nPlease let me know by 17 October whether you wish to book it.\n\nKind regards,\n\nKarolina Brzezinska\nBuilding Manager, Harborstone Property Services"}],"qs":["MXC-T06-154","MXC-T06-155","MXC-T06-156"]},{"id":"MXC-T06-P7-S5","p":7,"f":"MXT06","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Small Manufacturers Share the Cost of Testing\n\nRIVERTON (14 May) — Nineteen precision-parts makers in the Riverton industrial district have formed a cooperative to buy testing equipment that none of them could justify on its own.\n\nThe group's first purchase, a computed-tomography scanner installed in a leased unit on Kilner Road, allows a finished component to be inspected internally without being cut open. [1] Members book time on the machine through a shared calendar and are billed by the hour.\n\n“We were each sending parts to a laboratory two hundred kilometres away and waiting nine days for a report,” said Adaeze Nwachukwu, who runs a twelve-person machine shop and chairs the cooperative. “Now it is the same afternoon.” [2]\n\nMembership costs $4,000 a year plus usage fees. [3] The cooperative estimates that a member sending forty components a year for inspection recovers the subscription within seven months.\n\n[4] A second unit, for surface-roughness measurement, is expected before the end of the year, and the group has opened discussions with the technical institute about using the scanner for student projects two evenings a week."}],"qs":["MXC-T06-157","MXC-T06-158","MXC-T06-159"]},{"id":"MXC-T06-P7-S6","p":7,"f":"MXT06","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Tobias Lindqvist (8:02 A.M.)\nThe crane operator reads 14 metres per second on the mast anemometer. Our limit for lifting the roof panels is 12.\n\nRosa Mendieta (8:04 A.M.)\nThen the panels do not go up today. What else can the team get on with?\n\nTobias Lindqvist (8:06 A.M.)\nGround-floor blockwork, or they can start setting out the plant room. Neither needs the crane.\n\nRosa Mendieta (8:07 A.M.)\nSet out the plant room. The blockwork gang is not on site until Wednesday and I would rather not have two trades in the same bay.\n\nTobias Lindqvist (8:09 A.M.)\nUnderstood. One thing — the plant-room drawings in the site office are revision C. Friday's e-mail mentioned a revision D.\n\nRosa Mendieta (8:12 A.M.)\nDo not touch anything until I send it. Give me ten minutes.\n\nTobias Lindqvist (8:13 A.M.)\nWill do. I will have them clear the delivery bay in the meantime."}],"qs":["MXC-T06-160","MXC-T06-161","MXC-T06-162"]},{"id":"MXC-T06-P7-S7","p":7,"f":"MXT06","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO ALL OCCUPIERS — Wharfedale Business Park\nResurfacing of the north car park\n\nThe north car park will be resurfaced between Monday 6 April and Friday 17 April. For those two weeks it is closed completely, including the loading bays behind Units 9 to 14.\n\nAlternative arrangements\n\nStaff parking: the overflow area on Tannery Lane opens at 6:30 A.M. Permits are not required, but please display your unit number on the dashboard.\n\nDeliveries: use the south gate. The barrier is staffed from 7:00 A.M. to 6:00 P.M. Vehicles over 7.5 tonnes must book a slot with the estate office at least one working day ahead.\n\nWaste collection: bins move to the paved area beside Unit 3 for the duration of the work.\n\nThe cycle racks are unaffected.\n\nThe contractor works until 8:00 P.M. on weekdays and does not work at weekends. Noise will be heaviest during the first three days, when the existing surface is broken out.\n\nQuestions and complaints: estate office, extension 214."}],"qs":["MXC-T06-163","MXC-T06-164","MXC-T06-165"]},{"id":"MXC-T06-P7-S8","p":7,"f":"MXT06","k":"single","tt":"TX.JOB_POSTING","docs":[{"t":"TX.JOB_POSTING","h":"Job posting","x":"MAINTENANCE ENGINEER (NIGHT SHIFT)\nSolvarn Components — Ostrava plant\n\nSolvarn Components moulds and finishes technical plastics for the appliance industry. Our Ostrava plant runs continuously, and we are recruiting a maintenance engineer for the night shift.\n\nThe role\nYou will keep sixteen injection-moulding machines and their ancillary equipment running between 10:00 P.M. and 6:00 A.M., four nights on and four nights off. Roughly two thirds of the work is planned maintenance; the rest is breakdown response.\n\nEssential\n- A recognised qualification in mechanical or electrical engineering\n- At least three years in a manufacturing environment, ideally with hydraulic systems\n- Willingness to be first responder to alarms during your shift\n\nDesirable\n- Experience of tool changes on machines above 300 tonnes\n- Confidence reading engineering drawings in English\n\nWhat we offer\nSalary from $61,000, reviewed after six months. Night allowance of 18%. Four weeks of paid training at our Gdansk plant before you join the line in Ostrava. The company funds one professional course a year.\n\nSend a CV to careers@solvarn.example. We do not accept applications submitted through agencies."}],"qs":["MXC-T06-166","MXC-T06-167","MXC-T06-168","MXC-T06-169"]},{"id":"MXC-T06-P7-S9","p":7,"f":"MXT06","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Information","x":"CANDIDATE INFORMATION — Certified Lifting Supervisor (Level 2)\nHalberd Training Centre\n\nAssessment takes place on the final afternoon of the course and has three parts.\n\nWritten paper (45 minutes). Forty multiple-choice items on load calculation, sling selection and exclusion zones. The pass mark is 30.\n\nPractical observation (about 90 minutes per candidate). You will plan and direct two lifts using the yard gantry. An assessor records whether each step of the plan is briefed to the team before the lift begins.\n\nOral review (15 minutes). The assessor discusses your decisions with you. This part carries no marks, but a candidate who cannot account for a choice made during the practical may be asked to repeat that lift.\n\nResults are issued within ten working days. A candidate who fails one part only may re-sit that part once, free of charge, within six months. A candidate who fails two or more parts must repeat the whole course at the standard fee.\n\nBring photographic identification and your own safety footwear. All other equipment is provided."}],"qs":["MXC-T06-170","MXC-T06-171"]},{"id":"MXC-T06-P7-S10","p":7,"f":"MXT06","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"https://www.calderhouse-lettings.example/landlords\n\nCalderhouse Lettings — services for landlords\nHome | Properties | Landlords | Tenants | Contact\n\nWe have managed homes across the county since 1996 and look after 1,400 of them today. Choose the level of service that suits you.\n\nLet Only — 8% of the first year's rent\nWe advertise the property, hold the viewings, take up references and draw up the tenancy agreement. From then on you deal with the tenant yourself.\n\nManaged — 11% of the rent, collected monthly\nEverything in Let Only, plus rent collection, quarterly inspections and a 24-hour repairs line. Contractors are instructed by us; you approve anything above $400.\n\nManaged Plus — 14% of the rent, collected monthly\nEverything in Managed, plus rent guarantee insurance and annual safety certificates at no extra charge.\n\nLandlords who add a property before 30 June pay no set-up fee on any plan. After that date a set-up fee of $220 applies.\n\nInspection reports include dated photographs and reach your online account within two working days of the visit. We send you a text message as soon as a report is ready.\n\nNot sure which plan fits? Call 555 0142 and ask for the landlord team."}],"qs":["MXC-T06-172","MXC-T06-173","MXC-T06-174","MXC-T06-175"]},{"id":"MXC-T06-P7-D1","p":7,"f":"MXT06","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\nContact: Ingrid Halvorsen, Communications Office — press@aalstrup.example\n\nAALSTRUP COMPONENTS TO OPEN THIRD PLANT AT RIVERMOUTH\n\n11 January — Aalstrup Components announced today that its new plant at the Rivermouth Industrial Park will begin production on 2 March. The 14,000-square-metre facility will manufacture aluminium housings for electric motors, a line currently produced only at the company's plant in Sandvik.\n\nThe plant will employ 130 people at opening, rising to about 200 by the end of next year. Recruitment for machine operators and quality inspectors is already under way. A further round, for maintenance engineers, opens in April.\n\nAalstrup will hold an open house at the site on Friday 14 February, from 10:00 to 16:00. Visitors must register by 7 February. Tours of the assembly floor will be led by plant manager Ifeoma Balogun.\n\nAalstrup Components has supplied the motor industry since 1974 and employs 900 people across three sites."},{"t":"TX.EMAIL","h":"To: press@aalstrup.example\nFrom: p.rezende@rivermouthtech.example\nDate: 10 February\nSubject: Open house — apprentice group","x":"Dear Ms. Halvorsen,\n\nI coordinate the technical apprenticeship programme at Rivermouth Technical College, two kilometres from your new site. I would like to bring fourteen second-year apprentices to the open house on the 14th. They already spend three days a week in workshops of their own, and seeing a plant at this stage would be worth a term of classroom work.\n\nTwo requests. First, could Ms. Balogun give the group fifteen minutes after the floor tour? The apprentices have prepared questions about how a new line is commissioned. Second, could you confirm whether the round of hiring you mention for April will consider candidates who finish our programme in June? Six of the fourteen are in that position.\n\nWe can arrive at whatever hour suits you.\n\nKind regards,\n\nPaulo Rezende\nRivermouth Technical College"}],"qs":["MXC-T06-176","MXC-T06-177","MXC-T06-178","MXC-T06-179","MXC-T06-180"]},{"id":"MXC-T06-P7-D2","p":7,"f":"MXT06","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.AD","h":"Advertisement","x":"LARKSPUR PROFESSIONAL INSTITUTE — Autumn evening programme\n\nCertificate in Project Scheduling — 8 weeks, Tuesdays 18:30-21:00 — $640\nCertificate in Industrial Quality Systems — 10 weeks, Wednesdays 18:00-20:30 — $780\nCertificate in Contract Negotiation — 6 weeks, Thursdays 18:30-21:00 — $520\nDiploma in Plant Maintenance Management — 16 weeks, Mondays and Thursdays 18:00-21:00 — $1,950\n\nEvery certificate fee covers the examination, printed course notes and twelve months' access to our online library. The diploma adds two Saturday workshops in our machine hall.\n\nAn employer registering three or more members of staff on the same course pays 15 percent less for each place.\n\nCourses beginning on or after 1 October are taught in our new Harbour Street building. Earlier intakes remain at Fenwick Road until the move is complete.\n\nEnrol at larkspur.example/autumn or call 555-0148. A place is confirmed only on payment."},{"t":"TX.REVIEW","h":"Customer review","x":"Certificate in Industrial Quality Systems — September intake\nReviewer: Danuta Wrzesniewski, quality supervisor\nRating: 4 out of 5\n\nMy employer sent four of us on the course together, which brought the cost of each place down usefully. The instructor, Kwabena Osei, has run a testing laboratory for twenty years, and every rule he taught came with a story about the day somebody ignored it. I passed the examination in November.\n\nTwo complaints. Our intake began on 10 September, so we spent all ten weeks at Fenwick Road, where the heating fails roughly one evening in three. The photographs on the website had led me to expect otherwise. The printed notes also reached us only in week four, by which time most of us had copied them out by hand.\n\nThe online library, though, is excellent, and I still use it every week at my desk. It is the reason I have signed up for the six-week negotiation course in the spring."}],"qs":["MXC-T06-181","MXC-T06-182","MXC-T06-183","MXC-T06-184","MXC-T06-185"]},{"id":"MXC-T06-P7-T1","p":7,"f":"MXT06","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.JOB_POSTING","h":"Job posting","x":"CORVINA ESTATES — Assistant Property Manager, Northside portfolio\n\nCorvina Estates manages 42 residential buildings in and around the city. We are seeking an Assistant Property Manager to support the six-person Northside team.\n\nDuties: coordinating contractor visits, preparing monthly service-charge statements, carrying out quarterly inspections of fourteen buildings, and answering tenant enquiries within one working day.\n\nRequired:\n- Three years in residential property management\n- A current property licence\n- A driving licence; the portfolio extends 30 kilometres\n\nDesirable: experience with the Tenantly maintenance platform; a second language.\n\nSalary $54,000-$61,000 according to experience, with a vehicle allowance.\n\nSend a résumé and a one-page letter to careers@corvinaestates.example by 20 May. Shortlisted applicants will be seen at our Harrow Lane office in the first week of June. Every interview includes a written exercise on service-charge calculation.\n\nCorvina Estates has managed property in the region since 1998."},{"t":"TX.EMAIL","h":"To: n.aguirre@postbox.example\nFrom: s.okonkwo@corvinaestates.example\nDate: 27 May\nSubject: Interview, Thursday 5 June","x":"Dear Ms. Aguirre,\n\nThank you for your application. We would like to see you on Thursday 5 June; the schedule for the day is attached. Yours is the second panel interview of the morning.\n\nPlease allow ninety minutes in total. The panel takes forty-five minutes, and the written exercise described in our advertisement follows immediately afterwards in Room 5 and lasts the same length of time.\n\nTwo notes. Your letter mentions two years with the Tenantly platform, and the Northside team will certainly want to ask you about it. Please also bring the original of your licence; we cannot accept a photocopy for our records.\n\nParking at Harrow Lane is limited to eight spaces. The Bellamy Street car park is a five-minute walk away.\n\nKind regards,\n\nSelina Okonkwo\nHuman Resources"},{"t":"TX.SCHEDULE","h":"Schedule","x":"Assistant Property Manager — panel interviews\nThursday 5 June, Harrow Lane office, Room 3\n\n09:00  Bartosz Nowicki\n10:00  Nerea Aguirre\n11:15  Hyun-woo Chang\n13:30  Marguerite Okafor\n14:30  Tomas Lindqvist\n\nPanel: Selina Okonkwo (Human Resources), Dev Raman (Northside team leader), Marisol Quintero (Finance)\n\nWritten exercises are taken in Room 5 and are supervised by the reception team. Candidates should report to the front desk ten minutes before their panel interview. Coffee is available in the ground-floor waiting area.\n\nA decision is expected by 13 June. Candidates who are not selected will be told by telephone."}],"qs":["MXC-T06-186","MXC-T06-187","MXC-T06-188","MXC-T06-189","MXC-T06-190"]},{"id":"MXC-T06-P7-T2","p":7,"f":"MXT06","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO TENANTS — Ashgrove Court\nFrom the office of the building manager\n3 April\n\nLift modernisation: 5 May to 27 June\n\nThe two passenger lifts will be replaced one after the other, so one lift remains in service throughout. Journeys will be slower than usual.\n\nDeliveries to floors above the third should be arranged before 09:00 or after 17:00, when the working lift is least busy. The goods lift at the rear is unaffected and may be reserved at the front desk in half-hour slots.\n\nThe cost of the work is divided among tenants in proportion to floor area and appears on the second-quarter service-charge invoice under “capital works”. Tenants of ground-floor units are exempt from this item under clause 14 of the standard lease.\n\nQuestions: Aurelie Fontaine, building manager, 555-0193."},{"t":"TX.INVOICE","h":"Invoice","x":"ASHGROVE COURT — Quarterly service charge\nInvoice 2Q-1187\n\nBilled to: Steinhaus Design Studio, Unit 402\nPeriod: 1 April - 30 June\nIssued: 5 July\nPayment due: 4 August\n\nCleaning and waste removal      $1,120\nSecurity                        $860\nHeating and ventilation         $1,405\nGrounds and car park            $390\nCapital works (lifts)           $2,340\n\nTotal                           $6,115\n\nPayment by bank transfer to the account shown below. A late fee of 2 percent of the total is added to any balance outstanding after the due date.\n\nQueries about an item on this invoice must be raised in writing within fourteen days of the issue date. The floor-area statements used in the calculation may be obtained from the building manager."},{"t":"TX.EMAIL","h":"To: a.fontaine@ashgrovecourt.example\nFrom: l.steinhaus@steinhausdesign.example\nDate: 21 July\nSubject: Invoice 2Q-1187","x":"Dear Ms. Fontaine,\n\nTwo points on the invoice that reached us this month.\n\nFirst, the capital works line. Our studio occupied Unit 006, at street level, until 31 May and moved up to Unit 402 only on 1 June. We have therefore been charged for the lift work across a quarter in which we spent two of the three months on the ground floor. I would be grateful if you would look at the figure again.\n\nSecond, we take delivery of two cutting machines on the morning of 6 August and will need the goods lift for roughly two hours. The front desk tells me it cannot be held for longer than thirty minutes at a time. Could an exception be arranged?\n\nKind regards,\n\nLena Steinhaus\nSteinhaus Design Studio"}],"qs":["MXC-T06-191","MXC-T06-192","MXC-T06-193","MXC-T06-194","MXC-T06-195"]},{"id":"MXC-T06-P7-T3","p":7,"f":"MXT06","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"INSTITUTE OF APPLIED MANUFACTURING\nAnnual Practice Forum — 8-9 October, Delaney Convention Centre\n\nRegistration\nFull forum, both days — $430 members / $560 non-members\nSingle day — $250 members / $330 non-members\nWorkshop supplement (Thursday afternoon, 25 places) — $95\n\nRegistration closes on 26 September. Places in the Thursday workshop are allocated in the order in which payments arrive; last year the workshop was full ten days before that closing date.\n\nA member of the Institute may nominate one colleague to attend at the member rate. Registrations may be refunded until 19 September; after that date a registration may be transferred to another person but not refunded.\n\nThe Delaney Convention Centre is a four-minute walk from Ardmore station. Parking is not included in registration and must be reserved through the venue.\n\nEnquiries: forum@iam.example"},{"t":"TX.SCHEDULE","h":"Agenda","x":"ANNUAL PRACTICE FORUM — Thursday 8 October\n\n08:30  Registration and coffee — Foyer\n09:15  Opening address: “Where maintenance budgets actually go”, Dr. Halina Zawadzka — Auditorium\n10:30  Track A: Predictive maintenance in small plants — Room 2\n10:30  Track B: Certifying welded assemblies — Room 3\n12:00  Lunch — Riverside Hall\n13:30  Workshop: Reading vibration data (25 places) — Room 5\n13:30  Track C: Planning a shutdown week — Room 2\n16:00  Panel: Recruiting and keeping technicians — Auditorium\n17:15  Close of day one\n\nFriday 9 October opens at 09:30 with the annual lecture, followed by three further tracks and the members' meeting at 15:00."},{"t":"TX.MEMO","h":"To: Engineering staff\nFrom: Hendrik Vosloo, Engineering Manager\nDate: 12 September\nSubject: Practice Forum, October","x":"Four places at this year's forum have been approved.\n\nAiko Tanaka will attend both days. She joined us in March and is not yet a member of the Institute, so I have nominated her for the place my own membership allows; register her at that rate.\n\nPriya Ganguly and Osman Demir will attend on the Thursday only. Both should take the vibration workshop, and both should book it at the moment they register rather than nearer the date, or they will not get in. I will be there for both days myself.\n\nEveryone should travel by train. We will not pay for parking at the venue.\n\nSend me your confirmation numbers by 19 September. Anyone who finds after that date that they cannot go should tell me at once, so that the place can be passed to a colleague.\n\nHendrik"}],"qs":["MXC-T06-196","MXC-T06-197","MXC-T06-198","MXC-T06-199","MXC-T06-200"]}],"nodes":[{"id":"FD","nm":"基础层（读懂句子与篇章的底层能力）","l":"foundation","pa":null,"w":0.7,"bd":400,"g":1},{"id":"FD.SENT","nm":"句子结构基础","l":"foundation","pa":"FD","w":0.55,"bd":400,"g":1},{"id":"FD.SENT.CORE","nm":"主谓宾/五种基本句型识别","l":"foundation","pa":"FD.SENT","w":0.55,"bd":400,"g":0},{"id":"FD.SENT.CLAUSE_COUNT","nm":"谓语与连接词计数","l":"foundation","pa":"FD.SENT","w":0.4,"bd":400,"g":0},{"id":"FD.SENT.MODIFIER_STRIP","nm":"剥离修饰语找主干","l":"foundation","pa":"FD.SENT","w":0.4,"bd":400,"g":0},{"id": "ti":"看选项判题型","wr":"先看四个选项，再决定这句读多少。","r":"先扫四个选项判断题型（词性/动词形态/介连副/代词/词汇），语法类只看空格周边，词汇类读全句。","ns":["QT.P5.IDENTIFY","QT.P6.INDEPENDENT","ST.LOCATE.DEPTH_BY_QTYPE"],"p":[5,6],"w":0.85,"pm":1},{"id":"SL-P5-02","ti":"词性题看空格位置","wr":"只看空格前后两三个词定词性，5–15 秒交卷。","r":"限定词/介词后→名词；名词前、be/系动词后→形容词；完整句中修饰动词/形容词/全句→副词；a/an(+very)+adj+n、adj and adj 同词性。","ns":["QT.P5.WORD_FORM","QT.P6.INDEPENDENT","ST.TIME.PER_ITEM_P5","GR.POS","GR.POS.NOUN_AFTER_DET","GR.POS.NOUN_AFTER_PREP","GR.POS.ADJ_BEFORE_NOUN","GR.POS.ADJ_COMPLEMENT","GR.POS.ADV_VERB","GR.POS.ADV_ADJ","GR.POS.ADV_AUX_SLOT","GR.POS.ADV_SENTENCE"],"p":[5,6],"w":0.85,"pm":1},{"id":"SL-P5-03","ti":"同是名词再辨人/物与可数","wr":"名词定了别急着选：人还是物？要不要加 s？","r":"填名词时再看可数/不可数、限定词搭配、人名词 vs 事物名词、复合名词。","ns":["QT.P5.WORD_FORM","GR.POS.NOUN_COUNT","GR.POS.NOUN_PERSON_THING","GR.POS.NOUN_COMPOUND"],"p":[5],"w":0.49,"pm":1},{"id":"SL-P5-04","ti":"数谓语和连接词","wr":"数一数：一个连接词配两个谓语，少了谁就补谁。","r":"先数句子的谓语动词与连接词：缺谓语填限定动词；已有谓语则填非谓语或连接成分。","ns":["QT.P5.VERB_FORM","QT.P5.CONNECTOR_MIX","FD.SENT.CLAUSE_COUNT","GR.POS.VERB_SLOT"],"p":[5,6],"w":0.31,"pm":1},{"id":"SL-P5-05","ti":"删修饰找主干","wr":"长句先砍枝叶，只留主干再填空。","r":"先划掉介词短语、分词短语、插入从句，找到主谓宾后再判断空格成分。","ns":["QT.P5.WORD_FORM","QT.P5.VERB_FORM","FD.SENT.MODIFIER_STRIP","FD.SENT.LONG"],"p":[5,6,7],"w":0.63,"pm":1},{"id":"SL-P5-06","ti":"动词题四步排查","wr":"动词题按“谓语？→主被动→时态→单复数”过四道闸。","r":"先判谓语还是非谓语 → 再定主动/被动 → 再定时态 → 最后查主谓一致（数）。","ns":["QT.P5.VERB_FORM","QT.P6.CTX_TENSE","GR.VERB","GR.VERB.AGREE_SV","GR.VERB.VOICE_PASSIVE","GR.VERB.TENSE_SIMPLE","GR.VERB.TENSE_PERFECT","GR.VERB.TENSE_FUTURE_CLAUSE"],"p":[5,6],"w":0.53,"pm":1},{"id":"SL-P5-07","ti":"非谓语看搭配与主被动","wr":"to do 还是 -ing 看前面的词；-ing/-ed 看名词是主动做还是被做。","r":"记住只接 to do / 只接 -ing 的词；分词按与被修饰名词的主被动关系选 -ing 或 -ed。","ns":["QT.P5.VERB_FORM","GR.NONFIN","GR.NONFIN.TO_INF","GR.NONFIN.GERUND","GR.NONFIN.PARTICIPLE_MODIFIER","GR.NONFIN.PARTICIPLE_CLAUSE","GR.NONFIN.PARTICIPLE_ADJ"],"p":[5],"w":0.36,"pm":1},{"id":"SL-P5-08","ti":"动词句型与宾补","wr":"先看动词后面能跟什么，再看选项。","r":"掌握及物/不及物、双宾与宾补动词；make/let/have 后宾补用原形，其他多用 to do；近义动词句型不同（inform sb of / explain sth）。","ns":["QT.P5.VERB_FORM","QT.P5.VOCAB","GR.VERB.VERB_PATTERN","VO.CONF.SYN_VERB_PATTERN","GR.VERB.MODAL_BASE"],"p":[5],"w":0.58,"pm":1},{"id":"SL-P5-09","ti":"介/连/副看空格后面","wr":"看空格后面：名词用介词，整句用连词，前后两句都完整用副词。","r":"介词、连词、副词混排时：后接名词(短语)→介词；后接完整主谓→连词；两句已完整只缺逻辑衔接→接续副词。","ns":["QT.P5.CONNECTOR_MIX","QT.P5.CONJ","QT.P5.PREP","GR.CONN.PREP_VS_CONJ","GR.CONN.CONJ_ADVERBIAL","GR.CONN.CONJ_ADVERB"],"p":[5,6],"w":0.4,"pm":1},{"id":"SL-P5-10","ti":"介词题先搭配后语义","wr":"介词先想“固定跟谁搭”，想不到再翻译。","r":"先按空格前后搭配解（时间点/时段、地点、固定介词），搭配不明再按语义（原因/让步/目的/关于）选。","ns":["QT.P5.PREP","GR.CONN.PREP_TIME","GR.CONN.PREP_PLACE","GR.CONN.PREP_MEANING","GR.CONN.PREP_PHRASE_MULTI","VO.CONF.PREP_LOOKALIKE"],"p":[5,6],"w":0.36,"pm":1},{"id":"SL-P5-11","ti":"代词题先定格再定指代","wr":"代词先看站哪儿（格），再看替谁（单复数）。","r":"先看位置定格（主格/宾格/所有格/名词性物主/反身），再看所指对象的单复数与人/物。","ns":["QT.P5.PRONOUN","QT.P6.CTX_PRONOUN","GR.PRON.CASE","GR.PRON.POSSESSIVE_PRONOUN","GR.PRON.REFLEXIVE","GR.PRON.INDEFINITE","GR.PRON.DEMONSTRATIVE"],"p":[5,6],"w":0.38,"pm":1},{"id":"SL-P5-12","ti":"关系词看先行词与从句完整度","wr":"关系词问两件事：前面有没有名词？后面缺不缺东西？","r":"看有无先行词、指人还是物，再看后面从句缺不缺成分（缺主宾→关系代词，完整→关系副词/that 名词从句）。","ns":["QT.P5.RELATIVE","GR.REL","GR.REL.REL_PRONOUN","GR.REL.REL_ADVERB","GR.REL.REL_WHAT","GR.REL.NOUN_CLAUSE","GR.REL.COMPOUND_REL"],"p":[5],"w":0.29,"pm":1},{"id":"SL-P5-13","ti":"比较题看标志词","wr":"找 than / the / as 三个信号，秒选。","r":"than→比较级；the…of/in/among/ever→最高级；as…as→原级；强调比较级用 much/even/far/still。","ns":["QT.P5.COMPARATIVE","GR.COMP.COMPARATIVE","GR.COMP.SUPERLATIVE","GR.COMP.EQUATIVE"],"p":[5],"w":0.26,"pm":1},{"id":"SL-P5-14","ti":"成对表达找搭档词","wr":"看到 both/either/neither/whether，先去句子里找它的搭档。","r":"both–and、either–or、neither–nor、not only–but (also)、whether–or：看到一半就找另一半。","ns":["QT.P5.PAIR_GRAMMAR","GR.CONN.CONJ_CORRELATIVE"],"p":[5],"w":0.25,"pm":1},{"id":"SL-P5-15","ti":"数量词与单复数一致","wr":"先看数量词，再决定名词和动词要不要 s。","r":"each/every + 单数；a number of + 复数；the number of + 单数谓语；amount/number、few/little 区分可数。","ns":["QT.P5.PAIR_GRAMMAR","QT.P5.PRONOUN","GR.VERB.AGREE_QUANT","GR.PRON.DETERMINER_QUANT","VO.CONF.QUANT_WORDS"],"p":[5],"w":0.29,"pm":1},{"id":"SL-P5-16","ti":"特殊句式记固定形式","wr":"见到 request/suggest that、句首 Should，直接套模板。","r":"要求/建议类 that 从句用动词原形；省略 if 的倒装（Should/Had…）；并列结构前后同形；否定词/only 前置倒装；as requested 类省略。","ns":["QT.P5.VERB_FORM","QT.P5.PAIR_GRAMMAR","GR.VERB.SUBJUNCTIVE_DEMAND","GR.VERB.CONDITIONAL_INVERSION","GR.SPECIAL.PARALLEL","GR.SPECIAL.INVERSION_NEG","GR.SPECIAL.ELLIPSIS"],"p":[5],"w":0.33,"pm":1},{"id":"SL-P5-17","ti":"副词按功能辨","wr":"副词不看中文意思，先看它管时间、强调还是程度。","r":"时间副词（already/still/yet）、焦点副词（just/only/even）、so/such/too/enough、also/too/either 按功能和位置辨；never 可直接放动词前，not 需借助动词。","ns":["QT.P5.VOCAB","QT.P5.WORD_FORM","VO.CONF.ADV_TIME","VO.CONF.ADV_FOCUS","VO.CONF.SO_SUCH_TOO"],"p":[5],"w":0.58,"pm":1},{"id":"SL-P5-18","ti":"词汇题先找搭配","wr":"词汇题先看空格跟谁搭，搭不上的先划掉，再看意思。","r":"词汇题先找搭配与语法线索（介词搭配、及物性、固定短语）“不翻译解”；副/形词义题先把句子压成“修饰词+中心词”；线索不足再读全句。","ns":["QT.P5.VOCAB","QT.P6.CTX_VOCAB","VO.COLLO","VO.COLLO.VERB_PREP","VO.COLLO.VERB_NOUN","VO.COLLO.ADJ_NOUN","VO.COLLO.ADV_VERB_ADJ","VO.LEX","VO.LEX.VERB","VO.LEX.NOUN","VO.LEX.ADJ","VO.LEX.ADV"],"p":[5,6],"w":0.78,"pm":1},{"id":"SL-P5-19","ti":"常用词记商务义","wr":"熟词别按日常意思选，先想它在公司里是什么意思。","r":"成组辨析近义词，记住常见词的商务义项（address=处理、issue=期刊/发放、term=条款）。","ns":["QT.P5.VOCAB","QT.P7.SYNONYM","VO.CONF.BUSINESS_SENSE","VO.CONF.POLYSEMY_CONTEXT","VO.CONF.SYN_NOUN","VO.CONF.SYN_ADJ"],"p":[5,7],"w":0.56,"pm":1},{"id":"SL-P5-20","ti":"词缀猜词性","wr":"不认识的词先看尾巴，尾巴决定词性。","r":"后缀定词性（-tion/-ment 名词、-ive/-able 形容词、-ly 副词、-ize 动词），词根词缀辅助记忆。","ns":["QT.P5.WORD_FORM","FD.VOC.AFFIX","VO.CONF.FORM_ADJ","VO.CONF.FORM_NOUN"],"p":[5],"w":0.44,"pm":1},{"id":"SL-P5-21","ti":"P5 单题限时","wr":"每张 P5 工单有倒计时，铃响就交。","r":"P5 词性题约 5–15 秒、语法 15 秒、词汇 ≤20–30 秒；超时直接选一个往下走。","ns":["QT.P5.IDENTIFY","ST.TIME.PER_ITEM_P5","ST.GIVEUP.CUTOFF_RULE"],"p":[5],"w":0.89,"pm":1},{"id":"SL-P5-22","ti":"按考频排学习顺序","wr":"先练常考的活，冷门活放到后面。","r":"先攻高频题型（词汇约 30%、词性约 25%、介词约 11%、接续/动词/副词/代词各 7–9%），比较、特殊句式后补。","ns":["QT.P5.VOCAB","QT.P5.WORD_FORM","QT.P5.PREP","ST.REVIEW.DIAGNOSE_BY_TYPE"],"p":[5],"w":0.6,"pm":1},{"id":"SL-P5-23","ti":"P5 瓶颈转练 P6/P7","wr":"P5 已经很稳，就把时间挪给长文。","r":"P5 稳定只错 3–4 题后再刷 P5 收益很小，改为大量做 P6/P7 积累地道表达。","ns":["ST.REVIEW.DIAGNOSE_BY_TYPE"],"p":[5,6,7],"w":0.4,"pm":1},{"id":"SL-P6-01","ti":"P6 顺着读全文","wr":"P6 从头顺着读，读到空就填。","r":"Part 6 按顺序通读，不只读空格所在句：新制每篇 4 题，约 65% 需上下文，只靠本句能解的很少。","ns":["QT.P6.CLASSIFY","TX.EMAIL","TX.LETTER","TX.MEMO","TX.NOTICE","TX.AD","TX.ARTICLE","TX.WEB","ST.LOCATE.DEPTH_BY_QTYPE"],"p":[6],"w":0.72,"pm":1},{"id":"SL-P6-02","ti":"P6 两类分流","wr":"先分拣：本句能解的秒做，要看上下文的放慢。","r":"把 P6 题分为“句内独立可解”和“需上下文”两类：前者按 P5 方法速答；后者（时态/代词/接续副词/词汇/插入句）必须看前后文。","ns":["QT.P6.CLASSIFY","QT.P6.INDEPENDENT"],"p":[6],"w":0.66,"pm":1},{"id":"SL-P6-03","ti":"时态看全文时间线","wr":"先看这封信是哪天写的，事情发生了没有。","r":"P6 时态题本句语法上多个都通时，以全文时间线为准：看发信日期、前后句、事件是否已发生。","ns":["QT.P6.CTX_TENSE","GR.VERB.TENSE_SIMPLE","GR.VERB.TENSE_PERFECT","GR.VERB.TENSE_FUTURE_CLAUSE"],"p":[6],"w":0.29,"pm":1},{"id":"SL-P6-04","ti":"代词回前文找指代","wr":"代词题往回找“它/他们”到底指谁。","r":"P6 代词题回前文找所指对象，按单复数、人/物、公司/个人选代词。","ns":["QT.P6.CTX_PRONOUN","FD.READ.REFERENCE","GR.PRON.CASE"],"p":[6],"w":0.23,"pm":1},{"id":"SL-P6-05","ti":"接续副词判前后逻辑","wr":"先给两句关系贴标签：转折、因果还是追加。","r":"判断前后两句关系（转折/因果/追加/举例/顺序），再选 however/therefore/in addition/for example 等。","ns":["QT.P6.CTX_CONJ_ADV","GR.CONN.CONJ_ADVERB","FD.READ.DISCOURSE"],"p":[6],"w":0.4,"pm":1},{"id":"SL-P6-06","ti":"语境词汇以全文为准","wr":"本句都通？回头看整篇在讲什么。","r":"P6 词汇题几个选项本句都通顺时，以全文主题和前后信息决定。","ns":["QT.P6.CTX_VOCAB","VO.CONF.POLYSEMY_CONTEXT"],"p":[6],"w":0.39,"pm":1},{"id":"SL-P6-07","ti":"插入句看衔接线索","wr":"插入句先看候选句里的 this/they/also，问它在指前面哪件事。","r":"句子插入题先抓全文主题和段落走向，再用候选句里的代词（this/these/they）、连接词、新旧信息检查能否接上前后句。","ns":["QT.P6.INSERTION","QT.P6.INS_OPENING","QT.P6.INS_TRANSITION","QT.P6.INS_CLOSING","FD.READ.REFERENCE","FD.READ.DISCOURSE"],"p":[6],"w":0.61,"pm":1},{"id":"SL-P6-08","ti":"插入句按位置预测句型","wr":"空在开头找“开场白”，空在结尾找“请联系我们”。","r":"空在段首多为引入/目的句，在段中为衔接/举例句，在末尾多为“请联系/欢迎/行动号召”句。","ns":["QT.P6.INS_OPENING","QT.P6.INS_TRANSITION","QT.P6.INS_CLOSING"],"p":[6],"w":0.16,"pm":1},{"id":"SL-P6-09","ti":"插入句后做、没把握就猜","wr":"插入句最后做，30 秒没头绪就先猜一个。","r":"插入句是每篇最难的一题：先做本篇其他 3 题再回来；600–700 目标没把握直接猜，不恋战。","ns":["QT.P6.INSERTION","ST.ORDER.HARD_ITEMS_LAST","ST.GIVEUP.CUTOFF_RULE","ST.GIVEUP.TARGET_BASED"],"p":[6],"w":0.64,"pm":1},{"id":"SL-P6-10","ti":"P6 是否需要专项","wr":"P6 每篇错两题以上，才开专项训练。","r":"平均每篇错 ≤1 题按常规练；错误率超过约 1/3 再开 P6 专项。","ns":["QT.P6.CLASSIFY","ST.REVIEW.DIAGNOSE_BY_TYPE"],"p":[6],"w":0.4,"pm":1},{"id":"SL-P7-01","ti":"先题后文","wr":"先看题，再进文找答案。","r":"先读题干（必要时连选项），判断题型并记住人名/日期/数字/动作词，再回原文扫读定位、在定位句前后细读比对。","ns":["QT.P7.DETAIL","QT.P7.DETAIL_NUMBER","QT.P7.REQUEST_ACTION","QT.P7.REASON","ST.LOCATE.QUESTION_FIRST"],"p":[7],"w":1.0,"pm":1},{"id":"SL-P7-02","ti":"题序≈文序，两题一组","wr":"一次拿两道题进文，顺路把两个答案都找出来。","r":"设问顺序大体与原文顺序一致：两题一组读题，再在对应区间一次找完。","ns":["QT.P7.DETAIL","ST.LOCATE.QUESTION_ORDER"],"p":[7],"w":0.5,"pm":1},{"id":"SL-P7-03","ti":"细节题用锚点扫读","wr":"拿专名和数字当路标，找到路标只读它前后两句。","r":"细节(5W1H)题用题干里的专名、数字、日期、独特名词作锚点扫读，只精读锚点附近一两句；选项通常是改写。","ns":["QT.P7.DETAIL","QT.P7.DETAIL_NUMBER","QT.P7X.DETAIL.EMAIL","QT.P7X.DETAIL.ARTICLE","QT.P7X.DETAIL.NOTICE","QT.P7X.DETAIL.WEB","QT.P7X.DETAIL_NUMBER.FORM","QT.P7X.DETAIL_NUMBER.SCHEDULE","QT.P7X.DETAIL.TEXT_MSG","ST.LOCATE.KEYWORD_SCAN","FD.READ.SCAN"],"p":[7],"w":0.75,"pm":1},{"id":"SL-P7-04","ti":"按改写匹配，同词选项要警惕","wr":"答案通常换了说法；和原文一字不差的选项先多看一眼。","r":"正确选项多是原文的同义改写（约 70%）；照搬原文词语的选项常是陷阱，要核对意思。","ns":["QT.P7.DETAIL","QT.P7.TRUE_INDICATED","QT.P7.INFERENCE","QT.P7.REASON","ST.LOCATE.PARAPHRASE_MATCH","ST.ELIM.TRAP_TYPES","VO.PARA","VO.PARA.WORD_SYNONYM","VO.PARA.WORD_TO_PHRASE","VO.PARA.GENERALIZE","VO.PARA.POS_SHIFT","VO.PARA.SUMMARY_NOMINAL","VO.PARA.ROLE_REFERENCE"],"p":[5,6,7],"w":0.92,"pm":1},{"id":"SL-P7-05","ti":"主旨/目的题看开头","wr":"问“为什么写这封信”，先看第一段。","r":"主旨/目的题答案多在开头（I am writing to / in regard to / We are pleased to / Please be advised）。","ns":["QT.P7.MAIN_PURPOSE","QT.P7X.MAIN_PURPOSE.EMAIL","QT.P7X.MAIN_P     local = { kind: 'local', get: k => ls.getItem(k), set: (k, v) => ls.setItem(k, v), del: k => ls.removeItem(k) };
  } catch (e) { local = null; }
  let ad = local || memory;
  function safeSet(k, v) {
    try { ad.set(k, v); } catch (e) { // 配额满等 → 降级内存
      ad = memory; ad.set(k, v); if (Store.onFallback) Store.onFallback();
    }
  }
  return {
    get kind() { return ad.kind; },
    getJ(k, d) { try { const s = ad.get(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } },
    setJ(k, v) { safeSet(k, JSON.stringify(v)); },
    del(k) { try { ad.del(k); } catch (e) { } },
    onFallback: null
  };
})();

/* ===== 多档案：每个档案一份独立 state，key = t2:p:<id> ===== */
const Profiles = (() => {

    },

    remove(id) {
      idx.list = idx.list.filter(p => p.id !== id); Store.del('t2:p:' + id);
      if (idx.cur === id) idx.cur = idx.list[0] ? idx.list[0].id : null; saveIdx();
    },
    rename(id, nm) { const p = idx.list.find(p => p.id === id); if (p) { p.name = nm; saveIdx(); } },
    name(id) { const p = idx.list.find(p => p.id === (id || idx.cur)); return p ? p.name : ''; },
    load(id) { return Store.getJ('t2:p:' + (id || idx.cur), null); },

})();

/* 进度码：base64(UTF-8 JSON) */
const Code = {
  enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); },
  dec(s) { return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); }
};

/* ===== 引擎：数据索引 / 掌握度(Elo) / 预测分 / 简化 FSRS / 选题 ===== */
const D = window.TDATA;
const IT = {}, BU = {}, ND = {}, BY_NODE = {}, FORMS = {}, ALLF = {};
const FULL_MIN = 90;   // 一个 form 题数 ≥90 才算整套（可模考）；pilot 迷你卷不够数，不进模考
D.items.forEach(i => {
  IT[i.id] = i;
  [i.n].concat(i.ns).forEach(n => (BY_NODE[n] = BY_NODE[n] || []).push(i.id));
  (ALLF[i.f] = ALLF[i.f] || []).push(i.id);
});
Object.keys(ALLF).forEach(f => { if (ALLF[f].length >= FULL_MIN) FORMS[f] = ALLF[f]; });   // 整套：open MXT01–06 / 私有 xdf T01–T10 / 以后 ETS 等，按题数通用判定
D.bundles.forEach(b => { BU[b.id] = b; });
D.nodes.forEach(n => { ND[n.id] = n; });
Object.values(FORMS).forEach(a => a.sort((x, y) => IT[x].q - IT[y].q));

const DAY = 864e5;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / DAY);
const sig = x => 1 / (1 + Math.exp(-x));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const diffB = d => (d - 3) * 0.7;               // difficulty_est(1–5) → logit 难度
const RT = { 600: 300, 700: 350, 800: 400, 900: 450 }; // 总分目标 → 阅读分目标（按一半估）
const RANKS = [[0, '实习生'], [200, '专员'], [300, '主管'], [375, '经理'], [430, '总监']];
const SCALE = [[0, 5], [10, 5], [20, 60], [30, 110], [40, 165], [50, 220], [60, 275], [70, 330], [80, 385], [90, 440], [95, 470], [100, 495]];

function newState(target, exam) {
  return { ver: 2, created: Date.now(), target: target || 700, exam: exam || '', diag: false,
    th: 0, N: 0, nd: {}, seen: {}, cards: {}, words: {}, wrong: {}, mocks: [], used: [],
    streak: { d: '', n: 0 }, days: {}, log: [], hist: [], cons: {}, hl: {}, run: null };
}

const E = {
  st: null,
  log(e, o) { const L = this.st.log; L.push(Object.assign({ t: Date.now(), e }, o || {})); if (L.length > 20000) L.splice(0, L.length - 20000); },
  mastery(n) { const v = this.st.nd[n]; return v ? sig(v[0]) : null; },
  rawFromTheta(th) {
    const bs = [-1.4, -0.7, 0, 0.7, 1.4], ws = [.1, .25, .35, .2, .1];
    return 100 * bs.reduce((s, b, k) => s + ws[k] * sig(th - b), 0);
  },
  scaled(raw) {
    for (let k = 1; k < SCALE.length; k++) if (raw <= SCALE[k][0]) {
      const [x0, y0] = SCALE[k - 1], [x1, y1] = SCALE[k]; return y0 + (y1 - y0) * (raw - x0) / (x1 - x0);
    }
    return 495;
  },
  /* 预测阅读分：点估计 + 区间（答题越多越窄） + 达标概率 */
  predict() {
    const s = this.st, p = this.scaled(this.rawFromTheta(s.th)), hw = Math.max(20, 150 / Math.sqrt(1 + s.N / 8));
    const r5 = x => Math.round(clamp(x, 5, 495) / 5) * 5, tg = RT[s.target] || s.target / 2;
    const z = (p - tg) / (hw / 1.645), prob = 1 / (1 + Math.exp(-1.702 * z));
    return { p: r5(p), lo: r5(p - hw), hi: r5(p + hw), tg, prob };
  },
  rank(p) { let r = RANKS[0][1]; RANKS.forEach(([v, nm]) => { if (p >= v) r = nm; }); return r; },
  /* Elo 式更新：主节点全量，其他 node_ids 半量；全局能力 th 用于预测分 */
  update(it, ok) {
    const s = this.st, b = diffB(it.d), r = ok ? 1 : 0;
    const kg = Math.max(0.06, 0.6 / (1 + 0.05 * s.N));
    s.th += kg * (r - sig(s.th - b)); s.N++;
    const up = (n, half) => {
      const v = s.nd[n] || (s.nd[n] = [s.th, 0]);
      const k = Math.max(0.15, 0.8 / (1 + 0.1 * v[1])) * (half ? 0.5 : 1);
      v[0] += k * (r - sig(v[0] - b)); v[1]++;
    };
    up(it.n, false); it.ns.forEach(n => up(n, true));
    s.cons[it.n] = ok ? 0 : (s.cons[it.n] || 0) + 1;
  },
  /* 简化 FSRS：快对×2.5、慢对×1.3、错/查词→1 天。新题快对不建卡（已会）。 */
  schedule(id, ok, fast, lookedUp) {
    const s = this.st, c = s.cards[id];
    if (!c && ok && fast && !lookedUp) return;
    const iv = c ? c.ivl : 1;
    const ni = (!ok || lookedUp) ? 1 : (fast ? Math.max(1, iv) * 2.5 : Math.max(1, iv) * 1.3);
    s.cards[id] = { ivl: ni, due: dayNum() + Math.round(ni) };
    if (!ok) s.wrong[id] = Date.now();
  },
  scheduleWord(w, grade) { // grade: 2 认识 1 模糊 0 不认识
    const c = this.st.words[w]; if (!c) return;
    c.ivl = grade === 2 ? Math.max(1, c.ivl) * 2.5 : grade === 1 ? Math.max(1, c.ivl) * 1.3 : 1;
    c.due = dayNum() + Math.round(c.ivl);
  },
  addWord(w, ctx) {
    w = w.toLowerCase(); const s = this.st;
    if (!s.words[w]) s.words[w] = { c: ctx.slice(0, 160), ivl: 1, due: dayNum() + 1, ts: Date.now() };
    else s.words[w].due = dayNum() + 1;
    this.log('word', { w });
  },
  /* 记一次作答（训练/诊断/复习/模考交卷都走这里） */
  record(it, ans, mode) {
    const ok = ans.c === it.a, fast = ans.ms / 1000 <= it.t;
    this.update(it, ok);
    if (mode !== 'diag') this.schedule(it.id, ok, fast, !!ans.lu);
    const sn = this.st.seen[it.id] || [0, 0]; sn[0]++; sn[1] = ok ? 1 : 0; this.st.seen[it.id] = sn;
    const d = today(); this.st.days[d] = (this.st.days[d] || 0) + 1; this.touchStreak();
    this.log('answer', { id: it.id, mode, c: ans.c, ok: ok ? 1 : 0, ms: ans.ms, lu: ans.lu ? 1 : 0 });
    return ok;
  },
  touchStreak() {
    const s = this.st.streak, d = today();
    if (s.d === d) return;
    const y = new Date(Date.now() - DAY); const yd = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    s.n = s.d === yd ? s.n + 1 : 1; s.d = d;
  },
  streakNow() { const s = this.st.streak; if (!s.d) return 0; const gap = (new Date(today()) - new Date(s.d)) / DAY; return gap <= 1 ? s.n : 0; },
  /* 训练池：去掉模考用过的套 */
  pool() { const u = new Set(this.st.used); return D.items.filter(i => !(FORMS[i.f] && u.has(i.f))); },
  /* 薄弱节点：考频 × (1 − 掌握度)；未测节点用全局能力并稍加探索分 */
  weakList() {
    const g = sig(this.st.th);
    return D.nodes.filter(n => !n.g && BY_NODE[n.id] && n.w > 0).map(n => {
      const m = this.mastery(n.id), mm = m == null ? g : m;
      return { n, m, sc: n.w * (1 - mm) * (m == null ? 0.9 : 1) };
    }).sort((a, b) => b.sc - a.sc);
  },
  dueItems() { const t = dayNum(); return Object.keys(this.st.cards).filter(id => IT[id] && this.st.cards[id].due <= t).sort((a, b) => this.st.cards[a].due - this.st.cards[b].due); },
  dueWords() { const t = dayNum(); return Object.keys(this.st.words).filter(w => this.st.words[w].due <= t); },
  /* 选题：节点集合内、未做过、难度贴近能力 */
  pickSingles(nodes, k, used, fill) {
    const ns = new Set(nodes), th = this.st.th;
    let c = this.pool().filter(i => i.p === 5 && !used.has(i.id) && (ns.size === 0 || ns.has(i.n) || i.ns.some(x => ns.has(x))));
    // fill：薄弱节点里 P5 不够 k 道时（前几名薄弱点常是 TX/ST 等非 P5 节点），用其余 P5 补足（日常训练按设计"补到 8"）
    if (fill && c.length < k) { const have = new Set(c.map(i => i.id)); c = c.concat(this.pool().filter(i => i.p === 5 && !used.has(i.id) && !have.has(i.id)).sort(() => Math.random() - 0.5).slice(0, k - c.length)); }
    c.sort((a, b) => ((this.st.seen[a.id] ? 5 : 0) + Math.abs(diffB(a.d) - th) + Math.random()) - ((this.st.seen[b.id] ? 5 : 0) + Math.abs(diffB(b.d) - th) + Math.random()));
    const out = c.slice(0, k); out.forEach(i => used.add(i.id)); return out.map(i => ({ ids: [i.id] }));
  },
  pickBundle(part, nodes, used, kind, must) {
    const ns = new Set(nodes), u = new Set(this.st.used);
    const c = D.bundles.filter(b => b.p === part && b.qs.length && !(FORMS[b.f] && u.has(b.f)) && !b.qs.some(q => used.has(q)) && (!kind || kind.includes(b.k)) && (!must || b.qs.some(q => ns.has(IT[q].n) || IT[q].ns.some(x => ns.has(x)))));
    const score = b => b.qs.reduce((s, q) => { const i = IT[q]; return s + (ns.has(i.n) || i.ns.some(x => ns.has(x)) ? 1 : 0) - (this.st.seen[q] ? 2 : 0); }, 0) + Math.random();
    c.sort((a, b) => score(b) - score(a));
    const b = c[0]; if (!b) return null; b.qs.forEach(q => used.add(q)); return { b: b.id, ids: b.qs.slice() };
  },
  /* 复习单元：P5 单题；P6/P7 只出到期那题，但带原文 */
  reviewUnits(cap) {
    return this.dueItems().slice(0, cap).map(id => IT[id].b ? { b: IT[id].b, ids: [id] } : { ids: [id] });
  },
  plan(min) {
    const used = new Set(), top = this.weakList().slice(0, 6).map(x => x.n.id);
    if (min === 5) { const r = this.reviewUnits(4).filter(u => !u.b); r.forEach(u => used.add(u.ids[0])); return r.concat(this.pickSingles(top, 8 - r.length, used, true)); }
    if (min === 20) {
      const r = this.reviewUnits(10); r.forEach(u => u.ids.forEach(q => used.add(q)));
      const out = r.concat(this.pickSingles(top, 8, used, true));
      const b6 = this.pickBundle(6, top, used); if (b6) out.push(b6);
      const b7 = this.pickBundle(7, top, used, ['single']); if (b7) out.push(b7);
      return out;
    }
    return null;
  },
  weakPlan(nodeId) { // 攻克：该节点的 P5 单题 ×6 + 含该节点的 P6/P7 各 1 组（按题库实际分布）
    const used = new Set(), out = this.pickSingles([nodeId], 6, used), has = new Set((BY_NODE[nodeId] || []).map(q => IT[q].p));
    [6, 7].forEach(p => { if (has.has(p)) { const b = this.pickBundle(p, [nodeId], used, null, true); if (b) out.unshift(b); } });
    return out;
  },
  diagPlan(min) {
    const P = D.items.filter(i => i.src === 'pilot' && i.p === 5), used = new Set(), out = [];
    [2, 2, 3, 3, 4, 4].forEach(d => { const c = P.filter(i => i.d === d && !used.has(i.id)); const i = c[Math.floor(Math.random() * c.length)] || P.find(i => !used.has(i.id)); used.add(i.id); out.push({ ids: [i.id] }); });
    const pb = D.bundles.filter(b => b.qs[0] && b.qs[0].startsWith('PL'));
    const b6 = pb.find(b => b.p === 6), b7 = pb.filter(b => b.p === 7 && b.k === 'single' && b.qs.length <= 3)[0];
    if (b6) out.push({ b: b6.id, ids: b6.qs.slice() }); if (b7) out.push({ b: b7.id, ids: b7.qs.slice() });
    return out;
  },
  /* 模考：选未用过、做过题最少的整套（题数 ≥ FULL_MIN 的任意 form） */
  nextForm() {
    const u = new Set(this.st.used);
    return Object.keys(FORMS).filter(f => !u.has(f)).sort((a, b) => FORMS[a].filter(q => this.st.seen[q]).length - FORMS[b].filter(q => this.st.seen[q]).length)[0] || null;
  },
  mockPlan(form) {
    const out = [], done = new Set();
    FORMS[form].forEach(id => {
      if (done.has(id)) return; const i = IT[id];
      if (i.b) { const b = BU[i.b]; b.qs.forEach(q => done.add(q)); out.push({ b: b.id, ids: b.qs.slice() }); }
      else { done.add(id); out.push({ ids: [id] }); }
    });
    return out;
  },
  rules(nodeId) {
    const n = ND[nodeId], keys = new Set([nodeId, n && n.pa].filter(Boolean));
    return D.strats.filter(s => s.pm && s.ns.some(x => keys.has(x))).sort((a, b) => b.w - a.w).slice(0, 2);
  },
  weekStats(st) {
    const t0 = Date.now() - 7 * DAY, a = st.log.filter(x => x.e === 'answer' && x.t >= t0);
    return { n: a.length, acc: a.length ? a.filter(x => x.ok).length / a.length : 0 };
  }
};

   <div class="task" data-act="mock" ${f ? '' : 'style="opacity:.5"'}><div><b>75</b> 分钟<div class="sm mut">${f ? `整套模考 ${f}（${FORMS[f].length} 题，计时、无提示）` : '套题已全部用完'}</div></div><span>›</span></div>
  </div><p class="sm mut">到期复习 ${due} 题 · 生词 ${dw} 个</p></div>`;
}

/* ---------- 会话 ---------- */
function startSession(mode, units, extra) {
  if (!units || !units.length) return alert('没有可用的题目了');
  const nd0 = {};
  units.forEach(u => u.ids.forEach(id => { const i = IT[id]; nd0[i.n] = E.mastery(i.n); }));
  S = Object.assign({ mode, units, ui: 0, qi: 0, ans: {}, lu: {}, t0: Date.now(), qt0: Date.now(), pred0: E.predict(), nd0, fb: false, tool: '', fold: false, doc: 0, view: 1 }, extra || {});
  if (mode === 'mock') { S.flat = units.reduce((a, u) => a.concat(u.ids), []); S.pos = 0; S.mt = {}; S.end = Date.now() + 75 * 6e4; }
  E.log('start', { mode, n: units.reduce((s, u) => s + u.ids.length, 0), form: S.form });
  save(); render(); scrollTo(0, 0);
}
function curId() { return S.mode === 'mock' ? S.flat[S.pos] : S.units[S.ui].ids[S.qi]; }
function curUnit() { if (S.mode !== 'mock') return S.units[S.ui]; const id = curId(); return S.units.find(u => u.ids.includes(id)); }
function total() { return S.mode === 'mock' ? S.flat.length : S.units.reduce((s, u) => s + u.ids.length, 0); }

function words(t) { return esc(t).replace(/[A-Za-z][A-Za-z'’-]*/g, w => `<span class="w">${w}</span>`); }
function passageText(x, qid, bid, di) {
  const cur = IT[qid].q, hl = new Set(E.st.hl[bid + ':' + di] || []);
  let k = 0;
  return x.split(/(\n+)/).map(seg => {
    if (/^\n+$/.test(seg)) return seg;
    return (seg.match(/[^.!?]+[.!?"”’)]*\s*|.+$/g) || [seg]).map(sn => {
      const i = k++;
      let h = words(sn).replace(/\{\{(\d+)\}\}/g, (m, n) => `<span class="blank ${+n === cur ? 'cur' : ''}">${n}</span>`);
      return `<span class="sen ${hl.has(i) ? 'hl' : ''}" data-s="${i}">${h}</span>`;
    }).join('');
  }).join('');
}
function vPassage(u, qid) {
  const b = BU[u.b], tools = S.mode !== 'mock' && S.mode !== 'diag';
  const di = Math.min(S.doc, b.docs.length - 1), d = b.docs[di];
  return `<div class="row sp sm mut"><span>Part ${b.p} · ${b.k === 'single' ? '单篇' : b.k === 'double' ? '双篇' : '三篇'}</span><span class="chip" data-act="fold">${S.fold ? '展开原文' : '收起原文'}</span></div>
  ${b.docs.length > 1 ? `<div class="tabsx">${b.docs.map((x, k) => `<span class="chip ${k === di ? 'on' : ''}" data-act="doc" data-k="${k}">文${k + 1}</span>`).join('')}</div>` : ''}
  <div class="passage ${S.fold ? 'fold' : ''}" data-bid="${b.id}" data-di="${di}">${d.h ? `<div class="ph">${words(d.h).replace(/\{\{(\d+)\}\}/g, '<span class="blank">$1</span>')}</div>` : ''}${passageText(d.x, qid, b.id, di)}</div>`;
}
function vQuiz() {
  const id = curId(), it = IT[id], u = curUnit(), a = S.ans[id], mock = S.mode === 'mock', tools = !mock && S.mode !== 'diag';
  const n = mock ? S.pos + 1 : Object.keys(S.ans).length + (S.fb ? 0 : 1);
  let stem = it.p === 6 ? `第 ${it.q} 空（原文高亮处）` : it.s;
  stem = words(stem).replace(/-{4,}/g, '<span class="blank cur">&nbsp;</span>');
  const opts = it.o.map((o, k) => {
    let c = '';
    if (S.fb) c = k === it.a ? 'ok' : (a && a.c === k ? 'no' : '');
    else if (a && a.c === k) c = 'sel';
    return `<button class="opt ${c}" data-act="pick" data-c="${k}">(${'ABCD'[k]}) ${esc(o)}</button>`;
  }).join('');
  let fb = '';
  if (S.fb && a) {
    const ok = a.c === it.a, why = it.dr && it.dr[a.c];
    const rules = !ok && (E.st.cons[it.n] || 0) >= 2 && E.rules(it.n).length;
    fb = `<div class="fb ${ok ? '' : 'bad'}"><b>${ok ? '✓ ' + pick(FB_OK) : '✗ ' + pick(FB_NO)}</b>
     <div>正确答案：(${'ABCD'[it.a]}) ${esc(it.o[it.a])} · 用时 ${Math.round(a.ms / 1000)}s / 目标 ${it.t}s</div>
     ${it.e ? `<div class="mut" style="margin-top:4px">${esc(it.e)}</div>` : ''}
     ${why ? `<div style="margin-top:4px">你选的 (${'ABCD'[a.c]})：${esc(why)}</div>` : ''}
     <div class="sm mut">考点：${esc((ND[it.n] || {}).nm || it.n)}</div></div>
     ${rules ? '<button class="btn ghost full" data-act="rules">同类连错 2 次 · 看工作规则卡</button><p></p>' : ''}
     <button class="btn full" data-act="next">下一题</button>`;
  }
  const head = `<div class="q-top"><div class="row sp"><span><b>${MODE_NM[S.mode]}</b> <span class="mut sm">${n}/${total()}</span></span>
   ${mock ? `<span id="cd" class="rank">--:--</span>` : ''}<button class="btn ghost sm" data-act="pause">${mock ? '离开' : '暂停'}</button></div>
   ${mock ? '' : `<div class="tbar" id="tb"><i style="width:0"></i></div>`}</div>`;
  const tl = tools ? `<div class="tools"><span class="chip" data-act="later">稍后处理</span><span class="chip ${S.tool === 'hl' ? 'on' : ''}" data-act="tool" data-t="hl">划依据</span><span class="chip ${S.tool === 'w' ? 'on' : ''}" data-act="tool" data-t="w">点词进生词本</span></div>` : '';
  const nav = mock ? `<div class="row sp" style="margin:8px 0"><button class="btn ghost sm" data-act="mv" data-d="-1">上一题</button><button class="btn acc sm" data-act="submit">交卷</button><button class="btn ghost sm" data-act="mv" data-d="1">下一题</button></div>
   <details><summary>题号导航（已答 ${Object.keys(S.ans).length}/${S.flat.length}）</summary><div class="qnav">${S.flat.map((q, k) => `<button class="${S.ans[q] ? 'an' : ''} ${k === S.pos ? 'cu' : ''}" data-act="go" data-k="${k}">${IT[q].q}</button>`).join('')}</div></details>` : '';
  return head + (u.b ? vPassage(u, id) : '') + tl + `<div class="stem" data-stem="1"><span class="mut sm">Q${it.q}</span> ${stem}</div>` + opts + fb + nav;
}

let timer = null;
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!S || S.done || !S.view) return clearInterval(timer);
    if (S.mode === 'mock') {
      const left = Math.max(0, S.end - Date.now()), el = $('#cd');
      if (el) el.textContent = String(Math.floor(left / 6e4)).padStart(2, '0') + ':' + String(Math.floor(left / 1e3) % 60).padStart(2, '0');
      if (!left) { clearInterval(timer); submitMock(); }
      return;
    }
    const tb = $('#tb'); if (!tb || S.fb) return;
    const r = (Date.now() - S.qt0) / 1000 / IT[curId()].t;
    tb.firstChild.style.width = Math.min(100, r * 100) + '%'; tb.classList.toggle('over', r > 1);
  }, 500);
}

function answer(c) {
  const id = curId(), it = IT[id];
  if (S.mode === 'mock') { S.ans[id] = { c }; leaveQ(); if (S.pos < S.flat.length - 1) S.pos++; S.qt0 = Date.now(); save(); return render(); }
  if (S.fb) return;
  const a = { c, ms: Date.now() - S.qt0, lu: !!S.lu[id] }; S.ans[id] = a;
  E.record(it, a, S.mode);
  if (S.mode === 'diag') return next();
  S.fb = true; save(); render();
}
function next() {
  S.fb = false; S.qi++;
  if (S.qi >= S.units[S.ui].ids.length) { S.ui++; S.qi = 0; S.doc = 0; }
  if (S.ui >= S.units.length) return finish();
  S.qt0 = Date.now(); save(); render(); scrollTo(0, 0);
}
function leaveQ() { const id = curId(); S.mt[id] = (S.mt[id] || 0) + (Date.now() - S.qt0); }
function submitMock() {
  if (!S || S.mode !== 'mock') return;
  leaveQ(); const parts = {};
  S.flat.forEach(id => {
    const a = S.ans[id] || { c: -1 }; a.ms = S.mt[id] || 0; S.ans[id] = a;
    const ok = E.record(IT[id], a, 'mock'), p = parts[IT[id].p] || (parts[IT[id].p] = [0, 0]); p[0] += ok ? 1 : 0; p[1]++;
  });
  if (!E.st.used.includes(S.form)) E.st.used.push(S.form);
  S.parts = parts; finish();
}
function finish() {
  const ids = Object.keys(S.ans), ok = ids.filter(id => S.ans[id].c === IT[id].a).length;
  const ms = ids.reduce((s, id) => s + (S.ans[id].ms || 0), 0), tgt = ids.reduce((s, id) => s + IT[id].t, 0);
  const p1 = E.predict(), nodes = Object.keys(S.nd0).map(n => ({ n, a: S.nd0[n], b: E.mastery(n) })).filter(x => x.b != null)
    .map(x => Object.assign(x, { d: x.b - (x.a == null ? 0.5 : x.a) }));
  R = { mode: S.mode, n: ids.length, ok, ms, tgt, p0: S.pred0, p1, nodes, form: S.form, parts: S.parts };
  if (S.mode === 'mock') {
    const raw = ok / Math.max(1, ids.length) * 100;
    R.scaled = Math.round(E.scaled(raw) / 5) * 5; E.st.mocks.push({ ts: Date.now(), form: S.form, ok, n: ids.length, scaled: R.scaled, ms });
  }
  if (S.mode === 'diag') E.st.diag = true;
  E.st.hist.push([Date.now(), p1.p]);
  E.log('end', { mode: S.mode, n: ids.length, ok, ms });
  S.done = true; S = null; save(); render(); scrollTo(0, 0);
}
function vResult() {
  const r = R, d = r.p1.p - r.p0.p, up = r.nodes.filter(x => x.d > 0.005).sort((a, b) => b.d - a.d).slice(0, 4), dn = r.nodes.filter(x => x.d < -0.005).sort((a, b) => a.d - b.d).slice(0, 4);
  const li = x => `<div class="li"><span class="nm">${esc((ND[x.n] || {}).nm || x.n)}</span><span class="${x.d > 0 ? 'up' : 'dn'}">${x.d > 0 ? '▲' : '▼'}${Math.abs(Math.round(x.d * 100))}</span><span class="sm mut">${pct(x.b)}</span></div>`;
  const r0 = E.rank(r.p0.p), r1 = E.rank(r.p1.p);
  return `<div class="card"><h2>${r.mode === 'diag' ? '入职诊断结果' : r.mode === 'mock' ? '模考报告 ' + r.form : '本次结算'}</h2>
  ${r.mode === 'mock' ? `<div class="big">${r.scaled}</div><p class="mut sm">按正确率换算的阅读分估计（未答题按错计）</p>
   <div class="grid2">${Object.keys(r.parts || {}).map(p => `<div class="kpi"><b>${r.parts[p][0]}/${r.parts[p][1]}</b><span class="sm mut">Part ${p}</span></div>`).join('')}</div><p></p>` : ''}
  <div class="grid2"><div class="kpi"><b>${r.n}</b><span class="sm mut">题数</span></div><div class="kpi"><b>${pct(r.ok / Math.max(1, r.n))}</b><span class="sm mut">正确率</span></div>
  <div class="kpi"><b>${Math.round(r.ms / 1000)}s</b><span class="sm mut">用时（目标 ${r.tgt}s）</span></div>
  <div class="kpi"><b class="${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '+' : ''}${d}</b><span class="sm mut">预测分 ${r.p0.p}→${r.p1.p}</span></div></div>
  <p>职级：<span class="rank">${r1}</span> ${r0 !== r1 ? `<span class="mut sm">（原 ${r0}）${RANKS.findIndex(x => x[1] === r1) > RANKS.findIndex(x => x[1] === r0) ? '🎉 晋升！' : ''}</span>` : ''}</p>
  <p class="mut sm">预测区间 ${r.p1.lo}–${r.p1.hi} · 达标概率 ${pct(r.p1.prob)}</p></div>
  ${up.length ? `<div class="card"><h3>上涨节点</h3><div class="list">${up.map(li).join('')}</div></div>` : ''}
  ${dn.length ? `<div class="card"><h3>下跌节点</h3><div class="list">${dn.map(li).join('')}</div></div>` : ''}
  <button class="btn full" data-act="closeR">回工作台</button>`;
}

/* ---------- 薄弱点 / 复习 / 图谱 ---------- */

function vWeak() {

  ${L.map((x, k) => `<div class="li"><span class="sm mut">${k + 1}</span><span class="nm">${esc(x.n.nm)}<br><span class="sm mut">考频 ${x.n.w} · ${x.m == null ? '未测' : '掌握 ' + pct(x.m)}</span></span>${mbar(x.m)}<button class="btn sm" data-act="weak" data-n="${x.n.id}">攻克</button></div>`).join('')}</div></div>`;
}
function vReview() {
  const due = E.dueItems(), dw = E.dueWords(), wr = Object.keys(E.st.wrong).filter(id => IT[id]).sort((a, b) => E.st.wrong[b] - E.st.wrong[a]).slice(0, 40);

function vGraph() {

     ${ns.map(n => n.g ? `<h3>${esc(n.nm)}</h3>` : `<div class="li"><span class="nm sm">${esc(n.nm)} <span class="mut">${n.bd}</span></span>${mbar(E.mastery(n.id))}</div>`).join('')}</div></details></div>`;

/* ---------- 事件 ---------- */
const A = {

  later: () => {
    const u = S.units[S.ui]; E.log('later', { id: curId() });
    if (u.b && S.qi < u.ids.length - 1) u.ids.push(u.ids.splice(S.qi, 1)[0]);
    else if (!u.b && S.ui < S.units.length - 1) S.units.push(S.units.splice(S.ui, 1)[0]);
    else return alert('已经是最后一题');
    S.qt0 = Date.now(); save(); render();
  },
  tool: el => { S.tool = S.tool === el.dataset.t ? '' : el.dataset.t; render(); },
  fold: () => { S.fold = !S.fold; render(); },
  doc: el => { S.doc = +el.dataset.k; render(); },
  rules: () => { const it = IT[curId()]; E.log('rule', { n: it.n }); modal(`<h2>工作规则卡</h2>${E.rules(it.n).map(r => `<div class="fb"><b>${esc(r.ti)}</b><div>${esc(r.wr)}</div><div class="mut sm">${esc(r.r)}</div></div>`).join('')}<button class="btn full" data-act="closeM">记住了</button>`); },
  closeM: () => { modal(''); flash = null; render(); },
  mv: el => { leaveQ(); S.pos = clamp(S.pos + +el.dataset.d, 0, S.flat.length - 1); S.qt0 = Date.now(); render(); },
  go: el => { leaveQ(); S.pos = +el.dataset.k; S.qt0 = Date.now(); render(); },
  submit: () => { const left = S.flat.length - Object.keys(S.ans).length; if (confirm(left ? `还有 ${left} 题没答，确定交卷？` : '确定交卷？')) submitMock(); },
  closeR: () => { R = null; tab = 'home'; render(); },
  weak: el => startSession('weak', E.weakPlan(el.dataset.n)),
  rev: () => startSession('review', E.reviewUnits(20)),
  redo: el => { const i = IT[el.dataset.id]; startSession('review', [i.b ? { b: i.b, ids: [i.id] } : { ids: [i.id] }]); },
  flash: () => { flash = E.dueWords(); vFlash(); },
  fg: el => { const w = flash.shift(); E.scheduleWord(w, +el.dataset.g); E.log('wordrev', { w, g: +el.dataset.g }); save(); vFlash(); },
  delw: el => { delete E.st.words[el.dataset.w]; save(); render(); },
  use: el => { save(); Profiles.use(el.dataset.id); E.st = Profiles.load() || newState(); S = E.st.run || null; render(); },
  delp: el => { if (!confirm('删除档案「' + Profiles.name(el.dataset.id) + '」？数据不可恢复。')) return; Profiles.remove(el.dataset.id); if (!Profiles.cur()) { E.st = null; setupNew = true; } else { E.st = Profiles.load() || newState(); S = E.st.run || null; } render(); },
  newp: () => { save(); setupNew = true; render(); },
  setTg: el => { E.st.target = +el.dataset.v; save(); render(); },
  exp: () => { E.log('export', {}); save(); copy(Code.enc({ app: 'toeic-r-v2', name: Profiles.name(), st: Object.assign({}, E.st, { log: [] }) })); },
  imp: () => {
    try { const o = Code.dec($('#codeBox').value); if (o.app !== 'toeic-r-v2' || !o.st || o.st.ver !== 2) throw 0; save(); Profiles.create((o.name || '导入') + '（导入）'); E.st = o.st; S = o.st.run || null; save(); alert('已导入为新档案'); render(); }
    catch (e) { alert('进度码无效'); }
  },
  logx: () => {
    const s = JSON.stringify({ profile: Profiles.name(), log: E.st.log }), a = document.createElement('a');
    try { a.href = URL.createObjectURL(new Blob([s], { type: 'application/json' })); a.download = 'toeic_log_' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); }
    catch (e) { copy(s); }
  },
  reset: () => { if (confirm('重置当前档案的全部进度？')) { const t = E.st.target, x = E.st.exam; E.st = newState(t, x); S = null; save(); render(); } }
};
document.addEventListener('click', ev => {
  const tb = ev.target.closest('#tabs button'); if (tb) { tab = tb.dataset.tab; if (S) S.view = 0; return render(); }
  if (ev.target.id === 'modal') return A.closeM();
  const el = ev.target.closest('[data-act]');
  if (el && A[el.dataset.act] && el.tagName !== 'INPUT') return A[el.dataset.act](el);
  if (!S || !S.view || !S.tool) return;
  // 练习工具：点句划依据 / 点词加生词本
  const w = ev.target.closest('.w'), sen = ev.target.closest('.sen'), ps = ev.target.closest('.passage'), stem = ev.target.closest('[data-stem]');
  if (S.tool === 'w' && w && (ps || stem)) {
    const ctx = sen ? sen.textContent : stem.textContent; E.addWord(w.textContent, ctx.trim()); S.lu[curId()] = true; w.classList.add('vw'); save();
  } else if (S.tool === 'hl' && sen && ps) {
    const key = ps.dataset.bid + ':' + ps.dataset.di, a = E.st.hl[key] || (E.st.hl[key] = []), i = +sen.dataset.s, k = a.indexOf(i);
    if (k < 0) a.push(i); else a.splice(k, 1); sen.classList.toggle('hl'); E.log('hl', { b: ps.dataset.bid, s: i }); save();
  }
});
document.addEventListener('change', ev => { if (ev.target.id === 'exDate') { E.st.exam = ev.target.value; save(); } });
window.addEventListener('pagehide', save);
boot();
</script>
</body>
</html>
