"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"The premium is calculated ------- the basis of the driver's claims history over the previous five years.","o":["in","by","at","on"],"a":3,"e":"The fixed expression is “on the basis of”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-112","p":5,"f":"MXT05","q":112,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"Since the tariff changed in January, the utility ------- more than four thousand enquiries about billing.","o":["receives","has received","is receiving","received"],"a":1,"e":"“Since January” opens a period that runs up to the present, which takes the present perfect “has received”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-113","p":5,"f":"MXT05","q":113,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADV_AUX_SLOT"],"s":"The new fare structure is ------- simpler than the one it replaces.","o":["considerably","considerable","consider","consideration"],"a":0,"e":"An adverb is needed to intensify the comparative adjective “simpler”: “considerably simpler”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-114","p":5,"f":"MXT05","q":114,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.VOICE_PASSIVE"],"s":"The emergency generators ------- twice since the substation was upgraded in April.","o":["have tested","are testing","have been tested","were testing"],"a":2,"e":"“Since April” calls for the present perfect, and the generators undergo the testing rather than carry it out, so the passive “have been tested” is required.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-115","p":5,"f":"MXT05","q":115,"n":"QT.P5.RELATIVE","ns":["GR.REL.REL_PRONOUN"],"s":"Travellers ------- passports expire within six months of arrival may be refused entry.","o":["which","whose","who","of them"],"a":1,"e":"A possessive relative is needed to link “travellers” to “passports”: “travellers whose passports expire”. “Who” would leave “passports” without a subject.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-116","p":5,"f":"MXT05","q":116,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB"],"s":"All branch managers are expected to ------- strictly to the revised lending guidelines.","o":["observe","follow","comply","adhere"],"a":3,"e":"Only “adhere” is completed by “to”; “comply” would need “with”, and “observe” and “follow” take a direct object with no preposition.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-117","p":5,"f":"MXT05","q":117,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_PERSON_THING"],"s":"The firm has appointed an external ------- to review its data-protection procedures.","o":["adviser","advise","advisory","advisedly"],"a":0,"e":"“An external” must be followed by a noun, and the one appointed to review procedures is a person: “an external adviser”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-118","p":5,"f":"MXT05","q":118,"n":"QT.P5.CONNECTOR_MIX","ns":["GR.CONN.PREP_VS_CONJ"],"s":"------- the storm damaged three substations, service was restored to most customers within a day.","o":["Despite","Because of","Although","Owing to"],"a":2,"e":"A conjunction is needed before the clause “the storm damaged three substations”; “despite” and “owing to” must be followed by a noun phrase.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-119","p":5,"f":"MXT05","q":119,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_FUTURE_CLAUSE"],"s":"When the delegation ------- tomorrow, a representative from the consulate will meet them at the gate.","o":["will arrive","arrives","arrived","would arrive"],"a":1,"e":"A time clause introduced by “when” uses the present simple for future reference; the future is already carried by “will meet”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-120","p":5,"f":"MXT05","q":120,"n":"QT.P5.PAIR_GRAMMAR","ns":["GR.PRON.DETERMINER_QUANT"],"s":"Very ------- information was available about the cause of the delay when the notice was first posted.","o":["little","few","many","several"],"a":0,"e":"“Information” is uncountable, so it takes “little”; “few” and “several” count separate items.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-121","p":5,"f":"MXT05","q":121,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX"],"s":"The bank's mobile application has proved highly ------- with customers under thirty.","o":["populate","popularity","popularly","popular"],"a":3,"e":"“Prove” is a linking verb here and takes an adjective complement: “has proved highly popular”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-122","p":5,"f":"MXT05","q":122,"n":"QT.P5.VERB_FORM","ns":["GR.NONFIN.TO_INF"],"s":"The regional operator has agreed ------- the timetable until the track works are finished.","o":["adjusting","adjustment","to adjust","adjust"],"a":2,"e":"“Agree” is followed by the infinitive: “has agreed to adjust the timetable”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-123","p":5,"f":"MXT05","q":123,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_MEANING"],"s":"Delegates travelling ------- rail should keep their tickets for reimbursement.","o":["by","on","with","in"],"a":0,"e":"A means of transport named without an article takes “by”: “by rail”. “On” would require a specific vehicle, as in “on the 7:15 train”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-124","p":5,"f":"MXT05","q":124,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.VOICE_PASSIVE"],"s":"Policyholders ------- by e-mail as soon as a decision on their claim has been reached.","o":["notify","are notified","notifying","are notifying"],"a":1,"e":"The policyholders receive the message rather than send it, so the present passive “are notified” is required.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-125","p":5,"f":"MXT05","q":125,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.CONDITIONAL_INVERSION"],"s":"If the ministry ------- the subsidy last year, the wind farm would have opened on schedule.","o":["approved","has approved","would approve","had approved"],"a":3,"e":"The main clause “would have opened” marks an unreal past condition, which requires the past perfect “had approved”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-126","p":5,"f":"MXT05","q":126,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ"],"s":"The claims department cleared the backlog with remarkable -------.","o":["efficient","efficiently","efficiency","more efficient"],"a":2,"e":"After the preposition “with” and the adjective “remarkable”, only a noun can stand: “with remarkable efficiency”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-127","p":5,"f":"MXT05","q":127,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.MODAL_BASE"],"s":"Contractors ------- wear high-visibility clothing at all times inside the plant.","o":["must","might","would","could"],"a":0,"e":"A safety rule that applies at all times is an obligation, expressed by “must”; “might” and “could” would reduce it to a possibility.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-128","p":5,"f":"MXT05","q":128,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"The auditors ------- through the branch records for six hours before they found the discrepancy.","o":["have been working","had been working","are working","will have worked"],"a":1,"e":"The work ran up to a point in the past fixed by “before they found”, so the past perfect continuous is needed.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-129","p":5,"f":"MXT05","q":129,"n":"QT.P5.VOCAB","ns":[],"s":"Passengers must present a printed or digital boarding ------- before entering the departure lounge.","o":["permit","licence","ticket","pass"],"a":3,"e":"The fixed compound is “boarding pass”; a ticket records the purchase of travel rather than the document issued at check-in.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-130","p":5,"f":"MXT05","q":130,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX"],"s":"------- in renewable capacity has slowed in the last two quarters, according to the regulator.","o":["Grow","Growing","Growth","Grown"],"a":2,"e":"The subject of “has slowed” must be a noun: “Growth in renewable capacity”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-131","p":6,"f":"MXT05","q":131,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","FD.VOC.AFFIX","TX.EMAIL","VO.SCENE.TECH_IT"],"s":"","o":["process","processed","processing","processor"],"a":1,"e":"After “will still be” a past participle is needed, because the posted papers undergo the handling: “will still be processed”.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B1"},{"id":"MXC-T05-132","p":6,"f":"MXT05","q":132,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.AGREE_SV","TX.EMAIL","VO.SCENE.TECH_IT"],"s":"","o":["displays","display","displaying","to display"],"a":0,"e":"The singular subject “the portal” needs a finite third-person verb: “the portal displays its status”.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B1"},{"id":"MXC-T05-133","p":6,"f":"MXT05","q":133,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.EMAIL","VO.SCENE.TECH_IT"],"s":"","o":["Paper statements will no longer be issued to any client.","The portal is unavailable between midnight and 6 A.M.","You will also receive an e-mail each time a document is approved.","Identity documents must be certified by a solicitor before they are sent."],"a":2,"e":"The sentence extends the point just made about being kept informed of a document's status, and leads into how quickly accounts are cleared. Requiring certification by a solicitor would contradict a process the e-mail says takes about a minute.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B1"},{"id":"MXC-T05-134","p":6,"f":"MXT05","q":134,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","VO.LEX.VERB","TX.EMAIL","VO.SCENE.TECH_IT"],"s":"","o":["remind","submit","replace","review"],"a":3,"e":"“Review it with you” describes the check the desk offers before a client uploads; “submit” would name the client's own action rather than the desk's help.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B1"},{"id":"MXC-T05-135","p":6,"f":"MXT05","q":135,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.NOTICE","VO.SCENE.RETAIL_SHOPPING"],"s":"","o":["Some of this work requires the supply to be switched off for several hours.","Emergency repairs are handled by a separate contractor.","The network was last extended eleven years ago.","Customers may change supplier at any time without penalty."],"a":0,"e":"It connects the maintenance named before it to the notification rules that follow: an interruption to supply is precisely what households need to be told about. Emergency repairs fall outside a policy on planned outages.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B2"},{"id":"MXC-T05-136","p":6,"f":"MXT05","q":136,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.CONJ_ADVERBIAL","TX.NOTICE","VO.SCENE.RETAIL_SHOPPING"],"s":"","o":["during","until","since","before"],"a":3,"e":"The notice is placed earlier in time than the work, which “before” expresses; “since” and “until” would reverse or stretch that relationship.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B2"},{"id":"MXC-T05-137","p":6,"f":"MXT05","q":137,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.MODAL_BASE","TX.NOTICE","VO.SCENE.RETAIL_SHOPPING"],"s":"","o":["should","can","must","need"],"a":1,"e":"Registration is an option, and “can be completed at any time” states that it is available; “must” would make it compulsory, which the paragraph does not.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B2"},{"id":"MXC-T05-138","p":6,"f":"MXT05","q":138,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADV_VERB","TX.NOTICE","VO.SCENE.RETAIL_SHOPPING"],"s":"","o":["direct","direction","directly","directed"],"a":2,"e":"An adverb is needed to modify the passive verb “are contacted”: “are contacted directly by telephone”.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B2"},{"id":"MXC-T05-139","p":6,"f":"MXT05","q":139,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_PERFECT","TX.LETTER","VO.SCENE.HOTEL_LODGING"],"s":"","o":["examine","are examining","will examine","have examined"],"a":3,"e":"The review is finished and its summary is enclosed, so the present perfect “have examined” is required; the continuous would suggest the work is still under way.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B3"},{"id":"MXC-T05-140","p":6,"f":"MXT05","q":140,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.REL.REL_PRONOUN","TX.LETTER","VO.SCENE.HOTEL_LODGING"],"s":"","o":["what","that","which","it"],"a":2,"e":"A relative pronoun referring back to the whole preceding clause is needed: “which raises the average fare”. “It” would leave two main clauses joined by nothing but a comma.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B3"},{"id":"MXC-T05-141","p":6,"f":"MXT05","q":141,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","TX.LETTER","VO.SCENE.HOTEL_LODGING"],"s":"","o":["Specifically","Nevertheless","Otherwise","Meanwhile"],"a":0,"e":"The sentence narrows the general claim before it into two concrete proposals, which “specifically” signals; “nevertheless” would announce a contrast the paragraph does not make.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B3"},{"id":"MXC-T05-142","p":6,"f":"MXT05","q":142,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_CLOSING","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.LETTER","VO.SCENE.HOTEL_LODGING"],"s":"","o":["Please settle the enclosed invoice within thirty days.","If a particular morning suits you better, my assistant can be reached on the number below.","We are unfortunately unable to advise on hotel bookings.","Your account has been transferred to our Warsaw office."],"a":1,"e":"It follows directly from the offer to telephone and gives Ms. Rzepka a way to fix a time. Declining to advise on hotels would contradict the preferred-hotel list recommended a paragraph earlier.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B3"},{"id":"MXC-T05-143","p":6,"f":"MXT05","q":143,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.CONJ_ADVERBIAL","TX.ARTICLE","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["before","while","since","until"],"a":2,"e":"“Since” fixes the starting point of the period across which the figure is a record; “until” would place the record before the reopening.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B4"},{"id":"MXC-T05-144","p":6,"f":"MXT05","q":144,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.ARTICLE","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["The museum closed for refurbishment in March and has not reopened.","Introduced in April, it costs €18 and covers travel in both directions.","Passenger numbers fell sharply in the two seasons that followed.","The railway employs eleven drivers, three of whom work part time."],"a":1,"e":"It supplies the details of the combined ticket just mentioned, which the next sentence then quantifies with “It now accounts for…”. A museum closed since March could not be selling entry with the ticket.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B4"},{"id":"MXC-T05-145","p":6,"f":"MXT05","q":145,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","TX.ARTICLE","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["refusing","denying","delaying","exploring"],"a":3,"e":"“Exploring the possibility” fits an idea still under consideration, as the decision expected in January confirms; “refusing” or “denying” would already have ruled the shuttle out.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B4"},{"id":"MXC-T05-146","p":6,"f":"MXT05","q":146,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.ARTICLE","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["is published","publishes","will publish","is publishing"],"a":0,"e":"The timetable undergoes the publishing, so the passive is needed, and a time clause introduced by “before” uses the present rather than the future.","d":3,"t":30,"src":"open","b":"MXC-T05-P6-B4"},{"id":"MXC-T05-147","p":7,"f":"MXT05","q":147,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.NOTICE","TX.NOTICE","FD.READ.SKIM","VO.SCENE.TECH_IT"],"s":"What is the purpose of the notice?","o":["To announce a change in the building's opening hours","To introduce a new facilities contractor","To warn tenants of a temporary loss of power","To request payment of an annual maintenance charge"],"a":2,"e":"The notice is headed “Planned electrical maintenance” and states that power will be interrupted for an eight-hour window on 18 April.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S1"},{"id":"MXC-T05-148","p":7,"f":"MXT05","q":148,"n":"QT.P7.REQUEST_ACTION","ns":["TX.NOTICE","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What are tenants asked to do?","o":["Switch off their equipment before the weekend","Move their equipment to floor 4","Enter the building through the loading bay","Report to the facilities office on 18 April"],"a":0,"e":"Tenants with equipment outside the floor-4 server rooms are told to “shut it down before leaving on Friday 17 April”. The loading bay is mentioned only because it will be locked.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S1"},{"id":"MXC-T05-149","p":7,"f":"MXT05","q":149,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TEXT_MSG","TX.TEXT_MSG","FD.READ.SCAN","VO.SCENE.OFFICE_ADMIN"],"s":"What problem does Ms. Wójcik report?","o":["A meeting has been cancelled.","A filing deadline has been brought forward.","An office has closed for the day.","Documents were returned without a signature."],"a":3,"e":"Her first message says the audit files “have come back to us unsigned”. The Friday deadline is mentioned later as context, not as something that has changed.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S2"},{"id":"MXC-T05-150","p":7,"f":"MXT05","q":150,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.TEXT_MSG","TX.TEXT_MSG","FD.READ.DISCOURSE","VO.SCENE.OFFICE_ADMIN"],"s":"At 10:17, what does Mr. Okonjo most likely mean when he writes, “Then it is urgent”?","o":["He believes the deadline has already passed.","He realises there is very little time left to obtain the signature.","He thinks Ms. Hallberg should postpone her trip.","He wants Ms. Wójcik to handle the matter instead."],"a":1,"e":"He replies immediately after learning that Ms. Hallberg travels on Thursday and the deadline is Friday, which leaves almost no window — hence “Going back now”.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S2"},{"id":"MXC-T05-151","p":7,"f":"MXT05","q":151,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.ARTICLE","TX.ARTICLE","FD.READ.SCAN"],"s":"Where will the heat for the new network come from?","o":["An aluminium works","A gas-fired power station","Water pumped out of the harbour","The Kallsund conference centre"],"a":0,"e":"The network “will draw its heat from the aluminium works”. The harbour is where that water is currently discharged, not a source.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S3"},{"id":"MXC-T05-152","p":7,"f":"MXT05","q":152,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.ARTICLE","TX.ARTICLE","FD.READ.SCAN"],"s":"According to Ms. Solheim, what is unusual about the project?","o":["The temperature of the water being recovered","The speed at which construction will be completed","The size of the savings on gas","The tenants' agreement to share one contract"],"a":3,"e":"She says explicitly, “What makes the project unusual is that eighteen competing tenants agreed to sign a single shared supply contract.”","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S3"},{"id":"MXC-T05-153","p":7,"f":"MXT05","q":153,"n":"QT.P7.SYNONYM","ns":["QT.P7X.SYNONYM.ARTICLE","TX.ARTICLE","VO.CONF.POLYSEMY_CONTEXT","VO.PARA.WORD_SYNONYM"],"s":"In paragraph 3, the word “draw” is closest in meaning to","o":["attract","take","sketch","extend"],"a":1,"e":"“Draw its heat from the aluminium works” means take or obtain it from there. “Attract” would reverse the direction of the transfer.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S3"},{"id":"MXC-T05-154","p":7,"f":"MXT05","q":154,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.LETTER","TX.LETTER","FD.READ.SKIM"],"s":"Why was the letter written?","o":["To request payment of an overdue premium","To respond to a claim for flood damage","To set out the terms of a renewal","To explain why cover has been withdrawn"],"a":2,"e":"The letter states the renewal date, the new premium and the two terms that have changed. No claim has been made and nothing is overdue.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S4"},{"id":"MXC-T05-155","p":7,"f":"MXT05","q":155,"n":"QT.P7.TRUE_INDICATED","ns":["TX.LETTER","VO.PARA.WORD_SYNONYM"],"s":"What is stated about claims for glass?","o":["The amount the policyholder must pay has increased.","They are no longer covered by the policy.","They must be reported within thirty days.","They carry a separate additional premium."],"a":0,"e":"“The excess payable on glass claims has risen from €250 to €400” — the excess is the part the policyholder pays.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S4"},{"id":"MXC-T05-156","p":7,"f":"MXT05","q":156,"n":"QT.P7.INFERENCE","ns":["TX.LETTER","VO.PARA.GENERALIZE"],"s":"What is suggested about the ground-floor storage rooms?","o":["They are insured under a separate policy.","They will be inspected before 1 April.","They are no longer used for storage.","They are now considered less likely to flood."],"a":3,"e":"The insurer dropped the flood exclusion only after the drainage works were completed, which implies the flood risk there is now judged lower.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S4"},{"id":"MXC-T05-157","p":7,"f":"MXT05","q":157,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.ARTICLE","TX.ARTICLE","FD.READ.SKIM","VO.SCENE.TRAVEL_FLIGHT"],"s":"What is the article mainly about?","o":["A fall in the cost of air travel","Renewed demand for overnight rail services","The closure of a rolling-stock manufacturer","A hotel chain expanding near railway stations"],"a":1,"e":"The article opens with record passenger numbers on overnight trains and explains why demand has returned. The manufacturers appear only as a limit on supply.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S5"},{"id":"MXC-T05-158","p":7,"f":"MXT05","q":158,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.ARTICLE","TX.ARTICLE","FD.READ.SCAN","VO.SCENE.TRAVEL_FLIGHT"],"s":"According to operators, why do passengers choose overnight trains?","o":["They are cheaper than flights.","They offer discounts to frequent travellers.","They remove the need to pay for a hotel night.","They run more often than daytime services."],"a":2,"e":"Passengers are buying “a night that does not have to be spent in a hotel”. The article states directly that the revival is not driven by price.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S5"},{"id":"MXC-T05-159","p":7,"f":"MXT05","q":159,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.ARTICLE","TX.ARTICLE","VO.PARA.WORD_SYNONYM","VO.SCENE.TRAVEL_FLIGHT"],"s":"What is indicated about single-occupancy cabins?","o":["They are reserved well in advance.","They cost less than a seat in an ordinary carriage.","They are offered on only two routes.","They will be introduced in 2028."],"a":0,"e":"They “sell out first and are typically booked eleven weeks ahead”. The 2028 date refers to an order for new sleeping cars, not to the cabins in service today.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S5"},{"id":"MXC-T05-160","p":7,"f":"MXT05","q":160,"n":"QT.P7.DETAIL","ns":["TX.CHAT","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What will happen at 18:00?","o":["A branch will close to the public.","Replacement cards will be delivered.","A meeting of the three writers will begin.","A system will stop accepting new entries."],"a":3,"e":"The card-issuing system “goes read-only at 18:00”, so orders can no longer be entered until the migration is finished.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S6"},{"id":"MXC-T05-161","p":7,"f":"MXT05","q":161,"n":"QT.P7.INFERENCE","ns":["TX.CHAT","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"What is suggested about the branch staff?","o":["They have already read the release note.","Many are unaware of the paper forms held in their branch.","They will be asked to work over the weekend.","They have ordered more cards than usual."],"a":1,"e":"Mr. Zieliński notes that BR-12 forms are in every branch safe but “half of them will not know it is there”, which is why Ms. Nwosu will spell it out.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S6"},{"id":"MXC-T05-162","p":7,"f":"MXT05","q":162,"n":"QT.P7.DETAIL","ns":["TX.CHAT","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What will Ms. Nwosu do next?","o":["Clear the queue of replacement cards","Rewrite the release note","Visit several branches in person","Prepare a message for the branch network"],"a":3,"e":"She agrees to write to the branch network and promises a draft “by 10:30”. Clearing the card queue is Mr. Zieliński's task.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S6"},{"id":"MXC-T05-163","p":7,"f":"MXT05","q":163,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.EMAIL","TX.EMAIL","FD.READ.SKIM","VO.SCENE.TRAVEL_FLIGHT"],"s":"Why did Ms. Marstrand write the e-mail?","o":["To confirm a hotel reservation","To advertise a newly created tour","To explain a change to a booked itinerary","To request payment of an outstanding balance"],"a":2,"e":"The subject line reads “Change to your 3 November departure”, and the e-mail sets out how day four has been rebuilt after the ferry was withdrawn.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S7"},{"id":"MXC-T05-164","p":7,"f":"MXT05","q":164,"n":"QT.P7.TRUE_INDICATED","ns":["TX.EMAIL","VO.PARA.WORD_SYNONYM","VO.SCENE.TRAVEL_FLIGHT"],"s":"What is indicated about the new day-four arrangement?","o":["It takes longer than the original plan.","It requires an extra night in a hotel.","It will be led by a different guide.","It ends with an earlier return flight."],"a":0,"e":"“The drive adds ninety minutes to the day.” The e-mail states that the hotel, guide and return flight are unchanged.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S7"},{"id":"MXC-T05-165","p":7,"f":"MXT05","q":165,"n":"QT.P7.REQUEST_ACTION","ns":["QT.P7X.REQUEST_ACTION.EMAIL","TX.EMAIL","FD.READ.SCAN","VO.SCENE.TRAVEL_FLIGHT"],"s":"What is Mr. Bergström asked to do?","o":["Apply in writing for the refund","Reply before a stated date","Rebook his group's return flight","Pay a fee for changing the itinerary"],"a":1,"e":"“Please confirm by 20 October that the revised day four is acceptable.” The refund is automatic and no fee is charged.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S7"},{"id":"MXC-T05-166","p":7,"f":"MXT05","q":166,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.FINANCE_ACCOUNT"],"s":"How did Halvorsen & Adeyemi begin?","o":["As a division of a larger consultancy","With offices in three cities at once","By installing metering equipment for suppliers","As a small practice serving one client"],"a":3,"e":"It “began in 2009 as a two-person practice above a bakery in Trondheim, with a single client”. The three offices came later.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S8"},{"id":"MXC-T05-167","p":7,"f":"MXT05","q":167,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.FINANCE_ACCOUNT"],"s":"How does the firm earn its income?","o":["From commissions paid by energy suppliers","From the sale of metering equipment","From fees charged to the clients it advises","From installation contracts on industrial sites"],"a":2,"e":"“Our only revenue is the fee our clients pay us.” The page rules out commission, equipment sales and installation explicitly.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S8"},{"id":"MXC-T05-168","p":7,"f":"MXT05","q":168,"n":"QT.P7.NOT_TRUE","ns":["TX.WEB","ST.ELIM.OPTIONS","VO.SCENE.FINANCE_ACCOUNT"],"s":"What information about the firm is NOT given on the web page?","o":["The professional qualifications of its consultants","The year in which it was founded","The number of people it employs","The cities in which it has offices"],"a":0,"e":"The page gives 2009, forty-one employees and the three office cities, but says nothing about what qualifications its consultants hold.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S8"},{"id":"MXC-T05-169","p":7,"f":"MXT05","q":169,"n":"QT.P7.INSERTION","ns":["TX.WEB","FD.READ.REFERENCE","FD.READ.DISCOURSE","VO.SCENE.FINANCE_ACCOUNT"],"s":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong?\n\n“For a plant spending €4 million a year on power, that is €440,000 left on the table.”","o":["[1]","[2]","[3]","[4]"],"a":3,"e":"The sentence converts the eleven percent into euros, so it can only follow the sentence that supplies that figure, at [4].","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S8"},{"id":"MXC-T05-170","p":7,"f":"MXT05","q":170,"n":"QT.P7.DETAIL","ns":["TX.MEMO","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What should staff do with their current cards?","o":["Return them to the finance office","Destroy them","Keep them until 5 March","Post them to the new provider"],"a":1,"e":"“Please destroy it rather than returning it to this office.” The 5 March date applies to expense claims, not to the cards.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S9"},{"id":"MXC-T05-171","p":7,"f":"MXT05","q":171,"n":"QT.P7.INFERENCE","ns":["TX.MEMO","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"What is suggested about staff whose directory entry is out of date?","o":["They will not be sent a replacement card.","They must collect their card in person.","They may be unable to activate their new card.","Their spending limit will be reduced."],"a":2,"e":"Activation must be done from the number held in the directory, so an incorrect entry would block it — which is why corrections are due by 9 February.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S9"},{"id":"MXC-T05-172","p":7,"f":"MXT05","q":172,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"By when must a flexible-rate booking be cancelled to avoid a charge?","o":["By 18:00 on the day before arrival","By 18:00 on the day of arrival","Seven days before arrival","Twenty-one days before arrival"],"a":0,"e":"The flexible rate allows free cancellation “up to 18:00 on the day before arrival”; after that one night is charged. The seven- and twenty-one-day limits belong to group bookings.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S10"},{"id":"MXC-T05-173","p":7,"f":"MXT05","q":173,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"What is possible with a saver-rate booking?","o":["A full refund within twenty-four hours","A transfer to a different hotel at no cost","Cancellation up to eight days before arrival","One change of dates in return for a fee"],"a":3,"e":"The saver rate is non-refundable, but “dates may be moved once, to any date within six months, for a fee of €25 per room”.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S10"},{"id":"MXC-T05-174","p":7,"f":"MXT05","q":174,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"A group booking of ten rooms is cancelled twelve days before arrival. What will be charged?","o":["Nothing","Half the value of the booking","One night for each room","The full value of the booking"],"a":1,"e":"Twelve days falls inside the 20-to-8-day band, for which “half the value of the booking is charged”. The full value applies only within seven days.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S10"},{"id":"MXC-T05-175","p":7,"f":"MXT05","q":175,"n":"QT.P7.INFERENCE","ns":["TX.NOTICE","VO.PARA.GENERALIZE","VO.SCENE.HOTEL_LODGING"],"s":"What is suggested about a reservation made through an online platform?","o":["It cannot be amended at any point.","It qualifies for a reduction of 20 percent.","The terms above do not apply to it.","It must be confirmed twenty-one days in advance."],"a":2,"e":"Such bookings “are governed by that partner's terms rather than by this policy”, so the rates and deadlines set out here do not cover them.","d":3,"t":55,"src":"open","b":"MXC-T05-P7-S10"},{"id":"MXC-T05-176","p":7,"f":"MXT05","q":176,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SKIM","VO.SCENE.TECH_IT"],"s":"What is the purpose of the notice?","o":["To announce a change to the tenancy agreement","To warn tenants that electricity will be cut off for a day","To advertise portable generators for sale","To explain a rise in service charges"],"a":1,"e":"The notice gives the day on which each building will lose mains electricity while the substations are replaced. Generators are offered for hire, not for sale.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D1"},{"id":"MXC-T05-177","p":7,"f":"MXT05","q":177,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL_NUMBER","TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.TECH_IT"],"s":"On what date will Mr. Oyelaran's firm lose its electricity supply?","o":["3 March","4 March","5 March","6 March"],"a":2,"e":"The e-mail places Sundermeyer Actuarial in Building C, and the notice gives Building C the Thursday 5 March slot.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D1"},{"id":"MXC-T05-178","p":7,"f":"MXT05","q":178,"n":"QT.P7.INFERENCE","ns":["TX.DOUBLE","TX.EMAIL","TX.NOTICE","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"Why does Mr. Oyelaran mention the recruitment agency?","o":["To explain that another tenant would share the cost of the generator","To pass on a complaint made by another tenant","To ask that the agency be moved to a different building","To identify who will pay the whole hire fee"],"a":0,"e":"He asks whether the €340 covers the whole building because the ground-floor agency “would share the cost with us”. He never says the agency will pay all of it.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D1"},{"id":"MXC-T05-179","p":7,"f":"MXT05","q":179,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.NOT_TRUE","TX.DOUBLE","TX.EMAIL","TX.NOTICE","ST.ELIM.OPTIONS","VO.SCENE.TECH_IT"],"s":"Which of Mr. Oyelaran's concerns is NOT addressed in the notice?","o":["The date of the interruption in his building","The cost of hiring a generator","The deadline for requesting a generator","Whether a generator can run a cooling unit"],"a":3,"e":"The notice supplies the dates, the €340 charge and the ten-working-day deadline, but says nothing about how much equipment a generator will support.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D1"},{"id":"MXC-T05-180","p":7,"f":"MXT05","q":180,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What does the notice indicate about compensation?","o":["It is paid only to tenants who hire a generator.","It is not available for interruptions of this kind.","It is calculated according to the number of floors occupied.","It must be claimed within ten working days."],"a":1,"e":"“our standard tenancy agreement does not provide compensation for planned interruptions of this kind”. The ten-working-day limit belongs to generator requests, not to claims.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D1"},{"id":"MXC-T05-181","p":7,"f":"MXT05","q":181,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.ARTICLE","TX.LETTER","FD.READ.SKIM","VO.SCENE.HOTEL_LODGING"],"s":"What is the article mainly about?","o":["The completion of a path along the coast","A decline in visitor numbers in Kaldvik","A new charge on overnight visitors","A dispute between hotels and guesthouses"],"a":2,"e":"The article reports the council's decision to introduce a €2.50 nightly visitor levy from 1 October. The coastal path is what the money will pay for; it has not been built.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D2"},{"id":"MXC-T05-182","p":7,"f":"MXT05","q":182,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.LETTER","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"According to the article, how will most of the money raised be spent?","o":["On building a path along the coast","On running the summer shuttle bus","On collecting waste","On licensing short-term rentals"],"a":0,"e":"“Roughly two-thirds is earmarked for the long-delayed coastal path”; the shuttle bus and waste collection share what is left.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D2"},{"id":"MXC-T05-183","p":7,"f":"MXT05","q":183,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.LETTER","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"Who will stop paying the levy part-way through a stay?","o":["Guests in licensed short-term rentals","Guests travelling on business","Guests staying longer than two weeks","Guests who book before 1 October"],"a":2,"e":"Guests staying more than fourteen consecutive nights are exempt “from the fifteenth night onwards”. Those travelling for medical treatment are exempt for the whole stay, not part of it.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D2"},{"id":"MXC-T05-184","p":7,"f":"MXT05","q":184,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.ARTICLE","TX.LETTER","FD.READ.SKIM","VO.SCENE.HOTEL_LODGING"],"s":"What is Mr. Jónsson's main objection to the levy?","o":["The nightly amount is too high for his guests.","Small operators would have to administer it.","The coastal path is not worth building.","Hotels would be exempt from paying it."],"a":1,"e":"“My objection is to who does the collecting” — adding the charge, judging exemptions and filing quarterly returns falls on operators too small to absorb the work. He states plainly that his guests will pay the €2.50 without complaint.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D2"},{"id":"MXC-T05-185","p":7,"f":"MXT05","q":185,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL_NUMBER","TX.DOUBLE","TX.ARTICLE","TX.LETTER","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.HOTEL_LODGING"],"s":"By what date does Mr. Jónsson want the committee to consider his proposal?","o":["12 May","30 June","1 October","The end of the first quarter"],"a":1,"e":"He asks the committee to look at his alternative “before the consultation closes”, and the article dates that closing at 30 June.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-D2"},{"id":"MXC-T05-186","p":7,"f":"MXT05","q":186,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What does the advertisement indicate about the volume agreement?","o":["It removes the minimum charge per order.","It includes certification at no extra cost.","It is offered only for financial texts.","It applies the lowest per-word rate to every job."],"a":3,"e":"Clients who commit to 100,000 words a year “pay the Standard rate on every job, whatever the delivery speed”. The €90 minimum and the €45 certification fee are untouched by it.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T1"},{"id":"MXC-T05-187","p":7,"f":"MXT05","q":187,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What rate should have been applied to order KTP-9042?","o":["€0.14 per word","€0.19 per word","€0.28 per word","€45 per document"],"a":0,"e":"The invoice bills the policy wording at the Priority rate, but Vestberg signed the volume agreement in January, so the €0.14 Standard rate was due regardless of delivery speed.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T1"},{"id":"MXC-T05-188","p":7,"f":"MXT05","q":188,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","FD.READ.SKIM","VO.SCENE.BANK_PAYMENT"],"s":"Why did Ms. Vestberg write the e-mail?","o":["To place a further translation order","To ask for a credit note","To request a faster delivery option","To have an invoice issued again"],"a":3,"e":"“Could you reissue the invoice with that line corrected?” She says explicitly that she prefers this to paying and then waiting for a credit note.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T1"},{"id":"MXC-T05-189","p":7,"f":"MXT05","q":189,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What else does Ms. Vestberg ask Kiruna to confirm?","o":["The date on which the volume agreement began","Which documents were certified","The word count of the board minutes","The rate of VAT that was applied"],"a":1,"e":"The invoice charges for two certifications, but only the policy wording came back stamped and the survey report is not marked for certification, so she asks which two were certified.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T1"},{"id":"MXC-T05-190","p":7,"f":"MXT05","q":190,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.TRUE_INDICATED","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","VO.PARA.WORD_SYNONYM","VO.SCENE.BANK_PAYMENT"],"s":"What is indicated about Vestberg Marine Insurance?","o":["It has sent Kiruna more than 100,000 words this year.","It receives a separate invoice for each order.","It requires a sworn translator for every text.","It has undertaken to send a set volume of work this year."],"a":3,"e":"It signed the volume agreement, which the advertisement defines as a commitment to 100,000 words in a calendar year; only just over 40,000 have been sent so far. Volume clients are invoiced monthly, and this single invoice covers three orders.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T1"},{"id":"MXC-T05-191","p":7,"f":"MXT05","q":191,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.WEB","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What is included in the price of a Fjallstigen walk?","o":["Waterproof clothing","Travel insurance","Transport of luggage between huts","Transport back to the starting point"],"a":2,"e":"“baggage transfer between huts” is listed as included, whereas boots and waterproofs are not supplied and insurance is “not included in the price”.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T2"},{"id":"MXC-T05-192","p":7,"f":"MXT05","q":192,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.WEB","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What will Fjallstigen do if only three people have booked a departure?","o":["Offer another date or return the money","Run the walk with a second guide","Combine the group with a different route","Reduce the price for those who booked"],"a":0,"e":"With fewer than four booked seven days before departure, walkers are offered “a transfer to another date or a full refund”.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T2"},{"id":"MXC-T05-193","p":7,"f":"MXT05","q":193,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL_NUMBER","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.WEB","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.BANK_PAYMENT"],"s":"When will the balance for Ms. Aguirre's new booking fall due?","o":["12 August","22 August","26 August","27 August"],"a":3,"e":"She wants the last September departure, which the web page gives as 26 September, and clause 3 makes the balance due 30 days before departure.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T2"},{"id":"MXC-T05-194","p":7,"f":"MXT05","q":194,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.TRUE_INDICATED","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.WEB","VO.PARA.WORD_SYNONYM","VO.SCENE.BANK_PAYMENT"],"s":"What is indicated about the change of date Ms. Aguirre requests?","o":["It will be treated as a cancellation.","It can be made at no additional cost.","It requires a second deposit.","It cannot be made once the balance is paid."],"a":1,"e":"It is her first change and she writes on 2 August, more than 30 days before the 12 September departure, so clause 5 makes it free of charge.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T2"},{"id":"MXC-T05-195","p":7,"f":"MXT05","q":195,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.WEB","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"Ms. Aguirre asks what happens if it rains hard. What do the booking conditions state?","o":["A full refund is given.","The walk is shortened by one day.","The walk goes ahead as planned.","A different route is offered."],"a":2,"e":"“We do not cancel for rain.” The alternative route and the refund apply only when the authorities close a route.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T2"},{"id":"MXC-T05-196","p":7,"f":"MXT05","q":196,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SKIM","VO.SCENE.TECH_IT"],"s":"What is the main purpose of the press release?","o":["To announce longer telephone service hours","To publish the findings of a customer survey","To introduce a new billing system","To advertise positions for advisers"],"a":0,"e":"The headline and opening paragraph announce that the service centre will stay open until 21:00 from 5 January; the survey is cited only as the reason for the decision.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T3"},{"id":"MXC-T05-197","p":7,"f":"MXT05","q":197,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"The press release announces that the service centre will close later. What proportion of survey respondents chose that as the change they most wanted?","o":["34 percent","27 percent","19 percent","12 percent"],"a":0,"e":"“Longer telephone service hours” was the first item on the survey list, chosen by 34 percent; the 19 percent figure belongs to shorter waiting times.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T3"},{"id":"MXC-T05-198","p":7,"f":"MXT05","q":198,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What is offered to advisers who move to the evening shift?","o":["A shorter working week","Priority for Saturday shifts","Extra training in November","An additional payment for each hour after 18:00"],"a":3,"e":"“the allowance is €4.20 per hour worked after 18:00”. The November training is for the newly recruited advisers, not for staff moving across.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T3"},{"id":"MXC-T05-199","p":7,"f":"MXT05","q":199,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What will customers receive in March?","o":["An app for submitting meter readings","A bill in a new format","A wider choice of payment dates","A summary of the survey results"],"a":1,"e":"The memo says the second item on the survey list “is with the printers now and will reach customers in March”, and the second item on that list is a clearer bill.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T3"},{"id":"MXC-T05-200","p":7,"f":"MXT05","q":200,"n":"QT.P7.INFERENCE","ns":["TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"What is indicated about the advisers already working at the service centre?","o":["They will all be retrained in November.","They will be asked to work on Sundays.","None of them has to take the new evening hours.","Their hourly allowance will rise in January."],"a":2,"e":"The memo states that no one currently on the team is required to work the evening slot, which is why 45 advisers were recruited for it; moving to evenings is voluntary and is arranged with a team leader.","d":3,"t":65,"src":"open","b":"MXC-T05-P7-T3"},{"id":"MXC-T06-101","p":5,"f":"MXT06","q":101,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX"],"s":"Ravensholm Tooling reported a significant ------- in output after the second assembly line came online.","o":["increased","increase","increasingly","increasing"],"a":1,"e":"After the article “a” and the adjective “significant”, a noun is required: “a significant increase in output”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-102","p":5,"f":"MXT06","q":102,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"By the time the safety audit begins next month, the plant ------- all of the recommended guard rails.","o":["will have installed","installed","has installed","is installing"],"a":0,"e":"“By the time … next month” sets a deadline in the future, so the future perfect is needed. The present perfect “has installed” cannot reach forward to a future point.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-103","p":5,"f":"MXT06","q":103,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_MEANING"],"s":"The tenants association objected ------- the proposed increase in the monthly maintenance charge.","o":["against","for","with","to"],"a":3,"e":"The verb “object” takes “to”: “objected to the proposed increase”. “Against” belongs with “protest” or “argue”, not with “object”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-104","p":5,"f":"MXT06","q":104,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB"],"s":"Because the sensor readings had drifted out of tolerance, the technician had to ------- the machine before the next production run.","o":["relocate","reinforce","recalibrate","replicate"],"a":2,"e":"Readings that have drifted out of tolerance are corrected by adjusting the instrument, which is exactly what “recalibrate” means. Reinforcing or moving the machine would leave the readings wrong.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-105","p":5,"f":"MXT06","q":105,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADV_VERB"],"s":"The property manager praised the maintenance crew for responding so ------- to the flooding in the basement.","o":["quickly","quick","quickness","quicken"],"a":0,"e":"The blank modifies the verb “responding”, so an adverb is required: “responding so quickly”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-106","p":5,"f":"MXT06","q":106,"n":"QT.P5.CONNECTOR_MIX","ns":["GR.CONN.PREP_VS_CONJ"],"s":"------- the zoning application was submitted on time, the council will not rule on it before October.","o":["Despite","In spite of","Although","Owing to"],"a":2,"e":"Only “although” can introduce a full clause with its own subject and verb; “despite”, “in spite of” and “owing to” must be followed by a noun phrase.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-107","p":5,"f":"MXT06","q":107,"n":"QT.P5.RELATIVE","ns":["GR.REL.REL_PRONOUN"],"s":"The apprentices ------- portfolios were submitted after the deadline will be assessed in the next cycle.","o":["who","whose","which","whom"],"a":1,"e":"The portfolios belong to the apprentices, so the possessive relative “whose” is needed; “who” would leave “portfolios” with no link to their owners.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-108","p":5,"f":"MXT06","q":108,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.VOICE_PASSIVE"],"s":"The vacant retail unit on Kellerman Street ------- into two smaller offices next spring.","o":["will divide","is dividing","will have divided","will be divided"],"a":3,"e":"The unit does not perform the action, it receives it, so the future passive “will be divided” is required.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-109","p":5,"f":"MXT06","q":109,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.VERB_SLOT"],"s":"Ms. Adeyemi's report on the conveyor failure was unusually -------, running to fewer than two pages.","o":["concise","concisely","conciseness","concision"],"a":0,"e":"After the linking verb “was” and the adverb “unusually”, an adjective completes the sentence: “was unusually concise”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-110","p":5,"f":"MXT06","q":110,"n":"QT.P5.COMPARATIVE","ns":["GR.COMP.COMPARATIVE"],"s":"The new hydraulic press runs far ------- than the model it replaced, which has reduced complaints from the neighbouring units.","o":["more quietly","most quietly","quietly","as quietly"],"a":0,"e":"“Than” signals a comparison, so the adverb modifying “runs” must take the comparative form “more quietly”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-111","p":5,"f":"MXT06","q":111,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"Hollandale Engineering ------- apprenticeships in precision machining since the plant opened in 1998.","o":["offers","offered","has offered","will offer"],"a":2,"e":"“Since 1998” connects a starting point in the past to the present, which calls for the present perfect “has offered”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-112","p":5,"f":"MXT06","q":112,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_MEANING"],"s":"The surveyor's fee is payable ------- receipt of the completed valuation report.","o":["in","on","for","by"],"a":1,"e":"The fixed expression is “payable on receipt of”, meaning as soon as the report arrives.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-113","p":5,"f":"MXT06","q":113,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_AFTER_DET"],"s":"Several tenants have complained about the ------- of the lift in the north tower.","o":["reliable","reliably","rely","reliability"],"a":3,"e":"The object of the preposition “about” must be a noun phrase: “the reliability of the lift”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-114","p":5,"f":"MXT06","q":114,"n":"QT.P5.VERB_FORM","ns":["GR.NONFIN.GERUND"],"s":"The apprenticeship board recommends ------- a logbook of every task completed on the shop floor.","o":["to keep","keep","keeping","kept"],"a":2,"e":"“Recommend” is followed by a gerund when no object comes between: “recommends keeping a logbook”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-115","p":5,"f":"MXT06","q":115,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB"],"s":"Demand for warehouse space near the port has ------- sharply since the rail terminal opened.","o":["raised","risen","arisen","aroused"],"a":1,"e":"“Rise” is intransitive, so demand itself “has risen”. “Raised” would need an object, and “arisen” is used of questions or problems coming into existence.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-116","p":5,"f":"MXT06","q":116,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.AGREE_SV","FD.SENT.MODIFIER_STRIP"],"s":"The list of approved subcontractors ------- reviewed by the procurement team every quarter.","o":["is","are","were","have been"],"a":0,"e":"The subject is the singular “list”, not the plural “subcontractors” inside the prepositional phrase, so the singular “is” is correct.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-117","p":5,"f":"MXT06","q":117,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_PERSON_THING"],"s":"Vessikko Precision has appointed an external ------- to review its quality management system.","o":["auditing","audited","audit","auditor"],"a":3,"e":"A person is appointed, not a procedure: “an external auditor to review the system”. “Audit” names the review itself and cannot be given an appointment.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-118","p":5,"f":"MXT06","q":118,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_SIMPLE"],"s":"Enrolment for the autumn term ------- next Monday and closes on 30 September.","o":["opened","has opened","opens","had opened"],"a":2,"e":"A fixed point on a published timetable takes the present simple, matching “closes” later in the sentence: “opens next Monday”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-119","p":5,"f":"MXT06","q":119,"n":"QT.P5.RELATIVE","ns":["GR.REL.REL_PRONOUN"],"s":"The engineer ------- designed the new extraction system will lead Thursday's training session.","o":["who","which","whose","whom"],"a":0,"e":"The relative pronoun is the subject of “designed” and refers to a person, so “who” is required; “whom” can only serve as an object.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-120","p":5,"f":"MXT06","q":120,"n":"QT.P5.WORD_FORM","ns":["GR.NONFIN.PARTICIPLE_ADJ"],"s":"Delegates left the seminar on the revised building regulations feeling thoroughly -------.","o":["confusing","confused","confuse","confusion"],"a":1,"e":"The delegates experience the feeling, so the past participle “confused” is used; “confusing” would describe the seminar rather than the people at it.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-121","p":5,"f":"MXT06","q":121,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ"],"s":"Board members praised the site team's ------- of the shutdown, which finished a full day early.","o":["manage","manageable","management","managerial"],"a":2,"e":"After the possessive “the site team's”, a noun is needed: “the site team's management of the shutdown”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-122","p":5,"f":"MXT06","q":122,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"The refurbishment of the north wing is scheduled to finish ------- the end of the second quarter.","o":["until","in","on","by"],"a":3,"e":"“By” marks the deadline before which the work will be complete. “Until” would describe a period continuing up to that point, which does not fit a verb such as “finish”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-123","p":5,"f":"MXT06","q":123,"n":"QT.P5.CONJ","ns":["GR.CONN.CONJ_CORRELATIVE"],"s":"Neither the ventilation upgrade ------- the lighting replacement was included in the original budget.","o":["nor","or","and","but"],"a":0,"e":"“Neither” is paired with “nor”: “neither the ventilation upgrade nor the lighting replacement”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-124","p":5,"f":"MXT06","q":124,"n":"QT.P5.COMPARATIVE","ns":["GR.COMP.SUPERLATIVE"],"s":"Of the three sites shortlisted for the depot, the one beside the motorway offers ------- access for heavy vehicles.","o":["the better","the best","better","as good"],"a":1,"e":"Three sites are being compared, so the superlative is required; “the better” would be used only of two.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-125","p":5,"f":"MXT06","q":125,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADJ_BEFORE_NOUN"],"s":"Attendance at the evening courses has shown a ------- improvement since the campus shuttle was introduced.","o":["notice","noticing","noticeable","noticeably"],"a":2,"e":"The blank modifies the noun “improvement”, so an adjective is needed: “a noticeable improvement”. The adverb “noticeably” could only modify a verb or an adjective.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-126","p":5,"f":"MXT06","q":126,"n":"QT.P5.PRONOUN","ns":["GR.PRON.REFLEXIVE"],"s":"Tenants who wish to renew early should submit the form ------- rather than send it through the letting agent.","o":["themselves","them","their","theirs"],"a":0,"e":"The emphatic reflexive “themselves” stresses that the tenants act without help; the object pronoun “them” would have to refer to somebody other than the subject.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-127","p":5,"f":"MXT06","q":127,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_SIMPLE"],"s":"The quality team ------- the packing line when the power to the building failed.","o":["inspects","has inspected","will inspect","was inspecting"],"a":3,"e":"The past continuous describes the activity already under way when the sudden event interrupted it: “was inspecting … when the power failed”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-128","p":5,"f":"MXT06","q":128,"n":"QT.P5.VOCAB","ns":[],"s":"A shortage of qualified fitters is the main ------- to expanding the night shift.","o":["refusal","reluctance","obstacle","reduction"],"a":2,"e":"Something standing in the way of a plan is an “obstacle to” it. A shortage of staff is a condition, not an attitude, so it can be neither a refusal nor a reluctance.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-129","p":5,"f":"MXT06","q":129,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.VERB_SLOT"],"s":"Only qualified electricians may ------- the distribution boards in the plant room.","o":["accessible","access","accessibly","accessibility"],"a":1,"e":"After the modal “may”, the base form of the verb is required: “may access the distribution boards”.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-130","p":5,"f":"MXT06","q":130,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.VOICE_PASSIVE"],"s":"The vacant plot behind the depot ------- used for staff parking since the lease was renegotiated.","o":["has","is","was","has been"],"a":3,"e":"The plot receives the action, and “since” runs the situation from a past point up to now, so the present perfect passive “has been used” is required.","d":3,"t":22,"src":"open"},{"id":"MXC-T06-131","p":6,"f":"MXT06","q":131,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","FD.VOC.AFFIX","TX.NOTICE"],"s":"","o":["expecting","expects","expected","expectation"],"a":2,"e":"“Is expected to take” is a passive built on the past participle; the active “expects” would make the building work do the expecting.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B1"},{"id":"MXC-T06-132","p":6,"f":"MXT06","q":132,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.PREP_VS_CONJ","TX.NOTICE"],"s":"","o":["during","while","since","among"],"a":0,"e":"The blank is followed by the noun phrase “the morning rush”, so the preposition “during” is needed; “while” would require a clause with its own verb.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B1"},{"id":"MXC-T06-133","p":6,"f":"MXT06","q":133,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.NOTICE"],"s":"","o":["Large items may be carried in the passenger lift instead.","The concierge desk will be closed for the duration of the programme.","Both passenger lifts will run normally at weekends.","Requests made on the day of a move cannot normally be accommodated."],"a":3,"e":"The sentence before it sets a twenty-four-hour booking rule, so what follows naturally states the consequence of giving no notice. A closed concierge desk would contradict the booking hours given in the next sentence.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B1"},{"id":"MXC-T06-134","p":6,"f":"MXT06","q":134,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","TX.NOTICE"],"s":"","o":["are being","will be","have been","were"],"a":1,"e":"“By the end of June” points to a date still ahead, so the future “will be” is required; “have been” would place the return to service in the past.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B1"},{"id":"MXC-T06-135","p":6,"f":"MXT06","q":135,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.EMAIL","VO.SCENE.RND_PRODUCT"],"s":"","o":["The course has been postponed until the autumn.","The institute needs a fortnight's notice to confirm each name.","Places are allocated on the day by the course tutors.","The fee has not yet been agreed with the provider."],"a":1,"e":"“Therefore” shows that this sentence supplies the reason for an internal deadline earlier than the institute's, and only the fortnight of notice does that. The fee is stated at the end of the message, so it cannot still be unsettled.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B2"},{"id":"MXC-T06-136","p":6,"f":"MXT06","q":136,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.AGREE_SV","TX.EMAIL","VO.SCENE.RND_PRODUCT"],"s":"","o":["including","include","to include","includes"],"a":3,"e":"The verb shares the singular subject “The course” and balances “is run”, so the third-person form “includes” is needed.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B2"},{"id":"MXC-T06-137","p":6,"f":"MXT06","q":137,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.NONFIN.TO_INF","TX.EMAIL","VO.SCENE.RND_PRODUCT"],"s":"","o":["to check","checking","check","checked"],"a":0,"e":"“Remind” is followed by an infinitive of purpose: “supervisors are reminded to check their team rotas”.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B2"},{"id":"MXC-T06-138","p":6,"f":"MXT06","q":138,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.EMAIL","VO.SCENE.RND_PRODUCT"],"s":"","o":["will give","has given","will be given","is giving"],"a":2,"e":"Priority is something granted rather than something that acts, so the future passive “will be given” fits the conditional clause about extra names.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B2"},{"id":"MXC-T06-139","p":6,"f":"MXT06","q":139,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.COMP.COMPARATIVE","TX.ARTICLE","VO.SCENE.RND_PRODUCT"],"s":"","o":["as","very","much more","considerably"],"a":3,"e":"A comparative adjective is intensified by an adverb such as “considerably”: “considerably larger than”. “Very” cannot modify “larger”, and “much more” cannot precede a comparative — with “large” the intensified comparative is “much larger”.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B3"},{"id":"MXC-T06-140","p":6,"f":"MXT06","q":140,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.PREP_VS_CONJ","TX.ARTICLE","VO.SCENE.RND_PRODUCT"],"s":"","o":["despite","because of","while","so that"],"a":2,"e":"The two effects happen together, and “while” introduces the second one as a simultaneous gain. “Despite” would set the two in opposition, and “so that” cannot be followed by an -ing form.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B3"},{"id":"MXC-T06-141","p":6,"f":"MXT06","q":141,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.REL.REL_PRONOUN","TX.ARTICLE","VO.SCENE.RND_PRODUCT"],"s":"","o":["what","that","who","where"],"a":1,"e":"The relative pronoun is the subject of “will still be competitive” and refers to the thing “foundry”, so “that” is used; “what” cannot follow the noun it describes.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B3"},{"id":"MXC-T06-142","p":6,"f":"MXT06","q":142,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_CLOSING","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.ARTICLE","VO.SCENE.RND_PRODUCT"],"s":"","o":["Journalists may arrange a site visit through the company's press office.","The gas furnaces will be returned to service once demand recovers.","Recruitment for the forty additional posts has been suspended.","Talvern has not yet decided where the new foundry will be built."],"a":0,"e":"With the production timetable given, the release closes in the standard way, by telling reporters how to visit. Each of the other sentences contradicts the article: the gas units were replaced, forty posts are being added, and the foundry has already opened.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B3"},{"id":"MXC-T06-143","p":6,"f":"MXT06","q":143,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.PRON.DETERMINER_QUANT","GR.VERB.AGREE_QUANT","TX.MEMO","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["each","all","both","every"],"a":0,"e":"“Each of the four departments” takes the singular possessive “its own”; “all” would require “their own”, “both” refers to two, and “every” cannot be followed by “of”.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B4"},{"id":"MXC-T06-144","p":6,"f":"MXT06","q":144,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.MEMO","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["Parking at Alderway House will be reserved for visitors from November.","The new site is further from the station, and we know this worries many of you.","Ashgrove Park is served by three underground lines and a tram.","Staff who prefer to stay at Alderway House may apply to do so."],"a":1,"e":"The sentence that follows announces a shuttle from the station, so what comes before it must raise the travel problem the shuttle solves. Staying at Alderway House is impossible once the lease ends.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B4"},{"id":"MXC-T06-145","p":6,"f":"MXT06","q":145,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.MODAL_BASE","TX.MEMO","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["must not","need not","cannot","should not"],"a":2,"e":"The clause after “since” explains that the keys are gone, so retrieval is impossible rather than forbidden: “cannot be recovered”.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B4"},{"id":"MXC-T06-146","p":6,"f":"MXT06","q":146,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.PREP_VS_CONJ","TX.MEMO","VO.SCENE.TRANSPORT_COMMUTE"],"s":"","o":["during","in advance of","as soon as","before"],"a":3,"e":"Requests are useful only while the plan can still change, so “before the layout is fixed” is the deadline meant. “In advance of” and “during” cannot take the clause that follows.","d":3,"t":30,"src":"open","b":"MXC-T06-P6-B4"},{"id":"MXC-T06-147","p":7,"f":"MXT06","q":147,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MEMO","TX.MEMO","FD.READ.SKIM","VO.SCENE.INVENTORY_PRODUCTION"],"s":"Why was the memo written?","o":["To introduce a new inspection procedure","To inform supervisors that a line will be out of service","To report the results of a recent calibration","To announce a permanent change to shift hours"],"a":1,"e":"The memo exists to tell supervisors that “line 4 will not run that day” and to have them move their targets accordingly. The calibration is the cause of the shutdown, not a procedure the supervisors are being taught.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S1"},{"id":"MXC-T06-148","p":7,"f":"MXT06","q":148,"n":"QT.P7.INFERENCE","ns":["TX.MEMO","VO.PARA.GENERALIZE","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What is suggested about the compressed-air supply?","o":["It will be replaced during the calibration.","It is monitored by the visiting engineers.","It serves line 3 only.","It cannot fully serve two demands at once."],"a":3,"e":"Line 3 tools are expected to cycle more slowly precisely while the calibration rig is drawing on the same supply, which implies its capacity is stretched. Nothing indicates the supply itself is being changed or watched by the contractor.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S1"},{"id":"MXC-T06-149","p":7,"f":"MXT06","q":149,"n":"QT.P7.INFERENCE","ns":["TX.CHAT","VO.PARA.GENERALIZE"],"s":"Why does Ms. Wojcik want the repair carried out the same day?","o":["The unit can be reached from the street.","The tenants are moving out tomorrow.","The call-out fee rises after 11:00.","An inspection of the block is due."],"a":0,"e":"She links the urgency to the flat being on the ground floor and to not wanting it left open overnight, which points to the risk of entry from outside. The fee is Mr. Okonkwo's concern, not hers.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S2"},{"id":"MXC-T06-150","p":7,"f":"MXT06","q":150,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.CHAT","TX.CHAT","FD.READ.DISCOURSE"],"s":"At 10:26 A.M., what does Mr. Okonkwo most likely mean when he writes, “I will ask them to quote for it while they are on site”?","o":["He will negotiate a lower call-out fee.","He will ask the tenants to approve the cost.","He will obtain a price for checking the other doors.","He will arrange a second visit for the winter."],"a":2,"e":"“It” refers back to Ms. Wojcik's request to have the whole row of balcony doors looked at, so he means a price for that wider job. The call-out fee has already been waived.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S2"},{"id":"MXC-T06-151","p":7,"f":"MXT06","q":151,"n":"QT.P7.DETAIL","ns":["TX.AD","FD.READ.SCAN","VO.SCENE.INVENTORY_PRODUCTION"],"s":"Which course runs for the greatest number of weeks?","o":["Industrial Maintenance","Project Coordination","Workplace Health and Safety","Technical Drawing (CAD)"],"a":3,"e":"Technical Drawing runs 16 weeks, ahead of Industrial Maintenance at 14. Project Coordination and Workplace Health and Safety are shorter still, at 12 and 8 weeks.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S3"},{"id":"MXC-T06-152","p":7,"f":"MXT06","q":152,"n":"QT.P7.TRUE_INDICATED","ns":["TX.AD","VO.PARA.WORD_SYNONYM","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What is stated about learners whose fees are paid by an employer?","o":["They are billed once the course has finished.","They pay a reduced rate.","They must register before 22 August.","They are exempt from the final examination."],"a":0,"e":"“invoiced when the course ends rather than in advance”. The 22 August date concerns the administration charge and applies to everyone.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S3"},{"id":"MXC-T06-153","p":7,"f":"MXT06","q":153,"n":"QT.P7.INFERENCE","ns":["TX.AD","VO.PARA.GENERALIZE","VO.SCENE.INVENTORY_PRODUCTION"],"s":"Who may attend the Saturday laboratory sessions without paying?","o":["Anyone registering before 22 August","Students of Technical Drawing (CAD)","Members of the manufacturers' association","Learners sponsored by an employer"],"a":1,"e":"The sessions are open to anyone enrolled in a Wednesday course, and the timetable shows that Technical Drawing is the only course taught on Wednesdays.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S3"},{"id":"MXC-T06-154","p":7,"f":"MXT06","q":154,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.EMAIL","TX.EMAIL","FD.READ.SKIM"],"s":"What is one purpose of the e-mail?","o":["To announce an increase in service charges","To confirm that a lease has been renewed","To offer the use of a facility at no charge","To request payment for completed repairs"],"a":2,"e":"Alongside the notice of the works, Ms. Brzezinska offers exclusive use of the Marlow Lane goods entrance “at no cost” and asks for a decision by 17 October.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S4"},{"id":"MXC-T06-155","p":7,"f":"MXT06","q":155,"n":"QT.P7.DETAIL_NUMBER","ns":["TX.EMAIL","FD.READ.SCAN","VO.PARA.NUMBER_TIME"],"s":"How long will the building be left with no working lift?","o":["Nine weeks","Four weeks","One month","Four days"],"a":3,"e":"One car remains in service throughout except during the changeover week, when “both cars will be down for four days”. Nine weeks is the length of the whole project.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S4"},{"id":"MXC-T06-156","p":7,"f":"MXT06","q":156,"n":"QT.P7.SYNONYM","ns":["QT.P7X.SYNONYM.EMAIL","TX.EMAIL","VO.CONF.POLYSEMY_CONTEXT","VO.PARA.WORD_SYNONYM"],"s":"In paragraph 1, the word “released” is closest in meaning to","o":["published","made available","let go of","loosened"],"a":1,"e":"The owners have put money at the manager's disposal for the work, so “released funds” means the funds have been made available. “Published” fits a different sense of the verb, used of announcements rather than money.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S4"},{"id":"MXC-T06-157","p":7,"f":"MXT06","q":157,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.ARTICLE","TX.ARTICLE","FD.READ.SKIM","VO.SCENE.RETAIL_SHOPPING"],"s":"What is the article mainly about?","o":["A shared arrangement that gives small firms access to equipment","A merger of nineteen manufacturing companies","A testing laboratory that has opened a second branch","A training partnership between industry and a college"],"a":0,"e":"The whole piece describes a cooperative formed so that member firms can use a scanner none of them could buy alone. The talks with the technical institute are one late detail, not the subject.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S5"},{"id":"MXC-T06-158","p":7,"f":"MXT06","q":158,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.ARTICLE","TX.ARTICLE","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"According to Ms. Nwachukwu, what has changed for her business?","o":["The price charged by the outside laboratory","The number of components it produces","The time needed to obtain test results","The size of its workforce"],"a":2,"e":"She contrasts waiting nine days for a report with getting one “the same afternoon”. She mentions the size of her shop only to identify herself, and says nothing about its output or about laboratory prices.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S5"},{"id":"MXC-T06-159","p":7,"f":"MXT06","q":159,"n":"QT.P7.INSERTION","ns":["QT.P7X.INSERTION.ARTICLE","TX.ARTICLE","FD.READ.REFERENCE","FD.READ.DISCOURSE","VO.SCENE.RETAIL_SHOPPING"],"s":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong?\n\n“Its ambitions do not stop with the scanner.”","o":["[1]","[2]","[3]","[4]"],"a":3,"e":"The sentence introduces further plans, and only at [4] is it followed by them: a second measuring unit and talks with the technical institute. At [3] it would interrupt the run of figures about membership cost and payback.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S5"},{"id":"MXC-T06-160","p":7,"f":"MXT06","q":160,"n":"QT.P7.REASON","ns":["TX.TEXT_MSG","VO.PARA.CAUSE_EFFECT"],"s":"Why will the roof panels not be installed?","o":["The crane operator is unavailable.","Conditions on site exceed a safety limit.","The panels have not been delivered.","Another trade is working in the same bay."],"a":1,"e":"The wind reads 14 metres per second against a lifting limit of 12. The blockwork gang is not on site at all, so no other trade is in the way.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S6"},{"id":"MXC-T06-161","p":7,"f":"MXT06","q":161,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.TEXT_MSG","TX.TEXT_MSG","FD.READ.DISCOURSE"],"s":"At 8:12 A.M., what does Ms. Mendieta most likely mean when she writes, “Do not touch anything until I send it”?","o":["She wants the crane shut down for the day.","She intends to come to the site herself.","She has not yet decided where the plant room goes.","Work should wait for the current version of the drawings."],"a":3,"e":"“It” is the revision D drawing Mr. Lindqvist has just said the site office is missing, so she is holding the work until the up-to-date sheet arrives. The crane is already standing idle for another reason.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S6"},{"id":"MXC-T06-162","p":7,"f":"MXT06","q":162,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TEXT_MSG","TX.TEXT_MSG","FD.READ.SCAN"],"s":"What does Ms. Mendieta indicate about the blockwork gang?","o":["It will not arrive until later in the week.","It has completed its part of the job.","It is working from an outdated drawing.","It needs the crane to continue."],"a":0,"e":"“The blockwork gang is not on site until Wednesday” is her reason for choosing the plant room instead. The drawing problem concerns the plant room, not the blockwork.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S6"},{"id":"MXC-T06-163","p":7,"f":"MXT06","q":163,"n":"QT.P7.NOT_TRUE","ns":["TX.NOTICE","ST.ELIM.OPTIONS","VO.SCENE.OFFICE_ADMIN"],"s":"According to the notice, what is NOT required of drivers during the work?","o":["Booking ahead for a heavy vehicle","Entering by the south gate to deliver","Holding a permit to park on Tannery Lane","Showing a unit number on the dashboard"],"a":2,"e":"The notice states plainly that permits are not required for the overflow area, although a unit number must still be displayed. Booking and the south gate are both stated requirements.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S7"},{"id":"MXC-T06-164","p":7,"f":"MXT06","q":164,"n":"QT.P7.REQUEST_ACTION","ns":["TX.NOTICE","FD.READ.SCAN","VO.SCENE.OFFICE_ADMIN"],"s":"When is the work expected to be at its noisiest?","o":["At weekends","At the start of the closure","After 6:00 P.M. each day","In the final week"],"a":1,"e":"“Noise will be heaviest during the first three days”, when the old surface is broken out. No work at all takes place at weekends.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S7"},{"id":"MXC-T06-165","p":7,"f":"MXT06","q":165,"n":"QT.P7.INFERENCE","ns":["TX.NOTICE","VO.PARA.GENERALIZE","VO.SCENE.OFFICE_ADMIN"],"s":"What is suggested about the businesses in Units 9 to 14?","o":["They will have to take deliveries elsewhere in April.","They will lose access to their premises.","They must move their own waste bins.","They are excused from the parking arrangements."],"a":0,"e":"Their loading bays are inside the closed area, so for those two weeks their goods must come in through the south gate like everyone else's. Only the car park closes, not the units.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S7"},{"id":"MXC-T06-166","p":7,"f":"MXT06","q":166,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.JOB_POSTING","TX.JOB_POSTING","VO.PARA.WORD_SYNONYM","VO.SCENE.RECRUIT"],"s":"What is indicated about the working pattern?","o":["It changes every six months.","It includes daytime hours at weekends.","It is shared between two engineers.","It alternates blocks of four nights with time off."],"a":3,"e":"“four nights on and four nights off” describes the rota. The six-month point in the posting is the salary review, not a change of hours.","d":3,"t
