<!doctype html>
<html lang="zh-CN">
<head>

<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mut:#6b7684;--pri:#1d3557;--acc:#e76f51;--ok:#2a9d8f;--bad:#d62839;--warn:#f4a261;--line:#e3e7ec;--hl:#fff1a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{max-width:480px;margin:0 auto;padding-bottom:72px}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--pri);color:#fff}
.who{font-size:12px;opacity:.85}
.banner{background:#fff3cd;color:#7a5200;padding:8px 12px;font-size:13px}
main{padding:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:6px 0 8px;font-size:12px;color:var(--mut)}
.tabs button i{display:block;font-style:normal;font-size:18px}
.tabs button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:10px 0 6px}
.mut{color:var(--mut);font-size:13px}.sm{font-size:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.big{font-size:30px;font-weight:700;color:var(--pri)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font-size:15px}
.btn.ghost{background:#eef1f5;color:var(--ink)}.btn.acc{background:var(--acc)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:#eef1f5;font-size:12px;margin:2px}
.chip.on{background:var(--pri);color:#fff}
.tasks{display:grid;grid-template-columns:1fr;gap:8px}
.task{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.task b{font-size:20px;color:var(--acc)}
.bar{height:8px;background:#e9edf2;border-radius:6px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--ok)}
.gauge{position:relative;height:14px;background:#e9edf2;border-radius:8px;margin:12px 0 4px}
.gauge .rng{position:absolute;top:0;bottom:0;background:rgba(29,53,87,.35);border-radius:8px}
.gauge .pt{position:absolute;top:-3px;width:4px;height:20px;background:var(--pri);border-radius:2px}
.gauge .tg{position:absolute;top:-6px;width:2px;height:26px;background:var(--acc)}
.list .li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border:0}
.li .nm{flex:1;min-width:0;font-size:14px}
.q-top{position:sticky;top:44px;z-index:4;background:var(--bg);padding:6px 0}
.tbar{height:4px;background:#e9edf2;border-radius:3px;overflow:hidden}.tbar>i{display:block;height:100%;background:var(--ok);transition:width .5s linear}
.tbar.over>i{background:var(--bad)}
.passage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap;max-height:48vh;overflow:auto}
.passage.fold{max-height:4.8em;overflow:hidden}
.ph{font-weight:600;margin-bottom:4px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--acc);color:var(--acc);font-weight:600;text-align:center;padding:0 2px}
.blank.cur{background:#fde4dc}
.sen.hl{background:var(--hl)}
.w.vw{background:#d6ecff;border-radius:3px}
.stem{font-size:16px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px;color:var(--ink)}
.opt.sel{border-color:var(--pri);background:#eef3fb}
.opt.ok{border-color:var(--ok);background:#e6f6f3}.opt.no{border-color:var(--bad);background:#fdecee}
.fb{border-left:4px solid var(--ok);background:#fff;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.fb.bad{border-color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tools .chip{cursor:pointer}
.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.qnav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 0;font-size:11px}
.qnav .an{background:#dbe7f6}.qnav .cu{border-color:var(--acc);border-width:2px}.qnav .fl{background:#ffe8a3}
.tabsx{display:flex;gap:6px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;background:#fff}
textarea{min-height:80px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#f7f9fb;border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:20px;color:var(--pri)}
.up{color:var(--ok)}.dn{color:var(--bad)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.rank{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--acc);color:#fff;font-size:12px}
</style>
</head>

<script>window.TDATA={"v":"v2-2026-10-21","items":[{"id":"PL5-001","p":5,"f":"P5-A","q":124,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.COLLO.VERB_NOUN","VO.SCENE.OFFICE_ADMIN","QT.P5.IDENTIFY"],"s":"Please ------- the attached form and return it to the front desk by Friday.","o":["attend","achieve","perform","complete"],"a":3,"e":"四个都是动词 → 词汇题。宾语是 the attached form（附件表格），“填写表格”固定说 complete a form，所以选 complete。","d":2,"t":29,"src":"pilot","dr":{"0":"attend 搭配会议/活动（attend a meeting）","1":"achieve 搭配目标/结果（achieve a goal），不说 achieve a form","2":"perform 搭配任务/表演（perform a task）"}},{"id":"PL5-002","p":5,"f":"P5-A","q":101,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN","VO.SCENE.RETAIL_SHOPPING","QT.P5.IDENTIFY"],"s":"Customers who spend more than $50 will receive a 10 percent ------- on their next purchase.","o":["receipt","discount","deposit","budget"],"a":1,"e":"线索是 10 percent 和 next purchase：消费满 50 美元，下次购物打九折，“折扣”= discount。","d":1,"t":26,"src":"pilot","dr":{"0":"receipt 是收据，不能是“10%”","2":"deposit 是押金/定金，不是优惠","3":"budget 是预算，和顾客下次购物无关"}},{"id":"PL5-003","p":5,"f":"P5-A","q":109,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADJ","VO.CONF.SYN_ADJ","VO.CONF.FORM_ADJ","VO.SCENE.HOTEL_LODGING","QT.P5.IDENTIFY"],"s":"The hotel offers ------- breakfast to all guests who book directly through its Web site.","o":["complimentary","complementary","previous","considerate"],"a":0,"e":"酒店给直接在官网订房的客人提供“免费”早餐，complimentary = free。小心形近词 complementary（互补的）。","d":3,"t":32,"src":"pilot","dr":{"1":"complementary 是“互补的”，只差一个字母的形近词","2":"previous 是“之前的”，“之前的早餐”不通","3":"considerate 是“体贴的”，形容人，不形容早餐"}},{"id":"PL5-004","p":5,"f":"P5-A","q":113,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADV","VO.CONF.ADV_TIME","VO.SCENE.TRAVEL_FLIGHT","QT.P5.IDENTIFY"],"s":"Mr. Patel's flight was delayed, so he arrived ------- after the presentation had started.","o":["highly","closely","shortly","nearly"],"a":2,"e":"shortly after = “……之后不久”，是固定的时间表达。航班晚点，所以演讲开始后不久才到。","d":3,"t":32,"src":"pilot","dr":{"0":"highly 修饰程度（highly recommended），不修饰时间","1":"closely 是“密切地/仔细地”，不是“不久”","3":"nearly 是“几乎”，不放在 after 前表示时间"}},{"id":"PL5-005","p":5,"f":"P5-A","q":126,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.COLLO.VERB_NOUN","VO.SCENE.RECRUIT","QT.P5.IDENTIFY"],"s":"The position requires the ability to ------- several projects at the same time.","o":["manage","contain","attract","operate"],"a":0,"e":"招聘要求：能同时“管理”好几个项目，manage projects 是固定搭配。","d":2,"t":29,"src":"pilot","dr":{"1":"contain 是“包含”，人不能 contain 项目","2":"attract 是“吸引”，意思不通","3":"operate 搭配机器/设备（operate a machine），不搭 projects"}},{"id":"PL5-006","p":5,"f":"P5-A","q":110,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN","VO.SCENE.EVENT_CONFERENCE","QT.P5.IDENTIFY"],"s":"Due to high demand, ------- for the marketing workshop has been extended until April 12.","o":["attendance","registration","location","invitation"],"a":1,"e":"因为报名的人多，“报名”截止被延长到 4 月 12 日。has been extended until + 日期，能被延长的是 registration（报名期）。","d":2,"t":29,"src":"pilot","dr":{"0":"attendance 是出席人数/出席，不会被“延长到某天”","2":"location 是地点，和延长日期无关","3":"invitation 是邀请，不是可延长的期限"}},{"id":"PL5-007","p":5,"f":"P5-A","q":123,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADJ","VO.COLLO.ADJ_PREP","VO.SCENE.FINANCE_ACCOUNT","QT.P5.IDENTIFY"],"s":"All travel costs are ------- for reimbursement if receipts are submitted within 30 days.","o":["aware","capable","eligible","responsible"],"a":2,"e":"be eligible for = “有资格获得”：交了收据，差旅费就“可以报销”。看形容词后面的介词 for 和主语（费用）。","d":3,"t":32,"src":"pilot","dr":{"0":"aware 后接 of，且主语要是人","1":"capable 后接 of，不接 for","3":"responsible for 是“负责”，主语要是人，费用不能负责"}},{"id":"PL5-008","p":5,"f":"P5-A","q":102,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADV","VO.SCENE.CONSTRUCTION_MAINT","QT.P5.IDENTIFY"],"s":"The work on the lobby is ------- complete, and the main entrance will reopen next week.","o":["hardly","closely","lately","nearly"],"a":3,"e":"大厅工程“快”完成了，所以下周入口重开。nearly complete = almost finished。","d":2,"t":29,"src":"pilot","dr":{"0":"hardly 是“几乎不”，和“下周重新开放”矛盾","1":"closely 是“密切地”，不能修饰 complete","2":"lately 是“最近”，不修饰 complete 的程度"}},{"id":"PL5-009","p":5,"f":"P5-A","q":112,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.CONF.SYN_VERB_PATTERN","VO.SCENE.ORDER_SHIP","QT.P5.IDENTIFY"],"s":"If your package has not arrived within five business days, please ------- our customer service team.","o":["reply","contact","inform","respond"],"a":1,"e":"空格后直接接宾语 our customer service team，“联系客服”用及物动词 contact。respond/reply 都要加 to。","d":2,"t":29,"src":"pilot","dr":{"0":"reply 后要加 to 才能接对象","2":"inform 是“通知某人某事”，要 inform sb of sth，这里缺内容且意思不对","3":"respond 是不及物动词，要说 respond to"}},{"id":"PL5-010","p":5,"f":"P5-A","q":106,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN","VO.SCENE.TECH_IT","QT.P5.IDENTIFY"],"s":"Employees should report any ------- with their computers to the IT help desk immediately.","o":["problems","requirements","solutions","conditions"],"a":0,"e":"电脑有“问题”要马上报告给技术部，problems with 是常见搭配。","d":1,"t":26,"src":"pilot","dr":{"1":"requirements 是要求，和 report…immediately 不搭","2":"solutions 是解决办法，员工不用向技术部报告“办法”","3":"conditions 是条件/状况，意思不具体"}},{"id":"PL5-011","p":5,"f":"P5-A","q":107,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADJ","VO.COLLO.ADJ_NOUN","VO.SCENE.CORP_STRATEGY","QT.P5.IDENTIFY"],"s":"Thanks to its ------- growth in Asia, Delmont Electronics plans to open three new offices next year.","o":["urgent","frequent","eager","rapid"],"a":3,"e":"因为在亚洲“快速”增长，所以要开新办公室。rapid growth 是固定搭配。","d":2,"t":29,"src":"pilot","dr":{"0":"urgent 是“紧急的”，意思不对","1":"frequent 是“频繁的”，不说 frequent growth","2":"eager 形容人“渴望的”，不修饰 growth"}},{"id":"PL5-012","p":5,"f":"P5-A","q":127,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.SCENE.MEETING_SCHEDULE","QT.P5.IDENTIFY"],"s":"The board meeting has been ------- until next Thursday because several members are traveling.","o":["canceled","attended","postponed","located"],"a":2,"e":"几位董事在出差，所以会议“推迟”到下周四。postpone … until + 时间。","d":2,"t":29,"src":"pilot","dr":{"0":"canceled 是取消，取消了就不会再“到下周四”","1":"attended 是出席，不能接 until next Thursday","3":"located 是“位于”，意思不通"}},{"id":"PL5-013","p":5,"f":"P5-A","q":121,"n":"QT.P5.VOCA "src":"pilot","b":"P7-D1","dr":{"0":"他说已经付了会员价","1":"他说自己是会员","2":"两篇都没提满员"}},{"id":"PL7-D1-4","p":7,"f":"P7-A","q":179,"n":"QT.P7X.DETAIL.DOUBLE","ns":["TX.DOUBLE","ST.LOCATE.QUESTION_FIRST","TX.WEB","VO.SCENE.EVENT_CONFERENCE"],"s":"According to the Web page, where are the workshops held?","o":["At a supplier's office","Online","At a new store","At a community center"],"a":3,"e":"网页第二行 All workshops are held at the Carlton Community Center。","d":1,"t":73,"src":"pilot","b":"P7-D1","dr":{"0":"见供应商是邮件里的安排","1":"没说线上","2":"开新店是邮件里 Haddad 的事"}},{"id":"PL7-D1-5","p":7,"f":"P7-A","q":180,"n":"QT.P7X.SYNONYM.MULTI","ns":["TX.MULTI","VO.PARA.WORD_SYNONYM","VO.CONF.POLYSEMY_CONTEXT","VO.SCENE.EVENT_CONFERENCE"],"s":"In the e-mail, the word \"switch\" in paragraph 1, line 3, is closest in meaning to","o":["share","check","exchange","turn on"],"a":2,"e":"switch A for B = 用 B 换 A。放回原句 exchange that workshop for the one led by Kevin Moss 意思不变。","d":3,"t":89,"src":"pilot","b":"P7-D1","dr":{"0":"意思不同","1":"意思不同","3":"switch on 是开（电器），这里不是"}},{"id":"PL7-T1-1","p":7,"f":"P7-A","q":181,"n":"QT.P7X.DETAIL.TRIPLE","ns":["TX.TRIPLE","ST.LOCATE.QUESTION_FIRST","TX.WEB","VO.PARA.WORD_SYNONYM","VO.SCENE.PURCHASE_QUOTE"],"s":"According to the Web page, what is true about Premium cards?","o":["They are printed on thicker paper.","They are delivered in two days.","They cost $30 per 500 cards.","They always include a free design."],"a":0,"e":"网页 Premium (thick, high-quality paper) → 纸更厚：thick → thicker paper。","d":2,"t":88,"src":"pilot","b":"P7-T1","dr":{"1":"两天送达是 Express delivery 的特点","2":"$30 是 Standard 的价格","3":"免费设计只针对 2,000 张以上，always 太绝对"}},{"id":"PL7-T1-2","p":7,"f":"P7-A","q":182,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["TX.TRIPLE","ST.LOCATE.PARAPHRASE_MATCH","TX.INVOICE","TX.EMAIL","VO.SCENE.PURCHASE_QUOTE"],"s":"Which amount on the invoice does Ms. Chen believe is a mistake?","o":["$15.00","$20.00","$90.00","$125.00"],"a":0,"e":"邮件说她选的是 regular delivery（普通配送，网页写免费），发票却收了 Express delivery $15 → 错的是 $15。","d":3,"t":96,"src":"pilot","b":"P7-T1","dr":{"1":"设计费是按新设计收的，她没有对此提出问题","2":"1,000 张高级卡 = 2 × $45 = $90，没错","3":"总价会跟着变，但她指的是其中那一项"}},{"id":"PL7-T1-3","p":7,"f":"P7-A","q":183,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["TX.TRIPLE","ST.LOCATE.PARAPHRASE_MATCH","TX.INVOICE","QT.P7.INFERENCE","VO.SCENE.PURCHASE_QUOTE"],"s":"What is suggested about Ms. Chen's first order?","o":["It was printed on plain paper.","The price of the cards was correct.","It arrived later than she expected.","It included 2,000 cards."],"a":1,"e":"网页：Premium 每 500 张 $45；发票：1,000 张收 $90 = 2 × 45，价格对。要网页 + 发票对照。","d":4,"t":105,"src":"pilot","b":"P7-T1","dr":{"0":"发票写的是 Premium，plain 是 Standard","2":"她没抱怨送晚了","3":"发票上是 1,000 张"}},{"id":"PL7-T1-4","p":7,"f":"P7-A","q":184,"n":"QT.P7X.CALC_LOOKUP.INVOICE","ns":["TX.INVOICE","QT.P7X.CROSS_REF.TRIPLE","TX.TRIPLE","VO.SCENE.PURCHASE_QUOTE"],"s":"How much will Ms. Chen most likely pay for her new order?","o":["$60.00","$75.00","$80.00","$90.00"],"a":0,"e":"新单：1,000 张便宜的纸（Standard，$30/500）= $60；用旧设计 → 不收设计费；普通配送 → 免费。合计 $60。","d":5,"t":114,"src":"pilot","b":"P7-T1","dr":{"1":"多加了快递费 $15，但她要普通配送","2":"多加了设计费 $20，但用的是已有设计","3":"按高级纸算了，她要的是便宜的纸"}},{"id":"PL7-T1-5","p":7,"f":"P7-A","q":185,"n":"QT.P7X.DETAIL.TRIPLE","ns":["TX.TRIPLE","ST.LOCATE.QUESTION_FIRST","QT.P7.REASON","TX.EMAIL","VO.PARA.GENERALIZE","VO.SCENE.PURCHASE_QUOTE"],"s":"Why does Ms. Chen want to place another order?","o":["She did not like the first design.","Her company has moved to a new office.","She lost her first set of cards.","New employees have joined her company."],"a":3,"e":"邮件第二段：three new staff members joined our office this month → 新员工入职（staff members → employees）。","d":2,"t":88,"src":"pilot","b":"P7-T1","dr":{"0":"她说很满意设计","1":"没提搬家","2":"没提"}}],"bundles":[{"id":"P6-B1","p":6,"f":"P6-A","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Ryan Brooks\nFrom: Dana Whitfield, Pinecrest Office Supply\nDate: March 3\nSubject: Your order #20581","x":"Dear Mr. Brooks,\n\nThank you for your recent order of 40 desk chairs. Unfortunately, the model you selected is currently out of stock, and our supplier {{131}} new chairs to us until March 17. {{132}} If you would like the similar model, please reply to this e-mail by March 6. Otherwise, we will ship your original order as soon as it {{133}}. We are sorry for the delay and thank you for your {{134}}.\n\nSincerely,\nDana Whitfield\nCustomer Service"}],"qs":["PL6-1-1","PL6-1-2","PL6-1-3","PL6-1-4"]},{"id":"P6-B2","p":6,"f":"P6-A","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"NOTICE TO ALL TENANTS","x":"The parking garage at Harbor View Tower will be closed for {{135}} from Monday, June 8, to Friday, June 12. During this time, tenants may park in the public lot on Ash Street, which is a five-minute walk from the building. Parking there normally costs $12 per day. {{136}}, the building management has agreed to cover this cost. To receive your money back, simply keep your parking receipts and bring {{137}} to the front desk by June 19. {{138}}"}],"qs":["PL6-2-1","PL6-2-2","PL6-2-3","PL6-2-4"]},{"id":"P6-B3","p":6,"f":"P6-A","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"MEMO\nTo: All Sales Staff\nFrom: Grace Lin, Training Manager\nDate: September 14\nRe: Customer service workshop","x":"{{139}} The workshop will focus on handling customer complaints over the phone and by e-mail. Each session lasts two hours and {{140}} by Martin Hale, an experienced trainer from Clearpath Consulting. Sessions will be offered on September 28 and October 5. Staff members who {{141}} the workshop will receive a certificate. Please sign up for one session online by September 21. Space is {{142}}, so early registration is recommended. If neither date works for you, please speak with your team leader."}],"qs":["PL6-3-1","PL6-3-2","PL6-3-3","PL6-3-4"]},{"id":"P6-B4","p":6,"f":"P6-A","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Local Bakery to Open Third Store","x":"BRIDGEPORT (May 2) — Golden Oak Bakery will open its third location next month on Carter Avenue. The family-owned business started as a small shop on Main Street in 2015 and has grown steadily since then. The new store {{143}} seating for up to 80 customers, which is twice the size of the original shop. Owner Lisa Moreno said the larger space will also include a training kitchen. {{144}} Classes will be {{145}} on weekends, and the first one is planned for June 20. {{146}}, the bakery will hire about fifteen new employees for the Carter Avenue location."}],"qs":["PL6-4-1","PL6-4-2","PL6-4-3","PL6-4-4"]},{"id":"P6-B5","p":6,"f":"P6-B","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Riverside Hotel\n45 Bay Road\n\nDear Ms. Alvarez,","x":"Thank you for staying at the Riverside Hotel last week. We were sorry to learn that the air conditioner in your room was not working {{131}} your stay. Our maintenance team has since replaced the unit, and we have also checked the air conditioners in every other room on your floor. As a way of saying sorry, we would like to offer you a free night on {{132}} next visit. This offer is valid {{133}} December 31. {{134}}\n\nSincerely,\nPaul Ng\nGuest Services Manager"}],"qs":["PL6-5-1","PL6-5-2","PL6-5-3","PL6-5-4"]},{"id":"P7-S1","p":7,"f":"P7-A","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Anna Ruiz [9:14 A.M.]\nHi Tom, I'm at the Grandview Hotel for the client meeting, but the front desk says our room isn't ready.\nTom Becker [9:15 A.M.]\nReally? I booked the Garden Room for 9:30.\nAnna Ruiz [9:16 A.M.]\nThey say it's still being cleaned after an event last night. They can give us the Lake Room instead, but it only seats six.\nTom Becker [9:18 A.M.]\nThere are only five of us today.\nAnna Ruiz [9:19 A.M.]\nGreat. I'll tell them we'll take it."}],"qs":["PL7-S1-1","PL7-S1-2"]},{"id":"P7-S2","p":7,"f":"P7-A","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"E-mail","x":"From: Helen Park, Office Manager\nTo: All staff, Westbrook Design\nDate: April 8\nSubject: Kitchen improvements\n\nDear all,\n\nI am pleased to let you know that the second-floor kitchen will be improved next week. The work will begin on Monday, April 15, and should be finished by Thursday, April 18. During this time, the kitchen will be closed, but the coffee machine in the third-floor meeting area will be available to everyone.\n\nThe improvements include a larger refrigerator, a new dishwasher, and two more microwave ovens. These changes are a direct result of the comments many of you made in last month's staff survey.\n\nBefore the work begins, please remove all personal items, including food and cups, from the kitchen by 5 P.M. on Friday, April 12. Anything left after that time will be thrown away.\n\nThank you,\nHelen"}],"qs":["PL7-S2-1","PL7-S2-2","PL7-S2-3"]},{"id":"P7-S3","p":7,"f":"P7-A","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Lakeside Library Opens Digital Learning Center","x":"NORTH BAY (October 3) — The Lakeside Public Library opened its new Digital Learning Center on Saturday. — [1] — The center, located on the library's second floor, offers twenty computers, two printers, and a recording room for local residents.\n\nThe project was paid for by money from the Harmon Foundation, along with gifts from several local businesses. — [2] — Library director Sandra Cole said the center was designed for people of all ages. \"Many residents told us they wanted help with basic computer skills,\" she said. \"Others wanted a quiet place to work on job applications.\" — [3] —\n\nFree classes will be held every Tuesday and Thursday evening, starting October 10. Topics include using e-mail, writing a résumé, and keeping personal information safe online. Each class is limited to twelve people, so residents should sign up at the information desk. — [4] —"}],"qs":["PL7-S3-1","PL7-S3-2","PL7-S3-3","PL7-S3-4"]},{"id":"P7-S4","p":7,"f":"P7-A","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"ATTENTION GUESTS\n\nThe pool and fitness center on the fifth floor will be closed on Wednesday, July 9, from 7:00 A.M. to 3:00 P.M. for regular cleaning. During these hours, guests may use the fitness room at our partner, Summit Gym, located across the street. Simply show your room key at the Summit Gym front desk. Towels will be provided there. We are sorry for any inconvenience.\n\n— The Management, Bayshore Hotel"}],"qs":["PL7-S4-1","PL7-S4-2"]},{"id":"P7-S5","p":7,"f":"P7-A","k":"single","tt":"TX.INVOICE","docs":[{"t":"TX.INVOICE","h":"Order confirmation","x":"Greenleaf Catering — Order Confirmation\nCustomer: Kessler Partners (contact: Mia Lambert)\nEvent date: Friday, November 14, 12:00 P.M.\nDelivery address: 220 River Road, 4th Floor\n\nItem | Quantity | Price\nSandwich tray (serves 10) | 3 | $135.00\nFruit tray (serves 10) | 2 | $70.00\nCoffee and tea service | 1 | $45.00\nDelivery | — | $20.00\nTotal | | $270.00\n\nNote: Orders of $250 or more receive free delivery. The delivery charge above will be removed from your final bill."}],"qs":["PL7-S5-1","PL7-S5-2"]},{"id":"P7-S6","p":7,"f":"P7-A","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Leo Grant [10:02 A.M.]\nThe delivery truck from Norland Paper just called. They're stuck in traffic and won't get here until 2:00.\nRita Shah [10:03 A.M.]\nThat's a problem. We need that paper to print the brochures for the trade show, and they have to be ready by 5:00 today.\nLeo Grant [10:04 A.M.]\nHow long does the print job take?\nRita Shah [10:05 A.M.]\nAbout four hours.\nSam Ortega [10:06 A.M.]\nI can ask the print shop on Elm Street if they have enough paper.\nRita Shah [10:07 A.M.]\nPlease do. If they can start by noon, we'll still finish on time.\nSam Ortega [10:12 A.M.]\nThey can. They'll need the final design files, though.\nRita Shah [10:13 A.M.]\nLeave that to me.\nLeo Grant [10:14 A.M.]\nThen I'll call Norland and tell them to bring the paper next week instead."}],"qs":["PL7-S6-1","PL7-S6-2","PL7-S6-3","PL7-S6-4"]},{"id":"P7-D1","p":7,"f":"P7-A","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.WEB","h":"Web page","x":"Carlton Business Forum — Spring Workshops\nOur spring workshops give small business owners practical skills they can use right away. All workshops are held at the Carlton Community Center, and coffee is provided.\n\nWorkshop | Date | Time | Leader\nWriting Strong Business Plans | April 4 | 9:00–11:00 A.M. | Diane Webb\nSocial Media for Small Shops | April 4 | 1:00–3:00 P.M. | Kevin Moss\nManaging Your Cash Flow | April 11 | 9:00–11:00 A.M. | Priya Nair\nHiring Your First Employee | April 11 | 1:00–3:00 P.M. | Diane Webb\n\nCost: $25 per workshop, or $80 for all four. Forum members receive a 20 percent discount. Please register or make changes at least three days before each workshop."},{"t":"TX.EMAIL","h":"E-mail","x":"From: Omar Haddad\nTo: Carlton Business Forum\nDate: April 2\nSubject: Registration change\n\nHello,\n\nI registered for both of the April 11 workshops last week. However, I have just learned that I need to meet with a supplier on the afternoon of April 11. Could I switch that workshop for the one led by Kevin Moss? I am very interested in his topic because I recently opened a second store and would like to attract more young customers online.\n\nAs a forum member, I paid the member price, so I believe no extra payment should be needed. Please let me know as soon as possible whether this change is possible.\n\nBest regards,\nOmar Haddad"}],"qs":["PL7-D1-1","PL7-D1-2","PL7-D1-3","PL7-D1-4","PL7-D1-5"]},{"id":"P7-T1","p":7,"f":"P7-A","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"Bright Print Co. — Business Card Printing\n\nMake a strong first impression with cards from Bright Print Co. We have served local businesses for more than twenty years.\n\nStandard (plain paper): $30 per 500 cards\nPremium (thick, high-quality paper): $45 per 500 cards\nDesign service: $20 per new design (free for orders of 2,000 cards or more)\nCards using a design we already have on file: no design charge\n\nRegular delivery: 5 business days, free\nExpress delivery: 2 business days, add $15\n\nAll prices include tax. If you are not happy with your cards, contact us within 14 days of delivery and we will print them again for free."},{"t":"TX.INVOICE","h":"Invoice","x":"Bright Print Co. — Invoice #7713\nDate: May 6\nCustomer: Julia Chen, Fairway Accounting\n\nPremium business cards (1,000 cards) | $90.00\nDesign service | $20.00\nExpress delivery | $15.00\nTotal | $125.00\n\nPayment is due within 30 days of the invoice date. Thank you for your business!"},{"t":"TX.EMAIL","h":"E-mail","x":"From: Julia Chen\nTo: Bright Print Co.\nDate: May 13\nSubject: Invoice #7713\n\nHello,\n\nI received my business cards yesterday, and I am very happy with both the paper and the design. However, there is a problem with the invoice. When I placed the order, I chose regular delivery because I was not in a hurry. I have checked my order confirmation e-mail, and it also shows regular delivery. Please correct the charge and send me a new invoice. I will pay the full amount as soon as I receive it.\n\nAlso, three new staff members joined our office this month, so I would like to order 1,000 more cards on the cheaper paper. Please use the same design as my last order, with regular delivery. The new cards should show the same office address and phone number. Because these cards are for new employees, I will send you their names and job titles in a separate e-mail by Friday.\n\nThank you,\nJulia Chen"}],"qs":["PL7-T1-1","PL7-T1-2","PL7-T1-3","PL7-T1-4","PL7-T1-5"]}],"nodes":[{"id":"FD","nm":"基础层（读懂句子与篇章的底层能力）","l":"foundation","pa":null,"w":0.7,"bd":400,"g":1},{"id":"FD.SENT","nm":"句子结构基础","l":"foundation","pa":"FD","w":0.55,"bd":400,"g":1},{"id":"FD.SENT.CORE","nm":"主谓宾/五种基本句型识别","l":"foundation","pa":"FD.SENT","w":0.55,"bd":400,"g":0} nm":"从真题/错题中摘词（生词本）","l":"strategy","pa":"ST.REVIEW","w":0.3,"bd":400,"g":0},{"id":"ST.REVIEW.SPEED_REPEAT","nm":"测时→复读同一篇提速","l":"strategy","pa":"ST.REVIEW","w":0.25,"bd":600,"g":0}],"strats":[{"id":"SL-P5-01","ti":"看选项判题型","wr":"先看四个选项，再决定这句读多少。","r":"先扫四个选项判断题型（词性/动词形态/介连副/代词/词汇），语法类只看空格周边，词汇类读全句。","ns":["QT.P5.IDENTIFY","QT.P6.INDEPENDENT","ST.LOCATE.DEPTH_BY_QTYPE"],"p":[5,6],"w":0.85,"pm":1},{"id":"SL-P5-02","ti":"词性题看空格位置","wr":"只看空格前后两三个词定词性，5–15 秒交卷。","r":"限定词/介词后→名词；名词前、be/系动词后→形容词；完整句中修饰动词/形容词/全句→副词；a/an(+very)+adj+n、adj and adj 同词性。","ns":["QT.P5.WORD_FORM","QT.P6.INDEPENDENT","ST.TIME.PER_ITEM_P5","GR.POS","GR.POS.NOUN_AFTER_DET","GR.POS.NOUN_AFTER_PREP","GR.POS.ADJ_BEFORE_NOUN","GR.POS.ADJ_COMPLEMENT","GR.POS.ADV_VERB","GR.POS.ADV_ADJ","GR.POS.ADV_AUX_SLOT","GR.POS.ADV_SENTENCE"],"p":[5,6],"w":0.85,"pm":1},{"id":"SL-P5-03","ti":"同是名词再辨人/物与可数","wr":"名词定了别急着选：人还是物？要不要加 s？","r":"填名词时再看可数/不可数、限定词搭配、人名词 vs 事物名词、复合名词。","ns":["QT.P5.WORD_FORM","GR.POS.NOUN_COUNT","GR.POS.NOUN_PERSON_THING","GR.POS.NOUN_COMPOUND"],"p":[5],"w":0.49,"pm":1},{"id":"SL-P5-04","ti":"数谓语和连接词","wr":"数一数：一个连接词配两个谓语，少了谁就补谁。","r":"先数句子的谓语动词与连接词：缺谓语填限定动词；已有谓语则填非谓语或连接成分。","ns":["QT.P5.VERB_FORM","QT.P5.CONNECTOR_MIX","FD.SENT.CLAUSE_COUNT","GR.POS.VERB_SLOT"],"p":[5,6],"w":0.31,"pm":1},{"id":"SL-P5-05","ti":"删修饰找主干","wr":"长句先砍枝叶，只留主干再填空。","r":"先划掉介词短语、分词短语、插入从句，找到主谓宾后再判断空格成分。","ns":["QT.P5.WORD_FORM","QT.P5.VERB_FORM","FD.SENT.MODIFIER_STRIP","FD.SENT.LONG"],"p":[5,6,7],"w":0.63,"pm":1},{"id":"SL-P5-06","ti":"动词题四步排查","wr":"动词题按“谓语？→主被动→时态→单复数”过四道闸。","r":"先判谓语还是非谓语 → 再定主动/被动 → 再定时态 → 最后查主谓一致（数）。","ns":["QT.P5.VERB_FORM","QT.P6.CTX_TENSE","GR.VERB","GR.VERB.AGREE_SV","GR.VERB.VOICE_PASSIVE","GR.VERB.TENSE_SIMPLE","GR.VERB.TENSE_PERFECT","GR.VERB.TENSE_FUTURE_CLAUSE"],"p":[5,6],"w":0.53,"pm":1},{"id":"SL-P5-07","ti":"非谓语看搭配与主被动","wr":"to do 还是 -ing 看前面的词；-ing/-ed 看名词是主动做还是被做。","r":"记住只接 to do / 只接 -ing 的词；分词按与被修饰名词的主被动关系选 -ing 或 -ed。","ns":["QT.P5.VERB_FORM","GR.NONFIN","GR.NONFIN.TO_INF","GR.NONFIN.GERUND","GR.NONFIN.PARTICIPLE_MODIFIER","GR.NONFIN.PARTICIPLE_CLAUSE","GR.NONFIN.PARTICIPLE_ADJ"],"p":[5],"w":0.36,"pm":1},{"id":"SL-P5-08","ti":"动词句型与宾补","wr":"先看动词后面能跟什么，再看选项。","r":"掌握及物/不及物、双宾与宾补动词；make/let/have 后宾补用原形，其他多用 to do；近义动词句型不同（inform sb of / explain sth）。","ns":["QT.P5.VERB_FORM","QT.P5.VOCAB","GR.VERB.VERB_PATTERN","VO.CONF.SYN_VERB_PATTERN","GR.VERB.MODAL_BASE"],"p":[5],"w":0.58,"pm":1},{"id":"SL-P5-09","ti":"介/连/副看空格后面","wr":"看空格后面：名词用介词，整句用连词，前后两句都完整用副词。","r":"介词、连词、副词混排时：后接名词(短语)→介词；后接完整主谓→连词；两句已完整只缺逻辑衔接→接续副词。","ns":["QT.P5.CONNECTOR_MIX","QT.P5.CONJ","QT.P5.PREP","GR.CONN.PREP_VS_CONJ","GR.CONN.CONJ_ADVERBIAL","GR.CONN.CONJ_ADVERB"],"p":[5,6],"w":0.4,"pm":1},{"id":"SL-P5-10","ti":"介词题先搭配后语义","wr":"介词先想“固定跟谁搭”，想不到再翻译。","r":"先按空格前后搭配解（时间点/时段、地点、固定介词），搭配不明再按语义（原因/让步/目的/关于）选。","ns":["QT.P5.PREP","GR.CONN.PREP_TIME","GR.CONN.PREP_PLACE","GR.CONN.PREP_MEANING","GR.CONN.PREP_PHRASE_MULTI","VO.CONF.PREP_LOOKALIKE"],"p":[5,6],"w":0.36,"pm":1},{"id":"SL-P5-11","ti":"代词题先定格再定指代","wr":"代词先看站哪儿（格），再看替谁（单复数）。","r":"先看位置定格（主格/宾格/所有格/名词性物主/反身），再看所指对象的单复数与人/物。","ns":["QT.P5.PRONOUN","QT.P6.CTX_PRONOUN","GR.PRON.CASE","GR.PRON.POSSESSIVE_PRONOUN","GR.PRON.REFLEXIVE","GR.PRON.INDEFINITE","GR.PRON.DEMONSTRATIVE"],"p":[5,6],"w":0.38,"pm":1},{"id":"SL-P5-12","ti":"关系词看先行词与从句完整度","wr":"关系词问两件事：前面有没有名词？后面缺不缺东西？","r":"看有无先行词、指人还是物，再看后面从句缺不缺成分（缺主宾→关系代词，完整→关系副词/that 名词从句）。","ns":["QT.P5.RELATIVE","GR.REL","GR.REL.REL_PRONOUN","GR.REL.REL_ADVERB","GR.REL.REL_WHAT","GR.REL.NOUN_CLAUSE","GR.REL.COMPOUND_REL"],"p":[5],"w":0.29,"pm":1},{"id":"SL-P5-13","ti":"比较题看标志词","wr":"找 than / the / as 三个信号，秒选。","r":"than→比较级；the…of/in/among/ever→最高级；as…as→原级；强调比较级用 much/even/far/still。","ns":["QT.P5.COMPARATIVE","GR.COMP.COMPARATIVE","GR.COMP.SUPERLATIVE","GR.COMP.EQUATIVE"],"p":[5],"w":0.26,"pm":1},{"id":"SL-P5-14","ti":"成对表达找搭档词","wr":"看到 both/either/neither/whether，先去句子里找它的搭档。","r":"both–and、either–or、neither–nor、not only–but (also)、whether–or：看到一半就找另一半。","ns":["QT.P5.PAIR_GRAMMAR","GR.CONN.CONJ_CORRELATIVE"],"p":[5],"w":0.25,"pm":1},{"id":"SL-P5-15","ti":"数量词与单复数一致","wr":"先看数量词，再决定名词和动词要不要 s。","r":"each/every + 单数；a number of + 复数；the number of + 单数谓语；amount/number、few/little 区分可数。","ns":["QT.P5.PAIR_GRAMMAR","QT.P5.PRONOUN","GR.VERB.AGREE_QUANT","GR.PRON.DETERMINER_QUANT","VO.CONF.QUANT_WORDS"],"p":[5],"w":0.29,"pm":1},{"id":"SL-P5-16","ti":"特殊句式记固定形式","wr":"见到 request/suggest that、句首 Should，直接套模板。","r":"要求/建议类 that 从句用动词原形；省略 if 的倒装（Should/Had…）；并列结构前后同形；否定词/only 前置倒装；as requested 类省略。","ns":["QT.P5.VERB_FORM","QT.P5.PAIR_GRAMMAR","GR.VERB.SUBJUNCTIVE_DEMAND","GR.VERB.CONDITIONAL_INVERSION","GR.SPECIAL.PARALLEL","GR.SPECIAL.INVERSION_NEG","GR.SPECIAL.ELLIPSIS"],"p":[5],"w":0.33,"pm":1},{"id":"SL-P5-17","ti":"副词按功能辨","wr":"副词不看中文意思，先看它管时间、强调还是程度。","r":"时间副词（already/still/yet）、焦点副词（just/only/even）、so/such/too/enough、also/too/either 按功能和位置辨；never 可直接放动词前，not 需借助动词。","ns":["QT.P5.VOCAB","QT.P5.WORD_FORM","VO.CONF.ADV_TIME","VO.CONF.ADV_FOCUS","VO.CONF.SO_SUCH_TOO"],"p":[5],"w":0.58,"pm":1},{"id":"SL-P5-18","ti":"词汇题先找搭配","wr":"词汇题先看空格跟谁搭，搭不上的先划掉，再看意思。","r":"词汇题先找搭配与语法线索（介词搭配、及物性、固定短语）“不翻译解”；副/形词义题先把句子压成“修饰词+中心词”；线索不足再读全句。","ns":["QT.P5.VOCAB","QT.P6.CTX_VOCAB","VO.COLLO","VO.COLLO.VERB_PREP","VO.COLLO.VERB_NOUN","VO.COLLO.ADJ_NOUN","VO.COLLO.ADV_VERB_ADJ","VO.LEX","VO.LEX.VERB","VO.LEX.NOUN","VO.LEX.ADJ","VO.LEX.ADV"],"p":[5,6],"w":0.78,"pm":1},{"id":"SL-P5-19","ti":"常用词记商务义","wr":"熟词别按日常意思选，先想它在公司里是什么意思。","r":"成组辨析近义词，记住常见词的商务义项（address=处理、issue=期刊/发放、term=条款）。","ns":["QT.P5.VOCAB","QT.P7.SYNONYM","VO.CONF.BUSINESS_SENSE","VO.CONF.POLYSEMY_CONTEXT","VO.CONF.SYN_NOUN","VO.CONF.SYN_ADJ"],"p":[5,7],"w":0.56,"pm":1},{"id":"SL-P5-20","ti":"词缀猜词性","wr":"不认识的词先看尾巴，尾巴决定词性。","r":"后缀定词性（-tion/-ment 名词、-ive/-able 形容词、-ly 副词、-ize 动词），词根词缀辅助记忆。","ns":["QT.P5.WORD_FORM","FD.VOC.AFFIX","VO.CONF.FORM_ADJ","VO.CONF.FORM_NOUN"],"p":[5],"w":0.44,"pm":1},{"id":"SL-P5-21","ti":"P5 单题限时","wr":"每张 P5 工单有倒计时，铃响就交。","r":"P5 词性题约 5–15 秒、语法 15 秒、词汇 ≤20–30 秒；超时直接选一个往下走。","ns":["QT.P5.IDENTIFY","ST.TIME.PER_ITEM_P5","ST.GIVEUP.CUTOFF_RULE"],"p":[5],"w":0.89,"pm":1},{"id":"SL-P5-22","ti":"按考频排学习顺序","wr":"先练常考的活，冷门活放到后面。","r":"先攻高频题型（词汇约 30%、词性约 25%、介词约 11%、接续/动词/副词/代词各 7–9%），比较、特殊句式后补。","ns":["QT.P5.VOCAB","QT.P5.WORD_FORM","QT.P5.PREP","ST.REVIEW.DIAGNOSE_BY_TYPE"],"p":[5],"w":0.6,"pm":1},{"id":"SL-P5-23","ti":"P5 瓶颈转练 P6/P7","wr":"P5 已经很稳，就把时间挪给长文。","r":"P5 稳定只错 3–4 题后再刷 P5 收益很小，改为大量做 P6/P7 积累地道表达。","ns":["ST.REVIEW.DIAGNOSE_BY_TYPE"],"p":[5,6,7],"w":0.4,"pm":1},{"id":"SL-P6-01","ti":"P6 顺着读全文","wr":"P6 从头顺着读，读到空就填。","r":"Part 6 按顺序通读，不只读空格所在句：新制每篇 4 题，约 65% 需上下文，只靠本句能解的很少。","ns":["QT.P6.CLASSIFY","TX.EMAIL","TX.LETTER","TX.MEMO","TX.NOTICE","TX.AD","TX.ARTICLE","TX.WEB","ST.LOCATE.DEPTH_BY_QTYPE"],"p":[6],"w":0.72,"pm":1},{"id":"SL-P6-02","ti":"P6 两类分流","wr":"先分拣：本句能解的秒做，要看上下文的放慢。","r":"把 P6 题分为“句内独立可解”和“需上下文”两类：前者按 P5 方法速答；后者（时态/代词/接续副词/词汇/插入句）必须看前后文。","ns":["QT.P6.CLASSIFY","QT.P6.INDEPENDENT"],"p":[6],"w":0.66,"pm":1},{"id":"SL-P6-03","ti":"时态看全文时间线","wr":"先看这封信是哪天写的，事情发生了没有。","r":"P6 时态题本句语法上多个都通时，以全文时间线为准：看发信日期、前后句、事件是否已发生。","ns":["QT.P6.CTX_TENSE","GR.VERB.TENSE_SIMPLE","GR.VERB.TENSE_PERFECT","GR.VERB.TENSE_FUTURE_CLAUSE"],"p":[6],"w":0.29,"pm":1},{"id":"SL-P6-04","ti":"代词回前文找指代","wr":"代词题往回找“它/他们”到底指谁。","r":"P6 代词题回前文找所指对象，按单复数、人/物、公司/个人选代词。","ns":["QT.P6.CTX_PRONOUN","FD.READ.REFERENCE","GR.PRON.CASE"],"p":[6],"w":0.23,"pm":1},{"id":"SL-P6-05","ti":"接续副词判前后逻辑","wr":"先给两句关系贴标签：转折、因果还是追加。","r":"判断前后两句关系（转折/因果/追加/举例/顺序），再选 however/therefore/in addition/for example 等。","ns":["QT.P6.CTX_CONJ_ADV","GR.CONN.CONJ_ADVERB","FD.READ.DISCOURSE"],"p":[6],"w":0.4,"pm":1},{"id":"SL-P6-06","ti":"语境词汇以全文为准","wr":"本句都通？回头看整篇在讲什么。","r":"P6 词汇题几个选项本句都通顺时，以全文主题和前后信息决定。","ns":["QT.P6.CTX_VOCAB","VO.CONF.POLYSEMY_CONTEXT"],"p":[6],"w":0.39,"pm":1},{"id":"SL-P6-07","ti":"插入句看衔接线索","wr":"插入句先看候选句里的 this/they/also，问它在指前面哪件事。","r":"句子插入题先抓全文主题和段落走向，再用候选句里的代词（this/these/they）、连接词、新旧信息检查能否接上前后句。","ns":["QT.P6.INSERTION","QT.P6.INS_OPENING","Q 数据，答题时两篇对照；三篇常需 1↔3 篇对比、常带图表；每组约 1–2 道跨篇题。","ns":["QT.P7.CROSS_REF","QT.P7X.CROSS_REF.DOUBLE","QT.P7X.CROSS_REF.TRIPLE","QT.P7.CALC_LOOKUP","QT.P7X.CALC_LOOKUP.INVOICE","QT.P7X.CALC_LOOKUP.SCHEDULE","TX.MULTI","TX.DOUBLE","TX.TRIPLE","TX.INVOICE","TX.SCHEDULE"],"p":[7],"w":0.63,"pm":1},{"id":"SL-P7-18","ti":"多篇按题定篇","wr":"先给 5 道题分配文件，再决定精读哪篇。","r":"多篇先看 5 道题分别指向哪篇（题干里的 e-mail/notice/article 等），精读被问最多的那篇，其余寻读；跨篇题不按先后顺序出。","ns":["QT.P7X.DETAIL.DOUBLE","QT.P7X.DETAIL.TRIPLE","QT.P7X.MAIN_PURPOSE.MULTI","QT.P7.CROSS_REF","TX.MULTI","TX.DOUBLE","TX.TRIPLE","ST.LOCATE.QUESTION_FIRST"],"p":[7],"w":0.72,"pm":1},{"id":"SL-P7-19","ti":"意群顺读","wr":"按意群一块一块往前读，不回头。","r":"用意群斜线读法训练顺序直读（不回读、不逐词翻译），可跟着题目音频按目标速度读。","ns":["ST.REVIEW.AUDIO_SHADOW","FD.READ.CHUNK","FD.READ.SPEED_150"],"p":[6,7],"w":0.43,"pm":1},{"id":"SL-P7-20","ti":"生词不停","wr":"生词先跳过，读完再回来查。","r":"遇到生词不停下，先靠上下文把握大意，读完再查。","ns":["FD.READ.UNKNOWN_WORD"],"p":[6,7],"w":0.35,"pm":1},{"id":"SL-P7-21","ti":"测时后重复同篇提速","wr":"同一篇读三遍，每遍限时更短。","r":"先测自己读一篇的用时，再以目标用时反复练同一篇（测时→抓要点→斜线读→答题→提速）。","ns":["ST.REVIEW.SPEED_REPEAT","FD.READ.SPEED_150","FD.READ.SPEED_200"],"p":[7],"w":0.31,"pm":1},{"id":"SL-P7-22","ti":"信号句预测下文","wr":"看到 although、note that，后面那句重点读。","r":"700+ 提速：精读 although/while/unless 后的转折、关系从句里 who 后的谓语、whoever/whatever 结构；announce/ensure/note that 后的内容常是考点。","ns":["QT.P7.TRUE_INDICATED","QT.P7.DETAIL","FD.READ.DISCOURSE","FD.SENT.LONG","GR.REL.COMPOUND_REL"],"p":[7],"w":0.52,"pm":1},{"id":"SL-P7-23","ti":"先看中文概要再读英文","wr":"新手先看中文提要，再读英文。","r":"基础阶段先读中文概要再读英文原文，建立“英文能顺读”的感觉。","ns":["FD.READ.SKIM"],"p":[7],"w":0.44,"pm":1},{"id":"SL-P7-24","ti":"记题干选项常见词与职位名","wr":"先认熟题目里反复出现的词和职位名。","r":"专门记题干和选项里的高频词，以及部门、职位名称，读题更快。","ns":["QT.P7.INFER_WHO","VO.TITLES_DEPTS"],"p":[7],"w":0.27,"pm":1},{"id":"SL-ALL-01","ti":"整卷配速","wr":"P5、P6 合计 20 分钟内交差，剩下的全给 P7。","r":"P5 约 10–12 分钟、P6 约 8–10 分钟（合计 ≤20），P7 留 ≥53–55 分钟；开考约 20 分钟时应翻到第 147 题。","ns":["ST.TIME.TOTAL_PLAN"],"p":[5,6,7],"w":1.0,"pm":1},{"id":"SL-ALL-02","ti":"高分档加速配速","wr":"冲高分：P5、P6 合计 16 分钟左右。","r":"目标 800+ 或 P7 常做不完：P5+P6 压到 15–18 分钟（900 目标各 ≤8 分钟），三篇每组留 6–7 分钟。","ns":["ST.TIME.TOTAL_PLAN"],"p":[5,6,7],"w":0.71,"pm":1},{"id":"SL-ALL-03","ti":"P7 分段配时","wr":"单篇别恋战，留够 25 分钟给多篇。","r":"单篇 147–175（29 题）≤25–30 分钟，多篇 176–200（25 题）≥25 分钟，三篇每组约 6–7 分钟；单篇尽快做完把时间留给多篇。","ns":["TX.DOUBLE","TX.TRIPLE","ST.TIME.PER_SET_P7","ST.ORDER.WITHIN_P7"],"p":[7],"w":0.65,"pm":1},{"id":"SL-ALL-04","ti":"分阶段看表","wr":"只在几个检查站看表，落后就提速或猜。","r":"不每篇都看表：每做 3–4 篇（或到 P6 开头、147、176 题）对一次检查点，落后就启用放弃线。","ns":["ST.TIME.CHECKPOINTS"],"p":[5,6,7],"w":0.57,"pm":1},{"id":"SL-ALL-05","ti":"不留空","wr":"每张工单都要交，空着等于白扔分。","r":"答错不扣分，任何题都不要空着；最后来不及就统一猜同一个字母。","ns":["ST.GIVEUP.NO_BLANK"],"p":[5,6,7],"w":0.78,"pm":1},{"id":"SL-ALL-06","ti":"卡住就猜，先跳后回","wr":"卡住就先猜一个，挂“稍后处理”，往下走。","r":"设放弃线：一题超时（P5 约 30 秒、P7 约 1 分钟）先选一个最像的，标记后继续，有余时间再回看；不要因一题耽误后面的简单题。","ns":["ST.GIVEUP.CUTOFF_RULE"],"p":[5,6,7],"w":0.88,"pm":1},{"id":"SL-ALL-07","ti":"时间不够做三蒙二","wr":"时间不够：每组只做最容易的两三题，其余先猜。","r":"剩余时间不够做完时，每组 5 题只挑词义题和直接定位的细节题做 2–3 道，其余快速排除后猜，先保证全部涂满。","ns":["TX.DOUBLE","TX.TRIPLE","ST.GIVEUP.TARGET_BASED","ST.TIME.PER_SET_P7"],"p":[7],"w":0.51,"pm":0},{"id":"SL-ALL-08","ti":"按目标分决定放弃哪些题","wr":"先拿自己够得着的分，够不着的题批量猜。","r":"只求过线/600–700 目标：难题集中区（P5 后段、P6 插入句、P7 单篇后段长文）不会就猜，可战略性放弃部分多篇；多篇每组都有易得分题要先抓。","ns":["ST.GIVEUP.TARGET_BASED"],"p":[5,6,7],"w":0.48,"pm":1},{"id":"SL-ALL-09","ti":"Part 间按顺序做","wr":"按顺序开工，别东一块西一块。","r":"默认按 P5→P6→P7 顺序做，不跳着先做双篇；要预期 P7 篇型顺序被打乱。","ns":["ST.ORDER.PART_SEQUENCE"],"p":[5,6,7],"w":0.39,"pm":1},{"id":"SL-ALL-10","ti":"P7 内先易后难，多篇不整块留后","wr":"先做单篇就能答的，跨篇题放在组内最后。","r":"P7 内先拿把握大的题/篇；多篇里先做单文档题，跨篇题后做；但不要把多篇整块留到最后。","ns":["TX.MULTI","ST.ORDER.WITHIN_P7"],"p":[7],"w":0.7,"pm":1},{"id":"SL-ALL-11","ti":"分段涂卡、最后 5 分钟涂完","wr":"每做完一段就涂卡；还剩 5 分钟立刻全部涂满。","r":"纸笔考每 30 题或每个 Part 集中涂一次；倒计时 5 分钟停下，把已做题全部涂完，剩余题统一猜涂。","ns":["ST.BUBBLE.BATCH","ST.BUBBLE.FINAL_MINUTES"],"p":[5,6,7],"w":0.59,"pm":0},{"id":"SL-ALL-12","ti":"按题型统计正确率找弱项","wr":"先看绩效报表：哪类工单错得多就练哪类。","r":"按题型统计正确率诊断薄弱点，再针对弱项练（可对照官方 Abilities Measured 5 项）。","ns":["ST.REVIEW.DIAGNOSE_BY_TYPE"],"p":[5,6,7],"w":0.72,"pm":1},{"id":"SL-ALL-13","ti":"错题按原因分类","wr":"每道错题贴一个错因标签。","r":"每套记录各 Part 错几题、每种原因错几题（词汇/语法/定位/时间/改写没认出），按原因而不是按题复习。","ns":["ST.REVIEW.ERROR_CAUSE_LOG"],"p":[5,6,7],"w":0.71,"pm":1},{"id":"SL-ALL-14","ti":"讲清每个错误选项为何错","wr":"复盘时把四个选项都“结案”。","r":"复盘时逐个说明每个错误选项为什么错，能给别人讲清“为什么选这个、不选另外三个”才算懂。","ns":["ST.REVIEW.EXPLAIN_DISTRACTORS"],"p":[5,6,7],"w":0.71,"pm":1},{"id":"SL-ALL-15","ti":"认熟错误选项套路","wr":"错误选项就那几种套路，认出来就划掉。","r":"掌握错误选项套路（原文没提、部分正确、张冠李戴、过度推断、照搬原词、因果颠倒）并在复盘时归类。","ns":["QT.P7.TRUE_INDICATED","QT.P7.INFERENCE","QT.P7.DETAIL","ST.ELIM.TRAP_TYPES","ST.ELIM.OPTIONS","VO.PARA.CAUSE_EFFECT","VO.PARA.NEGATION_SHIFT"],"p":[5,6,7],"w":0.59,"pm":1},{"id":"SL-ALL-16","ti":"限时整卷模考","wr":"定期来一次 75 分钟“季度考核”，第二天专门复盘。","r":"用官方/仿真题严格 75 分钟整卷模考（含涂卡），不在题本写答案以便重做；留 1–2 套新题考前做；每次模考后用一天复盘。","ns":["ST.REVIEW.TIMED_MOCK"],"p":[5,6,7],"w":0.92,"pm":0},{"id":"SL-ALL-17","ti":"用题目音频复习阅读","wr":"做完的题再听一遍、跟读一遍。","r":"Part 5/6 听音频写出空格，Part 7 跟着音频读原文。","ns":["ST.REVIEW.AUDIO_SHADOW","FD.READ.CHUNK"],"p":[5,6,7],"w":0.6,"pm":1},{"id":"SL-ALL-18","ti":"生词从题里摘","wr":"每篇做完挑两三个词放进词卡。","r":"生词本从做过的题里摘，只记托业考到的词义；每篇挑 2–3 个词记；先用词表 App 过一遍，再转自建生词本。","ns":["ST.REVIEW.VOCAB_FROM_ITEMS","FD.VOC.NGSL_CORE"],"p":[5,6,7],"w":0.59,"pm":1},{"id":"SL-ALL-19","ti":"按分数段分层背词","wr":"先背自己这一档的词。","r":"先背目标分以下各段的词，提分后再扩展。","ns":["VO.BAND","VO.BAND.B600","VO.BAND.B730","VO.BAND.B860","VO.BAND.B990"],"p":[5,6,7],"w":0.5,"pm":1},{"id":"SL-ALL-20","ti":"按搭配记词","wr":"背词背整个短语，不背单个词。","r":"以短语/搭配为单位记词（每条不超过 7 个词），兼顾 P5 搭配题和 P7 阅读。","ns":["QT.P5.VOCAB","VO.COLLO","VO.COLLO.FIXED_PHRASE","VO.COLLO.VERB_NOUN","VO.COLLO.PHRASAL_VERB"],"p":[5,6,7],"w":0.72,"pm":1},{"id":"SL-ALL-21","ti":"生词多先补词再模考","wr":"一篇里生词超过 5 个，先回词汇区。","r":"每篇生词 ≥5 个说明词汇未过关，应先补词汇再做模考。","ns":["FD.VOC.NGSL_CORE","VO.BAND.B600"],"p":[6,7],"w":0.6,"pm":1},{"id":"SL-ALL-22","ti":"按目标选材料难度","wr":"冲高分时 P7 要练更难的文章。","r":"官方题集 P5/P6 难度接近真题，但 P7 偏易；冲 800+ 需要更难的 P7 材料。","ns":[],"p":[5,6,7],"w":0.28,"pm":1},{"id":"SL-ALL-23","ti":"分数波动 35 分以内看作噪音","wr":"模考分涨跌 35 分以内，别激动也别泄气。","r":"官方 SEM 约 ±25，两次成绩相差 35 分以内可能只是测量误差，不据此大改计划。","ns":["ST.REVIEW.TIMED_MOCK"],"p":[5,6,7],"w":0.61,"pm":0},{"id":"SL-ALL-24","ti":"高分段正向确认，排除作后备","wr":"高手先找证据再选，不是靠划掉别的。","r":"800+ 不靠消去法：先在原文找到支持正确选项的依据再选，排除法只用于犹豫的两选一。","ns":["ST.ELIM.OPTIONS"],"p":[7],"w":0.44,"pm":1},{"id":"SL-ALL-25","ti":"考场规则：题本不写画、只在阅读时间做阅读","wr":"模考里不能在卷子上写字，练习里养成习惯。","r":"题本禁止划线/笔记，无草稿纸；听力时间不得翻做阅读（可取消成绩）；平时练习就不在题本写字。","ns":[],"p":[5,6,7],"w":0.55,"pm":1}]};</script>

const Store = (() => {
  const mem = {};
  const memory = { kind: 'memory', get: k => (k in mem ? mem[k] : null), set: (k, v) => { mem[k] = v; }, del: k => { delete mem[k]; } };
  let local = null;
  try {
    const ls = window.localStorage, t = '__t2';
    ls.setItem(t, '1'); ls.removeItem(t);
    local = { kind: 'local', get: k => ls.getItem(k), set: (k, v) => ls.setItem(k, v), del: k => ls.removeItem(k) };
  } catch (e) { local = null; }
  let ad = local || memory;
  function safeSet(k, v) {
    try { ad.set(k, v); } catch (e) { // 配额满等 → 降级内存
      ad = memory; ad.set(k, v); if (Store.onFallback) Store.onFallback();
    }
  }
  return {
    get kind() { return ad.kind; },
    getJ(k, d) { try { const s = ad.get(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } },
    setJ(k, v) { safeSet(k, JSON.stringify(v)); },
    del(k) { try { ad.del(k); } catch (e) { } },
    onFallback: null
  };
})();

/* ===== 多档案：每个档案一份独立 state，key = t2:p:<id> ===== */
const Profiles = (() => {
  const IDX = 't2:index';
  let idx = Store.getJ(IDX, null) || { list: [], cur: null };
  const saveIdx = () => Store.setJ(IDX, idx);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  return {
    list: () => idx.list,
    cur: () => idx.cur,
    create(name) {
      const id = uid(); idx.list.push({ id, name: name || ('档案' + (idx.list.length + 1)) });
      idx.cur = id; saveIdx(); return id;
    },
    use(id) { idx.cur = id; saveIdx(); },
    remove(id) {
      idx.list = idx.list.filter(p => p.id !== id); Store.del('t2:p:' + id);
      if (idx.cur === id) idx.cur = idx.list[0] ? idx.list[0].id : null; saveIdx();
    },
    rename(id, nm) { const p = idx.list.find(p => p.id === id); if (p) { p.name = nm; saveIdx(); } },
    name(id) { const p = idx.list.find(p => p.id === (id || idx.cur)); return p ? p.name : ''; },
    load(id) { return Store.getJ('t2:p:' + (id || idx.cur), null); },
    save(st, id) { Store.setJ('t2:p:' + (id || idx.cur), st); }
  };
})();

/* 进度码：base64(UTF-8 JSON) */
const Code = {
  enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); },
  dec(s) { return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); }
};

/* ===== 引擎：数据索引 / 掌握度(Elo) / 预测分 / 简化 FSRS / 选题 ===== */
const D = window.TDATA;
const IT = {}, BU = {}, ND = {}, BY_NODE = {}, FORMS = {};
D.items.forEach(i => {
  IT[i.id] = i;
  [i.n].concat(i.ns).forEach(n => (BY_NODE[n] = BY_NODE[n] || []).push(i.id));
  if (i.src === 'xdf') (FORMS[i.f] = FORMS[i.f] || []).push(i.id);
});
D.bundles.forEach(b => { BU[b.id] = b; });
D.nodes.forEach(n => { ND[n.id] = n; });
Object.values(FORMS).forEach(a => a.sort((x, y) => IT[x].q - IT[y].q));

const DAY = 864e5;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / DAY);
const sig = x => 1 / (1 + Math.exp(-x));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const diffB = d => (d - 3) * 0.7;               // difficulty_est(1–5) → logit 难度
const RT = { 600: 300, 700: 350, 800: 400, 900: 450 }; // 总分目标 → 阅读分目标（按一半估）
const RANKS = [[0, '实习生'], [200, '专员'], [300, '主管'], [375, '经理'], [430, '总监']];
const SCALE = [[0, 5], [10, 5], [20, 60], [30, 110], [40, 165], [50, 220], [60, 275], [70, 330], [80, 385], [90, 440], [95, 470], [100, 495]];

function newState(target, exam) {
  return { ver: 2, created: Date.now(), target: target || 700, exam: exam || '', diag: false,
    th: 0, N: 0, nd: {}, seen: {}, cards: {}, words: {}, wrong: {}, mocks: [], used: [],
    streak: { d: '', n: 0 }, days: {}, log: [], hist: [], cons: {}, hl: {}, run: null };
}

const E = {
  st: null,
  log(e, o) { const L = this.st.log; L.push(Object.assign({ t: Date.now(), e }, o || {})); if (L.length > 20000) L.splice(0, L.length - 20000); },
  mastery(n) { const v = this.st.nd[n]; return v ? sig(v[0]) : null; },
  rawFromTheta(th) {
    const bs = [-1.4, -0.7, 0, 0.7, 1.4], ws = [.1, .25, .35, .2, .1];
    return 100 * bs.reduce((s, b, k) => s + ws[k] * sig(th - b), 0);
  },
  scaled(raw) {
    for (let k = 1; k < SCALE.length; k++) if (raw <= SCALE[k][0]) {
      const [x0, y0] = SCALE[k - 1], [x1, y1] = SCALE[k]; return y0 + (y1 - y0) * (raw - x0) / (x1 - x0);
    }
    return 495;
  },
  /* 预测阅读分：点估计 + 区间（答题越多越窄） + 达标概率 */
  predict() {
    const s = this.st, p = this.scaled(this.rawFromTheta(s.th)), hw = Math.max(20, 150 / Math.sqrt(1 + s.N / 8));
    const r5 = x => Math.round(clamp(x, 5, 495) / 5) * 5, tg = RT[s.target] || s.target / 2;
    const z = (p - tg) / (hw / 1.645), prob = 1 / (1 + Math.exp(-1.702 * z));
    return { p: r5(p), lo: r5(p - hw), hi: r5(p + hw), tg, prob };
  },
  rank(p) { let r = RANKS[0][1]; RANKS.forEach(([v, nm]) => { if (p >= v) r = nm; }); return r; },
  /* Elo 式更新：主节点全量，其他 node_ids 半量；全局能力 th 用于预测分 */
  update(it, ok) {
    const s = this.st, b = diffB(it.d), r = ok ? 1 : 0;
    const kg = Math.max(0.06, 0.6 / (1 + 0.05 * s.N));
    s.th += kg * (r - sig(s.th - b)); s.N++;
    const up = (n, half) => {
      const v = s.nd[n] || (s.nd[n] = [s.th, 0]);
      const k = Math.max(0.15, 0.8 / (1 + 0.1 * v[1])) * (half ? 0.5 : 1);
      v[0] += k * (r - sig(v[0] - b)); v[1]++;
    };
    up(it.n, false); it.ns.forEach(n => up(n, true));
    s.cons[it.n] = ok ? 0 : (s.cons[it.n] || 0) + 1;
  },
  /* 简化 FSRS：快对×2.5、慢对×1.3、错/查词→1 天。新题快对不建卡（已会）。 */
  schedule(id, ok, fast, lookedUp) {
    const s = this.st, c = s.cards[id];
    if (!c && ok && fast && !lookedUp) return;
    const iv = c ? c.ivl : 1;
    const ni = (!ok || lookedUp) ? 1 : (fast ? Math.max(1, iv) * 2.5 : Math.max(1, iv) * 1.3);
    s.cards[id] = { ivl: ni, due: dayNum() + Math.round(ni) };
    if (!ok) s.wrong[id] = Date.now();
  },
  scheduleWord(w, grade) { // grade: 2 认识 1 模糊 0 不认识
    const c = this.st.words[w]; if (!c) return;
    c.ivl = grade === 2 ? Math.max(1, c.ivl) * 2.5 : grade === 1 ? Math.max(1, c.ivl) * 1.3 : 1;
    c.due = dayNum() + Math.round(c.ivl);
  },
  addWord(w, ctx) {
    w = w.toLowerCase(); const s = this.st;
    if (!s.words[w]) s.words[w] = { c: ctx.slice(0, 160), ivl: 1, due: dayNum() + 1, ts: Date.now() };
    else s.words[w].due = dayNum() + 1;
    this.log('word', { w });
  },
  /* 记一次作答（训练/诊断/复习/模考交卷都走这里） */
  record(it, ans, mode) {
    const ok = ans.c === it.a, fast = ans.ms / 1000 <= it.t;
    this.update(it, ok);
    if (mode !== 'diag') this.schedule(it.id, ok, fast, !!ans.lu);
    const sn = this.st.seen[it.id] || [0, 0]; sn[0]++; sn[1] = ok ? 1 : 0; this.st.seen[it.id] = sn;
    const d = today(); this.st.days[d] = (this.st.days[d] || 0) + 1; this.touchStreak();
    this.log('answer', { id: it.id, mode, c: ans.c, ok: ok ? 1 : 0, ms: ans.ms, lu: ans.lu ? 1 : 0 });
    return ok;
  },
  touchStreak() {
    const s = this.st.streak, d = today();
    if (s.d === d) return;
    const y = new Date(Date.now() - DAY); const yd = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    s.n = s.d === yd ? s.n + 1 : 1; s.d = d;
  },
  streakNow() { const s = this.st.streak; if (!s.d) return 0; const gap = (new Date(today()) - new Date(s.d)) / DAY; return gap <= 1 ? s.n : 0; },
  /* 训练池：去掉模考用过的套 */
  pool() { const u = new Set(this.st.used); return D.items.filter(i => !(i.src === 'xdf' && u.has(i.f))); },
  /* 薄弱节点：考频 × (1 − 掌握度)；未测节点用全局能力并稍加探索分 */
  weakList() {
    const g = sig(this.st.th);
    return D.nodes.filter(n => !n.g && BY_NODE[n.id] && n.w > 0).map(n => {
      const m = this.mastery(n.id), mm = m == null ? g : m;
      return { n, m, sc: n.w * (1 - mm) * (m == null ? 0.9 : 1) };
    }).sort((a, b) => b.sc - a.sc);
  },
  dueItems() { const t = dayNum(); return Object.keys(this.st.cards).filter(id => IT[id] && this.st.cards[id].due <= t).sort((a, b) => this.st.cards[a].due - this.st.cards[b].due); },
  dueWords() { const t = dayNum(); return Object.keys(this.st.words).filter(w => this.st.words[w].due <= t); },
  /* 选题：节点集合内、未做过、难度贴近能力 */
  pickSingles(nodes, k, used) {
    const ns = new Set(nodes), th = this.st.th;
    const c = this.pool().filter(i => i.p === 5 && !used.has(i.id) && (ns.size === 0 || ns.has(i.n) || i.ns.some(x => ns.has(x))));
    c.sort((a, b) => ((this.st.seen[a.id] ? 5 : 0) + Math.abs(diffB(a.d) - th) + Math.random()) - ((this.st.seen[b.id] ? 5 : 0) + Math.abs(diffB(b.d) - th) + Math.random()));
    const out = c.slice(0, k); out.forEach(i => used.add(i.id)); return out.map(i => ({ ids: [i.id] }));
  },
  pickBundle(part, nodes, used, kind, must) {
    const ns = new Set(nodes), u = new Set(this.st.used);
    const c = D.bundles.filter(b => b.p === part && b.qs.length && !(b.qs[0].startsWith('XDF') && u.has(b.f)) && !b.qs.some(q => used.has(q)) && (!kind || kind.includes(b.k)) && (!must || b.qs.some(q => ns.has(IT[q].n) || IT[q].ns.some(x => ns.has(x)))));
    const score = b => b.qs.reduce((s, q) => { const i = IT[q]; return s + (ns.has(i.n) || i.ns.some(x => ns.has(x)) ? 1 : 0) - (this.st.seen[q] ? 2 : 0); }, 0) + Math.random();
    c.sort((a, b) => score(b) - score(a));
    const b = c[0]; if (!b) return null; b.qs.forEach(q => used.add(q)); return { b: b.id, ids: b.qs.slice() };
  },
  /* 复习单元：P5 单题；P6/P7 只出到期那题，但带原文 */
  reviewUnits(cap) {
    return this.dueItems().slice(0, cap).map(id => IT[id].b ? { b: IT[id].b, ids: [id] } : { ids: [id] });
  },
  plan(min) {
    const used = new Set(), top = this.weakList().slice(0, 6).map(x => x.n.id);
    if (min === 5) { const r = this.reviewUnits(4).filter(u => !u.b); r.forEach(u => used.add(u.ids[0])); return r.concat(this.pickSingles(top, 8 - r.length, used)); }
    if (min === 20) {
      const r = this.reviewUnits(10); r.forEach(u => u.ids.forEach(q => used.add(q)));
      const out = r.concat(this.pickSingles(top, 8, used));
      const b6 = this.pickBundle(6, top, used); if (b6) out.push(b6);
      const b7 = this.pickBundle(7, top, used, ['single']); if (b7) out.push(b7);
      return out;
    }
    return null;
  },
  weakPlan(nodeId) { // 攻克：该节点的 P5 单题 ×6 + 含该节点的 P6/P7 各 1 组（按题库实际分布）
    const used = new Set(), out = this.pickSingles([nodeId], 6, used), has = new Set((BY_NODE[nodeId] || []).map(q => IT[q].p));
    [6, 7].forEach(p => { if (has.has(p)) { const b = this.pickBundle(p, [nodeId], used, null, true); if (b) out.unshift(b); } });
    return out;
  },
  diagPlan(min) {
    const P = D.items.filter(i => i.src === 'pilot' && i.p === 5), used = new Set(), out = [];
    [2, 2, 3, 3, 4, 4].forEach(d => { const c = P.filter(i => i.d === d && !used.has(i.id)); const i = c[Math.floor(Math.random() * c.length)] || P.find(i => !used.has(i.id)); used.add(i.id); out.push({ ids: [i.id] }); });
    const pb = D.bundles.filter(b => b.qs[0] && b.qs[0].startsWith('PL'));
    const b6 = pb.find(b => b.p === 6), b7 = pb.filter(b => b.p === 7 && b.k === 'single' && b.qs.length <= 3)[0];
    if (b6) out.push({ b: b6.id, ids: b6.qs.slice() }); if (b7) out.push({ b: b7.id, ids: b7.qs.slice() });
    return out;
  },
  /* 模考：选做过题最少、未用过的 xdf 套 */
  nextForm() {
    const u = new Set(this.st.used);
    return Object.keys(FORMS).filter(f => !u.has(f)).sort((a, b) => FORMS[a].filter(q => this.st.seen[q]).length - FORMS[b].filter(q => this.st.seen[q]).length)[0] || null;
  },
  mockPlan(form) {
    const out = [], done = new Set();
    FORMS[form].forEach(id => {
      if (done.has(id)) return; const i = IT[id];
      if (i.b) { const b = BU[i.b]; b.qs.forEach(q => done.add(q)); out.push({ b: b.id, ids: b.qs.slice() }); }
      else { done.add(id); out.push({ ids: [id] }); }
    });
    return out;
  },
  rules(nodeId) {
    const n = ND[nodeId], keys = new Set([nodeId, n && n.pa].filter(Boolean));
    return D.strats.filter(s => s.pm && s.ns.some(x => keys.has(x))).sort((a, b) => b.w - a.w).slice(0, 2);
  },
  weekStats(st) {
    const t0 = Date.now() - 7 * DAY, a = st.log.filter(x => x.e === 'answer' && x.t >= t0);
    return { n: a.length, acc: a.length ? a.filter(x => x.ok).length / a.length : 0 };
  }
};

function startSession(mode, units, extra) {
  if (!units || !units.length) return alert('没有可用的题目了');
  const nd0 = {};
  units.forEach(u => u.ids.forEach(id => { const i = IT[id]; nd0[i.n] = E.mastery(i.n); }));
  S = Object.assign({ mode, units, ui: 0, qi: 0, ans: {}, lu: {}, t0: Date.now(), qt0: Date.now(), pred0: E.predict(), nd0, fb: false, tool: '', fold: false, doc: 0, view: 1 }, extra || {});
  if (mode === 'mock') { S.flat = units.reduce((a, u) => a.concat(u.ids), []); S.pos = 0; S.mt = {}; S.end = Date.now() + 75 * 6e4; }
  E.log('start', { mode, n: units.reduce((s, u) => s + u.ids.length, 0), form: S.form });
  save(); render(); scrollTo(0, 0);
}
function curId() { return S.mode === 'mock' ? S.flat[S.pos] : S.units[S.ui].ids[S.qi]; }
function curUnit() { if (S.mode !== 'mock') return S.units[S.ui]; const id = curId(); return S.units.find(u => u.ids.includes(id)); }
function total() { return S.mode === 'mock' ? S.flat.length : S.units.reduce((s, u) => s + u.ids.length, 0); }

function words(t) { return esc(t).replace(/[A-Za-z][A-Za-z'’-]*/g, w => `<span class="w">${w}</span>`); }
function passageText(x, qid, bid, di) {
  const cur = IT[qid].q, hl = new Set(E.st.hl[bid + ':' + di] || []);
  let k = 0;
  return x.split(/(\n+)/).map(seg => {
    if (/^\n+$/.test(seg)) return seg;
    return (seg.match(/[^.!?]+[.!?"”’)]*\s*|.+$/g) || [seg]).map(sn => {
      const i = k++;
      let h = words(sn).replace(/\{\{(\d+)\}\}/g, (m, n) => `<span class="blank ${+n === cur ? 'cur' : ''}">${n}</span>`);
      return `<span class="sen ${hl.has(i) ? 'hl' : ''}" data-s="${i}">${h}</span>`;
    }).join('');
  }).join('');
}
function vPassage(u, qid) {
  const b = BU[u.b], tools = S.mode !== 'mock' && S.mode !== 'diag';
  const di = Math.min(S.doc, b.docs.length - 1), d = b.docs[di];
  return `<div class="row sp sm mut"><span>Part ${b.p} · ${b.k === 'single' ? '单篇' : b.k === 'double' ? '双篇' : '三篇'}</span><span class="chip" data-act="fold">${S.fold ? '展开原文' : '收起原文'}</span></div>
  ${b.docs.length > 1 ? `<div class="tabsx">${b.docs.map((x, k) => `<span class="chip ${k === di ? 'on' : ''}" data-act="doc" data-k="${k}">文${k + 1}</span>`).join('')}</div>` : ''}
  <div class="passage ${S.fold ? 'fold' : ''}" data-bid="${b.id}" data-di="${di}">${d.h ? `<div class="ph">${words(d.h).replace(/\{\{(\d+)\}\}/g, '<span class="blank">$1</span>')}</div>` : ''}${passageText(d.x, qid, b.id, di)}</div>`;
}
function vQuiz() {
  const id = curId(), it = IT[id], u = curUnit(), a = S.ans[id], mock = S.mode === 'mock', tools = !mock && S.mode !== 'diag';
  const n = mock ? S.pos + 1 : Object.keys(S.ans).length + (S.fb ? 0 : 1);
  let stem = it.p === 6 ? `第 ${it.q} 空（原文高亮处）` : it.s;
  stem = words(stem).replace(/-{4,}/g, '<span class="blank cur">&nbsp;</span>');
  const opts = it.o.map((o, k) => {
    let c = '';

  }).join('');
  let fb = '';

     <div>正确答案：(${'ABCD'[it.a]}) ${esc(it.o[it.a])} · 用时 ${Math.round(a.ms / 1000)}s / 目标 ${it.t}s</div>

   ${mock ? `<span id="cd" class="rank">--:--</span>` : ''}<button class="btn ghost sm" data-act="pause">${mock ? '离开' : '暂停'}</button></div>
   ${mock ? '' : `<div class="tbar" id="tb"><i style="width:0"></i></div>`}</div>`;
  const tl = tools ? `<div class="tools"><span class="chip" data-act="later">稍后处理</span><span class="chip ${S.tool === 'hl' ? 'on' : ''}" data-act="tool" data-t="hl">划依据</span><span class="chip ${S.tool === 'w' ? 'on' : ''}" data-act="tool" data-t="w">点词进生词本</span></div>` : '';
  const nav = mock ? `<div class="row sp" style="margin:8px 0"><button class="btn ghost sm" data-act="mv" data-d="-1">上一题</button><button class="btn acc sm" data-act="submit">交卷</button><button class="btn ghost sm" data-act="mv" data-d="1">下一题</button></div>

  return head + (u.b ? vPassage(u, id) : '') + tl + `<div class="stem" data-stem="1"><span class="mut sm">Q${it.q}</span> ${stem}</div>` + opts + fb + nav;
}

let timer = null;
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!S || S.done || !S.view) return clearInterval(timer);
    if (S.mode === 'mock') {
      const left = Math.max(0, S.end - Date.now()), el = $('#cd');
      if (el) el.textContent = String(Math.floor(left / 6e4)).padStart(2, '0') + ':' + String(Math.floor(left / 1e3) % 60).padStart(2, '0');
      if (!left) { clearInterval(timer); submitMock(); }
      return;
    }
    const tb = $('#tb'); if (!tb || S.fb) return;
    const r = (Date.now() - S.qt0) / 1000 / IT[curId()].t;
    tb.firstChild.style.width = Math.min(100, r * 100) + '%'; tb.classList.toggle('over', r > 1);
  }, 500);
}

function answer(c) {
  const id = curId(), it = IT[id];
  if (S.mode === 'mock') { S.ans[id] = { c }; leaveQ(); if (S.pos < S.flat.length - 1) S.pos++; S.qt0 = Date.now(); save(); return render(); }
  if (S.fb) return;
  const a = { c, ms: Date.now() - S.qt0, lu: !!S.lu[id] }; S.ans[id] = a;
  E.record(it, a, S.mode);
  if (S.mode === 'diag') return next();
  S.fb = true; save(); render();
}
function next() {
  S.fb = false; S.qi++;
  if (S.qi >= S.units[S.ui].ids.length) { S.ui++; S.qi = 0; S.doc = 0; }
  if (S.ui >= S.units.length) return finish();
  S.qt0 = Date.now(); save(); render(); scrollTo(0, 0);
}
function leaveQ() { const id = curId(); S.mt[id] = (S.mt[id] || 0) + (Date.now() - S.qt0); }
function submitMock() {
  if (!S || S.mode !== 'mock') return;
  leaveQ(); const parts = {};
  S.flat.forEach(id => {
    const a = S.ans[id] || { c: -1 }; a.ms = S.mt[id] || 0; S.ans[id] = a;
    const ok = E.record(IT[id], a, 'mock'), p = parts[IT[id].p] || (parts[IT[id].p] = [0, 0]); p[0] += ok ? 1 : 0; p[1]++;
  });
  if (!E.st.used.includes(S.form)) E.st.used.push(S.form);
  S.parts = parts; finish();
}
function finish() {
  const ids = Object.keys(S.ans), ok = ids.filter(id => S.ans[id].c === IT[id].a).length;
  const ms = ids.reduce((s, id) => s + (S.ans[id].ms || 0), 0), tgt = ids.reduce((s, id) => s + IT[id].t, 0);
  const p1 = E.predict(), nodes = Object.keys(S.nd0).map(n => ({ n, a: S.nd0[n], b: E.mastery(n) })).filter(x => x.b != null)
    .map(x => Object.assign(x, { d: x.b - (x.a == null ? 0.5 : x.a) }));
  R = { mode: S.mode, n: ids.length, ok, ms, tgt, p0: S.pred0, p1, nodes, form: S.form, parts: S.parts };
  if (S.mode === 'mock') {
    const raw = ok / Math.max(1, ids.length) * 100;
    R.scaled = Math.round(E.scaled(raw) / 5) * 5; E.st.mocks.push({ ts: Date.now(), form: S.form, ok, n: ids.length, scaled: R.scaled, ms });
  }
  if (S.mode === 'diag') E.st.diag = true;
  E.st.hist.push([Date.now(), p1.p]);
  E.log('end', { mode: S.mode, n: ids.length, ok, ms });
  S.done = true; S = null; save(); render(); scrollTo(0, 0);
}
function vResult() {
  const r = R, d = r.p1.p - r.p0.p, up = r.nodes.filter(x => x.d > 0.005).sort((a, b) => b.d - a.d).slice(0, 4), dn = r.nodes.filter(x => x.d < -0.005).sort((a, b) => a.d - b.d).slice(0, 4);

  rules: () => { const it = IT[curId()]; E.log('rule', { n: it.n }); modal(`<h2>工作规则卡</h2>${E.rules(it.n).map(r => `<div class="fb"><b>${esc(r.ti)}</b><div>${esc(r.wr)}</div><div class="mut sm">${esc(r.r)}</div></div>`).join('')}<button class="btn full" data-act="closeM">记住了</button>`); },
  closeM: () => { modal(''); flash = null; render(); },
  mv: el => { leaveQ(); S.pos = clamp(S.pos + +el.dataset.d, 0, S.flat.length - 1); S.qt0 = Date.now(); render(); },
  go: el => { leaveQ(); S.pos = +el.dataset.k; S.qt0 = Date.now(); render(); },
  submit: () => { const left = S.flat.length - Object.keys(S.ans).length; if (confirm(left ? `还有 ${left} 题没答，确定交卷？` : '确定交卷？')) submitMock(); },
  closeR: () => { R = null; tab = 'home'; render(); },
  weak: el => startSession('weak', E.weakPlan(el.dataset.n)),
  rev: () => startSession('review', E.reviewUnits(20)),
  redo: el => { const i = IT[el.dataset.id]; startSession('review', [i.b ? { b: i.b, ids: [i.id] } : { ids: [i.id] }]); },
  flash: () => { flash = E.dueWords(); vFlash(); },
  fg: el => { const w = flash.shift(); E.scheduleWord(w, +el.dataset.g); E.log('wordrev', { w, g: +el.dataset.g }); save(); vFlash(); },
  delw: el => { delete E.st.words[el.dataset.w]; save(); render(); },
  use: el => { save(); Profiles.use(el.dataset.id); E.st = Profiles.load() || newState(); S = E.st.run || null; render(); },
  delp: el => { if (!confirm('删除档案「' + Profiles.name(el.dataset.id) + '」？数据不可恢复。')) return; Profiles.remove(el.dataset.id); if (!Profiles.cur()) { E.st = null; setupNew = true; } else { E.st = Profiles.load() || newState(); S = E.st.run || null; } render(); },
  newp: () => { save(); setupNew = true; render(); },
  setTg: el => { E.st.target = +el.dataset.v; save(); render(); },
  exp: () => { E.log('export', {}); save(); copy(Code.enc({ app: 'toeic-r-v2', name: Profiles.name(), st: Object.assign({}, E.st, { log: [] }) })); },
  imp: () => {
    try { const o = Code.dec($('#codeBox').value); if (o.app !== 'toeic-r-v2' || !o.st || o.st.ver !== 2) throw 0; save(); Profiles.create((o.name || '导入') + '（导入）'); E.st = o.st; S = o.st.run || null; save(); alert('已导入为新档案'); render(); }
    catch (e) { alert('进度码无效'); }
  },
  logx: () => {
    const s = JSON.stringify({ profile: Profiles.name(), log: E.st.log }), a = document.createElement('a');
    try { a.href = URL.createObjectURL(new Blob([s], { type: 'application/json' })); a.download = 'toeic_log_' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); }
    catch (e) { copy(s); }
  },
  reset: () => { if (confirm('重置当前档案的全部进度？')) { const t = E.st.target, x = E.st.exam; E.st = newState(t, x); S = null; save(); render(); } }
};
document.addEventListener('click', ev => {
  const tb = ev.target.closest('#tabs button'); if (tb) { tab = tb.dataset.tab; if (S) S.view = 0; return render(); }
  if (ev.target.id === 'modal') return A.closeM();
  const el = ev.target.closest('[data-act]');
  if (el && A[el.dataset.act] && el.tagName !== 'INPUT') return A[el.dataset.act](el);
  if (!S || !S.view || !S.tool) return;
  // 练习工具：点句划依据 / 点词加生词本
  const w = ev.target.closest('.w'), sen = ev.target.closest('.sen'), ps = ev.target.closest('.passage'), stem = ev.target.closest('[data-stem]');
  if (S.tool === 'w' && w && (ps || stem)) {
    const ctx = sen ? sen.textContent : stem.textContent; E.addWord(w.textContent, ctx.trim()); S.lu[curId()] = true; w.classList.add('vw'); save();
  } else if (S.tool === 'hl' && sen && ps) {
    const key = ps.dataset.bid + ':' + ps.dataset.di, a = E.st.hl[key] || (E.st.hl[key] = []), i = +sen.dataset.s, k = a.indexOf(i);
    if (k < 0) a.push(i); else a.splice(k, 1); sen.classList.toggle('hl'); E.log('hl', { b: ps.dataset.bid, s: i }); save();
  }
});
document.addEventListener('change', ev => { if (ev.target.id === 'exDate') { E.st.exam = ev.target.value; save(); } });
window.addEventListener('pagehide', save);
boot();
</script>
</body>
</html>
