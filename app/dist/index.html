delegates landing later may book a car at €48 each way."},{"t":"TX.EMAIL","h":"To: registrations@nordichospitalityforum.example\nFrom: l.ferreira@cameliagroup.example\nDate: 6 October\nSubject: Two changes","x":"Dear Mr. Halvorsen,\n\nThank you for the itinerary. Two changes, if they can still be made.\n\nMy flight has been moved and I now land at 16:40 on the Tuesday, so I will need the car you offer to later arrivals. One way only, please: I am staying on privately on the Thursday night and will make my own way to the airport on the Friday.\n\nSecond, I would like to exchange my 11:00 workshop on the Wednesday. Menu costing sits well outside my remit these days; I would rather take “Suppliers and short contracts” in Salon 2, if a place is free. The afternoon session I will keep as it is — recruitment is exactly my problem this year.\n\nWith thanks,\n\nLucia Ferreira\nOperations Director, Camelia Group"},{"t":"TX.INVOICE","h":"Invoice","x":"NORDIC HOSPITALITY FORUM\nINVOICE 2419-B — issued 20 October\n\nBilled to: Camelia Group, attention L. Ferreira\n\nDelegate registration, full three days            €595\nAccommodation, 2 nights, Executive Double         €412\nForum dinner, 15 October                      included\nAirport transfer, one way                          €48\nReplacement name badge                             €15\n\nTOTAL                                           €1,070\n\nPayment is due within 30 days of issue. Please quote the invoice number on the transfer. Queries about individual lines should go to the registrations desk, not to the hotel; room charges beyond those listed above are settled directly with the Rosenhof at the front desk."}],"qs":["MXC-T02-186","MXC-T02-187","MXC-T02-188","MXC-T02-189","MXC-T02-190"]},{"id":"MXC-T02-P7-T2","p":7,"f":"MXT02","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.AD","h":"Advertisement","x":"NORTHGATE AUDIO — audiobook production for independent publishers\n\nStandard — €38 per finished hour\nA narrator from our open roster, one proof-listen, delivery in six weeks.\n\nSignature — €62 per finished hour\nYour choice of narrator from auditions by three readers, two proof-listens, delivery in four weeks.\n\nSeries — €55 per finished hour on orders of four titles or more. The same narrator is guaranteed for every title in the order.\n\nEvery price includes mastering to retail specification and one free re-record of up to fifteen minutes should you find an error after delivery. Re-recording beyond that is billed at €140 an hour.\n\nFinished files are delivered through our client portal in the formats the major retailers require.\n\nStudio: Unit 9, Ferrold Lane. Enquiries: bookings@northgateaudio.example"},{"t":"TX.REVIEW","h":"Customer review","x":"Reviewer: Ingrid Solvang, Larkfell Editions\nPosted: 22 January\nRating: 4 out of 5\n\nWe recorded a four-book crime series with Northgate last autumn, and I would use them again — with one reservation.\n\nAt €55 per finished hour the rate was competitive for work of this quality, and the promise that mattered most to us was kept: one narrator read all four titles. Readers of a series notice a change of voice, and they complain about it.\n\nDelivery is where it went wrong. The first title arrived on the agreed date. The fourth was eleven days late, and nobody told us — we found out because I wrote to ask. For a publisher with retailer listings already scheduled, that is expensive.\n\nWe also found a mispronounced place name in the second book. That was corrected within a week and we were not charged for it."},{"t":"TX.REVIEW","h":"Response","x":"Response from Daniel Okonkwo, Studio Manager, Northgate Audio\nPosted: 26 January\n\nMs. Solvang, thank you for a review that is fair on both counts.\n\nYou are right about the fourth title. Our narrator was unavailable for a week in November, and we should have written to you on the day we knew rather than leaving you to ask. Since December every client receives an automatic message the moment a delivery date moves, whether it moves by a day or by a fortnight. That is a change we owe to your complaint and to two others like it.\n\nOn the correction in book two, I am glad it was straightforward — that is exactly what the clause is there for.\n\nIf Larkfell Editions returns to us this year, the studio time for your first title will be at no charge. Please write to me directly."}],"qs":["MXC-T02-191","MXC-T02-192","MXC-T02-193","MXC-T02-194","MXC-T02-195"]},{"id":"MXC-T02-P7-T3","p":7,"f":"MXT02","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO CARRIERS — Rendell Park Distribution Centre\nPosted 2 June\n\nThe main yard will be resurfaced between Monday 15 June and Friday 26 June. For those two weeks:\n\n— Gate 1 will be closed to vehicles. All arrivals must use Gate 4 on Cavell Road.\n— Loading bays 1 to 6 remain in service. Bays 7 to 12 are closed for the whole period.\n— No trailer may be left in the yard overnight. Carriers needing to drop a trailer must use the overflow park at Sindal Road.\n— Every vehicle must hold a booked arrival slot made at least 24 hours in advance. Vehicles arriving without one will be turned away.\n\nThe driver facilities stay where they are, beside Gate 1, and a free shuttle bus will run to them from Gate 4. The timetable is posted separately.\n\nQuestions: Bea Lindqvist, Yard Supervisor, extension 218."},{"t":"TX.SCHEDULE","h":"Schedule","x":"GATE 4 AND DRIVER FACILITIES — FREE SHUTTLE TIMETABLE\nIn force 15-26 June\n\nMonday to Friday\nDepartures from Gate 4: 06:15, 07:15, 08:15, 09:15, 10:15, 11:15, 12:15, 13:15, 14:15, 15:15, 16:15, 17:15, 18:15, 19:15, 20:15, 21:15\nDepartures from the driver facilities: 06:30, 07:30, 08:30 and hourly thereafter until 21:30\n\nSaturday\nFirst departure from Gate 4: 08:15. First departure from the driver facilities: 08:30. Hourly thereafter, last departures as on weekdays.\n\nSunday\nNo service.\n\nThe journey takes four minutes. The bus does not call at the overflow park on Sindal Road; drivers leaving a trailer there should allow fifteen minutes to walk to Gate 4."},{"t":"TX.EMAIL","h":"To: b.lindqvist@rendellpark.example\nFrom: operations@kestrelhaulage.example\nDate: 9 June\nSubject: Our deliveries during the resurfacing","x":"Dear Ms. Lindqvist,\n\nWe deliver to Rendell Park three times a week and I would like to get the fortnight right before I book the slots.\n\nTwo of the three runs are chilled and have always been unloaded at bay 9. I assume we should now ask for a bay in the 1 to 6 range; please tell me if any of those six is unsuitable for a chilled trailer.\n\nOur Saturday run reaches you at 07:00. My driver takes his break before starting back, and from the timetable I can see that no bus will be waiting for him at that hour. Is the walk to the facilities signposted from Gate 4?\n\nFinally, our tractor units normally drop a trailer with you on a Thursday evening for collection on the Friday morning. I take it that arrangement is suspended for the two weeks.\n\nRegards,\n\nAdaeze Nwankwo\nTransport Office, Kestrel Haulage"}],"qs":["MXC-T02-196","MXC-T02-197","MXC-T02-198","MXC-T02-199","MXC-T02-200"]},{"id":"MXC-T03-P6-B1","p":6,"f":"MXT03","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Letter","x":"Vesterlund Architects\n17 Harbour Row, Portsmouth\n\n12 October\n\nDr. Amara Okonkwo\nRiverbend Community Health Centre\n\nDear Dr. Okonkwo,\n\nThank you for meeting us on site last Thursday. Following that visit, we have {{131}} the drawings for the outpatient extension to take account of your comments on the reception layout.\n\nThe new plan moves the waiting area away from the entrance doors, which should cut down draughts in winter. It also places a second consulting room {{132}} the dispensary and the staff room, so that both can be reached without crossing the waiting area. {{133}}, the storage cupboard you asked about has been widened to 1.8 metres.\n\nWe will submit the package to the planning office on 26 October. {{134}} If you would like anything changed before then, please let us know by 20 October.\n\nYours sincerely,\n\nHenrik Vesterlund\nPartner"}],"qs":["MXC-T03-131","MXC-T03-132","MXC-T03-133","MXC-T03-134"]},{"id":"MXC-T03-P6-B2","p":6,"f":"MXT03","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: All branch managers\nFrom: Priya Raghunathan, Operations\nDate: 3 February\nSubject: Click-and-collect launch","x":"Our click-and-collect service goes live in every branch on 1 March. {{135}} Customers will order online and pick their parcels up from a dedicated counter near the entrance.\n\nEach branch will receive a shelving unit and a handheld scanner during the week of 17 February. Please make sure the counter area has been cleared {{136}} the delivery arrives, as the units are two metres wide.\n\nParcels {{137}} within four hours of an order being placed. Customers are sent a text message the moment their parcel is ready, so the four-hour window matters.\n\nA short training video will be circulated next week; please watch it with your team before 1 March. By the end of that month we expect that every branch {{138}} at least fifty collections a week."}],"qs":["MXC-T03-135","MXC-T03-136","MXC-T03-137","MXC-T03-138"]},{"id":"MXC-T03-P6-B3","p":6,"f":"MXT03","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"Nordhelm Pharmacy Services — Home Delivery\n\nRepeat prescriptions {{139}} are issued by any surgery in the Larkfield district can now be delivered to your door. Delivery is free on orders above $20 and costs $3.50 otherwise.\n\nTo register, create an account and enter the name of the surgery that holds your records. Once your details {{140}} by our team, you can request a delivery from your dashboard at any time.\n\nDeliveries run Monday to Saturday between 9 A.M. and 6 P.M. {{141}} Refrigerated items travel in insulated boxes and are handed over in person; they are never left with a neighbour.\n\nIf you will not be at home, you can {{142}} a delivery to the following day at no extra charge, provided you tell us before 8 P.M. the evening before."}],"qs":["MXC-T03-139","MXC-T03-140","MXC-T03-141","MXC-T03-142"]},{"id":"MXC-T03-P6-B4","p":6,"f":"MXT03","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All staff, Meridian Heights Medical Centre\nFrom: Facilities Office\nDate: 9 June\nSubject: Car park resurfacing, 22-26 June\n\nThe main staff car park {{143}} for five days from Monday 22 June while the surface is replaced.\n\nDuring that week, staff should use the overflow area behind the laundry building. {{144}} Spaces there are limited, so please share transport where you can.\n\nThe contractor will start work at 7 A.M. each day. Noise will be {{145}} noticeable in the ground-floor offices on the east side, and colleagues based there are welcome to work from Room 118 instead.\n\nWe apologise for the disruption. Anyone who needs a reserved space for mobility reasons should contact the facilities office by 15 June so that one can be {{146}}."}],"qs":["MXC-T03-143","MXC-T03-144","MXC-T03-145","MXC-T03-146"]},{"id":"MXC-T03-P7-S1","p":7,"f":"MXT03","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO ALL DEPARTMENT COORDINATORS\n\nCentral Supply window relocation — 11 to 22 May\n\nThe Central Supply collection window on Level 1 of the Kirkvale Health Centre will be closed from 11 to 22 May while the corridor floor is replaced. During this period, collections will be handled at the Loading Bay B counter, which is entered from the rear car park.\n\nStanding orders will continue to reach each ward on the usual schedule; only walk-in collections are affected. A coordinator who needs an item that is not on the standing order should telephone extension 4180 before 3:00 P.M. so that it can be brought to Loading Bay B the same afternoon. Requests received after 3:00 P.M. will be held until the following working day.\n\nIlona Bergqvist, Supply Services Manager"}],"qs":["MXC-T03-147","MXC-T03-148"]},{"id":"MXC-T03-P7-S2","p":7,"f":"MXT03","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Dariusz Wieczorek (8:42 A.M.)\nThe tile shipment for the Halverson lobby is at the gate. The driver's paperwork says 60 boxes, but our manifest says 48.\n\nPriya Raghunathan (8:45 A.M.)\n48 is what I ordered. The extra 12 must be the stair nosing that was meant to go to the Fenwick site.\n\nDariusz Wieczorek (8:47 A.M.)\nDo I send those back with him?\n\nPriya Raghunathan (8:49 A.M.)\nNo. Fenwick is twenty minutes away and their crew starts on Thursday. Sign for all 60 and I will take the twelve across in the van tomorrow.\n\nDariusz Wieczorek (8:51 A.M.)\nUnderstood. I will keep them on the pallet by the hoist so nobody opens them."}],"qs":["MXC-T03-149","MXC-T03-150"]},{"id":"MXC-T03-P7-S3","p":7,"f":"MXT03","k":"single","tt":"TX.JOB_POSTING","docs":[{"t":"TX.JOB_POSTING","h":"Job posting","x":"NORDHAVEN PHARMACEUTICALS\nCold Chain Logistics Coordinator — Vantaa distribution centre\n\nNordhaven Pharmaceuticals supplies temperature-sensitive products to hospital pharmacies in fourteen countries. We are seeking a Cold Chain Logistics Coordinator for our distribution centre in Vantaa.\n\nThe role: planning refrigerated shipments, monitoring temperature data loggers, and acting as the first point of contact for carriers when a consignment is delayed. The coordinator reports to the Distribution Manager and works alongside two schedulers.\n\nRequirements\n— Three years' experience in warehousing or freight forwarding\n— Working knowledge of temperature-controlled distribution\n— Fluent English; a second European language is an advantage\n— Willingness to be on call one weekend in five\n\nWe offer a salary from $52,000, subsidised canteen meals and thirty days of annual leave. A candidate who does not yet hold a certificate in good distribution practice will be enrolled in a funded course during the first year.\n\nSend a curriculum vitae and a covering letter naming two referees to careers@nordhavenpharma.example by 30 September. Interviews will be held in Vantaa in the second week of October; travel costs are reimbursed."}],"qs":["MXC-T03-151","MXC-T03-152","MXC-T03-153"]},{"id":"MXC-T03-P7-S4","p":7,"f":"MXT03","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Letter","x":"Vestbury Architects\n17 Calderwood Row\nPortmarrow\n\n12 June\n\nMs. Adaeze Okonkwo\nFacilities Director\nLarkfield Community Trust\n\nDear Ms. Okonkwo,\n\nThank you for sending the survey drawings for the annexe at Larkfield Hall. Our structural engineer has now reviewed them.\n\nThe drawings confirm that the north wall can carry the proposed second storey without additional piling, which removes the largest cost risk we identified in April. However, the survey stops at the boundary line, and the drainage run serving the annexe appears to continue beneath the neighbouring car park. Before we can complete the planning submission we will need written confirmation from the car park's owner that the run may stay where it is.\n\nI have therefore held the drawing package at stage C instead of taking it to stage D, so that we do not have to redraw the ground floor twice.\n\nCould you tell me by 26 June whether your legal team can obtain that confirmation? If it is likely to take more than a month, I would suggest submitting the annexe and the drainage works as two separate applications.\n\nYours sincerely,\n\nTomás Berenguer\nProject Architect"}],"qs":["MXC-T03-154","MXC-T03-155","MXC-T03-156"]},{"id":"MXC-T03-P7-S5","p":7,"f":"MXT03","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Retailers rethink the back of the store\n\nMARLOWE BAY — When Halvorsen & Reed refitted its department store on Ashgrove Street last year, the most expensive work was not on the sales floor at all. — [1] —. The chain spent nine months converting two levels of stockrooms into a parcel hub that now dispatches online orders for eleven of its shops.\n\nThe change reflects a shift across the sector. Customers who order online increasingly collect from a shop rather than wait at home, and a store that already holds stock sits closer to the customer than a warehouse beside a motorway. — [2] —.\n\nHalvorsen & Reed reports that orders collected in store rose by 34 percent last year, while home deliveries were flat. — [3] —. Two-thirds of the customers who came in to collect a parcel bought something else while they were there.\n\nNot every site can be converted. — [4] —. Older buildings often have lifts too small for pallet trolleys, and loading doors that open straight onto a pedestrian street.\n\nThe company intends to convert four more stores by March."}],"qs":["MXC-T03-157","MXC-T03-158","MXC-T03-159"]},{"id":"MXC-T03-P7-S6","p":7,"f":"MXT03","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Renata Cardoso (10:12)\nQuick one before the eleven o'clock meeting. The agency has confirmed two ward clerks for the June rota, not the three we asked for.\n\nKwame Boateng (10:14)\nWhich cover did we lose?\n\nRenata Cardoso (10:15)\nThe Tuesday and Thursday evenings on Level 4.\n\nIngrid Sollie (10:16)\nI can move Farida to evenings for June if we bring her weekend hours down. She asked for fewer weekends last month anyway.\n\nKwame Boateng (10:18)\nThat leaves the weekend gap, though. Level 4 cannot run a Saturday with one clerk.\n\nIngrid Sollie (10:19)\nAgreed. Could we go back to the agency once the June rota is published? They usually find people when the dates are fixed.\n\nRenata Cardoso (10:21)\nLet us do that. Kwame, can you publish the rota by Friday so Ingrid has something to send them?\n\nKwame Boateng (10:22)\nFriday is tight, but yes. I will mark the Saturday line as provisional."}],"qs":["MXC-T03-160","MXC-T03-161","MXC-T03-162"]},{"id":"MXC-T03-P7-S7","p":7,"f":"MXT03","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: g.lindqvist@webmail.example\nFrom: customercare@brightfoldhome.example\nDate: 3 October\nSubject: Your order 88-40217","x":"Dear Mr. Lindqvist,\n\nThank you for telling us that the Ainsley shelving unit delivered to you on 28 September arrived with a damaged side panel.\n\nWe have ordered a replacement panel rather than a complete second unit. The panel is the only part affected, it fits using the screws already supplied, and it will reach you far sooner than a whole unit would — 9 October rather than the end of the month. Illustrated instructions are packed with the panel.\n\nIf you would rather have a complete replacement or a refund, reply to this message before 6 October and we will arrange collection of the original unit instead. Nothing has to be returned if you accept the panel.\n\nBy way of apology we have added a $25 credit to your account. It is applied automatically at checkout and has no expiry date.\n\nKind regards,\n\nSelma Achterberg\nCustomer Care, Brightfold Home"}],"qs":["MXC-T03-163","MXC-T03-164","MXC-T03-165"]},{"id":"MXC-T03-P7-S8","p":7,"f":"MXT03","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"www.calderstone-supply.example/trade-account\n\nCALDERSTONE SUPPLY | Trade Account | Deliveries | Returns | Contact\n\nTRADE ACCOUNT\n\nA Calderstone trade account gives building contractors and architectural practices a single monthly invoice, tiered pricing and access to our specification library.\n\nOpening an account\nComplete the online form and upload one document confirming your business address. Accounts are normally approved within two working days. A credit limit of $5,000 applies for the first three months, after which it is reviewed against your payment record.\n\nPricing tiers\nBronze — standard trade prices, no minimum spend\nSilver — 6% below trade prices, from $30,000 a year\nGold — 11% below trade prices, from $90,000 a year, plus a named account manager\n\nDeliveries\nOrders placed before 2:00 P.M. are delivered the next working day at any address within 40 km of a branch. A site delivery requires a telephone number for the person receiving the load; our drivers will not leave materials unattended.\n\nReturns\nUnopened stock items may be returned within 28 days. Cut-to-size timber, paint mixed to order and special orders cannot be returned."}],"qs":["MXC-T03-166","MXC-T03-167","MXC-T03-168","MXC-T03-169"]},{"id":"MXC-T03-P7-S9","p":7,"f":"MXT03","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All staff, Weatherby Clinic administration building\nFrom: Oluwaseun Adeyemi, Operations\nDate: 7 February\nRe: Car park resurfacing\n\nThe staff car park will be resurfaced over three weekends beginning 21 February. One third of the spaces will be out of use each weekend, and the barrier at the north entrance will be removed for the whole of the works.\n\nBecause that barrier houses our permit readers, permits cannot be scanned between 21 February and 8 March. During those weeks, please display your permit on the dashboard where it can be read from outside the vehicle. Vehicles without a visible permit may be issued a notice by the contractor's marshals, and we are not able to cancel those notices on your behalf.\n\nSpaces in the visitor area remain reserved for visitors throughout. Anyone who normally arrives after 8:30 A.M. should consider the overflow area behind the laundry building, which will be open on weekdays for the duration of the works."}],"qs":["MXC-T03-170","MXC-T03-171"]},{"id":"MXC-T03-P7-S10","p":7,"f":"MXT03","k":"single","tt":"TX.SCHEDULE","docs":[{"t":"TX.SCHEDULE","h":"Schedule","x":"NORTHERN HEALTH PROCUREMENT FORUM\nDay 2 — Thursday 14 November\nBrandt Conference Centre, Halbrook\n\n08:30-09:00  Registration and coffee — Foyer\n09:00-09:45  Keynote: What ten years of shortage data tell us — Dr. Aneta Kowalczyk — Auditorium\n10:00-11:15  Workshop A: Writing a tender that suppliers can answer — Room 2 (limit 30)\n10:00-11:15  Workshop B: Cold chain audits in practice — Room 3 (limit 30)\n11:15-11:45  Break — Foyer\n11:45-12:45  Panel: Consolidating orders across four hospitals — Auditorium\n12:45-13:45  Lunch — Terrace Room\n13:45-15:00  Workshop C: Renewing a contract without retendering — Room 2 (limit 30)\n15:00-15:30  Break — Foyer\n15:30-16:30  Closing session and certificates — Auditorium\n\nNotes\nWorkshops A and B run at the same hour; a delegate may attend one of them. Places are allocated when you collect your badge at registration, so arrive early if you have a preference.\nThe Terrace Room is on Level 2 and is reached by the stairs beside Room 3; the lift serves Levels 1 and 3 only.\nSlides from every session will be posted on the forum website on 18 November."}],"qs":["MXC-T03-172","MXC-T03-173","MXC-T03-174","MXC-T03-175"]},{"id":"MXC-T03-P7-D1","p":7,"f":"MXT03","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.JOB_POSTING","h":"Job posting","x":"HALVORSEN REGIONAL HEALTH NETWORK\nPharmacy Supply Coordinator — Central Distribution Centre\n\nHalvorsen Regional Health Network supplies medicines and consumables to fourteen clinics across the region. We are seeking a coordinator to manage stock rotation and delivery scheduling at our central warehouse.\n\nResponsibilities\n- Plan the daily delivery runs to the fourteen clinic sites\n- Maintain cold-chain records for temperature-sensitive products\n- Reconcile the monthly stock count against the ordering system\n\nRequirements\n- Three years of experience in warehouse or supply-chain work\n- A recognised certificate in logistics or in pharmacy technology\n- Familiarity with cold-chain handling is an advantage\n\nThe post is full time, based on site, and carries a starting salary of $52,000.\n\nApplications close on 30 April. Send a letter of application and two references to Ingrid Solheim, Human Resources, at the address below. Interviews will be held during the first week of May."},{"t":"TX.LETTER","h":"Letter","x":"Ingrid Solheim\nHuman Resources\nHalvorsen Regional Health Network\n18 Kastanie Vej\n\n22 April\n\nDear Ms. Solheim,\n\nI am writing to apply for the post of Pharmacy Supply Coordinator advertised on your careers page.\n\nFor the past six years I have worked at Brannon Cold Storage, where I supervise a team of four in the refrigerated goods section. My daily work involves precisely the record-keeping your notice describes: every pallet entering or leaving our chilled units is logged against a temperature trace, and I prepare the monthly audit file for the inspectorate.\n\nI should be open about one gap. My certificate is in transport management rather than in either of the two fields you name, although I completed a forty-hour course in cold-chain handling last autumn.\n\nI can be reached on weekday evenings on 555-0142. I should add that I will be abroad until 12 May, but I would be glad to come in at any time after that date.\n\nYours sincerely,\n\nOlamide Bakare\n\nEnclosures: two references"}],"qs":["MXC-T03-176","MXC-T03-177","MXC-T03-178","MXC-T03-179","MXC-T03-180"]},{"id":"MXC-T03-P7-D2","p":7,"f":"MXT03","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO TENANTS — Westhaven Shopping Centre\n\nRefurbishment of the north atrium\n\nWork on the north atrium begins on Monday 3 June and is expected to finish by 26 July.\n\nWhile the work continues:\n\n- The north entrance and car park level B will be closed. Shoppers should be directed to the east entrance.\n- Deliveries to units 12 to 28 must be made through the service corridor behind unit 30, between 6:00 and 9:00 A.M. only.\n- The two passenger lifts in the atrium will be out of service. The goods lift remains available to tenants on request to the centre office.\n\nTenants whose trade is affected may apply for an adjustment to their June and July rent. Applications must reach the centre office by 14 June.\n\nQuestions: Farida Yusuf, Centre Manager, extension 210."},{"t":"TX.EMAIL","h":"To: f.yusuf@westhavencentre.example\nFrom: p.oyelaran@lantern-home.example\nDate: 6 June\nSubject: Unit 19 — deliveries and rent","x":"Dear Ms. Yusuf,\n\nWe run the homewares shop in unit 19, and two matters arise from your notice.\n\nFirst, deliveries. Our furniture supplier will only unload in the afternoon; his lorry is on another contract every morning until noon, and three deliveries are already booked for late June. Is there any prospect of an afternoon slot, or should I ask him to bring the load to the east entrance instead?\n\nSecond, we do intend to apply for the adjustment. Our unit faces the atrium and takes most of its custom from people arriving on the north side, so a fall in takings seems certain. Could you tell me what the application has to show? Last year's figures for the same weeks, presumably.\n\nOne more thing. We would need the goods lift for the furniture. Must a request be made for each delivery, or once for the whole period?\n\nRegards,\n\nPatience Oyelaran\nLantern Home"}],"qs":["MXC-T03-181","MXC-T03-182","MXC-T03-183","MXC-T03-184","MXC-T03-185"]},{"id":"MXC-T03-P7-T1","p":7,"f":"MXT03","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"KIRRA & POST — Returns and exchanges\n\nWe want you to be happy with everything you order from us.\n\nStandard items may be returned within 30 days of delivery for a full refund, provided they are unused and in their original packaging. Sale items may be exchanged but not refunded. Made-to-measure items cannot be returned unless they are faulty.\n\nHow to return an item\n1. Complete the returns form enclosed with your parcel.\n2. Attach the prepaid label printed on the reverse of the form.\n3. Hand the parcel in at any post office and keep your receipt.\n\nRefunds are issued to the original payment method within ten working days of the parcel reaching our warehouse in Coimbra. Exchanges are dispatched the next working day when the replacement is in stock.\n\nReturn postage is free on orders over $60. On smaller orders, $4.50 is deducted from the refund."},{"t":"TX.APP_FORM","h":"Form","x":"KIRRA & POST — RETURNS FORM\n\nOrder number: KP-48211\nCustomer: Marek Wiśniewski\nDate of delivery: 9 October\nDate posted back: 2 November\n\nItem returned: Linen table runner, 2 m, sand\nItem price: $38.00\nOrder total: $71.50\n\nReason for return (tick one)\n[ ] Wrong item sent\n[ ] Faulty\n[X] Not as expected\n[ ] Arrived late\n\nRefund or exchange\n[X] Refund   [ ] Exchange\n\nCustomer comments: The colour is far darker than it appeared on the website. The runner has not been used and the paper band is still around it.\n\nOffice use only: received at the Coimbra warehouse on 6 November."},{"t":"TX.EMAIL","h":"To: m.wisniewski@example.net\nFrom: help@kirraandpost.example\nDate: 8 November\nSubject: Order KP-48211","x":"Dear Mr. Wiśniewski,\n\nThank you for sending the table runner back to us. It reached Coimbra on 6 November, and our warehouse team has confirmed that it is unused and still in its packaging, so the return has been accepted in full.\n\nYour remark about the colour has gone to the studio that photographs our textiles. Sand and the darker shade beside it in the range have been confused by several customers this season, and both will be photographed again against a neutral background before the winter catalogue is printed.\n\nIf you would still like a runner for the table, the 2 m size is also made in chalk and in a pale grey. I can post you a fabric sample of either at no charge — simply reply with the shade you would like to see.\n\nWith thanks,\n\nHelena Brancusi\nCustomer Care"}],"qs":["MXC-T03-186","MXC-T03-187","MXC-T03-188","MXC-T03-189","MXC-T03-190"]},{"id":"MXC-T03-P7-T2","p":7,"f":"MXT03","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Timber returns to the city centre\n\nBy Delphine Arroyo\n\nUntil recently, an eight-storey office block in this country meant steel and concrete. That is changing. Nineteen buildings of five storeys or more framed in cross-laminated timber were completed nationally last year, against three in the year the material was first permitted at that height.\n\nDevelopers give two reasons. The panels arrive cut to size, so a floor can be assembled in days rather than in weeks, and a timber frame weighs roughly a fifth of a concrete one, which cuts the cost of foundations on soft ground.\n\nTenants appear to have noticed. Letting agents report that timber schemes are being taken up before completion at a rate the sector has not seen for a decade.\n\nNot everyone is persuaded. Insurers have been slow to price the risk, and several city authorities still ask for fire modelling beyond what the building code requires. “The engineering is settled,” says Ravi Mahadevan of the practice Norrland & Vale. “The paperwork is not.”"},{"t":"TX.APP_FORM","h":"Survey results","x":"NORRLAND & VALE — Tenant priorities survey, March\n\n412 responses from occupiers of commercial buildings completed within the last five years.\n\nWhich single factor most influenced your choice of building?\n\nNatural light and interior finish — 34%\nRent per square metre — 29%\nDistance from a transport hub — 21%\nEnvironmental credentials — 11%\nOther — 5%\n\nWould you pay a higher rent for a building with a timber structure?\n\nNo — 44%\nYes, up to 5% more — 38%\nYes, more than 5% more — 9%\nDon't know — 9%\n\nRespondents by sector: professional services 41%, technology 27%, public bodies 18%, retail and hospitality 14%."},{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: Design team, Studio 3\nFrom: Ravi Mahadevan\nDate: 2 April\nSubject: Kesselring Quay — structure\n\nThe client has asked us to price a timber frame for Kesselring Quay alongside the concrete option and to report by the end of the month.\n\nTwo things to keep in front of us. The site is reclaimed land, so anything that lightens the building helps us at foundation level, and that argument alone may carry the decision. And the letting agent means to market the upper floors well before completion, which last week's property supplement suggests is now realistic for schemes of this kind.\n\nI would not lean on the environmental case in the client presentation. Our own survey put that factor well down the list, behind light, rent and location, and the client's board is unlikely to think differently.\n\nGiselle, please pull the fire-modelling correspondence from the Harbour Lane job. We should assume the same authority will want it again.\n\nRavi"}],"qs":["MXC-T03-191","MXC-T03-192","MXC-T03-193","MXC-T03-194","MXC-T03-195"]},{"id":"MXC-T03-P7-T3","p":7,"f":"MXT03","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.AD","h":"Advertisement","x":"THERMALINE PACKAGING\nValidated shipping for temperature-sensitive goods\n\nOur reusable insulated shippers hold 2–8 °C for a documented period with no external power.\n\nTL-12 — 12 litres — 48 hours — $180 each\nTL-24 — 24 litres — 72 hours — $265 each\nTL-48 — 48 litres — 96 hours — $410 each\nTL-72 — 72 litres — 120 hours — $560 each\n\nEvery shipper leaves us with two sets of coolant packs and a validation certificate for your regulatory file.\n\nOrders of ten or more units of a single model take 8% off the unit price.\n\nDelivery is free on orders above $2,000; below that, a flat $95 applies. Replacement coolant packs cost $22 a set, and lids and gaskets are guaranteed for three years.\n\nOrder on 555-0186 or through your account manager. Quotations hold good for 30 days."},{"t":"TX.INVOICE","h":"Invoice","x":"THERMALINE PACKAGING — INVOICE 7742\n\nBill to: Marchetti Pharmacy Group, 40 Ostrowska Street\nInvoice date: 11 September\nPayment terms: 30 days from the invoice date\n\nQty   Item                              Unit price   Amount\n12    Shipper TL-24, 24 L, 72 hours     $243.80      $2,925.60\n4     Coolant pack set, spare           $22.00       $88.00\n      Delivery                                       $0.00\n\n                                        Total        $3,013.60\n\nUnit price reflects the volume rate. Shippers are reusable and need not be returned to us.\n\nQueries: accounts@thermaline.example"},{"t":"TX.EMAIL","h":"To: accounts@thermaline.example\nFrom: b.marchetti@marchettipharmacy.example\nDate: 24 September\nSubject: Invoice 7742, and a further order","x":"Dear colleagues,\n\nInvoice 7742 has been passed for payment and will be settled well before it falls due.\n\nTwo points, however.\n\nFirst, the twelve shippers arrived with one set of coolant packs each rather than two, and the delivery note lists only twelve sets. The four spare sets we ordered on top of the standard supply did arrive and are not in dispute. Please send the missing sets or credit us for them.\n\nSecond, we open a fourth branch in November and will need shippers for a run that goes out to the coast and back over four days. The 72-hour model cannot cover that, so we would like six units of the next size up. Am I right that six will not reach your threshold for the volume rate? If a larger quantity would change the price materially, I would rather know before the order goes in.\n\nKind regards,\n\nBianca Marchetti"}],"qs":["MXC-T03-196","MXC-T03-197","MXC-T03-198","MXC-T03-199","MXC-T03-200"]},{"id":"MXC-T04-P6-B1","p":6,"f":"MXT04","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All Helpdesk Staff\nFrom: Priya Raghunathan, Service Operations\nDate: 12 May\nSubject: Change to ticket triage\n\nFrom Monday 19 May, incoming tickets will no longer be assigned by hand. The routing engine will read each request and {{131}} it to the queue that matches the system being reported. Tickets the engine cannot classify will land in a general queue, which the duty lead checks twice a day.\n\nWe expect the change to {{132}} the first-response time for common requests, which currently wait an average of forty minutes. During the first fortnight, please make a note of any ticket that reaches the wrong queue. {{133}} The vendor has agreed to retrain the classifier at the end of June using everything we send.\n\nOne thing does not change: the {{134}} of a ticket is still decided by the agent who picks it up, not by the routing engine."}],"qs":["MXC-T04-131","MXC-T04-132","MXC-T04-133","MXC-T04-134"]},{"id":"MXC-T04-P6-B2","p":6,"f":"MXT04","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Members of the Vale Growers' Association\nFrom: Bendik Sørland, Field Services\nDate: 3 February\nSubject: Free soil testing — March round","x":"Our March round of free soil testing is now open to every member farm. {{135}} Sampling kits will be posted to the address we hold on file, so please check that yours is up to date.\n\nEach kit contains ten tubes, a probe and a prepaid return envelope. Take one sample from every hectare you intend to test, and {{136}} the tubes clearly with the name of the plot. Results take about twelve working days from the day the laboratory receives your package.\n\nThis year the report also {{137}} an estimate of organic matter, which a number of you asked for last season. There is no charge for the addition. Results are sent {{138}} e-mail only; we no longer post paper copies.\n\nTo register, reply to this message before 20 February."}],"qs":["MXC-T04-135","MXC-T04-136","MXC-T04-137","MXC-T04-138"]},{"id":"MXC-T04-P6-B3","p":6,"f":"MXT04","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Information","x":"MEMBERSHIP RENEWAL — WHAT HAPPENS NEXT\n\nThank you for renewing your membership of the Ardmore Institute of Applied Arts. Your new card will reach you within ten working days. {{139}} it does, the confirmation e-mail you received serves as proof of membership at the admissions desk.\n\nMembers enter all permanent galleries free of charge and receive two guest passes a year. The passes are valid on any day except the opening weekend of a {{140}} exhibition, when demand is at its highest.\n\nYour card also gives you fifteen percent off in the shop and the café. Places on the Thursday evening lecture series {{141}} to members a week before general booking opens, and the room seats sixty.\n\nIf your card has not arrived after ten working days, please write to members@ardmoreinstitute.example. {{142}} Replacement cards are issued free of charge."}],"qs":["MXC-T04-139","MXC-T04-140","MXC-T04-141","MXC-T04-142"]},{"id":"MXC-T04-P6-B4","p":6,"f":"MXT04","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE — SCHEDULED SYSTEM MAINTENANCE\n\nThe stock and ordering system will be unavailable from 22:00 on Friday 6 June until 06:00 on Saturday 7 June while the database is moved to new hardware. All twelve packhouses, including the two that joined the network in April, {{143}} affected.\n\nSupervisors should print the Saturday morning picking lists before they leave on Friday. {{144}} Orders taken by telephone during the outage must be written on the paper forms kept in each office and entered on Monday.\n\nWe have chosen this window because it is the {{145}} period of the week for order traffic. Even so, some of you will be working, and we are sorry for the inconvenience.\n\nQuestions about the move should go to Ingrid Halvorsen, {{146}} will monitor the migration overnight and can be reached on extension 4102."}],"qs":["MXC-T04-143","MXC-T04-144","MXC-T04-145","MXC-T04-146"]},{"id":"MXC-T04-P7-S1","p":7,"f":"MXT04","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Information","x":"HARVEST NOTE — Week 24\nIncluded with every Torvald Fields vegetable box\n\nThis week's box was packed on Tuesday morning at our sorting shed in Reddington and left the same afternoon. Everything in it was cut, pulled or picked within forty-eight hours of packing.\n\nIn the box: broad beans, red chard, spring onions, two heads of butter lettuce, 500 g of new potatoes and a bunch of flat-leaf parsley.\n\nA note on the potatoes. The wet spring pushed our own main crop back by roughly three weeks, so this week's potatoes come from Bendik Aasen's farm in the next valley, which sits on lighter soil and drained faster. They are grown to the same standard as ours and cost us slightly more; we have absorbed the difference rather than change your subscription price.\n\nRecipe cards are no longer printed. Every recipe we have ever sent out is at torvaldfields.example/kitchen, sorted by vegetable.\n\nQuestions about a delivery? Reply to the message that told you your box was on its way."}],"qs":["MXC-T04-147","MXC-T04-148"]},{"id":"MXC-T04-P7-S2","p":7,"f":"MXT04","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Priya Raghunathan (10:02) — The staging server is refusing every deploy this morning. Is anyone else seeing this?\n\nMarek Wozniak (10:04) — Yes. It started around 09:30. The build passes and then the upload step times out.\n\nPriya Raghunathan (10:05) — So it is not something we wrote.\n\nInes Ferreira (10:09) — It is not. Hosting rotated the storage credentials overnight and did not tell us. Our deploy key is dead.\n\nMarek Wozniak (10:10) — Can we generate a new one ourselves?\n\nInes Ferreira (10:12) — Only from the account owner's console, and that is Daniel, who is away until Thursday. I have opened a ticket and marked it urgent.\n\nPriya Raghunathan (10:13) — The client demonstration is at 14:00. I will run it from the build already on production and say nothing.\n\nInes Ferreira (10:14) — That works. Nothing in this week's changes affects what they asked to see."}],"qs":["MXC-T04-149","MXC-T04-150"]},{"id":"MXC-T04-P7-S3","p":7,"f":"MXT04","k":"single","tt":"TX.AD","docs":[{"t":"TX.AD","h":"Advertisement","x":"THE HALVERSEN GLASS COLLECTION — Members' Season\n\nThe Halversen reopens on 3 October after eleven months of building work, and membership for the new season is open now.\n\nIndividual — $85 a year\nHousehold (two adults and any children under 18) — $140 a year\nStudent and Under-26 — $35 a year\nPatron — $400 a year\n\nEvery membership includes unlimited entry to the permanent galleries, entry to all three ticketed exhibitions of the season, 15% off in the shop and café, and the quarterly journal by post. Patrons are additionally invited to the curator's preview evening before each exhibition opens and may bring one guest to it.\n\nThe permanent galleries are free to everyone on the first Sunday of each month; no membership is needed on those days.\n\nJoin before 20 September and your card will be posted to you in time for the reopening weekend. Cards for applications received after that date will be waiting at the front desk.\n\nhalversenglass.example/join"}],"qs":["MXC-T04-151","MXC-T04-152","MXC-T04-153"]},{"id":"MXC-T04-P7-S4","p":7,"f":"MXT04","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: r.oyelaran@ferrolinelogistics.example\nFrom: support@quillstack.example\nDate: 12 May\nSubject: Ticket 44-2087 — report exports","x":"Dear Ms. Oyelaran,\n\nThank you for your patience. Our engineers have reproduced the fault you described: on accounts holding more than 50,000 records, a scheduled export finishes normally but produces a file whose final column is empty.\n\nThe cause is a change we released on 6 May. A fix has been written and will go out with the 19 May release. Until then, exports started by hand from the Reports screen are unaffected, so please use that route for anything urgent.\n\nTwo of your scheduled exports ran on 8 and 11 May and contain the empty column. We have regenerated both and placed them in your account's Files area under the original names with “-corrected” added. Nothing has been deleted.\n\nBecause the fault was ours, your May invoice will be issued at half the usual amount. You do not need to request this.\n\nIf the corrected files do not open as expected, reply to this message and it will return to the same engineer.\n\nKind regards,\n\nSolveig Lindqvist\nCustomer Support, Quillstack"}],"qs":["MXC-T04-154","MXC-T04-155","MXC-T04-156"]},{"id":"MXC-T04-P7-S5","p":7,"f":"MXT04","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Sensors move into the greenhouse\nBy Adaeze Nwachukwu\n\nUntil recently the tomato growers of the Vale district judged their crop as their parents had: by hand, by eye, and by walking the rows twice a day. Since March, four of the district's largest producers have been running a system that does part of that walking for them.\n\nBuilt by a small firm in the regional capital, the system buries a probe every twenty metres and reports soil moisture, temperature and salinity to a screen in the packing shed. Growers set a range for each figure, and when a reading leaves that range a message is sent.\n\nThe saving is not in labour. Ola Bergström, who grows twelve hectares under glass, says his staff still walk the rows. What has changed is water. “We were irrigating on a schedule,” he said. “Now we irrigate when the soil asks for it. That has cut our use by about a fifth.”\n\nWhether smaller growers will follow is less certain. Installation runs to roughly $9,000 per hectare, and the district's co-operative has so far declined to subsidise it."}],"qs":["MXC-T04-157","MXC-T04-158","MXC-T04-159"]},{"id":"MXC-T04-P7-S6","p":7,"f":"MXT04","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Hana Okabe (08:41)\nThe crate with the Weiss panels is here, but the truck is at the loading bay on Mill Street, not the one on Carrow Lane.\n\nTobias Adeyemi (08:43)\nMill Street is the old bay. The lift there has been out since February.\n\nHana Okabe (08:44)\nThe driver says nobody told him. He has another drop at 10:30 and will not wait.\n\nTobias Adeyemi (08:46)\nThen he has to come round. It is four minutes' drive. I will meet him at Carrow Lane and sign for it myself.\n\nHana Okabe (08:47)\nI will tell him. Do you want the conservator there when it is opened?\n\nTobias Adeyemi (08:49)\nNot at the bay. Have it taken straight to Gallery 3 and she can look at it there. Nothing gets unwrapped in the corridor again."}],"qs":["MXC-T04-160","MXC-T04-161","MXC-T04-162"]},{"id":"MXC-T04-P7-S7","p":7,"f":"MXT04","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All shift supervisors, Line 2\nFrom: Ingrid Halvorsen, Plant Manager\nDate: 9 November\nSubject: Changeover procedure\n\nFrom Monday 16 November, Line 2 will run oat drinks on the early shift and almond drinks on the late shift. The two products cannot share equipment without a full wash, and the wash is what this memo is about.\n\nUntil now the outgoing shift has begun the wash and the incoming shift has finished it. That arrangement has twice produced a line signed off as clean when it was not. From Monday the wash belongs to a single shift from start to finish: the outgoing shift runs it, records the readings and signs the sheet before anyone from the next shift touches the line.\n\nThis adds thirty-five minutes to the end of each shift. The extra time is paid and has been agreed with the works council.\n\nSupervisors should collect the revised sheets from my office this week. The old sheets will be taken off the line on Friday."}],"qs":["MXC-T04-163","MXC-T04-164","MXC-T04-165"]},{"id":"MXC-T04-P7-S8","p":7,"f":"MXT04","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"halversenglass.example  ›  For professionals  ›  Object loans\n\nLoans from the collection\n\nThe Halversen lends objects from its permanent collection to museums, galleries and registered public archives. We do not lend to private collectors, to commercial premises, or for use as film or photographic props. — [1]\n\nRequests must reach the registrar at least nine months before the opening date of the exhibition. — [2] A request should name the objects by catalogue number, state the dates on which the objects would be away from us, and describe the case or mount in which each would be displayed.\n\nEvery request is assessed by a conservator before it goes to the loans committee, which meets in February, June and October. — [3] Glass that has been repaired, and anything still on its original wooden base, is rarely approved for travel.\n\nThere is no fee for the loan itself. — [4] The borrower pays for packing, transport, courier travel and insurance, all of which we arrange and invoice afterwards.\n\nEnquiries: registrar@halversenglass.example"}],"qs":["MXC-T04-166","MXC-T04-167","MXC-T04-168","MXC-T04-169"]},{"id":"MXC-T04-P7-S9","p":7,"f":"MXT04","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE — Building network, floors 3 to 6\nSaturday 22 February, 06:00 to 18:00\n\nThe wired and wireless networks on floors 3, 4, 5 and 6 will be switched off for the whole of Saturday while the building's switches are replaced. Floors 1 and 2 are unaffected.\n\nWhat this means on those floors:\n· No internet, no shared drives and no desk telephones\n· Door badges will still work; the badge system runs on its own circuit\n· Anything saved only to a shared drive will be unreachable until Sunday morning\n\nIf you plan to work on Saturday, book a desk on floor 2 through the usual room-booking page by Thursday. Fourteen desks are available and they are allocated in the order requests arrive.\n\nLaptops left in a dock on floors 3 to 6 on Friday evening should be unplugged and taken home; the docks will be powered down with everything else.\n\nFacilities will post a message in the building channel once the network is back."}],"qs":["MXC-T04-170","MXC-T04-171"]},{"id":"MXC-T04-P7-S10","p":7,"f":"MXT04","k":"single","tt":"TX.APP_FORM","docs":[{"t":"TX.APP_FORM","h":"Form","x":"NORDVIK PRESERVES — Goods Received and Inspection Record\nForm GR-14 · one per delivery · retain for three years\n\nSupplier: Almadén Orchards\nPurchase order: PO-7741\nProduct: Apricots, Class 1, for jam line\nDelivery date: 3 August          Time unloaded: 07:20\nQuantity ordered: 4,000 kg       Quantity delivered: 3,650 kg\nVehicle temperature on arrival: 4 °C (limit 6 °C)\n\nINSPECTION\nChecked by: Marisol Duarte, Quality Technician\nSample: 12 crates out of 146\nFindings: Fruit firm and within specification in 11 crates. One crate, marked 88, showed bruising on roughly a quarter of the fruit and has not been accepted.\n\nDECISION:  [ ] Accept in full    [X] Accept in part    [ ] Reject\n\nNotes: Crate 88 rejected and left on the vehicle. Shortfall of 350 kg confirmed with the supplier by telephone at 08:05; the balance will follow on 5 August at no extra carriage cost. Line 1 has enough fruit for today's run.\n\nCountersigned: T. Oyelowo, Shift Manager, 08:15"}],"qs":["MXC-T04-172","MXC-T04-173","MXC-T04-174","MXC-T04-175"]},{"id":"MXC-T04-P7-D1","p":7,"f":"MXT04","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.AD","h":"Advertisement","x":"FENNHORSE AGRI HIRE\nSeasonal machinery rental for the Wexbury Valley\n\nWeekly rates, delivery within 60 km of our yard included:\n\nCompact tractor (45 hp) — $310\nRound baler — $540\nGrain trailer (12 t) — $265\nSelf-propelled sprayer — $890\n\nRentals begin and end on a Monday. A trained operator can be supplied with any machine for an additional $180 per day.\n\nBookings placed before 1 April receive a 15 percent early-season reduction. Because demand peaks in July and August, we ask that harvest equipment be reserved at least three weeks ahead.\n\nDeliveries beyond the 60 km zone are charged at $2.40 per kilometre each way.\n\nCall 555 0148 or write to bookings@fennhorse.example. Our yard on Ledbury Road is open Tuesday to Saturday, 7 A.M. to 5 P.M."},{"t":"TX.EMAIL","h":"To: bookings@fennhorse.example\nFrom: p.adeyemi@brackenfield.example\nDate: 12 March\nSubject: Baler and trailer, week of 20 July","x":"Dear Fennhorse team,\n\nI manage a 180-hectare mixed farm at Brackenfield, roughly 75 km north of your yard. We took a grain trailer from you last summer and were very pleased with it.\n\nThis year I would like to book the round baler and the grain trailer for the week beginning 20 July. Neither of my two farmhands has handled a baler of that size, so I would like an operator to come with it for the first two days.\n\nTwo points I would be grateful for clarification on. First, I am writing this early partly to secure the reduction you advertise, and I would like it confirmed that a booking placed today qualifies. Second, our access track is narrow and turns sharply at the gate. Could someone come out and look at it before the delivery date, so that we are not discovering the problem with a lorry standing in the lane?\n\nKind regards,\n\nPriya Adeyemi\nBrackenfield Farm"}],"qs":["MXC-T04-176","MXC-T04-177","MXC-T04-178","MXC-T04-179","MXC-T04-180"]},{"id":"MXC-T04-P7-D2","p":7,"f":"MXT04","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Kestrel Bay Maritime Museum Reports Record Spring\n\nKESTREL BAY (18 May) — The Kestrel Bay Maritime Museum welcomed 41,600 visitors between February and April, its strongest spring since the building opened in 1998 and an increase of 26 percent on the same period last year.\n\nDirector Ingrid Solheim credits the rise to two changes. In January the museum began staying open until 9 P.M. on Fridays, and in March it withdrew its printed guide in favour of a free mobile application offering commentary in six languages.\n\n“The Friday evenings brought us an audience we had never reached — people who are at work all day,” Ms. Solheim said. “The application surprised us more. Nearly half of all visitors now use it.”\n\nThe museum will close its east wing on 1 September for eight months while the Whaling Gallery is rebuilt. The remaining galleries, the archive reading room and the café will stay open throughout the work."},{"t":"TX.CHAT","h":"Online chat discussion","x":"Ravi Chandrasekar (10:02 A.M.)\nHave you both seen the spring figures? Ingrid wants the evening opening extended to Thursdays as well, starting in October.\n\nMarta Oyelaran (10:04 A.M.)\nI saw them. October is exactly what worries me. The east wing goes on the first of September, so from then on we have about a third less to show, and I do not want people paying the full price for two thirds of a museum.\n\nRavi Chandrasekar (10:06 A.M.)\nFair. What if the evening ticket were reduced for as long as the work lasts?\n\nJonas Berglund (10:09 A.M.)\nThat would answer it, and we could send people to the reading room, which is empty every evening.\n\nMarta Oyelaran (10:11 A.M.)\nBetter still, the tour on the application. It runs ninety minutes and not one stop on it is in the wing that is closing.\n\nRavi Chandrasekar (10:13 A.M.)\nGood. Let me put something to Ingrid before Friday: two evenings a week, reduced admission until the wing opens again."}],"qs":["MXC-T04-181","MXC-T04-182","MXC-T04-183","MXC-T04-184","MXC-T04-185"]},{"id":"MXC-T04-P7-T1","p":7,"f":"MXT04","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"GRAINLEDGER — Traceability software for small food producers\n\nPlans are billed monthly, per site.\n\nSprout — $29 — up to 3 users; batch records; printable labels\nHarvest — $79 — up to 12 users; everything in Sprout; supplier register; barcode scanning\nEstate — $149 — unlimited users; everything in Harvest; single-file audit export; a named account manager\n\nEvery plan includes unlimited storage of batch photographs and a nightly backup, and your records can be exported as a spreadsheet at any time.\n\nBarcode scanning requires a handheld reader. We do not supply readers; compatible models are listed on our hardware page.\n\nSupport is by e-mail on Sprout and by telephone on the other two plans, Monday to Friday, 8 A.M. to 6 P.M.\n\nAny plan may be trialled free for thirty days, and no payment details are needed to begin a trial."},{"t":"TX.REVIEW","h":"Customer review","x":"Reviewed by Solomon Adeyinka, Vellowmoor Creamery — 3 stars out of 5\n\nWe make cheese at two sites and have run Grainledger for seven months. The batch records are excellent. An inspector arrived in April and asked for three years of history; I had it in front of him in about a minute.\n\nTwo frustrations. We moved up from the entry plan to the $79 one so that we could scan barcodes, and it took me a week to work out that the reader itself was not part of what I had bought. That is written down somewhere, but not anywhere a buyer is looking.\n\nThe second is the telephone line. Our packing runs finish at seven in the evening, which is precisely when things go wrong, and by then nobody answers. An hour of evening cover would be worth more to me than most of the features on the list."},{"t":"TX.REVIEW","h":"Response","x":"Response from Grainledger — Dagmara Wisniewska, Customer Success\n\nMr. Adeyinka, thank you for a review we could act on.\n\nYou are right about the reader. The list of compatible models has been moved onto the plan comparison itself, so it now sits beside the feature that needs it rather than three pages away, and the trial checklist names it as well.\n\nOn the telephone line: from 1 October it will stay open until 8 P.M. from Monday to Thursday. Your plan already includes telephone support, so nothing has to change on your account for you to use it.\n\nOne further thought on the inspection you describe. Customers on the plan above yours can produce that history as a single audit file rather than assembling it on screen. If inspections are becoming frequent at both sites, it may be worth a conversation."}],"qs":["MXC-T04-186","MXC-T04-187","MXC-T04-188","MXC-T04-189","MXC-T04-190"]},{"id":"MXC-T04-P7-T2","p":7,"f":"MXT04","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\nContact: Nadia Ferreira, Press Office, Ashgrove Gallery\npress@ashgrovegallery.example\n\nASHGROVE GALLERY TO HOST “PAPER AND SALT” THIS AUTUMN\n\nAshgrove Gallery has announced that Paper and Salt, a touring exhibition of nineteenth-century photographic prints assembled by the Lindqvist Institute, will open on 14 October and run until 11 January.\n\nThe exhibition brings together 190 salt prints, forty of which have never been shown outside the Institute's storerooms. Ashgrove is the tour's third and final venue.\n\nBecause salt prints fade in strong light, the galleries will be kept at low illumination and photography of any kind is prohibited throughout the exhibition.\n\nA programme of talks, demonstrations and guided viewings will accompany the opening week; the full schedule is available at the ticket desk and on our web page.\n\nTickets are $18, or $12 for members, and include entry to the permanent collection. Members may attend the preview evening on 13 October at no charge."},{"t":"TX.SCHEDULE","h":"Schedule","x":"PAPER AND SALT — Opening week programme, Ashgrove Gallery\n\nMonday 13 October, 6:30 P.M. — Preview evening (members only), Long Gallery\nTuesday 14 October, 11:00 A.M. — Curator's introduction with Dr. Henrik Lindqvist, Lecture Room B\nWednesday 15 October, 2:00 P.M. — Making a salt print: demonstration, Studio 1\nThursday 16 October, 6:00 P.M. — Handling and storing early photographs, Studio 1\nFriday 17 October, 11:00 A.M. — Guided viewing in British Sign Language, Long Gallery\nSaturday 18 October, 10:00 A.M. to 4:00 P.M. — Workshop: salt printing for beginners, Studio 2\n\nEvery event except the Saturday workshop is free to holders of an exhibition ticket. The workshop is $45, is limited to twelve places, and all materials are supplied. The studios are reached from the Marlow Street entrance, which is step-free."},{"t":"TX.EMAIL","h":"To: bookings@ashgrovegallery.example\nFrom: e.matsuura@northfieldcollege.example\nDate: 22 September\nSubject: Group visit during the opening week","x":"Dear Ms. Ferreira,\n\nI teach photography at Northfield College and would like to bring eleven students to Paper and Salt during its opening week. Our timetable puts us in the city on the Wednesday and the Thursday only, which rules out a good deal of your programme.\n\nThe students are preparing a unit on early processes, so the Wednesday afternoon demonstration is exactly what we need. I would also like to add the Saturday workshop for two of them if places remain; they can travel back for it on their own.\n\nThree things I need to know. Is the group rate the same as the member rate? One of my students uses a wheelchair, and I should like to confirm that she can reach the demonstration. And the students will want to record what they see, so please tell me whether cameras are permitted; if they are not, I will tell them what to bring instead.\n\nWith thanks,\n\nEmiko Matsuura"}],"qs":["MXC-T04-191","MXC-T04-192","MXC-T04-193","MXC-T04-194","MXC-T04-195"]},{"id":"MXC-T04-P7-T3","p":7,"f":"MXT04","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.JOB_POSTING","h":"Job posting","x":"Quality Engineer — Halvard Systems, Lindholm office\n\nHalvard Systems builds scheduling software for regional bus and rail operators. We are looking for a quality engineer to join the eleven-person platform team.\n\nWhat you would do\n- Write and maintain the automated tests for our timetable engine\n- Reproduce and document faults reported by operators\n- Sit with the release team one week in four and approve deployments\n\nWhat we ask for\n- Three years in software testing, at least one of them on a product with external customers\n- Confidence reading Python; you will not be asked to write new features\n- Working German, as our two largest customers correspond with us in it\n\nA background in transport, timetabling or ticketing is welcome but not required.\n\nWe work four days in the office and one from home. The salary range is $62,000 to $78,000.\n\nSend a CV and a short covering note to careers@halvardsystems.example by 30 April. Interviews are held in the first half of May."},{"t":"TX.EMAIL","h":"To: b.okonkwo@example.net\nFrom: l.haugen@halvardsystems.example\nDate: 6 May\nSubject: Your visit on 12 May","x":"Dear Ms. Okonkwo,\n\nThank you for making time to speak with me last week. We would like to invite you to the Lindholm office on Tuesday 12 May, and I attach the agenda for the day.\n\nTwo notes on it. The exercise after lunch is not a coding test. You will be handed a real fault report from one of our operators and asked how you would set about reproducing it, which is the work itself rather than a puzzle. There is nothing to prepare.\n\nYou will also meet Annika Sjoberg, who runs our release team. As the post carries one week in four with that team, she will want to hear how you have handled deployment approvals before.\n\nReception is on Marlow Street. Ask for me and I will come down for you.\n\nBest wishes,\n\nLars Haugen\nPeople Team"},{"t":"TX.SCHEDULE","h":"Agenda","x":"Interview day — B. Okonkwo, Tuesday 12 May\nLindholm office, meeting room 4B unless stated otherwise\n\n9:30 — Arrival and coffee, L. Haugen (People Team)\n10:00 — Platform team interview, T. Varga (head of platform)\n11:15 — Conversation in German, M. Kruger (Customer Accounts)\n12:00 — Lunch with the platform team, canteen, ground floor\n13:00 — Practical exercise, room 2A\n14:30 — Second interview, A. Sjoberg\n15:15 — Questions and close, L. Haugen\n\nPlease bring photo identification and hand it in at reception. The parking bays on Marlow Street are reserved for visitors holding a permit; a permit is issued at reception on request."}],"qs":["MXC-T04-196","MXC-T04-197","MXC-T04-198","MXC-T04-199","MXC-T04-200"]},{"id":"MXC-T05-P6-B1","p":6,"f":"MXT05","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Business Banking Clients\nFrom: Ingrid Halvorsen, Head of Client Operations\nDate: 12 October\nSubject: Uploading documents to Nordvik Direct","x":"From 1 November, statements and identity documents can be sent to us through Nordvik Direct, our online client portal. Papers posted to the branch will still be {{131}}, but they take up to ten working days to reach our verification team.\n\nUploading a file takes about a minute. Once a document has arrived, the portal {{132}} its status until the review is complete. {{133}} Most accounts are cleared within two working days.\n\nPlease note that scanned pages must be legible; blurred images are returned for resubmission. If you are unsure whether a document meets the standard, our client desk will {{134}} it with you first.\n\nThank you for banking with Nordvik."}],"qs":["MXC-T05-131","MXC-T05-132","MXC-T05-133","MXC-T05-134"]},{"id":"MXC-T05-P6-B2","p":6,"f":"MXT05","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Policy","x":"VESTRA ENERGY — PLANNED OUTAGE NOTIFICATION POLICY\n\nVestra Energy carries out scheduled maintenance on the distribution network throughout the year. {{135}} This policy sets out how and when the households affected are informed.\n\nWritten notice is posted to every property on the affected circuit at least fourteen days {{136}} the work begins. The notice states the date, the expected start and finish times, and a reference number for enquiries.\n\nCustomers who have registered a mobile number also receive a text message on the previous evening. Registration is free and {{137}} be completed at any time through the customer portal.\n\nIf a planned outage is cancelled or moved to another date, a second notice is issued. Where the change is made less than 48 hours in advance, customers are contacted {{138}} by telephone."}],"qs":["MXC-T05-135","MXC-T05-136","MXC-T05-137","MXC-T05-138"]},{"id":"MXC-T05-P6-B3","p":6,"f":"MXT05","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Letter","x":"Kestrel Travel Management\n41 Rue des Ateliers, Brussels\n\n18 February\n\nMs. Paulina Rzepka\nProcurement Manager\nHalberd Instruments\n\nDear Ms. Rzepka,\n\nThank you for asking us to review your company's travel arrangements for the coming year. Our analysts {{139}} your booking records, and I am pleased to enclose a summary of what they found.\n\nTwo figures stand out. First, more than a third of your flights are booked within seven days of departure, {{140}} raises the average fare by roughly €180 per journey. Second, your teams stayed in eleven different hotel chains in Frankfurt alone.\n\nBoth figures can be improved without restricting where your staff stay. {{141}}, we would suggest a preferred-hotel list of four properties and an internal booking deadline of fourteen days.\n\nI will telephone you next week to arrange a meeting. {{142}}\n\nYours sincerely,\n\nBruno Okonkwo\nClient Director"}],"qs":["MXC-T05-139","MXC-T05-140","MXC-T05-141","MXC-T05-142"]},{"id":"MXC-T05-P6-B4","p":6,"f":"MXT05","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Coastal Railway Draws Record Summer Traffic\n\nPORTHAVEN — The narrow-gauge line linking Porthaven to the cliff villages of the northern coast carried 214,000 passengers between May and September, its highest figure {{143}} the railway reopened in 2011.\n\nOperators credit a combined ticket, sold together with entry to the maritime museum, for much of the rise. {{144}} It now accounts for nearly a quarter of all summer journeys.\n\nThe increase has not pleased everyone. Residents of Aldmere, the smallest village on the route, report that the single car park fills by nine in the morning. The regional tourism board says it is {{145}} the possibility of a shuttle bus from a field outside the village.\n\nA decision is expected before the timetable for next season {{146}} in January."}],"qs":["MXC-T05-143","MXC-T05-144","MXC-T05-145","MXC-T05-146"]},{"id":"MXC-T05-P7-S1","p":7,"f":"MXT05","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO ALL TENANTS — Nordvik Business Centre\n\nPlanned electrical maintenance\nSaturday 18 April, 06:00-14:00\n\nThe building's main switchgear will be replaced on Saturday 18 April. Power to floors 1 through 9 will be interrupted for the whole of the eight-hour window. Lifts, air conditioning and card readers will not operate during this time.\n\nThe server rooms on floor 4 will remain on the backup supply. Tenants who keep equipment anywhere else in the building are asked to shut it down before leaving on Friday 17 April.\n\nStairwell lighting will stay on. The loading bay entrance will be locked for the duration of the work; use the Ravnsgate door and sign in with the duty engineer.\n\nQuestions: facilities@nordvikcentre.example or extension 4180."}],"qs":["MXC-T05-147","MXC-T05-148"]},{"id":"MXC-T05-P7-S2","p":7,"f":"MXT05","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Aleksandra Wójcik (10:12)\nAre you still at the Hallberg office? The audit files we sent on Tuesday have come back to us unsigned.\n\nDaniel Okonjo (10:14)\nJust left the car park. I can turn around if it is urgent.\n\nAleksandra Wójcik (10:15)\nNot urgent exactly, but the filing deadline is Friday and Ms. Hallberg travels on Thursday morning.\n\nDaniel Okonjo (10:17)\nThen it is urgent. Going back now. Do you need anything else from her, or is it only the signature?\n\nAleksandra Wójcik (10:19)\nOnly the signature, on pages 3 and 11. I will e-mail those two pages to their front desk so they can print them for you.\n\nDaniel Okonjo (10:21)\nAsk them for two sets. I would like to leave a signed copy with her.\n\nAleksandra Wójcik (10:22)\nDone. I am copying you in as well, in case the desk is unattended when you arrive."}],"qs":["MXC-T05-149","MXC-T05-150"]},{"id":"MXC-T05-P7-S3","p":7,"f":"MXT05","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\nVantorp Energi to supply district heating to Kallsund industrial park\n\nVANTORP, 6 May — Vantorp Energi announced today that it has been selected to build and operate a district heating network for the Kallsund industrial park, serving eighteen manufacturing and logistics tenants from the winter of next year.\n\nThe network will draw its heat from the aluminium works on the northern edge of the park, which currently discharges cooling water into the harbour at around 70°C. Vantorp Energi estimates that recovering that water will meet roughly 60 percent of the park's annual heating demand and cut the park's gas purchases by €2.4 million a year.\n\n“The heat is already being produced,” said Ingrid Solheim, the company's chief operating officer. “Our contribution is a pipe network and a set of pumps. What makes the project unusual is that eighteen competing tenants agreed to sign a single shared supply contract.”\n\nConstruction begins in September. An information evening for park tenants will be held on 28 May at the Kallsund conference centre."}],"qs":["MXC-T05-151","MXC-T05-152","MXC-T05-153"]},{"id":"MXC-T05-P7-S4","p":7,"f":"MXT05","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Letter","x":"Meridian Mutual Insurance\n14 Rua das Amoreiras, Lisbon\n\n11 February\n\nMs. Chiaki Morimoto\nAparthotel Rosa dos Ventos\nSetúbal\n\nDear Ms. Morimoto,\n\nYour commercial property policy, number CP-40915, renews on 1 April. The premium for the coming year is €3,180, an increase of €95 on the expiring policy.\n\nTwo terms have changed. The flood exclusion that applied to your ground-floor storage rooms has been removed, following the drainage works you reported to us in October. In addition, the excess payable on glass claims has risen from €250 to €400.\n\nYou need do nothing to renew. Payment will be taken from the account we hold on file on 25 March unless you instruct us otherwise before that date.\n\nIf the use or occupancy of the building has changed in the past twelve months, please telephone us on 21 447 0090 before renewal so that the cover can be adjusted.\n\nYours sincerely,\n\nBartosz Lewandowski\nRenewals Team"}],"qs":["MXC-T05-154","MXC-T05-155","MXC-T05-156"]},{"id":"MXC-T05-P7-S5","p":7,"f":"MXT05","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"Slow trains, full carriages\n\nOvernight rail travel across the continent, written off a decade ago as a relic, carried 4.1 million passengers last year — the highest figure since 2004. Three operators have added routes in the past eighteen months, and a fourth has ordered sleeping cars for delivery in 2028.\n\nThe revival is not driven by price. A berth from Kraków to Trieste costs €149 return, roughly twice the cheapest flight on the same day. Operators say their passengers are buying something else: a night that does not have to be spent in a hotel, and an arrival in the centre of the city that needs no onward transfer.\n\nLoad factors tell the story. On the Kraków-Trieste service, single-occupancy cabins sell out first and are typically booked eleven weeks ahead, while the ordinary seated carriages on the same train run at 62 percent.\n\nThe constraint is rolling stock. A sleeping car takes four years to build, and only two manufacturers on the continent still make them."}],"qs":["MXC-T05-157","MXC-T05-158","MXC-T05-159"]},{"id":"MXC-T05-P7-S6","p":7,"f":"MXT05","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Priya Ramanathan (09:02)\nMorning, both. The card-issuing system goes read-only at 18:00 tonight for the migration. Anything outstanding on your side?\n\nMarek Zieliński (09:04)\nFourteen replacement cards sitting in the queue. I can clear them by lunchtime.\n\nAdaeze Nwosu (09:05)\nBranch staff have not been told that the ordering screen disappears tonight. I only found out from the release note yesterday afternoon.\n\nPriya Ramanathan (09:06)\nThat is my fault — I assumed operations had circulated it. Adaeze, could you send something to the branch network this morning?\n\nAdaeze Nwosu (09:08)\nYes. What do they do between tonight and Monday?\n\nPriya Ramanathan (09:10)\nPaper form BR-12, faxed to us, and we key it in on Monday. The same arrangement as the last migration.\n\nMarek Zieliński (09:11)\nThere is a stock of BR-12 in every branch safe. Half of them will not know it is there.\n\nAdaeze Nwosu (09:12)\nThen I will say so explicitly. Draft with you both by 10:30."}],"qs":["MXC-T05-160","MXC-T05-161","MXC-T05-162"]},{"id":"MXC-T05-P7-S7","p":7,"f":"MXT05","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: h.bergstrom@lindqvistpartners.example\nFrom: tours@aurorapaths.example\nDate: 9 October\nSubject: Change to your 3 November departure — Fjord & Highland, 6 nights","x":"Dear Mr. Bergström,\n\nThe ferry operator has withdrawn the Wednesday afternoon crossing to Sørvik for the remainder of the season. Your group's itinerary uses that crossing on day four, so we have rebuilt the second half of the tour.\n\nIn place of the ferry, the coach will follow the coast road to Sørvik. The drive adds ninety minutes to the day but passes the Rennedal viewpoint, where we will stop for lunch. Nothing else changes: the same hotel, the same guide and the same return flight.\n\nBecause the coach route costs us less than the ferry, we are refunding €40 per traveller. The refund will reach the card used for the booking within ten working days; you do not need to request it.\n\nPlease confirm by 20 October that the revised day four is acceptable to your group. If it is not, we can move the whole departure to 17 November at no charge.\n\nKind regards,\n\nSolveig Marstrand\nAurora Paths"}],"qs":["MXC-T05-163","MXC-T05-164","MXC-T05-165"]},{"id":"MXC-T05-P7-S8","p":7,"f":"MXT05","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"www.halvorsen-adeyemi.example/about\n\nAbout Halvorsen & Adeyemi\n\nHalvorsen & Adeyemi advises industrial clients on energy procurement and metering. — [1] — The firm began in 2009 as a two-person practice above a bakery in Trondheim, with a single client: a fish-processing plant that could not explain its own electricity bill.\n\nWe now employ forty-one people across three offices and audit roughly €90 million of annual energy spend on behalf of our clients. — [2] — Our work is deliberately narrow. We do not sell equipment, we do not install anything, and we take no commission from suppliers. Our only revenue is the fee our clients pay us.\n\nThat independence occasionally costs us work. — [3] — A client who wants one firm to audit, specify and install is better served elsewhere, and we say so at the first meeting.\n\nEvery engagement begins with a fortnight of meter data and one uncomfortable question: what are you paying for that you are not using? On average, the answer is eleven percent of the bill. — [4] —\n\nOffices: Trondheim · Gdańsk · Lagos"}],"qs":["MXC-T05-166","MXC-T05-167","MXC-T05-168","MXC-T05-169"]},{"id":"MXC-T05-P7-S9","p":7,"f":"MXT05","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All holders of a corporate card\nFrom: Renata Duarte, Head of Finance\nDate: 22 January\nSubject: New card provider from 1 March\n\nOur corporate card programme moves to a new provider on 1 March. Your current card will stop working at midnight on 28 February; please destroy it rather than returning it to this office.\n\nReplacement cards will be posted to your home address during the week of 16 February and will arrive unactivated. Activate yours by calling the number on the sticker, from the telephone number we hold for you in the staff directory. If that number is out of date, correct your entry before 9 February.\n\nClaims for January and February must be submitted under the old system by 5 March. Anything submitted after that date has to be re-entered by hand, which delays reimbursement by about three weeks.\n\nSpending limits and approval routes are unchanged."}],"qs":["MXC-T05-170","MXC-T05-171"]},{"id":"MXC-T05-P7-S10","p":7,"f":"MXT05","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Policy","x":"KESTREL HOUSE HOTELS — Cancellation and amendment policy\nApplies to all direct bookings made on or after 1 June\n\nFlexible rate\nCancel or amend free of charge up to 18:00 on the day before arrival. After that time, one night is charged.\n\nSaver rate\nNon-refundable; the full stay is charged at the time of booking. Dates may be moved once, to any date within six months, for a fee of €25 per room.\n\nGroup bookings (five rooms or more)\nCancel up to 21 days before arrival at no cost. Between 20 and 8 days before arrival, half the value of the booking is charged. Within 7 days, the full value is charged. The number of rooms may be reduced by up to 20 percent at any time before the 21-day point without penalty.\n\nAmendments must be made through the hotel holding the booking, not through central reservations. Bookings made through a travel agent or an online platform are governed by that partner's terms rather than by this policy.\n\nGuests who do not arrive and have not cancelled are charged under the rules of their rate."}],"qs":["MXC-T05-172","MXC-T05-173","MXC-T05-174","MXC-T05-175"]},{"id":"MXC-T05-P7-D1","p":7,"f":"MXT05","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO ALL TENANTS — RIVERGATE BUSINESS PARK\n\nHalvorsen Power will replace the two ageing substations that serve the park. Each building will lose mains electricity for one working day, as follows:\n\nBuilding A — Tuesday 3 March, 07:00-17:00\nBuilding B — Wednesday 4 March, 07:00-17:00\nBuilding C — Thursday 5 March, 07:00-17:00\nBuilding D — Friday 6 March, 07:00-17:00\n\nEmergency lighting, fire alarms and door entry systems will run on battery throughout. Lifts will be out of service; the stairwells remain open.\n\nTenants who cannot suspend operations for a day may hire a portable generator through the site office. The charge is €340 per building for the day, and requests must reach us at least ten working days before the interruption.\n\nPlease note that our standard tenancy agreement does not provide compensation for planned interr
