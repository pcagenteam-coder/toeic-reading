CLE","TX.ARTICLE","FD.READ.REFERENCE","FD.READ.DISCOURSE","VO.SCENE.RETAIL_SHOPPING"],"s":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong?\n\n“The limits are usually set by the building rather than by the budget.”","o":["[1]","[2]","[3]","[4]"],"a":3,"e":"It follows “Not every site can be converted” and introduces the physical obstacles listed next — small lifts and doors onto a pedestrian street.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S5"},{"id":"MXC-T03-160","p":7,"f":"MXT03","q":160,"n":"QT.P7.DETAIL","ns":["TX.CHAT","FD.READ.SCAN","VO.SCENE.MEDIA_PUBLISH"],"s":"What problem are the writers discussing?","o":["Two clerks have resigned without giving notice.","Fewer agency staff than requested are available.","Level 4 will be closed on Tuesday evenings.","The June rota was published later than promised."],"a":1,"e":"“The agency has confirmed two ward clerks […] not the three we asked for.” The rota has not been published yet, so it cannot be late.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S6"},{"id":"MXC-T03-161","p":7,"f":"MXT03","q":161,"n":"QT.P7.DETAIL","ns":["TX.CHAT","FD.READ.SCAN","VO.SCENE.MEDIA_PUBLISH"],"s":"What does Ms. Sollie propose doing about Farida?","o":["Moving her from weekend shifts to evening shifts","Asking her to take on extra Saturdays","Transferring her to a different level","Offering her a permanent contract"],"a":0,"e":"“I can move Farida to evenings for June if we bring her weekend hours down.” The extra Saturdays are the gap this creates, not something Farida is asked to fill.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S6"},{"id":"MXC-T03-162","p":7,"f":"MXT03","q":162,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.CHAT","TX.CHAT","FD.READ.DISCOURSE","VO.SCENE.MEDIA_PUBLISH"],"s":"At 10:22, what does Mr. Boateng most likely mean when he writes, “Friday is tight, but yes”?","o":["He believes the deadline has already passed.","He would prefer someone else to publish the rota.","He thinks the Saturday shift should be cancelled.","He will meet the deadline even though it is difficult."],"a":3,"e":"“Tight” concedes that the date is demanding and “but yes” accepts the request; he then explains how he will handle the unresolved Saturday.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S6"},{"id":"MXC-T03-163","p":7,"f":"MXT03","q":163,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.EMAIL","TX.EMAIL","FD.READ.SKIM","VO.SCENE.CUSTOMER_SERVICE"],"s":"What is the main purpose of the e-mail?","o":["To confirm that an order has been dispatched","To request photographs of a damaged item","To explain how a customer's complaint will be settled","To announce a change to the company's returns policy"],"a":2,"e":"The message sets out the remedy for the damaged panel, the alternatives open to Mr. Lindqvist and the compensation offered. The damage has already been reported, so no photographs are asked for.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S7"},{"id":"MXC-T03-164","p":7,"f":"MXT03","q":164,"n":"QT.P7.REASON","ns":["TX.EMAIL","VO.PARA.CAUSE_EFFECT","VO.SCENE.CUSTOMER_SERVICE"],"s":"Why is a replacement panel being sent instead of a complete unit?","o":["The complete unit is no longer manufactured.","The panel will arrive considerably earlier.","Mr. Lindqvist asked for the panel only.","Returning the unit would cost Mr. Lindqvist money."],"a":1,"e":"“it will reach you far sooner than a whole unit would — 9 October rather than the end of the month”. A complete replacement is still available if he prefers it, so the unit is clearly still made.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S7"},{"id":"MXC-T03-165","p":7,"f":"MXT03","q":165,"n":"QT.P7.INFERENCE","ns":["QT.P7X.INFERENCE.EMAIL","TX.EMAIL","VO.PARA.GENERALIZE","VO.SCENE.CUSTOMER_SERVICE"],"s":"What is suggested about the $25 credit?","o":["It can be used on a purchase at any time in the future.","It must be claimed before 6 October.","It will be sent as a paper voucher by post.","It covers the full price of the shelving unit."],"a":0,"e":"It is already on the account, “applied automatically at checkout and has no expiry date”, so there is no deadline. The 6 October date belongs to the refund option, not to the credit.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S7"},{"id":"MXC-T03-166","p":7,"f":"MXT03","q":166,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"What must be provided when an account is opened?","o":["A deposit of $5,000","References from three suppliers","A signed schedule of planned deliveries","A document confirming the business address"],"a":3,"e":"“upload one document confirming your business address”. The $5,000 figure is the initial credit limit, not a payment.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S8"},{"id":"MXC-T03-167","p":7,"f":"MXT03","q":167,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"What is available only at the Gold tier?","o":["A single monthly invoice","Next-working-day delivery","A named account manager","Access to the specification library"],"a":2,"e":"The account manager is listed under Gold alone; the invoice and the specification library come with any trade account, and next-day delivery depends on the 2:00 P.M. cut-off rather than on the tier.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S8"},{"id":"MXC-T03-168","p":7,"f":"MXT03","q":168,"n":"QT.P7.NOT_TRUE","ns":["TX.WEB","ST.ELIM.OPTIONS","VO.SCENE.ORDER_SHIP"],"s":"Which item may NOT be returned?","o":["An unopened box of screws bought last week","A tin of paint mixed to a customer's colour","An unopened stock door delivered ten days ago","An unopened roll of insulation bought three weeks ago"],"a":1,"e":"“paint mixed to order […] cannot be returned”. The other three are unopened stock items still inside the 28-day window.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S8"},{"id":"MXC-T03-169","p":7,"f":"MXT03","q":169,"n":"QT.P7.INFERENCE","ns":["TX.WEB","VO.PARA.GENERALIZE","VO.SCENE.ORDER_SHIP"],"s":"What is suggested about a contractor who spends $40,000 a year with Calderstone Supply?","o":["The account will be closed at the end of the year.","No credit limit will be applied to the account.","Delivery beyond 40 km will be free of charge.","Prices will be 6% below standard trade prices."],"a":3,"e":"$40,000 passes the $30,000 threshold for Silver but not the $90,000 threshold for Gold, so the Silver discount of 6% applies.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S8"},{"id":"MXC-T03-170","p":7,"f":"MXT03","q":170,"n":"QT.P7.REQUEST_ACTION","ns":["QT.P7X.REQUEST_ACTION.MEMO","TX.MEMO","FD.READ.SCAN"],"s":"What are staff asked to do while the work is under way?","o":["Place their permits where they can be seen","Register their vehicles with the contractor","Use the visitor area at weekends","Arrive before 8:30 A.M."],"a":0,"e":"With the readers removed, “please display your permit on the dashboard where it can be read from outside the vehicle”. The visitor area stays reserved for visitors throughout.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S9"},{"id":"MXC-T03-171","p":7,"f":"MXT03","q":171,"n":"QT.P7.TRUE_INDICATED","ns":["TX.MEMO","VO.PARA.WORD_SYNONYM"],"s":"What is indicated about notices issued by the marshals?","o":["They will be forwarded to the operations department.","They apply at weekends only.","The clinic will not withdraw them.","They can be paid at the north entrance."],"a":2,"e":"“we are not able to cancel those notices on your behalf”. The scanning problem runs from 21 February to 8 March, weekdays included, so the notices are not limited to weekends.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S9"},{"id":"MXC-T03-172","p":7,"f":"MXT03","q":172,"n":"QT.P7.REQUEST_ACTION","ns":["TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.FINANCE_ACCOUNT"],"s":"What are delegates advised to do in order to obtain a place in a particular workshop?","o":["Book online before the forum begins","Speak to the workshop leader beforehand","Pay an additional registration fee","Arrive early to collect their badge"],"a":3,"e":"“Places are allocated when you collect your badge at registration, so arrive early if you have a preference.”","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S10"},{"id":"MXC-T03-173","p":7,"f":"MXT03","q":173,"n":"QT.P7.INFERENCE","ns":["TX.SCHEDULE","VO.PARA.GENERALIZE","VO.SCENE.FINANCE_ACCOUNT"],"s":"How many workshops can one delegate attend on 14 November?","o":["One","Two","Three","Four"],"a":1,"e":"A and B clash, so only one of them can be attended, and Workshop C is in the afternoon — two in all.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S10"},{"id":"MXC-T03-174","p":7,"f":"MXT03","q":174,"n":"QT.P7.INFERENCE","ns":["TX.SCHEDULE","VO.PARA.GENERALIZE","VO.SCENE.FINANCE_ACCOUNT"],"s":"What is suggested about the Terrace Room?","o":["It is used both for lunch and for the closing session.","It holds no more than thirty people.","It cannot be reached by lift.","It is next to the Auditorium."],"a":2,"e":"The room is on Level 2 and the lift “serves Levels 1 and 3 only”, so the stairs beside Room 3 are the way in. The limit of thirty applies to the workshops.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S10"},{"id":"MXC-T03-175","p":7,"f":"MXT03","q":175,"n":"QT.P7.DETAIL","ns":["TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.FINANCE_ACCOUNT"],"s":"What will happen on 18 November?","o":["Presentation materials will be made available online.","Certificates will be posted to delegates.","A third day of the forum will be held.","Tender documents will be published."],"a":0,"e":"“Slides from every session will be posted on the forum website on 18 November.” Certificates are handed out at the closing session on 14 November.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S10"},{"id":"MXC-T03-176","p":7,"f":"MXT03","q":176,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.JOB_POSTING","TX.LETTER","FD.READ.SKIM","VO.SCENE.HEALTH_MEDICAL"],"s":"Why did Mr. Bakare write the letter?","o":["To request details of a training course","To apply for an advertised position","To confirm the date of an interview","To recommend a colleague for a post"],"a":1,"e":"“I am writing to apply for the post of Pharmacy Supply Coordinator advertised on your careers page.” The course he mentions is one he has already completed, not one he is asking about.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D1"},{"id":"MXC-T03-177","p":7,"f":"MXT03","q":177,"n":"QT.P7.INFER_WHO","ns":["TX.DOUBLE","TX.JOB_POSTING","TX.LETTER","VO.PARA.ROLE_REFERENCE","VO.SCENE.HEALTH_MEDICAL"],"s":"According to the job posting, what is one duty of the position?","o":["Arranging the daily deliveries to clinic sites","Interviewing candidates for warehouse roles","Preparing the network's annual budget","Training clinical staff to use the ordering system"],"a":0,"e":"The first responsibility listed is to “Plan the daily delivery runs to the fourteen clinic sites”. The ordering system appears only in connection with the monthly stock count, not with training.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D1"},{"id":"MXC-T03-178","p":7,"f":"MXT03","q":178,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.JOB_POSTING","TX.LETTER","FD.READ.SCAN","VO.SCENE.HEALTH_MEDICAL"],"s":"Which of the network's requirements does Mr. Bakare fail to meet?","o":["The number of years of experience","The field in which his certificate was awarded","Familiarity with cold-chain handling","The supply of two references"],"a":1,"e":"The posting asks for a certificate in logistics or pharmacy technology; his is in transport management. His six years, his cold-chain course and the two enclosed references all satisfy the notice.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D1"},{"id":"MXC-T03-179","p":7,"f":"MXT03","q":179,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.INFERENCE","TX.DOUBLE","TX.JOB_POSTING","TX.LETTER","VO.PARA.GENERALIZE","VO.SCENE.HEALTH_MEDICAL"],"s":"What difficulty does Mr. Bakare's travel create?","o":["He cannot apply before the closing date.","He will miss the monthly audit at his current employer.","His references may not reach the network in time.","He will be away when the interviews take place."],"a":3,"e":"Interviews are held in the first week of May and he is abroad until 12 May. His letter is dated 22 April, comfortably inside the 30 April closing date.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D1"},{"id":"MXC-T03-180","p":7,"f":"MXT03","q":180,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.JOB_POSTING","TX.LETTER","FD.READ.SCAN","VO.SCENE.HEALTH_MEDICAL"],"s":"What does Mr. Bakare send with his letter?","o":["A copy of his certificate","A sample temperature record","Two references","A list of his previous employers"],"a":2,"e":"The letter closes “Enclosures: two references”, which is what the posting asks applicants to provide. His certificate and his temperature logs are described but not enclosed.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D1"},{"id":"MXC-T03-181","p":7,"f":"MXT03","q":181,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SKIM","VO.SCENE.RETAIL_SHOPPING"],"s":"What is the purpose of the notice?","o":["To explain how building work will affect tenants","To announce the appointment of a centre manager","To advertise retail units that have become vacant","To remind tenants that their rent is overdue"],"a":0,"e":"Every item on the notice sets out a consequence of the atrium refurbishment for the people trading in the centre. Rent is mentioned only as something tenants may ask to have reduced.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D2"},{"id":"MXC-T03-182","p":7,"f":"MXT03","q":182,"n":"QT.P7.REQUEST_ACTION","ns":["TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"According to the notice, what should shoppers be asked to do?","o":["Park on level B","Use the service corridor","Come in by the east entrance","Telephone the centre office first"],"a":2,"e":"“Shoppers should be directed to the east entrance.” Level B is closed and the service corridor is for deliveries by tenants, not for the public.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D2"},{"id":"MXC-T03-183","p":7,"f":"MXT03","q":183,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.TRUE_INDICATED","TX.DOUBLE","TX.EMAIL","TX.NOTICE","VO.PARA.WORD_SYNONYM","VO.SCENE.RETAIL_SHOPPING"],"s":"What is indicated about deliveries to Lantern Home?","o":["They are suspended until 26 July.","They must go through the service corridor.","They may continue to use the north entrance.","They will be received on the shop's behalf by the centre office."],"a":1,"e":"Lantern Home occupies unit 19, and the notice routes all deliveries to units 12 to 28 through the corridor behind unit 30. The north entrance is closed for the duration.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D2"},{"id":"MXC-T03-184","p":7,"f":"MXT03","q":184,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"What problem does Ms. Oyelaran describe?","o":["Her rent has risen without warning.","Her supplier has cancelled three deliveries.","The east entrance is too far from her unit.","Her supplier cannot deliver within the permitted hours."],"a":3,"e":"Deliveries are allowed between 6:00 and 9:00 A.M. only, and her furniture supplier is committed elsewhere every morning until noon. The three deliveries are booked, not cancelled.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D2"},{"id":"MXC-T03-185","p":7,"f":"MXT03","q":185,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.EMAIL","TX.NOTICE","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"What does Ms. Oyelaran ask about the goods lift?","o":["How often a request must be made","Whether tenants are charged for using it","Whether it will be closed during the works","How much weight it will carry"],"a":0,"e":"“Must a request be made for each delivery, or once for the whole period?” It is the passenger lifts, not the goods lift, that are going out of service.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-D2"},{"id":"MXC-T03-186","p":7,"f":"MXT03","q":186,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.EMAIL","TX.WEB","FD.READ.SCAN","VO.SCENE.CUSTOMER_SERVICE"],"s":"According to the web page, what should a customer do when returning an item?","o":["Pay the postage in advance","Keep the receipt from the post office","Telephone customer care beforehand","Address the parcel to the Coimbra warehouse"],"a":1,"e":"Step 3 is “Hand the parcel in at any post office and keep your receipt”. The label is prepaid, and the address is already on it, so neither postage nor addressing falls to the customer.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T1"},{"id":"MXC-T03-187","p":7,"f":"MXT03","q":187,"n":"QT.P7.REASON","ns":["TX.TRIPLE","TX.APP_FORM","TX.EMAIL","TX.WEB","VO.PARA.CAUSE_EFFECT","VO.SCENE.CUSTOMER_SERVICE"],"s":"Why did Mr. Wiśniewski return the table runner?","o":["It reached him later than promised.","The wrong size had been sent.","It was damaged in transit.","Its colour was unlike the one shown online."],"a":3,"e":"He ticked “Not as expected” and wrote that the colour was far darker than on the website. “Arrived late” and “Faulty” were both available on the form and were left unticked.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T1"},{"id":"MXC-T03-188","p":7,"f":"MXT03","q":188,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL_NUMBER","TX.TRIPLE","TX.APP_FORM","TX.EMAIL","TX.WEB","QT.P7.CALC_LOOKUP","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.CUSTOMER_SERVICE"],"s":"How much will Mr. Wiśniewski be refunded?","o":["$33.50","$38.00","$67.00","$71.50"],"a":1,"e":"He is refunded the price of the one item he sent back, $38.00. The $4.50 postage deduction applies only to orders of $60 or less, and his order came to $71.50.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T1"},{"id":"MXC-T03-189","p":7,"f":"MXT03","q":189,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.APP_FORM","TX.EMAIL","TX.WEB","FD.READ.SKIM","VO.SCENE.CUSTOMER_SERVICE"],"s":"Why does Ms. Brancusi mention the studio?","o":["To account for a delay in issuing the refund","To identify where the runner was woven","To describe a step taken in response to his comment","To invite him to appear in the winter catalogue"],"a":2,"e":"The paragraph follows directly from his complaint about the colour and reports that both shades will be photographed again. Nothing in the message suggests the refund has been held up.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T1"},{"id":"MXC-T03-190","p":7,"f":"MXT03","q":190,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.EMAIL","TX.WEB","FD.READ.SCAN","VO.SCENE.CUSTOMER_SERVICE"],"s":"What does Ms. Brancusi offer to send free of charge?","o":["A sample of another shade","A replacement runner","A discount on his next order","A prepaid returns label"],"a":0,"e":"“I can post you a fabric sample of either at no charge.” She names two alternative shades but does not offer a runner itself.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T1"},{"id":"MXC-T03-191","p":7,"f":"MXT03","q":191,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"According to the article, what is one reason developers choose cross-laminated timber?","o":["It is cheaper per square metre than concrete.","It is exempt from fire modelling.","It is simpler to insure than steel.","It goes up faster than concrete."],"a":3,"e":"“The panels arrive cut to size, so a floor can be assembled in days rather than in weeks.” Insurance and fire modelling appear in the article as obstacles to timber, not as advantages.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T2"},{"id":"MXC-T03-192","p":7,"f":"MXT03","q":192,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"What was the most common answer to the survey's second question?","o":["That respondents would pay more than 5% extra","That respondents would not pay any more","That respondents had not decided","That respondents would pay up to 5% extra"],"a":1,"e":"“No” drew 44%, ahead of the 38% willing to pay up to 5% more. No single answer was given by a majority, but 44% is the largest share.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T2"},{"id":"MXC-T03-193","p":7,"f":"MXT03","q":193,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"What share of respondents named the factor Mr. Mahadevan advises the team not to stress?","o":["11%","21%","29%","34%"],"a":0,"e":"The memo warns against leaning on the environmental case, and environmental credentials were chosen by 11% of the 412 respondents.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T2"},{"id":"MXC-T03-194","p":7,"f":"MXT03","q":194,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","VO.PARA.CAUSE_EFFECT","VO.SCENE.REAL_ESTATE"],"s":"Why does Mr. Mahadevan believe the Kesselring Quay site suits a timber frame?","o":["The authority has waived its fire-modelling requirement.","The upper floors have already been let.","A lighter building is cheaper to found on reclaimed land.","Timber panels can be delivered to the quay by water."],"a":2,"e":"The memo notes that the site is reclaimed land and that lightening the building helps at foundation level; the article supplies the figure, a timber frame weighing about a fifth of a concrete one. The upper floors are still to be marketed.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T2"},{"id":"MXC-T03-195","p":7,"f":"MXT03","q":195,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.APP_FORM","TX.ARTICLE","TX.MEMO","VO.PARA.GENERALIZE","VO.SCENE.REAL_ESTATE"],"s":"What does Mr. Mahadevan expect the local authority to do?","o":["Refuse permission for a timber structure","Require the client to change insurer","Issue a revised building code","Ask for fire modelling the code does not require"],"a":3,"e":"He wants the Harbour Lane fire-modelling file because “the same authority will want it again”, and the article explains that several city authorities demand modelling beyond the code.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T2"},{"id":"MXC-T03-196","p":7,"f":"MXT03","q":196,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"According to the advertisement, what is supplied with every shipper?","o":["A power adaptor","Two sets of coolant packs","A prepaid return label","A three-year service contract"],"a":1,"e":"“Every shipper leaves us with two sets of coolant packs and a validation certificate.” The three-year guarantee covers lids and gaskets and is not a service contract, and the shippers need no power at all.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T3"},{"id":"MXC-T03-197","p":7,"f":"MXT03","q":197,"n":"QT.P7.DETAIL_NUMBER","ns":["TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","QT.P7X.CALC_LOOKUP.INVOICE","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.ORDER_SHIP"],"s":"By what date must invoice 7742 be paid?","o":["11 September","24 September","11 October","24 October"],"a":2,"e":"The invoice is dated 11 September and the terms are 30 days from the invoice date. 24 September is the date of Ms. Marchetti's message, not a payment date.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T3"},{"id":"MXC-T03-198","p":7,"f":"MXT03","q":198,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","VO.PARA.CAUSE_EFFECT","VO.SCENE.ORDER_SHIP"],"s":"Why does Ms. Marchetti believe Thermaline owes her something?","o":["The shippers reached her after the agreed date.","She was charged for delivery she should not have paid for.","One of the twelve shippers arrived damaged.","Fewer coolant packs were supplied than advertised."],"a":3,"e":"The advertisement promises two sets of coolant packs with every shipper, so twelve shippers should have brought twenty-four sets rather than the twelve delivered. Delivery was in fact charged at $0.00.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T3"},{"id":"MXC-T03-199","p":7,"f":"MXT03","q":199,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"Which model is Ms. Marchetti likely to order in November?","o":["TL-12","TL-24","TL-48","TL-72"],"a":2,"e":"She wants “the next size up” from the 72-hour model she already buys, which is the TL-48, and its 96 hours covers the four-day run. The TL-72 is two sizes up.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T3"},{"id":"MXC-T03-200","p":7,"f":"MXT03","q":200,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.AD","TX.EMAIL","TX.INVOICE","VO.PARA.GENERALIZE","VO.SCENE.ORDER_SHIP"],"s":"What is true of the order Ms. Marchetti is considering?","o":["It will not qualify for the volume rate.","It will be larger than the September order.","It will be for the same model as the September order.","It will have to be paid for when it is placed."],"a":0,"e":"The 8% volume rate begins at ten units of one model, and she intends to buy six. Six units is fewer than the twelve she bought in September, and of a different model.","d":3,"t":65,"src":"open","b":"MXC-T03-P7-T3"},{"id":"MXC-T04-101","p":5,"f":"MXT04","q":101,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADV_AUX_SLOT"],"s":"The new interface is ------- simple, which is why most agents need only an hour of training.","o":["deceive","deception","deceptively","deceptive"],"a":2,"e":"An adverb is needed to modify the adjective “simple”: “deceptively simple”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-102","p":5,"f":"MXT04","q":102,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"By the time the autumn harvest begins, Vasterlund Orchards ------- the installation of its new sorting line.","o":["completes","will have completed","had completed","is completing"],"a":1,"e":"“By the time … begins” sets a deadline in the future, so the future perfect is required for something finished before that point.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-103","p":5,"f":"MXT04","q":103,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"All exhibit labels must reach the design office ------- 15 March so that printing can begin.","o":["by","until","over","since"],"a":0,"e":"“by 15 March” states a deadline. “Until” would describe an action continuing up to that date, which a single delivery cannot do.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-104","p":5,"f":"MXT04","q":104,"n":"QT.P5.VOCAB","ns":[],"s":"The redesigned dashboard gives packhouse supervisors ------- access to yield figures from every line.","o":["abrupt","hasty","brisk","instant"],"a":3,"e":"“Instant access” is the standard collocation for data available with no delay; “abrupt” and “hasty” describe something done suddenly or carelessly, not availability.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-105","p":5,"f":"MXT04","q":105,"n":"QT.P5.VERB_FORM","ns":["GR.NONFIN.GERUND"],"s":"The curator recommended ------- the textile display until the humidity controls have been serviced.","o":["to postpone","postponing","postpone","postponement"],"a":1,"e":"“Recommend” takes a gerund when no object follows: “recommended postponing the display”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-106","p":5,"f":"MXT04","q":106,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADV_VERB"],"s":"The gallery's lighting system operates ------- during opening hours, dimming as the daylight changes.","o":["automatic","automation","automatically","automate"],"a":2,"e":"The verb “operates” needs an adverb to say how it works: “operates automatically”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-107","p":5,"f":"MXT04","q":107,"n":"QT.P5.PAIR_GRAMMAR","ns":["GR.PRON.DETERMINER_QUANT"],"s":"------- of the two candidates for the archivist post has worked with digitised collections.","o":["Either","Both","Any","Every"],"a":0,"e":"“Of the two” with the singular verb “has” points to “Either”; “Both” would require the plural “have”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-108","p":5,"f":"MXT04","q":108,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"Northfield Dairy ------- its packaging supplier three times since the plant opened.","o":["has changed","changed","changes","will change"],"a":0,"e":"“Since the plant opened” marks a period running up to the present, which the present perfect expresses.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-109","p":5,"f":"MXT04","q":109,"n":"QT.P5.WORD_FORM","ns":["GR.NONFIN.PARTICIPLE_ADJ"],"s":"Ticket holders were ------- to learn that the sculpture wing would stay closed for a further week.","o":["disappointing","disappoint","disappointment","disappointed"],"a":3,"e":"The people experience the feeling, so the past participle is used: “holders were disappointed”. “Disappointing” would describe the news rather than the holders.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-110","p":5,"f":"MXT04","q":110,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADJ_COMPLEMENT"],"s":"Delegates found the conference app surprisingly -------, even on five-year-old handsets.","o":["reliability","reliable","reliably","rely"],"a":1,"e":"In “find + object + complement”, the complement describes the app, so the adjective “reliable” is needed.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-111","p":5,"f":"MXT04","q":111,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"Attendance at the weekend workshops rose sharply ------- the second quarter.","o":["among","between","during","along"],"a":2,"e":"A stretch of time takes “during”: “during the second quarter”. “Between” would need two separate points in time.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-112","p":5,"f":"MXT04","q":112,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.AGREE_SV","FD.SENT.MODIFIER_STRIP"],"s":"The list of approved seed varieties ------- updated every January by the regional agency.","o":["are","have been","were","is"],"a":3,"e":"The subject is the singular “list”, not “varieties”, so the singular “is” is correct.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-113","p":5,"f":"MXT04","q":113,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB"],"s":"The museum has ------- a grant of $85,000 to conserve its collection of glass negatives.","o":["secured","gathered","collected","reached"],"a":0,"e":"“Secure a grant” means to obtain funding after applying for it; “gather” and “collect” suit objects one accumulates, and “reach” suits a target or an agreement.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-114","p":5,"f":"MXT04","q":114,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX"],"s":"The laboratory is looking for an experienced ------- to lead its soil-testing programme.","o":["analyse","analytical","analyst","analysis"],"a":2,"e":"The sentence describes a person to be hired, so the person noun “analyst” is needed; “analysis” names the activity.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-115","p":5,"f":"MXT04","q":115,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.VOICE_PASSIVE"],"s":"Photographs of the excavation ------- in the east corridor until the end of the year.","o":["are displaying","will be displayed","have displayed","display"],"a":1,"e":"The photographs receive the action rather than perform it, so a passive form is required, and the period runs into the future.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-116","p":5,"f":"MXT04","q":116,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT","VO.SCENE.FINANCE_ACCOUNT"],"s":"When the auditors arrived on Tuesday, the finance team ------- the quarterly figures for six hours.","o":["reviews","has reviewed","will review","had been reviewing"],"a":3,"e":"The review was already under way when the auditors arrived, and the duration “for six hours” calls for the past perfect continuous.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-117","p":5,"f":"MXT04","q":117,"n":"QT.P5.CONNECTOR_MIX","ns":["GR.CONN.PREP_VS_CONJ"],"s":"------- the irrigation contract was signed late, the pilot plots were planted on schedule.","o":["Although","Despite","However","Because"],"a":0,"e":"Two contrasting clauses need the subordinating conjunction “Although”; “Despite” must be followed by a noun phrase rather than a clause.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-118","p":5,"f":"MXT04","q":118,"n":"QT.P5.VERB_FORM","ns":["GR.NONFIN.TO_INF"],"s":"The IT department has arranged ------- every workstation with the new client before the audit.","o":["updating","update","to update","updated"],"a":2,"e":"“Arrange” is followed by an infinitive: “has arranged to update”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-119","p":5,"f":"MXT04","q":119,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ"],"s":"Growers reported a significant ------- in water use after switching to drip irrigation.","o":["reduce","reduction","reduced","reducing"],"a":1,"e":"After the article and adjective “a significant”, a noun is required: “a significant reduction in”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-120","p":5,"f":"MXT04","q":120,"n":"QT.P5.PAIR_GRAMMAR","ns":["GR.PRON.DETERMINER_QUANT"],"s":"There is very ------- evidence that the new coating shortens shelf life.","o":["few","many","several","little"],"a":3,"e":"“Evidence” is uncountable and so takes “little”; the other three quantifiers require a countable plural noun.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-121","p":5,"f":"MXT04","q":121,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"Under the revised licence, the software may be installed ------- up to five devices per user.","o":["on","in","at","to"],"a":0,"e":"Software is installed “on” a device, so “installed on up to five devices” is the correct phrasing.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-122","p":5,"f":"MXT04","q":122,"n":"QT.P5.VOCAB","ns":[],"s":"The catalogue entry was ------- after new evidence about the painting's origin came to light.","o":["revoked","reversed","revised","restored"],"a":2,"e":"A description corrected in the light of new evidence is “revised”; “revoked” applies to permissions and “reversed” to decisions.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-123","p":5,"f":"MXT04","q":123,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_AFTER_DET"],"s":"The vineyard was replanted under the ------- of an agronomist from Mendoza.","o":["supervise","supervision","supervisory","supervisor"],"a":1,"e":"“Under the supervision of” is the fixed phrase, and only the noun “supervision” fits between “the” and “of” here.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-124","p":5,"f":"MXT04","q":124,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_SIMPLE"],"s":"The support desk ------- more than two hundred tickets last Thursday, a record for a single day.","o":["handled","has handled","handles","will have handled"],"a":0,"e":"“Last Thursday” is a finished past time, which requires the simple past; the present perfect cannot be used with it.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-125","p":5,"f":"MXT04","q":125,"n":"QT.P5.COMPARATIVE","ns":["GR.COMP.COMPARATIVE"],"s":"The second prototype proved ------- to assemble than the one the team built in the spring.","o":["easy","easiest","as easy","far easier"],"a":3,"e":"“Than” requires a comparative, and “far easier” is the only choice that supplies one.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-126","p":5,"f":"MXT04","q":126,"n":"QT.P5.WORD_FORM","ns":["GR.NONFIN.PARTICIPLE_ADJ"],"s":"The samples ------- from the northern plots will be tested before the others.","o":["collecting","collect","collected","collection"],"a":2,"e":"A reduced relative clause is needed — “the samples that were collected” — so the past participle is correct; “collecting” would make the samples do the collecting.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-127","p":5,"f":"MXT04","q":127,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADJ_BEFORE_NOUN"],"s":"The festival's ------- director will announce next season's programme in April.","o":["art","artistic","artistically","artist"],"a":1,"e":"The noun “director” needs an adjective in front of it, and “artistic director” is the established title.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-128","p":5,"f":"MXT04","q":128,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.AGREE_SV"],"s":"Neither the projector nor the speakers ------- working when the lecture was due to begin.","o":["was","has been","is","were"],"a":3,"e":"After “neither … nor”, the verb agrees with the nearer subject, the plural “speakers”, and the lecture is in the past.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-129","p":5,"f":"MXT04","q":129,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.MODAL_BASE"],"s":"Because the server room is locked outside office hours, contractors ------- arrange access a day in advance; no exceptions will be made.","o":["might","may","must","can"],"a":2,"e":"“No exceptions will be made” signals an obligation rather than a possibility or a permission, so “must” is the only fit.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-130","p":5,"f":"MXT04","q":130,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ"],"s":"All applicants will be notified of the panel's ------- by the end of May.","o":["decision","decide","decisive","decisively"],"a":0,"e":"The possessive “panel's” must be followed by a noun: “the panel's decision”.","d":3,"t":22,"src":"open"},{"id":"MXC-T04-131","p":6,"f":"MXT04","q":131,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","TX.MEMO","VO.SCENE.TECH_IT"],"s":"","o":["direct","directs","directing","direction"],"a":0,"e":"The blank continues “will read each request and ______”, so the bare infinitive “direct” is needed to match “read”.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B1"},{"id":"MXC-T04-132","p":6,"f":"MXT04","q":132,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","VO.LEX.VERB","TX.MEMO","VO.SCENE.TECH_IT"],"s":"","o":["shrink","abbreviate","shorten","compress"],"a":2,"e":"A length of time is “shortened”; “shrink” applies to physical size, “abbreviate” to words and “compress” to files.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B1"},{"id":"MXC-T04-133","p":6,"f":"MXT04","q":133,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.MEMO","VO.SCENE.TECH_IT"],"s":"","o":["Agents should keep assigning tickets by hand until further notice.","A short form for reporting these cases is now on the intranet.","The routing engine will be switched off for the whole of June.","The vendor no longer supports the classifier we are using."],"a":1,"e":"The sentence before asks staff to note mis-routed tickets and the one after refers to what the team sends the vendor, so a sentence explaining how to report them belongs here. Keeping manual assignment or switching the engine off would contradict the memo.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B1"},{"id":"MXC-T04-134","p":6,"f":"MXT04","q":134,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.NOUN_AFTER_DET","TX.MEMO","VO.SCENE.TECH_IT"],"s":"","o":["prior","prioritised","prioritise","priority"],"a":3,"e":"Between “the” and “of” a noun is required: “the priority of a ticket”.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B1"},{"id":"MXC-T04-135","p":6,"f":"MXT04","q":135,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.EMAIL"],"s":"","o":["Farms that joined the association after September are eligible for the first time.","The testing service has been suspended until further notice.","A fee of $60 per kit applies to every participant this year.","Only farms in the northern district may take part in this round."],"a":0,"e":"The sentence announces that the round is open to every member farm, so a note about who is newly eligible follows naturally. A fee contradicts “free” and “no charge”, and a district restriction contradicts “every member farm”.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B2"},{"id":"MXC-T04-136","p":6,"f":"MXT04","q":136,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","TX.EMAIL"],"s":"","o":["labelling","label","labelled","labels"],"a":1,"e":"The blank continues the imperative “Take one sample …, and ______”, so the base form “label” is required.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B2"},{"id":"MXC-T04-137","p":6,"f":"MXT04","q":137,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.AGREE_SV","TX.EMAIL"],"s":"","o":["include","including","have included","includes"],"a":3,"e":"The singular subject “the report” takes the singular present verb “includes”.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B2"},{"id":"MXC-T04-138","p":6,"f":"MXT04","q":138,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.PREP_MEANING","TX.EMAIL"],"s":"","o":["in","on","by","with"],"a":2,"e":"The means by which something is transmitted takes “by”: “sent by e-mail”.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B2"},{"id":"MXC-T04-139","p":6,"f":"MXT04","q":139,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.CONJ_ADVERBIAL","TX.NOTICE","VO.SCENE.HOTEL_LODGING"],"s":"","o":["Although","Whether","Until","Unless"],"a":2,"e":"The e-mail serves as proof only for the period before the card arrives, so the time conjunction “Until” is correct.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B3"},{"id":"MXC-T04-140","p":6,"f":"MXT04","q":140,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADJ_BEFORE_NOUN","TX.NOTICE","VO.SCENE.HOTEL_LODGING"],"s":"","o":["temporary","temporarily","temporariness","temporaries"],"a":0,"e":"The noun “exhibition” needs an adjective in front of it, and only “temporary” is an adjective.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B3"},{"id":"MXC-T04-141","p":6,"f":"MXT04","q":141,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.NOTICE","VO.SCENE.HOTEL_LODGING"],"s":"","o":["offer","are offering","offering","are offered"],"a":3,"e":"Places do not offer themselves; the institute offers them to members, so the passive “are offered” is required.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B3"},{"id":"MXC-T04-142","p":6,"f":"MXT04","q":142,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_CLOSING","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.NOTICE","VO.SCENE.HOTEL_LODGING"],"s":"","o":["Membership cards cannot be replaced once they have been issued.","Please include the postcode the card was sent to.","The institute no longer accepts renewals by post.","Guest passes must be collected from the shop in person."],"a":1,"e":"The paragraph deals with a card that has not arrived, so asking for the delivery postcode helps trace it. The sentence that follows promises free replacements, which rules out the claim that cards cannot be replaced.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B3"},{"id":"MXC-T04-143","p":6,"f":"MXT04","q":143,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.AGREE_SV","FD.SENT.MODIFIER_STRIP","GR.VERB.TENSE_SIMPLE","TX.NOTICE","VO.SCENE.TECH_IT"],"s":"","o":["is","has been","was","will be"],"a":3,"e":"The subject is the plural “packhouses” — the phrase between the commas does not change it — and the outage has not happened yet, so “will be affected” is the only possible form.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B4"},{"id":"MXC-T04-144","p":6,"f":"MXT04","q":144,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.NOTICE","VO.SCENE.TECH_IT"],"s":"","o":["The new hardware will be installed at head office in July.","Picking lists can be generated from the mobile app at any time.","Nothing printed after 22:00 will show the final order figures.","Saturday deliveries have been cancelled for this weekend."],"a":2,"e":"The instruction to print before Friday evening needs a reason, and a printout made during the migration would be out of date. Generating lists from the app is impossible while the system is down, and the paragraph shows that Saturday orders are still being taken.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B4"},{"id":"MXC-T04-145","p":6,"f":"MXT04","q":145,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.COMP.SUPERLATIVE","TX.NOTICE","VO.SCENE.TECH_IT"],"s":"","o":["quietest","quieter","quiet","more quiet"],"a":0,"e":"“Of the week” sets the whole week as the field of comparison, which calls for the superlative “quietest”.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B4"},{"id":"MXC-T04-146","p":6,"f":"MXT04","q":146,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.REL.REL_PRONOUN","TX.NOTICE","VO.SCENE.TECH_IT"],"s":"","o":["she","who","which","whom"],"a":1,"e":"A relative clause about a person, with the pronoun acting as the subject of “will monitor”, takes “who”; “whom” would be needed only for an object.","d":3,"t":30,"src":"open","b":"MXC-T04-P6-B4"},{"id":"MXC-T04-147","p":7,"f":"MXT04","q":147,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.NOTICE","TX.NOTICE","FD.READ.SKIM"],"s":"Why does the note mention Bendik Aasen's farm?","o":["To announce the closure of a nearby farm","To explain where one item in the box came from","To recommend a shop in the next valley","To introduce a new subscription level"],"a":1,"e":"A wet spring delayed Torvald Fields' own potatoes, so the potatoes in this week's box were bought from the neighbouring farm instead.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S1"},{"id":"MXC-T04-148","p":7,"f":"MXT04","q":148,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN"],"s":"What change does the note describe?","o":["The box is now packed on a different day.","The subscription price has increased.","Deliveries are now confirmed by telephone.","Recipes are provided online rather than on paper."],"a":3,"e":"“Recipe cards are no longer printed” and every recipe is now on the website. The price is tempting because the potatoes cost more, but the note says that difference was absorbed.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S1"},{"id":"MXC-T04-149","p":7,"f":"MXT04","q":149,"n":"QT.P7.DETAIL","ns":["TX.CHAT","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What is causing the deployment failures?","o":["The hosting provider changed the storage credentials.","The team's most recent code contains an error.","The staging server has run out of space.","A scheduled maintenance window was missed."],"a":0,"e":"“Hosting rotated the storage credentials overnight […] Our deploy key is dead.” The code is not at fault, since the build itself passes.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S2"},{"id":"MXC-T04-150","p":7,"f":"MXT04","q":150,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.CHAT","TX.CHAT","FD.READ.DISCOURSE","VO.SCENE.TECH_IT"],"s":"At 10:14, what does Ms. Ferreira most likely mean when she writes, “That works”?","o":["A new deploy key has been issued.","The provider has already resolved the ticket.","She agrees that the demonstration can use the older build.","She will reach Daniel before Thursday."],"a":2,"e":"She is replying to Ms. Raghunathan's plan to show the client the build already on production, and she adds that the week's changes are irrelevant to the demonstration.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S2"},{"id":"MXC-T04-151","p":7,"f":"MXT04","q":151,"n":"QT.P7.DETAIL","ns":["TX.AD","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"What does every membership include?","o":["An invitation to the curator's preview evenings","Free parking at the museum","A guest pass for every visit","The quarterly journal by post"],"a":3,"e":"The journal is listed among the benefits of every membership, whereas the preview evenings and the guest place are reserved for Patrons.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S3"},{"id":"MXC-T04-152","p":7,"f":"MXT04","q":152,"n":"QT.P7.DETAIL","ns":["TX.AD","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"What happens to people who join after 20 September?","o":["They pay a higher rate.","They collect their card at the museum.","They cannot enter the permanent galleries until January.","They must apply again in the following season."],"a":1,"e":"“Cards for applications received after that date will be waiting at the front desk” — the card is not posted, but nothing else changes.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S3"},{"id":"MXC-T04-153","p":7,"f":"MXT04","q":153,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.AD","TX.AD","FD.READ.SKIM","VO.SCENE.RETAIL_SHOPPING"],"s":"Why does the advertisement mention the first Sunday of each month?","o":["To indicate when the permanent galleries can be visited free of charge","To give the date of the reopening","To announce when the ticketed exhibitions open","To explain when membership cards are posted"],"a":0,"e":"The sentence exists to say that the permanent galleries are open to everyone on those days and that “no membership is needed”.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S3"},{"id":"MXC-T04-154","p":7,"f":"MXT04","q":154,"n":"QT.P7.REQUEST_ACTION","ns":["QT.P7X.REQUEST_ACTION.EMAIL","TX.EMAIL","FD.READ.SCAN"],"s":"What is Ms. Oyelaran advised to do before 19 May?","o":["Reduce the number of records in her account","Reschedule her exports for a later date","Run exports by hand from the Reports screen","Contact the engineer who wrote the fix"],"a":2,"e":"“exports started by hand from the Reports screen are unaffected, so please use that route for anything urgent”. Contacting the engineer is offered only if the corrected files fail to open.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S4"},{"id":"MXC-T04-155","p":7,"f":"MXT04","q":155,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.EMAIL","TX.EMAIL","FD.READ.SCAN"],"s":"What has been done about the two faulty exports?","o":["They have been deleted from the account.","They were attached to this message.","They were replaced with the versions from 6 May.","Corrected copies were added to the Files area."],"a":3,"e":"Both were regenerated and put in the Files area under the original names with “-corrected” added; the e-mail states that nothing has been deleted.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S4"},{"id":"MXC-T04-156","p":7,"f":"MXT04","q":156,"n":"QT.P7.INFERENCE","ns":["QT.P7X.INFERENCE.EMAIL","TX.EMAIL","VO.PARA.GENERALIZE"],"s":"What is suggested about the May invoice?","o":["It will be cancelled entirely.","It will be reduced without Ms. Oyelaran having to ask.","It will be delayed until the fix is released.","It will include a charge for the corrected files."],"a":1,"e":"It will be issued “at half the usual amount” and “You do not need to request this” — a reduction applied automatically, not a cancellation.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S4"},{"id":"MXC-T04-157","p":7,"f":"MXT04","q":157,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.ARTICLE","TX.ARTICLE","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What does the system report to the packing shed?","o":["Conditions in the soil","The weight of each harvest","The market price of tomatoes","The hours worked by staff"],"a":0,"e":"The buried probes send “soil moisture, temperature and salinity” to a screen in the packing shed.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S5"},{"id":"MXC-T04-158","p":7,"f":"MXT04","q":158,"n":"QT.P7.SYNONYM","ns":["QT.P7X.SYNONYM.ARTICLE","TX.ARTICLE","VO.CONF.POLYSEMY_CONTEXT","VO.PARA.WORD_SYNONYM","VO.SCENE.TECH_IT"],"s":"The word “declined” in the last paragraph is closest in meaning to","o":["reduced","descended","refused","postponed"],"a":2,"e":"“Declined to subsidise it” means the co-operative has refused to pay towards the cost. “Reduced” and “descended” are the other senses of the verb and do not work before an infinitive.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S5"},{"id":"MXC-T04-159","p":7,"f":"MXT04","q":159,"n":"QT.P7.INFERENCE","ns":["QT.P7X.INFERENCE.ARTICLE","TX.ARTICLE","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"What is implied about the cost of the system?","o":["It falls a little each year.","It is met by the district's co-operative.","It is lower than the cost of hiring extra staff.","It may prevent smaller growers from adopting the system."],"a":3,"e":"The doubt about smaller growers is stated immediately before the figure of $9,000 per hectare and the co-operative's refusal to help, so price is presented as the obstacle. The article says the saving is not in labour.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S5"},{"id":"MXC-T04-160","p":7,"f":"MXT04","q":160,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TEXT_MSG","TX.TEXT_MSG","FD.READ.SCAN"],"s":"What is the problem with the Mill Street bay?","o":["It is closed for building work.","Its lift is out of service.","Another vehicle is using it.","It is too small for the crate."],"a":1,"e":"Mr. Adeyemi calls it the old bay and says “The lift there has been out since February”.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S6"},{"id":"MXC-T04-161","p":7,"f":"MXT04","q":161,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TEXT_MSG","TX.TEXT_MSG","FD.READ.SCAN"],"s":"What does Mr. Adeyemi say he will do?","o":["Take delivery of the crate at the Carrow Lane bay","Telephone the haulage company","Delay the delivery until 10:30","Unwrap the panels in the corridor"],"a":0,"e":"“I will meet him at Carrow Lane and sign for it myself.” The 10:30 appointment is the driver's next drop, not a new delivery time.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S6"},{"id":"MXC-T04-162","p":7,"f":"MXT04","q":162,"n":"QT.P7.INFERENCE","ns":["TX.TEXT_MSG","VO.PARA.GENERALIZE"],"s":"At 08:49, what does Mr. Adeyemi imply when he writes, “Nothing gets unwrapped in the corridor again”?","o":["The corridor is currently being repainted.","The conservator prefers to work without an audience.","Opening a crate outside a gallery has caused trouble before.","The panels have already been inspected once."],"a":2,"e":"“Again” points back to an earlier occasion, and he insists the crate go straight to Gallery 3 before anyone opens it.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S6"},{"id":"MXC-T04-163","p":7,"f":"MXT04","q":163,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MEMO","TX.MEMO","FD.READ.SKIM"],"s":"What is the main purpose of the memo?","o":["To announce a new product line","To report the findings of an inspection","To ask for volunteers to work extra shifts","To set out a change to a cleaning procedure"],"a":3,"e":"The subject line is “Changeover procedure”, and the memo is given over to the new rule that one shift now performs the whole wash.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S7"},{"id":"MXC-T04-164","p":7,"f":"MXT04","q":164,"n":"QT.P7.DETAIL","ns":["TX.MEMO","FD.READ.SCAN"],"s":"What problem does Ms. Halvorsen say the previous arrangement caused?","o":["A line was signed off as clean when it was not.","Two shifts were paid for the same work.","Products were packed into the wrong containers.","Wash readings were recorded twice."],"a":0,"e":"Splitting the wash between two shifts “has twice produced a line signed off as clean when it was not”.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S7"},{"id":"MXC-T04-165","p":7,"f":"MXT04","q":165,"n":"QT.P7.REQUEST_ACTION","ns":["QT.P7X.REQUEST_ACTION.MEMO","TX.MEMO","FD.READ.SCAN"],"s":"What are supervisors asked to do this week?","o":["Sign the works council agreement","Collect the revised record sheets","Train the late shift on Line 2","Submit a weekly overtime claim"],"a":1,"e":"“Supervisors should collect the revised sheets from my office this week.” The agreement with the works council is already in place.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S7"},{"id":"MXC-T04-166","p":7,"f":"MXT04","q":166,"n":"QT.P7.MAIN_PURPOSE","ns":["TX.WEB","FD.READ.SKIM","VO.SCENE.EVENT_CONFERENCE"],"s":"What is the web page mainly about?","o":["An exhibition opening at the museum","A change to the museum's admission charges","The conditions under which the museum lends objects","A vacancy in the registrar's office"],"a":2,"e":"The page sets out who may borrow, when to apply, how requests are assessed and who pays the costs.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S8"},{"id":"MXC-T04-167","p":7,"f":"MXT04","q":167,"n":"QT.P7.DETAIL_NUMBER","ns":["TX.WEB","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.EVENT_CONFERENCE"],"s":"When must a loan request be submitted?","o":["In February, June or October","Nine months after the loans committee meets","As soon as a conservator has assessed the objects","At least nine months before the exhibition opens"],"a":3,"e":"“Requests must reach the registrar at least nine months before the opening date of the exhibition.” February, June and October are the committee's meeting months, not the deadline.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S8"},{"id":"MXC-T04-168","p":7,"f":"MXT04","q":168,"n":"QT.P7.NOT_TRUE","ns":["TX.WEB","ST.ELIM.OPTIONS","VO.SCENE.EVENT_CONFERENCE"],"s":"What is NOT required in a loan request?","o":["The name of the exhibition's curator","The catalogue numbers of the objects","The dates the objects would be away","A description of the case or mount"],"a":0,"e":"The three items the page asks for are catalogue numbers, the dates away, and the case or mount; nobody is asked to name a curator.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S8"},{"id":"MXC-T04-169","p":7,"f":"MXT04","q":169,"n":"QT.P7.INSERTION","ns":["TX.WEB","FD.READ.REFERENCE","FD.READ.DISCOURSE","VO.SCENE.EVENT_CONFERENCE"],"s":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong?\n\n“Requests that arrive later than this are held over to the following season.”","o":["[1]","[2]","[3]","[4]"],"a":1,"e":"“Later than this” can only refer to the nine-month deadline, so the sentence follows the sentence that sets it. At [4] it would be read as being about the loan fee.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S8"},{"id":"MXC-T04-170","p":7,"f":"MXT04","q":170,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"What will continue to work on floors 3 to 6 during the shutdown?","o":["The shared drives","The desk telephones","The door badge readers","The docking stations"],"a":2,"e":"“Door badges will still work; the badge system runs on its own circuit.” The docks are explicitly powered down.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S9"},{"id":"MXC-T04-171","p":7,"f":"MXT04","q":171,"n":"QT.P7.REQUEST_ACTION","ns":["TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"What are staff told to do by Thursday?","o":["Copy their files to a shared drive","Unplug their laptops from the docks","Post a message in the building channel","Reserve a desk on floor 2"],"a":3,"e":"Anyone working on Saturday must “book a desk on floor 2 […] by Thursday”. Unplugging laptops is for Friday evening, and the channel message comes from Facilities.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S9"},{"id":"MXC-T04-172","p":7,"f":"MXT04","q":172,"n":"QT.P7.DETAIL","ns":["TX.APP_FORM","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"What did Ms. Duarte find during the inspection?","o":["One of the sampled crates contained bruised fruit.","The vehicle temperature was above the limit.","The fruit delivered was of the wrong class.","The purchase order number was incorrect."],"a":0,"e":"Eleven of the twelve sampled crates were within specification; crate 88 was bruised. The arrival temperature of 4 °C is below the stated limit of 6 °C.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S10"},{"id":"MXC-T04-173","p":7,"f":"MXT04","q":173,"n":"QT.P7.DETAIL","ns":["TX.APP_FORM","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"How was the shortfall handled?","o":["The order was cancelled.","A replacement supplier was contacted.","The supplier agreed to send the remainder on 5 August.","An additional carriage charge was accepted."],"a":2,"e":"The 350 kg shortfall was confirmed by telephone and “the balance will follow on 5 August at no extra carriage cost”.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S10"},{"id":"MXC-T04-174","p":7,"f":"MXT04","q":174,"n":"QT.P7.INFERENCE","ns":["TX.APP_FORM","VO.PARA.GENERALIZE","VO.SCENE.ORDER_SHIP"],"s":"What is suggested about production on 3 August?","o":["It was moved to another line.","It went ahead as planned.","It was halted until the balance arrived.","It used fruit from a second supplier."],"a":1,"e":"“Line 1 has enough fruit for today's run”, so the missing 350 kg did not interrupt the day's production.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S10"},{"id":"MXC-T04-175","p":7,"f":"MXT04","q":175,"n":"QT.P7.DETAIL","ns":["TX.APP_FORM","FD.READ.SCAN","VO.SCENE.ORDER_SHIP"],"s":"What happened to crate 88?","o":["It was emptied and the fruit sorted by hand.","It was placed in the cold store.","It was sent to a different production line.","It remained on the delivery vehicle."],"a":3,"e":"The notes record that crate 88 was “rejected and left on the vehicle”, which is why the delivery was accepted only in part.","d":3,"t":55,"src":"open","b":"MXC-T04-P7-S10"},{"id":"MXC-T04-176","p":7,"f":"MXT04","q":176,"n":"QT.P7.TRUE_INDICATED","ns":["TX.DOUBLE","TX.AD","TX.EMAIL","VO.PARA.WORD_SYNONYM","VO.SCENE.REAL_ESTATE"],"s":"What is stated about the rental period?","o":["It begins and ends on a Monday.","It is limited to a maximum of two weeks.","It may be extended at no additional cost.","It differs depending on the machine."],"a":0,"e":"“Rentals begin and end on a Monday” — the same period applies to every machine on the list.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D1"},{"id":"MXC-T04-177","p":7,"f":"MXT04","q":177,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.INFERENCE","TX.DOUBLE","TX.AD","TX.EMAIL","VO.PARA.GENERALIZE","VO.SCENE.REAL_ESTATE"],"s":"What is indicated about the delivery to Brackenfield Farm?","o":["It is included in the weekly rate.","It will involve an additional charge.","It must be arranged three weeks in advance.","It can be made only on a Saturday."],"a":1,"e":"The farm is “roughly 75 km” away and free delivery covers only 60 km, so the $2.40 per kilometre charge applies. The three-week rule concerns reserving harvest equipment, not delivery.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D1"},{"id":"MXC-T04-178","p":7,"f":"MXT04","q":178,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL_NUMBER","TX.DOUBLE","TX.AD","TX.EMAIL","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.REAL_ESTATE"],"s":"How much will Ms. Adeyemi be charged for the operator she requests?","o":["$180","$310","$360","$540"],"a":2,"e":"An operator costs $180 per day and she wants one for the first two days: $360. The $540 is the baler's weekly rate.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D1"},{"id":"MXC-T04-179","p":7,"f":"MXT04","q":179,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.AD","TX.EMAIL","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"What does Ms. Adeyemi expect to receive because of when she is booking?","o":["Free delivery outside the standard zone","A 15 percent reduction","An extra day of rental","Priority during the harvest period"],"a":1,"e":"She writes on 12 March “to secure the reduction you advertise”, and the advertisement gives 15 percent off bookings placed before 1 April.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D1"},{"id":"MXC-T04-180","p":7,"f":"MXT04","q":180,"n":"QT.P7.REQUEST_ACTION","ns":["TX.DOUBLE","TX.AD","TX.EMAIL","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"What does Ms. Adeyemi ask Fennhorse to do before the delivery date?","o":["Send a revised list of rates","Train two members of her staff","Confirm the yard's opening hours","Examine the entrance to her farm"],"a":3,"e":"She asks that someone “come out and look at” the narrow access track and its sharp turn. She requests an operator for the baler, but not training for her farmhands.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D1"},{"id":"MXC-T04-181","p":7,"f":"MXT04","q":181,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.ARTICLE","TX.CHAT","FD.READ.SKIM","VO.SCENE.COMMUNITY_CULTURE"],"s":"What is the purpose of the article?","o":["To report on a museum's visitor numbers","To announce the opening of a new museum","To review a mobile application","To describe a change of director"],"a":0,"e":"The article opens with the 41,600 spring figure and spends the rest of its length explaining why attendance rose.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D2"},{"id":"MXC-T04-182","p":7,"f":"MXT04","q":182,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.CHAT","FD.READ.SCAN","VO.SCENE.COMMUNITY_CULTURE"],"s":"What did the museum introduce in March?","o":["Evening opening on Fridays","A printed guide in six languages","A free mobile application","A reduced admission price"],"a":2,"e":"“in March it withdrew its printed guide in favour of a free mobile application”. The Friday evenings began in January, and the six languages belong to the application, not to a printed guide.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D2"},{"id":"MXC-T04-183","p":7,"f":"MXT04","q":183,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.CHAT","FD.READ.SCAN","VO.SCENE.COMMUNITY_CULTURE"],"s":"What is Ms. Oyelaran concerned about?","o":["The evening programme costs too much to run.","The reading room will be closed to visitors.","Too few visitors are using the application.","Visitors would pay full price for a reduced museum."],"a":3,"e":"“I do not want people paying the full price for two thirds of a museum” once the east wing shuts.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D2"},{"id":"MXC-T04-184","p":7,"f":"MXT04","q":184,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.INFERENCE","TX.DOUBLE","TX.ARTICLE","TX.CHAT","VO.PARA.GENERALIZE","VO.SCENE.COMMUNITY_CULTURE"],"s":"When would Mr. Chandrasekar's reduced admission most likely end?","o":["In January","In May","In September","In October"],"a":1,"e":"He would keep the reduction “until the wing opens again”, and the article dates the closure from 1 September for eight months, which takes it to about the beginning of May.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D2"},{"id":"MXC-T04-185","p":7,"f":"MXT04","q":185,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.CHAT","FD.READ.SCAN","VO.SCENE.COMMUNITY_CULTURE"],"s":"What does Ms. Oyelaran propose offering evening visitors?","o":["The ninety-minute tour on the application","A guided tour of the Whaling Gallery","Free use of the café","A printed map of the building"],"a":0,"e":"She recommends the application tour precisely because none of its stops is in the wing that is closing; a Whaling Gallery tour is impossible while that gallery is being rebuilt.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-D2"},{"id":"MXC-T04-186","p":7,"f":"MXT04","q":186,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.REVIEW","TX.WEB","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"Which plan does Vellowmoor Creamery currently use?","o":["Sprout","Harvest","Estate","The free trial"],"a":1,"e":"Mr. Adeyinka moved up from the entry plan to “the $79 one”, which the web page names Harvest.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T1"},{"id":"MXC-T04-187","p":7,"f":"MXT04","q":187,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.REVIEW","TX.WEB","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What difficulty does Mr. Adeyinka describe with his purchase?","o":["A device he needed was not included in the plan.","His batch records could not be exported.","An inspector rejected the history he produced.","His two sites were billed as a single site."],"a":0,"e":"He upgraded in order to scan barcodes and only discovered a week later that the handheld reader was sold separately.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T1"},{"id":"MXC-T04-188","p":7,"f":"MXT04","q":188,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.REVIEW","TX.WEB","FD.READ.SKIM","VO.SCENE.TECH_IT"],"s":"Why did Ms. Wisniewska write the response?","o":["To request more detail about a fault","To offer a refund for a piece of equipment","To explain why an inspection was failed","To set out what has been changed in reply to the criticism"],"a":3,"e":"She takes his two complaints in turn and says what has been done about each — the reader list moved, the telephone hours extended.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T1"},{"id":"MXC-T04-189","p":7,"f":"MXT04","q":189,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.REVIEW","TX.WEB","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What will happen on 1 October?","o":["The price of one of the plans will rise.","A list of compatible readers will be published for the first time.","Telephone support will run later on four days a week.","E-mail support will be added to every plan."],"a":2,"e":"“from 1 October it will stay open until 8 P.M. from Monday to Thursday”. The reader list already exists; it has only been moved to a more visible place.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T1"},{"id":"MXC-T04-190","p":7,"f":"MXT04","q":190,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.REVIEW","TX.WEB","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"What does Ms. Wisniewska imply Mr. Adeyinka might consider?","o":["Reducing the number of users on his account","Trialling the software free for thirty days","Exporting his records as a spreadsheet","Moving to the Estate plan"],"a":3,"e":"“the plan above yours” produces a single audit file; above Harvest on the web page is Estate. The spreadsheet export he already has on any plan.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T1"},{"id":"MXC-T04-191","p":7,"f":"MXT04","q":191,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.ARTICLE","TX.EMAIL","TX.SCHEDULE","FD.READ.SKIM","VO.SCENE.EVENT_CONFERENCE"],"s":"What is the purpose of the press release?","o":["To report the sale of a photographic collection","To announce an exhibition and the events around it","To invite applications for a workshop place","To explain a change to the gallery's opening hours"],"a":1,"e":"It gives the exhibition's dates, contents and ticket prices, and points readers to the opening-week programme.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T2"},{"id":"MXC-T04-192","p":7,"f":"MXT04","q":192,"n":"QT.P7.TRUE_INDICATED","ns":["TX.TRIPLE","TX.ARTICLE","TX.EMAIL","TX.SCHEDULE","VO.PARA.WORD_SYNONYM","VO.SCENE.EVENT_CONFERENCE"],"s":"What is indicated about the Saturday workshop?","o":["It is free to holders of an exhibition ticket.","Participants must supply their own materials.","An additional fee is charged for it.","It is held in the Long Gallery."],"a":2,"e":"It is the one event excluded from the free-with-a-ticket rule, at $45. Materials are supplied, and it takes place in Studio 2.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T2"},{"id":"MXC-T04-193","p":7,"f":"MXT04","q":193,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.ARTICLE","TX.EMAIL","TX.SCHEDULE","VO.PARA.CAUSE_EFFECT","VO.SCENE.EVENT_CONFERENCE"],"s":"Why will Ms. Matsuura's group be unable to attend the curator's introduction?","o":["It falls on a day when the group is not in the city.","It is open to gallery members only.","Its places have already been taken.","It carries a charge the college will not meet."],"a":0,"e":"The introduction is on Tuesday 14 October, and her group is in the city on the Wednesday and Thursday only.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T2"},{"id":"MXC-T04-194","p":7,"f":"MXT04","q":194,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFER_NEXT","TX.TRIPLE","TX.ARTICLE","TX.EMAIL","TX.SCHEDULE","VO.SCENE.EVENT_CONFERENCE"],"s":"What will Ms. Matsuura most likely tell her students to bring?","o":["Cameras","Membership cards","Printed tickets","Sketchbooks"],"a":3,"e":"Photography is prohibited throughout the exhibition, so the alternative she promised to name must be something to draw with rather than a camera.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T2"},{"id":"MXC-T04-195","p":7,"f":"MXT04","q":195,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.ARTICLE","TX.EMAIL","TX.SCHEDULE","VO.PARA.GENERALIZE","VO.SCENE.EVENT_CONFERENCE"],"s":"What is suggested about the Wednesday demonstration?","o":["It will be repeated later in the week.","It will be led by Dr. Lindqvist.","It can be reached without using stairs.","It is limited to twelve participants."],"a":2,"e":"The demonstration is in Studio 1, and the studios are reached from the step-free Marlow Street entrance, which answers Ms. Matsuura's question about her student.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T2"},{"id":"MXC-T04-196","p":7,"f":"MXT04","q":196,"n":"QT.P7.INFER_WHO","ns":["TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","VO.PARA.ROLE_REFERENCE","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What is stated about the quality engineer position?","o":["It is carried out entirely from home.","It does not involve writing new features.","It requires previous experience of ticketing.","It reports to the head of Customer Accounts."],"a":1,"e":"“Confidence reading Python; you will not be asked to write new features.” A transport or ticketing background is welcome but explicitly not required.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T3"},{"id":"MXC-T04-197","p":7,"f":"MXT04","q":197,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","VO.PARA.CAUSE_EFFECT","VO.SCENE.TRANSPORT_COMMUTE"],"s":"Why does the agenda include a conversation in German?","o":["Because the Lindholm office works in German","Because the practical exercise is written in German","Because the company's largest customers write in it","Because the platform team is based abroad"],"a":2,"e":"The posting asks for working German “as our two largest customers correspond with us in it”, and the conversation is held by Customer Accounts.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T3"},{"id":"MXC-T04-198","p":7,"f":"MXT04","q":198,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What does Mr. Haugen say about the practical exercise?","o":["It will be marked by the platform team.","It requires no preparation in advance.","It will test her ability to write Python code.","It will take place before lunch."],"a":1,"e":"“There is nothing to prepare.” He states plainly that it is not a coding test, and the agenda places it at 13:00, after lunch.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T3"},{"id":"MXC-T04-199","p":7,"f":"MXT04","q":199,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.TRANSPORT_COMMUTE"],"s":"At what time will Ms. Okonkwo meet the head of the release team?","o":["10:00","11:15","13:00","14:30"],"a":3,"e":"The e-mail identifies Annika Sjoberg as the person who runs the release team, and the agenda puts A. Sjoberg at 14:30.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T3"},{"id":"MXC-T04-200","p":7,"f":"MXT04","q":200,"n":"QT.P7.REQUEST_ACTION","ns":["TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What are visitors who drive to the office advised to do?","o":["Ask reception for a parking permit","Park on the ground floor of the building","Arrive before 9:30","Contact Ms. Kruger in advance"],"a":0,"e":"The Marlow Street bays are for permit holders, and the agenda says a permit is issued at reception on request. The ground floor holds the canteen, not parking.","d":3,"t":65,"src":"open","b":"MXC-T04-P7-T3"},{"id":"MXC-T05-101","p":5,"f":"MXT05","q":101,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ","VO.SCENE.EVENT_CONFERENCE"],"s":"Delegates who register before 15 March will receive a substantial ------- on the conference fee.","o":["reduce","reduced","reduction","reducing"],"a":2,"e":"After the article “a” and the adjective “substantial”, a noun is required: “a substantial reduction”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-102","p":5,"f":"MXT05","q":102,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT","VO.SCENE.FINANCE_ACCOUNT"],"s":"By the time the audit team arrives on Monday, the finance department ------- all supporting invoices.","o":["will have compiled","is compiling","compiled","had compiled"],"a":0,"e":"“By the time … arrives” sets a deadline in the future, so an action finished before it takes the future perfect “will have compiled”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-103","p":5,"f":"MXT05","q":103,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"Passengers may check in online ------- 24 hours of their scheduled departure time.","o":["during","within","among","toward"],"a":1,"e":"“Within 24 hours of” names the period inside which checking in is possible; “during” would need a defined event rather than a countdown.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-104","p":5,"f":"MXT05","q":104,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB"],"s":"Ms. Adeyemi has been asked to ------- the Lisbon branch at next month's regional banking forum.","o":["attend","present","remind","represent"],"a":3,"e":"To “represent the branch” is to act on its behalf. “Present” would require something shown to an audience rather than an organisation, and one attends a forum, not a branch.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-105","p":5,"f":"MXT05","q":105,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.VOICE_PASSIVE"],"s":"Claims submitted after the 31 May deadline ------- in the following quarter.","o":["will be processed","will process","are processing","have processed"],"a":0,"e":"Claims do not act on themselves; the subject receives the action, so the future passive “will be processed” is needed.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-106","p":5,"f":"MXT05","q":106,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADV_VERB"],"s":"The maintenance crew worked ------- through the night to restore power to the northern grid.","o":["steady","steadier","steadily","steadiness"],"a":2,"e":"An adverb is needed to modify the verb “worked”: “worked steadily through the night”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-107","p":5,"f":"MXT05","q":107,"n":"QT.P5.CONNECTOR_MIX","ns":["GR.CONN.PREP_VS_CONJ"],"s":"The turbines will remain offline ------- the replacement gearboxes clear customs.","o":["so that","until","despite","in case of"],"a":1,"e":"“Until” marks the point at which the offline period ends. “Despite” and “in case of” cannot introduce a clause with a finite verb.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-108","p":5,"f":"MXT05","q":108,"n":"QT.P5.VERB_FORM","ns":["GR.NONFIN.GERUND"],"s":"The agency recommends ------- travel insurance at the time of booking rather than a few days before departure.","o":["to purchase","purchase","to have purchased","purchasing"],"a":3,"e":"“Recommend” takes a gerund when no object comes between it and the verb: “recommends purchasing”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-109","p":5,"f":"MXT05","q":109,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX"],"s":"Applicants must supply ------- proof of address before a business account can be opened.","o":["satisfactory","satisfaction","satisfy","satisfactorily"],"a":0,"e":"An adjective is needed before the noun “proof”: “satisfactory proof of address”.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-110","p":5,"f":"MXT05","q":110,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.MODAL_BASE"],"s":"Guests ------- leave luggage at the front desk after checking out, at no additional charge.","o":["must","had better","may","ought to"],"a":2,"e":"“At no additional charge” describes a service offered to guests, so the permission modal “may” fits; “must” would turn an option into an obligation.","d":3,"t":22,"src":"open"},{"id":"MXC-T05-111","p":5,"f":"MXT05","q":111,"n":
