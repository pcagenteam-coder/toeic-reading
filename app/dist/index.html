":55,"src":"open","b":"MXC-T06-P7-S8"},{"id":"MXC-T06-167","p":7,"f":"MXT06","q":167,"n":"QT.P7.INFER_WHO","ns":["QT.P7X.INFER_WHO.JOB_POSTING","TX.JOB_POSTING","VO.PARA.ROLE_REFERENCE","VO.SCENE.RECRUIT"],"s":"What is an essential requirement of the position?","o":["Experience with machines above 300 tonnes","Fluency in more than one language","Three years of work in manufacturing","A qualification in production planning"],"a":2,"e":"The essential list asks for “at least three years in a manufacturing environment”. Large-tool experience appears under Desirable, and only reading drawings in English is mentioned, not fluency in several languages.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S8"},{"id":"MXC-T06-168","p":7,"f":"MXT06","q":168,"n":"QT.P7.DETAIL","ns":["TX.JOB_POSTING","FD.READ.SCAN","VO.SCENE.RECRUIT"],"s":"What will the successful candidate do before starting work in Ostrava?","o":["Train at another company site","Complete a funded professional course","Take part in a six-month review","Visit the company's customers"],"a":0,"e":"“Four weeks of paid training at our Gdansk plant before you join the line in Ostrava.” The funded course is an annual benefit once employed.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S8"},{"id":"MXC-T06-169","p":7,"f":"MXT06","q":169,"n":"QT.P7.MAIN_PURPOSE","ns":["TX.JOB_POSTING","FD.READ.SKIM","VO.SCENE.RECRUIT"],"s":"Why does the posting mention agencies?","o":["To identify who will conduct the interviews","To make clear that candidates should apply directly","To explain a delay in filling the position","To indicate that a recruitment fee is payable"],"a":1,"e":"The sentence follows the instruction to send a CV to the company address, so ruling out agency submissions tells applicants to come straight to Solvarn. Refusing such applications also rules out any fee rather than announcing one.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S8"},{"id":"MXC-T06-170","p":7,"f":"MXT06","q":170,"n":"QT.P7.TRUE_INDICATED","ns":["TX.NOTICE","VO.PARA.WORD_SYNONYM"],"s":"What is stated about the oral review?","o":["It lasts ninety minutes.","It takes place before the practical.","It carries fewer marks than the other parts.","It does not count towards the result."],"a":3,"e":"“This part carries no marks” — it can only send a candidate back to repeat a lift. The 90 minutes belongs to the practical observation.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S9"},{"id":"MXC-T06-171","p":7,"f":"MXT06","q":171,"n":"QT.P7.INFERENCE","ns":["TX.NOTICE","VO.PARA.GENERALIZE"],"s":"What is suggested about a candidate who fails both the written paper and the practical observation?","o":["The result will be issued sooner than usual.","Only the written paper has to be taken again.","A further payment will be necessary.","A wait of six months is required."],"a":2,"e":"Failing two parts means repeating the whole course “at the standard fee”; the free re-sit is reserved for a candidate who fails one part only.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S9"},{"id":"MXC-T06-172","p":7,"f":"MXT06","q":172,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.WEB","TX.WEB","VO.PARA.WORD_SYNONYM","VO.SCENE.REAL_ESTATE"],"s":"What is indicated about the Let Only service?","o":["It includes quarterly inspections.","The landlord deals with the tenant after the letting.","It costs 11% of the rent.","It provides annual safety certificates."],"a":1,"e":"“From then on you deal with the tenant yourself.” Inspections belong to Managed and safety certificates to Managed Plus.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S10"},{"id":"MXC-T06-173","p":7,"f":"MXT06","q":173,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"What does Managed Plus include that Managed does not?","o":["Rent guarantee insurance","A 24-hour repairs line","Reference checks on applicants","Monthly collection of the rent"],"a":0,"e":"Managed Plus is described as everything in Managed plus rent guarantee insurance and safety certificates. The repairs line and rent collection are already part of Managed.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S10"},{"id":"MXC-T06-174","p":7,"f":"MXT06","q":174,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"According to the web page, when must a landlord give approval?","o":["Before the property is advertised","Before a tenancy agreement is drawn up","Before an inspection is carried out","Before repair work over a certain value is ordered"],"a":3,"e":"The agency instructs contractors itself, “you approve anything above $400”. Advertising, agreements and inspections are all handled by the agency without a separate approval.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S10"},{"id":"MXC-T06-175","p":7,"f":"MXT06","q":175,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.REAL_ESTATE"],"s":"What does a landlord receive after a property inspection?","o":["A printed copy of the tenancy agreement","A telephone call from the contractor","A message saying the report is ready","A refund of the set-up fee"],"a":2,"e":"The report goes to the online account within two working days and “we send you a text message as soon as a report is ready”. The set-up fee is waived before 30 June, never refunded afterwards.","d":3,"t":55,"src":"open","b":"MXC-T06-P7-S10"},{"id":"MXC-T06-176","p":7,"f":"MXT06","q":176,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.ARTICLE","TX.EMAIL","FD.READ.SKIM","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What is the purpose of the press release?","o":["To recruit maintenance engineers","To announce the opening of a manufacturing site","To report the company's results for the year","To invite suppliers to submit bids"],"a":1,"e":"The headline and first paragraph announce that a new plant at Rivermouth will begin production on 2 March. Hiring is mentioned, but only as a consequence of the opening.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D1"},{"id":"MXC-T06-177","p":7,"f":"MXT06","q":177,"n":"QT.P7.TRUE_INDICATED","ns":["TX.DOUBLE","TX.ARTICLE","TX.EMAIL","VO.PARA.WORD_SYNONYM","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What is indicated about the aluminium housings?","o":["They are currently made at only one Aalstrup plant.","They will replace an older product line.","They are produced for a single customer.","They were designed at the Rivermouth site."],"a":0,"e":"“a line currently produced only at the company's plant in Sandvik”. Nothing says the product replaces anything or that Rivermouth designed it.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D1"},{"id":"MXC-T06-178","p":7,"f":"MXT06","q":178,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.INFERENCE","TX.DOUBLE","TX.ARTICLE","TX.EMAIL","VO.PARA.GENERALIZE","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What is suggested about Mr. Rezende's e-mail?","o":["It was written before the press release appeared.","It was sent to the wrong department.","It arrived after the date set for registration.","It repeats a request he made by telephone."],"a":2,"e":"The release asks visitors to register by 7 February, and the e-mail is dated 10 February. The open house itself has not yet taken place, so the message is late rather than too early.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D1"},{"id":"MXC-T06-179","p":7,"f":"MXT06","q":179,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.EMAIL","FD.READ.SCAN","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What position is held by the person Mr. Rezende wants to address his group?","o":["Communications officer","Plant manager","Quality inspector","Maintenance engineer"],"a":1,"e":"He asks for fifteen minutes with Ms. Balogun, whom the press release identifies as the plant manager leading the assembly-floor tours.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D1"},{"id":"MXC-T06-180","p":7,"f":"MXT06","q":180,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.ARTICLE","TX.EMAIL","FD.READ.SCAN","VO.SCENE.INVENTORY_PRODUCTION"],"s":"What does Mr. Rezende ask Ms. Halvorsen to confirm?","o":["The address of the Rivermouth site","The maximum size of a tour group","Whether the open house will be repeated","Whether his apprentices may apply in April"],"a":3,"e":"His second request concerns the April round of hiring and whether it is open to candidates finishing his programme in June.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D1"},{"id":"MXC-T06-181","p":7,"f":"MXT06","q":181,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.AD","TX.REVIEW","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What is included in the price of every certificate course?","o":["The examination","A place at a Saturday workshop","A textbook written by the instructor","Transport to the Fenwick Road hall"],"a":0,"e":"“Every certificate fee covers the examination, printed course notes and twelve months' access to our online library.” The Saturday workshops belong to the diploma only.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D2"},{"id":"MXC-T06-182","p":7,"f":"MXT06","q":182,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.AD","TX.REVIEW","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What does Ms. Wrzesniewski say she values most?","o":["The printed notes","The location of the classes","The size of her group","The online library"],"a":3,"e":"She calls the library “excellent” and says it is why she is enrolling again. The notes arrived late and the location was one of her two complaints.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D2"},{"id":"MXC-T06-183","p":7,"f":"MXT06","q":183,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.INFERENCE","TX.DOUBLE","TX.AD","TX.REVIEW","VO.PARA.GENERALIZE","VO.SCENE.TECH_IT"],"s":"How much less did Ms. Wrzesniewski's employer most likely pay for each place?","o":["5 percent","10 percent","15 percent","20 percent"],"a":2,"e":"Four members of staff were registered on the same course, which meets the advertisement's condition of three or more for a 15 percent reduction on every place.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D2"},{"id":"MXC-T06-184","p":7,"f":"MXT06","q":184,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.REASON","TX.DOUBLE","TX.AD","TX.REVIEW","VO.PARA.CAUSE_EFFECT","VO.SCENE.TECH_IT"],"s":"Why did Ms. Wrzesniewski's class not meet in the Harbour Street building?","o":["The building was still being fitted out.","Her course started before October.","Her group was too large for the new rooms.","The heating there could not be relied on."],"a":1,"e":"Only intakes beginning on or after 1 October use Harbour Street, and hers began on 10 September. The unreliable heating is what she found at Fenwick Road, not a reason for staying there.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D2"},{"id":"MXC-T06-185","p":7,"f":"MXT06","q":185,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL_NUMBER","TX.DOUBLE","TX.AD","TX.REVIEW","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.TECH_IT"],"s":"How much will Ms. Wrzesniewski's next course cost?","o":["$520","$640","$780","$1,950"],"a":0,"e":"The six-week negotiation course she has signed up for is the Certificate in Contract Negotiation, listed at $520.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-D2"},{"id":"MXC-T06-186","p":7,"f":"MXT06","q":186,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.RECRUIT"],"s":"What must applicants for the position have?","o":["A qualification in accounting","Experience with the Tenantly platform","A current property licence","Command of a second language"],"a":2,"e":"The licence appears under “Required”, whereas the Tenantly platform and a second language are listed only as desirable.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T1"},{"id":"MXC-T06-187","p":7,"f":"MXT06","q":187,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.RECRUIT"],"s":"What does Ms. Okonkwo ask Ms. Aguirre to bring?","o":["A printed copy of her letter","An original document","A sample service-charge statement","Proof that she has paid for parking"],"a":1,"e":"“bring the original of your licence; we cannot accept a photocopy”.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T1"},{"id":"MXC-T06-188","p":7,"f":"MXT06","q":188,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.RECRUIT"],"s":"At what time will Ms. Aguirre begin the written exercise?","o":["9:45 A.M.","10:00 A.M.","10:45 A.M.","11:15 A.M."],"a":2,"e":"The schedule puts her panel interview at 10:00, and the e-mail says the panel takes forty-five minutes and the exercise follows immediately.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T1"},{"id":"MXC-T06-189","p":7,"f":"MXT06","q":189,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","VO.PARA.GENERALIZE","VO.SCENE.RECRUIT"],"s":"Who is most likely to question Ms. Aguirre about the Tenantly platform?","o":["Ms. Okonkwo","Mr. Nowicki","Ms. Quintero","Mr. Raman"],"a":3,"e":"The e-mail says the Northside team will want to ask about it, and the schedule identifies Dev Raman as the Northside team leader on the panel.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T1"},{"id":"MXC-T06-190","p":7,"f":"MXT06","q":190,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.EMAIL","TX.JOB_POSTING","TX.SCHEDULE","FD.READ.SKIM","VO.SCENE.RECRUIT"],"s":"Why does Ms. Okonkwo mention Bellamy Street?","o":["Because a space at the office may not be free","Because the entrance to the office has moved","Because the written exercise is held there","Because no train serves Harrow Lane"],"a":0,"e":"She names the car park immediately after noting that Harrow Lane has only eight spaces, so it is offered as an alternative.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T1"},{"id":"MXC-T06-191","p":7,"f":"MXT06","q":191,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.EMAIL","TX.INVOICE","TX.NOTICE","FD.READ.SKIM","VO.SCENE.BANK_PAYMENT"],"s":"What is the purpose of the notice?","o":["To announce a change of building manager","To inform tenants about work on the lifts","To introduce a new delivery contractor","To explain how car-park spaces are allocated"],"a":1,"e":"The notice sets out the dates of the lift modernisation and its consequences for tenants.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T2"},{"id":"MXC-T06-192","p":7,"f":"MXT06","q":192,"n":"QT.P7.REQUEST_ACTION","ns":["TX.TRIPLE","TX.EMAIL","TX.INVOICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What are tenants asked to do while the work is under way?","o":["Use the stairs above the third floor","Report all deliveries to the building manager","Pay the service charge monthly","Arrange upper-floor deliveries outside the busiest hours"],"a":3,"e":"“Deliveries to floors above the third should be arranged before 09:00 or after 17:00, when the working lift is least busy.”","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T2"},{"id":"MXC-T06-193","p":7,"f":"MXT06","q":193,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.EMAIL","TX.INVOICE","TX.NOTICE","VO.PARA.CAUSE_EFFECT","VO.SCENE.BANK_PAYMENT"],"s":"Why does Ms. Steinhaus question one line of the invoice?","o":["Her studio was in an exempt unit for part of the period.","The work had not started when the invoice was issued.","Her lease covers only one of the two lifts.","The amount is higher than in the previous quarter."],"a":0,"e":"The notice exempts ground-floor tenants from the capital works item, and her studio was at street level in Unit 006 until 31 May.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T2"},{"id":"MXC-T06-194","p":7,"f":"MXT06","q":194,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.EMAIL","TX.INVOICE","TX.NOTICE","VO.PARA.GENERALIZE","VO.SCENE.BANK_PAYMENT"],"s":"What is suggested about Ms. Steinhaus's e-mail?","o":["It was written before the invoice was issued.","It was sent to an address no longer in use.","It falls outside the period allowed for queries.","It arrived after the payment was due."],"a":2,"e":"The invoice was issued on 5 July and allows fourteen days for written queries, but her message is dated 21 July. Payment is not due until 4 August, so it is the query window she has missed.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T2"},{"id":"MXC-T06-195","p":7,"f":"MXT06","q":195,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.EMAIL","TX.INVOICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What does Ms. Steinhaus request for 6 August?","o":["A meeting with the building manager","A goods-lift reservation longer than usual","More time to pay the invoice","Access to the rear car park"],"a":1,"e":"She needs the goods lift for about two hours, whereas the notice limits reservations to half-hour slots, so she asks for an exception.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T2"},{"id":"MXC-T06-196","p":7,"f":"MXT06","q":196,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.MEMO","TX.SCHEDULE","TX.WEB","FD.READ.SCAN","VO.SCENE.EVENT_CONFERENCE"],"s":"What does the web page indicate about the Thursday workshop?","o":["It is included in the full-forum fee.","It is repeated on Friday morning.","It is held away from the convention centre.","Places are given out in the order payments arrive."],"a":3,"e":"The workshop carries a $95 supplement and “places … are allocated in the order in which payments arrive”, which is also why it filled early last year.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T3"},{"id":"MXC-T06-197","p":7,"f":"MXT06","q":197,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.MEMO","TX.SCHEDULE","TX.WEB","FD.READ.SCAN","VO.SCENE.EVENT_CONFERENCE"],"s":"According to the agenda, what will Dr. Zawadzka speak about?","o":["Attracting technicians to the industry","The certification of welded assemblies","How maintenance money is actually spent","The planning of a shutdown week"],"a":2,"e":"Her opening address is titled “Where maintenance budgets actually go”. The other topics belong to the tracks and the afternoon panel.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T3"},{"id":"MXC-T06-198","p":7,"f":"MXT06","q":198,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.MEMO","TX.SCHEDULE","TX.WEB","VO.PARA.CAUSE_EFFECT","VO.SCENE.EVENT_CONFERENCE"],"s":"Why does Mr. Vosloo tell two colleagues to book the workshop as soon as they register?","o":["It is likely to be full before registration closes.","Refunds are no longer possible after 12 September.","The member rate is withdrawn at the end of the month.","The venue needs the numbers in order to open Room 5."],"a":0,"e":"The web page says the twenty-five places go in order of payment and that last year the workshop was full ten days before registration closed.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T3"},{"id":"MXC-T06-199","p":7,"f":"MXT06","q":199,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.DETAIL_NUMBER","TX.TRIPLE","TX.MEMO","TX.SCHEDULE","TX.WEB","QT.P7X.CALC_LOOKUP.SCHEDULE","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.EVENT_CONFERENCE"],"s":"How much will the company pay for Ms. Tanaka's registration?","o":["$250","$430","$525","$560"],"a":1,"e":"She attends both days at the member rate her manager's nomination gives her, which is $430; the $560 figure applies to non-members who are not nominated.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T3"},{"id":"MXC-T06-200","p":7,"f":"MXT06","q":200,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.MEMO","TX.SCHEDULE","TX.WEB","VO.PARA.GENERALIZE","VO.SCENE.EVENT_CONFERENCE"],"s":"What will Ms. Ganguly and Mr. Demir be unable to attend?","o":["The opening address","The panel on technicians","The vibration workshop","The annual lecture"],"a":3,"e":"They come on the Thursday only, and the annual lecture opens the Friday. Everything else listed takes place on the Thursday.","d":3,"t":65,"src":"open","b":"MXC-T06-P7-T3"}],"bundles":[{"id":"P6-B1","p":6,"f":"P6-A","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Ryan Brooks\nFrom: Dana Whitfield, Pinecrest Office Supply\nDate: March 3\nSubject: Your order #20581","x":"Dear Mr. Brooks,\n\nThank you for your recent order of 40 desk chairs. Unfortunately, the model you selected is currently out of stock, and our supplier {{131}} new chairs to us until March 17. {{132}} If you would like the similar model, please reply to this e-mail by March 6. Otherwise, we will ship your original order as soon as it {{133}}. We are sorry for the delay and thank you for your {{134}}.\n\nSincerely,\nDana Whitfield\nCustomer Service"}],"qs":["PL6-1-1","PL6-1-2","PL6-1-3","PL6-1-4"]},{"id":"P6-B2","p":6,"f":"P6-A","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"NOTICE TO ALL TENANTS","x":"The parking garage at Harbor View Tower will be closed for {{135}} from Monday, June 8, to Friday, June 12. During this time, tenants may park in the public lot on Ash Street, which is a five-minute walk from the building. Parking there normally costs $12 per day. {{136}}, the building management has agreed to cover this cost. To receive your money back, simply keep your parking receipts and bring {{137}} to the front desk by June 19. {{138}}"}],"qs":["PL6-2-1","PL6-2-2","PL6-2-3","PL6-2-4"]},{"id":"P6-B3","p":6,"f":"P6-A","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"MEMO\nTo: All Sales Staff\nFrom: Grace Lin, Training Manager\nDate: September 14\nRe: Customer service workshop","x":"{{139}} The workshop will focus on handling customer complaints over the phone and by e-mail. Each session lasts two hours and {{140}} by Martin Hale, an experienced trainer from Clearpath Consulting. Sessions will be offered on September 28 and October 5. Staff members who {{141}} the workshop will receive a certificate. Please sign up for one session online by September 21. Space is {{142}}, so early registration is recommended. If neither date works for you, please speak with your team leader."}],"qs":["PL6-3-1","PL6-3-2","PL6-3-3","PL6-3-4"]},{"id":"P6-B4","p":6,"f":"P6-A","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Local Bakery to Open Third Store","x":"BRIDGEPORT (May 2) — Golden Oak Bakery will open its third location next month on Carter Avenue. The family-owned business started as a small shop on Main Street in 2015 and has grown steadily since then. The new store {{143}} seating for up to 80 customers, which is twice the size of the original shop. Owner Lisa Moreno said the larger space will also include a training kitchen. {{144}} Classes will be {{145}} on weekends, and the first one is planned for June 20. {{146}}, the bakery will hire about fifteen new employees for the Carter Avenue location."}],"qs":["PL6-4-1","PL6-4-2","PL6-4-3","PL6-4-4"]},{"id":"P6-B5","p":6,"f":"P6-B","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Riverside Hotel\n45 Bay Road\n\nDear Ms. Alvarez,","x":"Thank you for staying at the Riverside Hotel last week. We were sorry to learn that the air conditioner in your room was not working {{131}} your stay. Our maintenance team has since replaced the unit, and we have also checked the air conditioners in every other room on your floor. As a way of saying sorry, we would like to offer you a free night on {{132}} next visit. This offer is valid {{133}} December 31. {{134}}\n\nSincerely,\nPaul Ng\nGuest Services Manager"}],"qs":["PL6-5-1","PL6-5-2","PL6-5-3","PL6-5-4"]},{"id":"P7-S1","p":7,"f":"P7-A","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Anna Ruiz [9:14 A.M.]\nHi Tom, I'm at the Grandview Hotel for the client meeting, but the front desk says our room isn't ready.\nTom Becker [9:15 A.M.]\nReally? I booked the Garden Room for 9:30.\nAnna Ruiz [9:16 A.M.]\nThey say it's still being cleaned after an event last night. They can give us the Lake Room instead, but it only seats six.\nTom Becker [9:18 A.M.]\nThere are only five of us today.\nAnna Ruiz [9:19 A.M.]\nGreat. I'll tell them we'll take it."}],"qs":["PL7-S1-1","PL7-S1-2"]},{"id":"P7-S2","p":7,"f":"P7-A","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"E-mail","x":"From: Helen Park, Office Manager\nTo: All staff, Westbrook Design\nDate: April 8\nSubject: Kitchen improvements\n\nDear all,\n\nI am pleased to let you know that the second-floor kitchen will be improved next week. The work will begin on Monday, April 15, and should be finished by Thursday, April 18. During this time, the kitchen will be closed, but the coffee machine in the third-floor meeting area will be available to everyone.\n\nThe improvements include a larger refrigerator, a new dishwasher, and two more microwave ovens. These changes are a direct result of the comments many of you made in last month's staff survey.\n\nBefore the work begins, please remove all personal items, including food and cups, from the kitchen by 5 P.M. on Friday, April 12. Anything left after that time will be thrown away.\n\nThank you,\nHelen"}],"qs":["PL7-S2-1","PL7-S2-2","PL7-S2-3"]},{"id":"P7-S3","p":7,"f":"P7-A","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Lakeside Library Opens Digital Learning Center","x":"NORTH BAY (October 3) — The Lakeside Public Library opened its new Digital Learning Center on Saturday. — [1] — The center, located on the library's second floor, offers twenty computers, two printers, and a recording room for local residents.\n\nThe project was paid for by money from the Harmon Foundation, along with gifts from several local businesses. — [2] — Library director Sandra Cole said the center was designed for people of all ages. \"Many residents told us they wanted help with basic computer skills,\" she said. \"Others wanted a quiet place to work on job applications.\" — [3] —\n\nFree classes will be held every Tuesday and Thursday evening, starting October 10. Topics include using e-mail, writing a résumé, and keeping personal information safe online. Each class is limited to twelve people, so residents should sign up at the information desk. — [4] —"}],"qs":["PL7-S3-1","PL7-S3-2","PL7-S3-3","PL7-S3-4"]},{"id":"P7-S4","p":7,"f":"P7-A","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"ATTENTION GUESTS\n\nThe pool and fitness center on the fifth floor will be closed on Wednesday, July 9, from 7:00 A.M. to 3:00 P.M. for regular cleaning. During these hours, guests may use the fitness room at our partner, Summit Gym, located across the street. Simply show your room key at the Summit Gym front desk. Towels will be provided there. We are sorry for any inconvenience.\n\n— The Management, Bayshore Hotel"}],"qs":["PL7-S4-1","PL7-S4-2"]},{"id":"P7-S5","p":7,"f":"P7-A","k":"single","tt":"TX.INVOICE","docs":[{"t":"TX.INVOICE","h":"Order confirmation","x":"Greenleaf Catering — Order Confirmation\nCustomer: Kessler Partners (contact: Mia Lambert)\nEvent date: Friday, November 14, 12:00 P.M.\nDelivery address: 220 River Road, 4th Floor\n\nItem | Quantity | Price\nSandwich tray (serves 10) | 3 | $135.00\nFruit tray (serves 10) | 2 | $70.00\nCoffee and tea service | 1 | $45.00\nDelivery | — | $20.00\nTotal | | $270.00\n\nNote: Orders of $250 or more receive free delivery. The delivery charge above will be removed from your final bill."}],"qs":["PL7-S5-1","PL7-S5-2"]},{"id":"P7-S6","p":7,"f":"P7-A","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Leo Grant [10:02 A.M.]\nThe delivery truck from Norland Paper just called. They're stuck in traffic and won't get here until 2:00.\nRita Shah [10:03 A.M.]\nThat's a problem. We need that paper to print the brochures for the trade show, and they have to be ready by 5:00 today.\nLeo Grant [10:04 A.M.]\nHow long does the print job take?\nRita Shah [10:05 A.M.]\nAbout four hours.\nSam Ortega [10:06 A.M.]\nI can ask the print shop on Elm Street if they have enough paper.\nRita Shah [10:07 A.M.]\nPlease do. If they can start by noon, we'll still finish on time.\nSam Ortega [10:12 A.M.]\nThey can. They'll need the final design files, though.\nRita Shah [10:13 A.M.]\nLeave that to me.\nLeo Grant [10:14 A.M.]\nThen I'll call Norland and tell them to bring the paper next week instead."}],"qs":["PL7-S6-1","PL7-S6-2","PL7-S6-3","PL7-S6-4"]},{"id":"P7-D1","p":7,"f":"P7-A","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.WEB","h":"Web page","x":"Carlton Business Forum — Spring Workshops\nOur spring workshops give small business owners practical skills they can use right away. All workshops are held at the Carlton Community Center, and coffee is provided.\n\nWorkshop | Date | Time | Leader\nWriting Strong Business Plans | April 4 | 9:00–11:00 A.M. | Diane Webb\nSocial Media for Small Shops | April 4 | 1:00–3:00 P.M. | Kevin Moss\nManaging Your Cash Flow | April 11 | 9:00–11:00 A.M. | Priya Nair\nHiring Your First Employee | April 11 | 1:00–3:00 P.M. | Diane Webb\n\nCost: $25 per workshop, or $80 for all four. Forum members receive a 20 percent discount. Please register or make changes at least three days before each workshop."},{"t":"TX.EMAIL","h":"E-mail","x":"From: Omar Haddad\nTo: Carlton Business Forum\nDate: April 2\nSubject: Registration change\n\nHello,\n\nI registered for both of the April 11 workshops last week. However, I have just learned that I need to meet with a supplier on the afternoon of April 11. Could I switch that workshop for the one led by Kevin Moss? I am very interested in his topic because I recently opened a second store and would like to attract more young customers online.\n\nAs a forum member, I paid the member price, so I believe no extra payment should be needed. Please let me know as soon as possible whether this change is possible.\n\nBest regards,\nOmar Haddad"}],"qs":["PL7-D1-1","PL7-D1-2","PL7-D1-3","PL7-D1-4","PL7-D1-5"]},{"id":"P7-T1","p":7,"f":"P7-A","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"Bright Print Co. — Business Card Printing\n\nMake a strong first impression with cards from Bright Print Co. We have served local businesses for more than twenty years.\n\nStandard (plain paper): $30 per 500 cards\nPremium (thick, high-quality paper): $45 per 500 cards\nDesign service: $20 per new design (free for orders of 2,000 cards or more)\nCards using a design we already have on file: no design charge\n\nRegular delivery: 5 business days, free\nExpress delivery: 2 business days, add $15\n\nAll prices include tax. If you are not happy with your cards, contact us within 14 days of delivery and we will print them again for free."},{"t":"TX.INVOICE","h":"Invoice","x":"Bright Print Co. — Invoice #7713\nDate: May 6\nCustomer: Julia Chen, Fairway Accounting\n\nPremium business cards (1,000 cards) | $90.00\nDesign service | $20.00\nExpress delivery | $15.00\nTotal | $125.00\n\nPayment is due within 30 days of the invoice date. Thank you for your business!"},{"t":"TX.EMAIL","h":"E-mail","x":"From: Julia Chen\nTo: Bright Print Co.\nDate: May 13\nSubject: Invoice #7713\n\nHello,\n\nI received my business cards yesterday, and I am very happy with both the paper and the design. However, there is a problem with the invoice. When I placed the order, I chose regular delivery because I was not in a hurry. I have checked my order confirmation e-mail, and it also shows regular delivery. Please correct the charge and send me a new invoice. I will pay the full amount as soon as I receive it.\n\nAlso, three new staff members joined our office this month, so I would like to order 1,000 more cards on the cheaper paper. Please use the same design as my last order, with regular delivery. The new cards should show the same office address and phone number. Because these cards are for new employees, I will send you their names and job titles in a separate e-mail by Friday.\n\nThank you,\nJulia Chen"}],"qs":["PL7-T1-1","PL7-T1-2","PL7-T1-3","PL7-T1-4","PL7-T1-5"]},{"id":"MXC-T01-P6-B1","p":6,"f":"MXT01","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: All Staff\nFrom: Yolanda Pratt, Finance Director\nDate: 4 August\nSubject: New expense system","x":"Beginning on 1 September, all travel and entertainment expenses must be submitted through our new online portal, ClaimTrack. The paper forms currently in use will no longer be {{131}} after that date.\n\nClaimTrack allows you to photograph receipts with your phone and attach them directly to a claim. {{132}} Claims submitted with legible receipts are normally reimbursed within five working days.\n\nTraining sessions will be held in Room 2B during the last week of August. Attendance is not mandatory, but we strongly {{133}} it for anyone who submits claims regularly.\n\nIf you have questions, contact the finance help desk at extension 3300. Thank you for your {{134}} during the transition."}],"qs":["MXC-T01-131","MXC-T01-132","MXC-T01-133","MXC-T01-134"]},{"id":"MXC-T01-P6-B2","p":6,"f":"MXT01","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Letter","x":"Dear Ms. Okonjo,\n\nThank you for your order of 12 March for forty ergonomic desk chairs. Unfortunately, our supplier has informed us that the model you selected is {{135}} out of stock until early May.\n\nWe understand that this delay is inconvenient. {{136}} It is identical in design and carries the same five-year warranty, but it is available for immediate shipment.\n\nIf you would rather wait for your original selection, we will hold your order and {{137}} the delivery charge as a gesture of goodwill. Please let us know your decision by 25 March.\n\nWe {{138}} your understanding and value your continued business.\n\nSincerely,\n\nMarcus Fenn\nCustomer Relations, Alderbrook Office Interiors"}],"qs":["MXC-T01-135","MXC-T01-136","MXC-T01-137","MXC-T01-138"]},{"id":"MXC-T01-P6-B3","p":6,"f":"MXT01","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: Marketing Department\nFrom: Building Services\nRe: Relocation to the fourth floor\n\nOur department will move to the fourth floor over the weekend of 14-15 June. Packing crates will be delivered to your current work area on 12 June, and the movers will begin loading at six P.M. on Friday.\n\nPlease label every crate with your name and your new desk number. Crates that are not labelled {{139}} be placed in general storage, and retrieving them may take several days.\n\n{{140}} Anything you no longer need should be placed in the recycling bins beside the service lift.\n\nPersonal electronics, keys and confidential files should be carried by hand rather than packed. The company cannot accept {{141}} for valuables left in crates.\n\nYour network connection will be restored by Monday morning. If your telephone or computer is not working when you {{142}}, call the help desk at extension 5115."}],"qs":["MXC-T01-139","MXC-T01-140","MXC-T01-141","MXC-T01-142"]},{"id":"MXC-T01-P6-B4","p":6,"f":"MXT01","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"PROFESSIONAL DEVELOPMENT GRANTS — Applications now open\n\nNorthwind Industries will fund up to £1,200 per employee this year for external courses, conferences and professional certifications. Any member of staff who has completed at least twelve months of continuous service is {{143}} to apply.\n\nApplications are reviewed twice a year, in April and October. Because the fund is limited, priority {{144}} to courses that relate directly to your current role or to a position you are actively preparing for.\n\n{{145}} Applications submitted without one are returned unread.\n\nSuccessful applicants are asked to share what they have learned with their team, either through a short presentation or a written summary. This requirement is taken {{146}}, and it is the main reason the programme has kept growing since 2019.\n\nForms are available on the intranet under Human Resources."}],"qs":["MXC-T01-143","MXC-T01-144","MXC-T01-145","MXC-T01-146"]},{"id":"MXC-T01-P7-S1","p":7,"f":"MXT01","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"HILLCREST COMMUNITY POOL — Summer schedule change\n\nFrom 1 July to 31 August, the pool will open at 6:00 A.M. on weekdays instead of 7:00 A.M. The additional hour is reserved for lane swimming only; recreational swimming begins at 8:00 A.M. as usual.\n\nWeekend hours are unchanged: 8:00 A.M. to 8:00 P.M.\n\nMembers who wish to use the early hour must reserve a lane through the Hillcrest app no more than two days in advance. Walk-in access during that hour cannot be guaranteed.\n\nQuestions may be directed to the front desk or to schedule@hillcrestpool.example."}],"qs":["MXC-T01-147","MXC-T01-148"]},{"id":"MXC-T01-P7-S2","p":7,"f":"MXT01","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Dara Whitfield (10:42 A.M.)\nThe projector in the Aspen Room won't turn on. I have twelve clients arriving at eleven.\n\nOwen Baptiste (10:44 A.M.)\nTry the second remote, in the drawer under the table. The first one has been dead for a week.\n\nDara Whitfield (10:47 A.M.)\nFound it — still nothing. The green light on the unit isn't on either.\n\nOwen Baptiste (10:48 A.M.)\nThen it's the power strip, not the projector. Move to the Birch Room, it's free until two. I'll bring the spare laptop cable up.\n\nDara Whitfield (10:49 A.M.)\nYou're a lifesaver. Could you also let reception know, so they redirect people?\n\nOwen Baptiste (10:50 A.M.)\nAlready texting them."}],"qs":["MXC-T01-149","MXC-T01-150"]},{"id":"MXC-T01-P7-S3","p":7,"f":"MXT01","k":"single","tt":"TX.AD","docs":[{"t":"TX.AD","h":"Advertisement","x":"KETTLE & KIN — Now hiring, all locations\n\nKettle & Kin operates eleven neighbourhood cafés across the metropolitan area. We are currently recruiting for the following positions:\n\nBaristas (full and part time) — no experience necessary; paid four-week training provided\nShift Leaders — minimum one year of food-service supervision required\nBakers — 4:00 A.M. start; previous production baking experience essential\n\nAll employees receive one free meal per shift, a 40% discount on retail items, and transit reimbursement of up to £70 per month. Full-time staff join our health plan after ninety days.\n\nWe promote from within: nine of our eleven current store managers began as baristas.\n\nApply in person at any location with a printed résumé, or online at kettleandkin.example/jobs. Interviews are held on Tuesdays and Thursdays."}],"qs":["MXC-T01-151","MXC-T01-152","MXC-T01-153"]},{"id":"MXC-T01-P7-S4","p":7,"f":"MXT01","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: Priya Raman <p.raman@vellmarkdesign.example>\nFrom: Colin Aduba <c.aduba@northgatelibrary.example>\nDate: 8 October\nSubject: Signage project — revised scope","x":"Dear Ms. Raman,\n\nThank you for the proposal you submitted last week for the interior signage at our Northgate branch. The design committee reviewed it on Monday and was impressed by the wayfinding concept, particularly the colour coding by floor.\n\nWe do need to revise the scope before we can approve a contract. The renovation of the third floor has been deferred to next year, so signage for that floor should come out of the current phase. That reduces the number of panels from fifty-eight to forty-one.\n\nWe would also like to add six free-standing directory units for the ground-floor lobby, which were not in the original brief.\n\nCould you send a revised quotation covering both changes by 18 October? Our board meets on 22 October and I would like to bring a final figure to that meeting.\n\nOne further note: the library will remain open throughout installation, so any work in public areas must take place after 6:00 P.M.\n\nBest regards,\n\nColin Aduba\nFacilities Manager, Northgate Library"}],"qs":["MXC-T01-154","MXC-T01-155","MXC-T01-156"]},{"id":"MXC-T01-P7-S5","p":7,"f":"MXT01","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"MARITIME QUARTER GETS A SECOND LIFE\n\nPORTHAVEN (14 May) — For thirty years the warehouses along Dock Road stood empty, too solid to fall down and too awkward to convert. This month the first of them reopened as the Porthaven Makers' Yard, a shared workshop for eighty small manufacturers.\n\nThe conversion was funded by a mix of city grants and rent paid in advance by future tenants — an unusual arrangement that the project's director, Ines Cardozo, says was the only way to begin. [1] \"Banks wanted a finished building before they would lend, and we needed money before we could finish one,\" she said. [2]\n\nTenants pay between £180 and £600 a month depending on floor area, well below the £1,100 average for comparable industrial space in the city. [3] In exchange, they commit to a three-year lease and to opening their workshops to the public one Saturday a month.\n\n[4] Two further warehouses are scheduled for conversion, the second of them due to open in eighteen months. Ms. Cardozo expects demand to keep outrunning supply: the Makers' Yard received more than four hundred applications for its eighty units."}],"qs":["MXC-T01-157","MXC-T01-158","MXC-T01-159"]},{"id":"MXC-T01-P7-S6","p":7,"f":"MXT01","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Rosalind Achebe (2:03 P.M.)\nHas anyone heard back from Tamsin about the Q3 figures? I need them for the deck by Thursday.\n\nPeter Lindqvist (2:05 P.M.)\nShe's out until Wednesday. Her out-of-office message says to contact Devi for anything urgent.\n\nDevi Sharma (2:06 P.M.)\nI have the raw numbers but not the commentary. I can send you a spreadsheet this afternoon if that helps.\n\nRosalind Achebe (2:07 P.M.)\nThe numbers are what I need — I'll write the commentary myself. Are the returns figures final?\n\nDevi Sharma (2:09 P.M.)\nEverything except September returns. Those close on Friday, so the total could still move by half a percent.\n\nPeter Lindqvist (2:10 P.M.)\nThen mark that slide \"provisional\". Ravi got asked about a similar number in July and it was awkward.\n\nRosalind Achebe (2:11 P.M.)\nGood call. Devi, send whatever you have and I'll flag the returns line."}],"qs":["MXC-T01-160","MXC-T01-161","MXC-T01-162"]},{"id":"MXC-T01-P7-S7","p":7,"f":"MXT01","k":"single","tt":"TX.LETTER","docs":[{"t":"TX.LETTER","h":"Letter","x":"Ferrand & Hoyle Chartered Surveyors\n14 Blackfriars Row, Leeds LS1 4QQ\n\n2 November\n\nMr. Anselm Krige\nKrige Timber Products\nUnit 9, Calder Industrial Estate\n\nDear Mr. Krige,\n\nFollowing my inspection of the roof structure at Unit 9 on 28 October, I am writing to summarise my findings ahead of the full report, which will reach you within ten working days.\n\nThe steel frame is in sound condition, and I found no evidence of the corrosion that concerned you. The staining on the north wall is the result of a blocked gutter rather than any failure of the roof covering itself. Clearing the gutter and renewing approximately four metres of flashing should resolve it. I would expect that work to cost between £900 and £1,400.\n\nI must, however, draw your attention to a separate matter. The roof lights above the finishing bay are the original 1987 units and have become brittle. They are not a safety hazard at present, but I would not recommend deferring their replacement beyond the next two years.\n\nMy full report will include photographs, moisture readings and a schedule of recommended works with indicative costs.\n\nYours sincerely,\n\nBernadette Hoyle, MRICS"}],"qs":["MXC-T01-163","MXC-T01-164","MXC-T01-165"]},{"id":"MXC-T01-P7-S8","p":7,"f":"MXT01","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"www.tovarahotels.example/harbourside/reviews\n\nTOVARA HARBOURSIDE — Guest reviews (page 1 of 46)\n\n★★★★☆  \"Right for a working trip, less so for a holiday\"\nReviewed by G. Almeida — stayed three nights in February\n\nI booked the Harbourside for a conference at the centre next door, and for that purpose it is hard to beat. The walk takes four minutes, the business centre is open around the clock, and the front desk had my printing waiting for me when I came down at 6:30 A.M.\n\nThe room itself was quiet and generously sized, with a desk you can actually work at rather than the narrow shelf most hotels install. Housekeeping never once moved my papers, which I appreciated more than I expected to.\n\nTwo reservations. First, the restaurant closes at nine, which is early for a hotel of this size; on my second evening I ended up eating a sandwich from the lobby shop. Second, the much-advertised harbour view applies to roughly a third of the rooms — mine faced the car park, and nobody mentioned that when I booked.\n\nI would return for work without hesitation. If I were bringing my family, I would look at the Tovara Bayside instead, which I gather has a pool.\n\nWas this review helpful?  [Yes 214]  [No 11]"}],"qs":["MXC-T01-166","MXC-T01-167","MXC-T01-168","MXC-T01-169"]},{"id":"MXC-T01-P7-S9","p":7,"f":"MXT01","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMO\n\nTo: All laboratory staff\nFrom: Yusuf Bello, Quality Manager\nDate: 15 May\nSubject: Calibration logs\n\nBeginning Monday, calibration entries must be made in the electronic log at the moment of calibration, not at the end of the shift. Our auditor flagged fourteen entries last month that had been recorded up to nine hours after the reading was taken.\n\nThe tablets mounted at each bench are now configured for log entry, so there is no longer any reason to walk to the office terminal.\n\nPaper logs will be collected on Friday and archived. Do not continue to use them in parallel: duplicate records were the second finding in the audit.\n\nBench leaders will review entries every Monday morning."}],"qs":["MXC-T01-170","MXC-T01-171"]},{"id":"MXC-T01-P7-S10","p":7,"f":"MXT01","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Information","x":"CALDERWOOD FILM FESTIVAL — Volunteer information\n\nThank you for volunteering. Please read this page carefully; it answers most of the questions we receive.\n\nSHIFTS\nMorning 8:00 A.M. – 1:00 P.M.  |  Afternoon 12:30 P.M. – 5:30 P.M.  |  Evening 5:00 P.M. – 10:30 P.M.\nShifts overlap by thirty minutes so that duties can be handed over in person. Do not leave your post until your replacement has arrived.\n\nROLES\nBox office — ticket collection and same-day sales. The Friday training session is required.\nUshers — seating, accessibility assistance, screening-room checks. No training required.\nHospitality — the filmmakers' lounge. Volunteers must be eighteen or over.\nTransport — collecting guests from the station. A valid driving licence and two years' driving experience are required.\n\nWHAT WE PROVIDE\nA festival pass valid for any screening on days you are not working, two meal vouchers per shift, and a volunteer jacket (returnable at the end of the festival).\n\nWHAT WE ASK\nArrive fifteen minutes before your shift begins. Wear dark trousers or a dark skirt with the jacket. Photography inside the screening rooms is not permitted, even during your break.\n\nCANCELLATIONS\nTelephone the volunteer line on 0900 55 21 44. Please do not cancel by e-mail — that inbox is not monitored during festival week."}],"qs":["MXC-T01-172","MXC-T01-173","MXC-T01-174","MXC-T01-175"]},{"id":"MXC-T01-P7-D1","p":7,"f":"MXT01","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.AD","h":"Advertisement","x":"MERIDIAN WORKS — Flexible workspace in central Bristol\n\nHot Desk — £145/month — unreserved desk, 8 A.M. to 8 P.M. on weekdays\nResident Desk — £260/month — your own desk, 24-hour access\nStudio (2-4 people) — £680/month — lockable room, 24-hour access\nStudio Plus (5-8 people) — £1,240/month — lockable room, 24-hour access, dedicated meeting room\n\nEvery plan includes high-speed internet, printing (500 pages a month), a business address for post, and eight hours of bookable meeting-room time per month. Studio Plus members have unlimited meeting-room use.\n\nMembers who pay twelve months in advance receive one month free.\n\nTours run Monday to Thursday between 10 A.M. and 4 P.M. Book at meridianworks.example/tour or call 0117 496 2210."},{"t":"TX.EMAIL","h":"To: hello@meridianworks.example\nFrom: t.nakashima@bramblecode.example\nDate: 4 September\nSubject: Enquiry — team of six","x":"Hello,\n\nI run a software consultancy that is outgrowing my flat. There are six of us at the moment and we expect to stay that size for at least a year.\n\nLooking at your list, the £1,240 option seems to be the one that fits, and the dedicated meeting room is the deciding factor — we run client calls most afternoons and cannot do that in an open room.\n\nThree questions.\n\n1. We would like to pay for the full year up front to take advantage of your offer. Does that have to be a single payment, or can it be split across two invoices?\n2. Two of my colleagues work from midnight until eight in the morning. I assume our plan covers that, but I would like it confirmed.\n3. Is there anywhere secure to leave two desktop machines and a small server overnight?\n\nI would also like to arrange a tour. Wednesday or Thursday afternoon next week would suit me best.\n\nKind regards,\n\nTomoko Nakashima\nBramblecode Ltd"}],"qs":["MXC-T01-176","MXC-T01-177","MXC-T01-178","MXC-T01-179","MXC-T01-180"]},{"id":"MXC-T01-P7-D2","p":7,"f":"MXT01","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.ARTICLE","h":"Article","x":"TRANSIT AUTHORITY TRIMS ROUTE 42\n\nEASTVALE (2 November) — The Eastvale Transit Authority will shorten Route 42 from 14 December, ending the service at Fenwick Interchange rather than continuing to Marley Green. The authority says the final three stops carried an average of eleven passengers a day last year, against a network average of two hundred and forty.\n\nRiders travelling beyond Fenwick will be able to transfer to the new Route 42B minibus, which will run hourly on weekdays and every ninety minutes on Saturdays. There will be no Sunday service.\n\nDeputy director Hana Vogel said the change would let the authority add two morning departures on Route 42 itself, where crowding has been the subject of repeated complaints. \"We are moving capacity to where the passengers are,\" she said.\n\nThe authority held two public meetings in September. Attendance was low — nineteen people in total — a fact critics attribute to the meetings' 2 P.M. start."},{"t":"TX.LETTER","h":"Letter to the editor","x":"To the Editor,\n\nYour report on Route 42 repeated the transit authority's figure of eleven passengers a day without asking how it was produced.\n\nI have used the Marley Green stop for nine years. The count was taken in the first week of August, when the packing plant that employs most of us shuts for its annual holiday. In any other week the 7:10 service alone carries fifteen to twenty of us.\n\nI do not dispute that the two extra morning departures are needed; the buses from Fenwick are genuinely overcrowded. But the replacement minibus runs hourly, and my shift starts at 6:45 A.M. An hourly service that does not begin until seven is not a replacement — it is a removal.\n\nAs for the public meetings, I would gently point out that a two o'clock meeting on a Tuesday is not accessible to people who work shifts. That is presumably why nineteen people came.\n\nConstance Ebele\nMarley Green"}],"qs":["MXC-T01-181","MXC-T01-182","MXC-T01-183","MXC-T01-184","MXC-T01-185"]},{"id":"MXC-T01-P7-T1","p":7,"f":"MXT01","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.JOB_POSTING","h":"Job posting","x":"POSITION: Conservation Technician\nEmployer: Ardwell Institute of Maritime History\nClosing date: 30 January\n\nThe Institute seeks a conservation technician to join its four-person team working on the Corrievreckan collection of recovered ship fittings.\n\nRequirements\n- A degree in conservation, materials science or a related field\n- At least two years' hands-on experience with waterlogged wood or ferrous metals\n- Familiarity with photographic documentation standards\n- Willingness to work occasional weekends during exhibition installation\n\nDesirable\n- Experience with polyethylene glycol treatment\n- A second language (Norwegian or Dutch are particularly useful given our partner institutions)\n\nThe post is full time and based at our Leith workshop. Salary £31,500-£36,000 depending on experience.\n\nTo apply, send a covering letter, a CV and the names of two referees to recruitment@ardwellinstitute.example. Please do not send portfolios at this stage; shortlisted candidates will be asked to bring one to interview."},{"t":"TX.EMAIL","h":"To: recruitment@ardwellinstitute.example\nFrom: e.solheim@nordvestmuseum.example\nDate: 22 January\nSubject: Application — Conservation Technician","x":"Dear Recruitment Team,\n\nI am writing to apply for the Conservation Technician post advertised on your website.\n\nI hold an MSc in Conservation Science from Gothenburg and have spent the past three years at the Nordvest Museum in Ålesund, working almost exclusively on waterlogged oak recovered from two eighteenth-century wrecks. Roughly half of that time has involved polyethylene glycol treatment, including the reprocessing of forty timbers that had been unsuccessfully treated in the 1980s.\n\nI am a native Norwegian speaker and read Dutch competently, though I do not speak it well.\n\nI should mention that I will be at a conference in Lisbon from 3 to 7 February. I could attend an interview by video link during that week if necessary, but I would much prefer to come in person and am free from 10 February onwards.\n\nMy CV is attached, together with the details of two referees. I have not attached a portfolio, in line with your instructions, but can bring one.\n\nYours faithfully,\n\nElise Solheim"},{"t":"TX.SCHEDULE","h":"Schedule","x":"CONSERVATION TECHNICIAN — INTERVIEW SCHEDULE\nLeith Workshop, Room 2 — please arrive fifteen minutes early\n\nThursday 12 February\n09:30  Marcus Trent\n11:00  Elise Solheim\n13:30  Priya Kaur\n\nFriday 13 February\n09:30  Domhnall Reid\n11:00  Yusra Kassim\n\nEach interview lasts approximately seventy-five minutes and consists of a panel discussion, a fifteen-minute portfolio presentation and a short practical exercise at the bench. Candidates should bring safety footwear if they have it; spare pairs are available in sizes 5 to 12.\n\nPanel: Dr. Aileen Frost (chair), Mr. Tobias Lund, Ms. Rowan Petrie"}],"qs":["MXC-T01-186","MXC-T01-187","MXC-T01-188","MXC-T01-189","MXC-T01-190"]},{"id":"MXC-T01-P7-T2","p":7,"f":"MXT01","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.WEB","h":"Web page","x":"BRISTLECONE OUTDOOR — Tarn 2 tent\n\nWeight: 1.9 kg packed\nSleeps: 2\nWaterproof rating: 4,000 mm flysheet, 6,000 mm groundsheet\nPoles: aluminium alloy, colour-coded\nPrice: £249\n\nThe Tarn 2 was designed for three-season use in exposed conditions. Its low profile and six guy points make it unusually stable in wind for a tent of this weight.\n\nTwo doors and two vestibules mean neither occupant has to climb over the other. The inner tent can be pitched on its own in dry conditions, or the flysheet used alone as a shelter.\n\nNot recommended for winter mountaineering or for use below -5 °C.\n\nEvery Bristlecone tent carries a five-year guarantee against manufacturing defects. Damage from ordinary wear, accidents or misuse is not covered, but our Bristlecone Mend service will repair almost anything for a fixed fee of £40 plus parts.\n\nFree delivery on orders over £100. Returns accepted within sixty days provided the tent has not been pitched outdoors."},{"t":"TX.REVIEW","h":"Customer review","x":"★★★☆☆  \"Excellent tent, one design flaw\"\nReviewed by H. Okwuosa — verified purchase\n\nTwenty-two nights in this tent across Snowdonia and the Cairngorms, including one night of sustained fifty-mile-an-hour wind on a col where I fully expected to be walking out at three in the morning. It did not move. The six guy points are not marketing.\n\nThe two doors are worth the extra two hundred grams over a single-door tent, and being able to pitch the inner on its own was genuinely useful in Spain last month.\n\nMy complaint is the zip on the left vestibule, which snagged on the storm flap from the second week and has now failed completely. Looking at the forum, I am not the first. Whether that counts as a manufacturing defect or as ordinary wear is presumably a matter of opinion, and I suspect I know which way it will go.\n\nWould still buy it again."},{"t":"TX.REVIEW","h":"Response","x":"Response from Bristlecone Outdoor — Customer Care\n\nThank you for this, and for the detail — a col in the Cairngorms in fifty-mile-an-hour wind is exactly what the Tarn 2 was designed for.\n\nOn the vestibule zip: you are right that this has come up before. We changed the storm-flap geometry on units manufactured after March this year for precisely that reason. Tents made before that date are covered by the guarantee for this specific fault, wear or not, and we are treating it as a manufacturing issue rather than sending it to Mend.\n\nPlease contact us with your order number and we will collect the tent and either repair or replace it at no cost to you. If you need it before your next trip, tell us the date and we will send a replacement out first.\n\nWe have also added a note to the product page.\n\n— Ravi Kulkarni, Customer Care"}],"qs":["MXC-T01-191","MXC-T01-192","MXC-T01-193","MXC-T01-194","MXC-T01-195"]},{"id":"MXC-T01-P7-T3","p":7,"f":"MXT01","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO ACCOUNT HOLDERS — Change to invoicing\n\nFrom 1 April, Harlow Trade Supplies will issue invoices electronically only. Paper invoices will no longer be posted.\n\nElectronic invoices are sent to the billing e-mail address held on your account. Please check that this address is current by logging in at harlowtrade.example/account before 25 March.\n\nPayment terms are unchanged: thirty days from the invoice date. However, accounts settled within ten days will now receive a 2% early-settlement discount, applied as a credit on your following invoice rather than deducted from the payment itself.\n\nCustomers who need a paper invoice for accessibility reasons should write to accounts@harlowtrade.example. We will continue to post invoices to those accounts at no charge.\n\nTrade counter receipts are not affected by this change."},{"t":"TX.INVOICE","h":"Invoice","x":"HARLOW TRADE SUPPLIES\nInvoice 44-20817\nInvoice date: 6 April\nAccount: Pemberton Joinery (PJ-3391)\nBilling e-mail: accounts@pembertonjoinery.example\n\nItem / Qty / Unit price / Total\nOak veneer sheet, 2440 x 1220 / 14 / £38.00 / £532.00\nBeech edging, 50 m roll / 6 / £22.50 / £135.00\nWood adhesive, 5 L / 4 / £31.00 / £124.00\nDelivery (next day) / 1 / £18.00 / £18.00\n\nSubtotal £809.00\nVAT (20%) £161.80\nTOTAL DUE £970.80\n\nPayment due: 6 May\nEarly settlement (paid by 16 April): 2% credit — £19.42"},{"t":"TX.EMAIL","h":"To: accounts@harlowtrade.example\nFrom: r.pemberton@pembertonjoinery.example\nDate: 9 April\nSubject: Invoice 44-20817","x":"Hello,\n\nTwo things about this invoice.\n\nFirst, we ordered twelve sheets of oak veneer, not fourteen. Fourteen were delivered and our workshop signed for them, so I accept that this is partly our own fault, but we cannot use the extra two. Can they be collected and credited?\n\nSecond, I will pay the balance on Monday 13 April, which I believe still qualifies for the early-settlement credit. I would like to confirm that the credit will appear on our May invoice rather than reducing Monday's payment, because otherwise our bookkeeper will pay the wrong amount.\n\nWhile I have your attention: we did not receive this invoice by e-mail. It arrived by post, which I assume is a leftover from the old system. The address on our account is correct — I checked it in March.\n\nRegards,\n\nRhian Pemberton\nPemberton Joinery"}],"qs":["MXC-T01-196","MXC-T01-197","MXC-T01-198","MXC-T01-199","MXC-T01-200"]},{"id":"MXC-T02-P6-B1","p":6,"f":"MXT02","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: All Export Desk Staff\nFrom: Bertil Lindqvist, Operations Manager\nDate: 12 May\nSubject: Customs paperwork from 1 June","x":"From 1 June, every consignment leaving our Rotterdam depot must {{131}} by an electronic customs declaration lodged at least four hours before collection. The paper declaration will remain valid only for shipments booked before that date.\n\nLodging a declaration takes about ten minutes on the Trade Gateway portal. {{132}}, the system stores each exporter's details, so a repeat customer can be processed in a fraction of that time.\n\n{{133}} Please raise them with your team leader rather than with the carrier, as the carrier is not party to the new arrangement.\n\nLog-in details will be sent to your work address on 26 May. Drivers will not be permitted to leave the yard {{134}} a declaration reference is attached to the manifest."}],"qs":["MXC-T02-131","MXC-T02-132","MXC-T02-133","MXC-T02-134"]},{"id":"MXC-T02-P6-B2","p":6,"f":"MXT02","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO RESIDENT GUESTS — LIFT REFURBISHMENT\n\nThe two guest lifts in the north wing will be out of service from 3 to 17 October while their control systems are replaced. {{135}} Signs at every landing will direct you to it.\n\nHousekeeping will make an additional round of the north wing at 11 A.M. each day. Guests who need assistance {{136}} their luggage should call the front desk on extension 2, and a porter will be sent up.\n\nWe {{137}} that this work would cause the least disruption in October, when occupancy is at its lowest. Even so, guests on the upper floors may prefer a room closer to the ground. The duty manager will move you to the south wing at no extra charge, {{138}} to availability.\n\nThank you for your understanding.\n\nIlse Vandenberg, General Manager"}],"qs":["MXC-T02-135","MXC-T02-136","MXC-T02-137","MXC-T02-138"]},{"id":"MXC-T02-P6-B3","p":6,"f":"MXT02","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: Features and Production teams\nFrom: Rosalía Marchetti, Managing Editor\nDate: 9 February\nRe: Spring issue deadlines\n\nThe printer has brought its schedule forward by a week, so the spring issue must be signed off on 6 March. All feature copy therefore needs to reach the subeditors' desk no {{139}} than 24 February.\n\nPhotography is the tightest part of the timetable. Anyone commissioning a shoot should obtain {{140}} approval from the picture desk before the fee is agreed, since we cannot process variations once a contract has been issued.\n\nThe picture desk has agreed to work through the weekend of 1 March, but that goodwill {{141}} on the rest of us filing on time. Please flag any image you know will need retouching as soon as you send in the copy that goes with it.\n\n{{142}} The full timetable is pinned in the shared calendar."}],"qs":["MXC-T02-139","MXC-T02-140","MXC-T02-141","MXC-T02-142"]},{"id":"MXC-T02-P6-B4","p":6,"f":"MXT02","k":"single","tt":"TX.AD","docs":[{"t":"TX.AD","h":"Advertisement","x":"HALDEN HOUSE — Conference and Events Centre, Trondheim\n\nFifteen minutes from the airport and {{143}} reached by rail from the city centre, Halden House hosts residential meetings for ten to two hundred delegates.\n\nEight meeting rooms, every one of them with daylight and adjustable lighting. Day-delegate rates from €165 per person, including two breaks, a hot lunch and unlimited filter coffee. {{144}}\n\nOur kitchen builds each menu around {{145}} the region's farms and boats supply that week, so the spring and autumn cards are never quite the same.\n\nResidential delegates stay in one of forty rooms in the courtyard wing. Bookings of more than thirty rooms {{146}} a dedicated coordinator from the day the contract is signed.\n\nAsk for our full pack: events@haldenhouse.example or +47 73 55 41 20."}],"qs":["MXC-T02-143","MXC-T02-144","MXC-T02-145","MXC-T02-146"]},{"id":"MXC-T02-P7-S1","p":7,"f":"MXT02","k":"single","tt":"TX.MEMO","docs":[{"t":"TX.MEMO","h":"Memo","x":"MEMORANDUM\n\nTo: All dock supervisors, Halvorsen Freight Terminal\nFrom: Ingrid Solheim, Terminal Operations Manager\nDate: 3 March\nSubject: Bay assignments during resurfacing\n\nThe eastern yard will be resurfaced from 16 to 27 March. Bays 7 through 12 will be closed for the full two weeks, which leaves us nine working bays instead of fifteen.\n\nTo keep turnaround times under forty minutes, every inbound carrier must hold a booked arrival window for the duration of the works. Drivers who arrive without one will be asked to rebook, and that applies to the carriers we see every day as much as to anyone else. Please make this clear to them before the closure begins rather than at the gate.\n\nSupervisors should also move the two afternoon container collections to the 6 A.M. slot, where the schedule has more room.\n\nI will circulate the revised bay chart on 10 March."}],"qs":["MXC-T02-147","MXC-T02-148"]},{"id":"MXC-T02-P7-S2","p":7,"f":"MXT02","k":"single","tt":"TX.CHAT","docs":[{"t":"TX.CHAT","h":"Online chat discussion","x":"Priya Raghunathan (10:12) The printer has just called. The paper we specified for the Ostrowski cookbook is out of stock until mid-May.\n\nDaniel Okonjo (10:14) That is three weeks after our launch date. Can they substitute?\n\nPriya Raghunathan (10:15) They can, but only with a lighter stock. The photographs would lose a lot of their depth.\n\nDaniel Okonjo (10:17) The photographs are the book. I would rather move the launch than print it on the wrong paper.\n\nPriya Raghunathan (10:19) Marketing has already booked us into two food festivals on the last weekend in April.\n\nDaniel Okonjo (10:21) Then they can rebook. Ask the printer to hold the original stock for us and I will speak to Marketing this afternoon.\n\nPriya Raghunathan (10:22) Will do. I will let the studio know as well."}],"qs":["MXC-T02-149","MXC-T02-150"]},{"id":"MXC-T02-P7-S3","p":7,"f":"MXT02","k":"single","tt":"TX.AD","docs":[{"t":"TX.AD","h":"Advertisement","x":"THE GRANARY AT ELDBERG — Events by the water\n\nA restored 1890s grain store on the harbour front, twenty minutes from the airport, for conferences, receptions and product launches.\n\nThe Loft — seated 120, standing 200 — river-facing terrace\nThe Mill Room — seated 60, standing 90 — original timber beams\nThe Vault — seated 24 — boardroom layout, natural light\n\nHire of any of the three rooms includes wireless internet, a technician on site for the whole of your booking, staging and lectern, and parking for thirty cars. Catering comes from our own kitchen; outside caterers cannot be admitted.\n\nWeekday hire from €900, Saturday hire from €1,600. Bookings confirmed more than six months ahead are held at the current year's rates, whatever the increase in the meantime.\n\nViewings by appointment, Tuesday to Friday. Write to bookings@granaryeldberg.example."}],"qs":["MXC-T02-151","MXC-T02-152","MXC-T02-153"]},{"id":"MXC-T02-P7-S4","p":7,"f":"MXT02","k":"single","tt":"TX.EMAIL","docs":[{"t":"TX.EMAIL","h":"To: r.almeida@vestbyimports.example\nFrom: claims@northgateforwarding.example\nDate: 11 October\nSubject: Consignment NG-448120","x":"Dear Ms. Almeida,\n\nThank you for your message of 9 October about the twelve pallets of ceramic tableware that reached your Rotterdam warehouse with damaged outer packaging.\n\nOur driver's handheld records show that the consignment left our Gdansk depot intact and was transferred to a partner vehicle at Hanover. We have asked that partner for its own loading photographs and expect them within three working days.\n\nIn the meantime, please do not dispose of the damaged cartons. A surveyor will visit your warehouse on 15 October to inspect them, and no claim can proceed without that inspection.\n\nOnce the surveyor's report reaches us, we will settle any confirmed loss within twenty-one days, in line with clause 9 of our carriage terms.\n\nYours sincerely,\n\nMarek Zielinski\nClaims Officer, Northgate Forwarding"}],"qs":["MXC-T02-154","MXC-T02-155","MXC-T02-156"]},{"id":"MXC-T02-P7-S5","p":7,"f":"MXT02","k":"single","tt":"TX.ARTICLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\n\nHalden House to launch audio imprint\n\nBERGEN, 5 June — Halden House, an independent publisher of travel and food writing, today announced Halden Audio, an imprint that will record titles from its backlist as well as new books.\n\n— [1] — The first twelve recordings will be made in a studio the company has built inside its Bergen offices, rather than hired by the day as it has done until now. — [2] — Halden expects to release two audio titles a month from September.\n\n“Our readers have been asking for this for years, and until now we could not answer them at a price that worked,” said Sofia Berntsen, managing director. — [3] —\n\nThe imprint will be led by Tomás Ferreira, who joins from a broadcasting background and will oversee narrator casting and studio scheduling. — [4] — Halden Audio titles will be sold through the company's own site and through the main audiobook retailers.\n\nMedia enquiries: press@haldenhouse.example"}],"qs":["MXC-T02-157","MXC-T02-158","MXC-T02-159"]},{"id":"MXC-T02-P7-S6","p":7,"f":"MXT02","k":"single","tt":"TX.TEXT_MSG","docs":[{"t":"TX.TEXT_MSG","h":"Text-message chain","x":"Amara Nwachukwu (16:41) I am at the Fjordlyng conference centre. The tables are laid for 90, which matches the guest list I was given, but the organiser tells me she is expecting 110.\n\nLukas Weber (16:44) The organiser added twenty places this morning. I sent the new list to your old address by mistake. Sorry.\n\nAmara Nwachukwu (16:46) That explains it. Can the van bring twenty more covers and chairs? We have enough food.\n\nLukas Weber (16:49) Piotr is loading now. He can be with you by half past five.\n\nAmara Nwachukwu (16:50) Cutting it fine. Doors at six.\n\nLukas Weber (16:52) Ask the centre for their stacking chairs as a fallback. They keep them behind the stage.\n\nAmara Nwachukwu (16:55) Doing that now. If Piotr is on time we will not need them."}],"qs":["MXC-T02-160","MXC-T02-161","MXC-T02-162"]},{"id":"MXC-T02-P7-S7","p":7,"f":"MXT02","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Notice","x":"NOTICE TO GUESTS — Lift refurbishment, 4-8 February\n\nThe two guest lifts in the north wing will be out of service from 07:00 on Monday 4 February until 18:00 on Friday 8 February while their cabins are replaced.\n\nWhile the work is under way:\n\n- The service lift beside the kitchen will carry guests between the ground floor and floors 1 to 6. A porter will operate it from 06:30 until midnight.\n- Guests with reduced mobility who are booked on floors 4 to 6 will be moved to equivalent rooms on floors 1 and 2 at no extra cost. Please speak to reception on arrival.\n- Luggage will be collected from and delivered to rooms on request; dial extension 4.\n- Breakfast will be served in the Harbour Room on the ground floor rather than in the sixth-floor restaurant.\n\nThe south wing lifts are unaffected. We are sorry for the disruption and thank you for your patience.\n\nGuest Services"}],"qs":["MXC-T02-163","MXC-T02-164","MXC-T02-165"]},{"id":"MXC-T02-P7-S8","p":7,"f":"MXT02","k":"single","tt":"TX.WEB","docs":[{"t":"TX.WEB","h":"Web page","x":"www.kestrelline.example/services/bonded-storage\n\nKestrel Line — Bonded storage\n\nKestrel Line operates 18,000 square metres of customs-bonded warehousing at the Port of Trelleby. Goods held in a bonded facility are not taxed until they are released for sale, which frees capital while stock waits for a buyer.\n\nWhat we hold\nPalletised dry goods, wines and spirits, and packaged food with a shelf life of six months or more. We cannot accept chilled or frozen cargo, live plants, or hazardous material of any class.\n\nWhat it costs\nStorage is charged per pallet per week, from €4.10, with the rate falling once a customer keeps more than 200 pallets with us. Handling in and out is billed separately at €7.50 per pallet movement.\n\nReporting\nEvery customer receives a stock file each night and can also run the same report from the customer portal at any hour. Discrepancies raised before noon are investigated the same day.\n\nTo open an account, complete the enquiry form. Accounts are normally active within five working days."}],"qs":["MXC-T02-166","MXC-T02-167","MXC-T02-168","MXC-T02-169"]},{"id":"MXC-T02-P7-S9","p":7,"f":"MXT02","k":"single","tt":"TX.INVOICE","docs":[{"t":"TX.INVOICE","h":"Receipt","x":"LINDVALL & DAUGHTERS — Catering\nReceipt no. 20-6614\nDate: 22 November\n\nClient: Sable & Quill Publishing\nEvent: Autumn author reception, Ravnholt Hall\nGuests: 85\n\nCanapé service, 8 items per guest .......... €1,275.00\nSparkling wine, 14 bottles ................... €322.00\nNon-alcoholic bar ............................ €170.00\nStaff, 6 servers for 5 hours ................. €900.00\nDelivery and collection ....................... €95.00\n\nSubtotal ................................... €2,762.00\nDeposit paid 3 October ...................... -€500.00\nBalance received 22 November ............... €2,262.00\n\nSettled in full by bank transfer. Thank you for your custom.\n\nGlassware is hired and must be returned within three working days; after that a charge of €4 applies for each missing glass. Please report breakages to accounts@lindvalldaughters.example rather than replacing items yourself."}],"qs":["MXC-T02-170","MXC-T02-171"]},{"id":"MXC-T02-P7-S10","p":7,"f":"MXT02","k":"single","tt":"TX.NOTICE","docs":[{"t":"TX.NOTICE","h":"Information","x":"TIDEWATER QUARTERLY — Subscriber information\n\nTidewater Quarterly is published in March, June, September and December. Print copies are posted in the last week of the preceding month; digital editions appear on the first day of the month of publication.\n\nRates\nDigital only — €38 a year\nPrint only — €62 a year\nPrint and digital — €74 a year\nStudents and library staff pay half the print-and-digital rate on production of a valid card.\n\nChanging your address\nTell us at least three weeks before an issue is posted. Copies returned to us as undeliverable are not replaced free of charge; a replacement costs €9 including postage.\n\nBack issues\nIssues from the past four years are on the website for subscribers at no cost. Earlier issues must be ordered from the office and are subject to availability.\n\nGift subscriptions begin with the next issue to be published rather than the current one. A card announcing the gift is sent to the recipient in the week the subscription starts."}],"qs":["MXC-T02-172","MXC-T02-173","MXC-T02-174","MXC-T02-175"]},{"id":"MXC-T02-P7-D1","p":7,"f":"MXT02","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.WEB","h":"Web page","x":"VELLUM & VINE — PUBLISHING SERVICES FOR INDEPENDENT AUTHORS\nHome | Services | Prices | Contact\n\nManuscript Assessment — €390\nA senior editor reads the complete text and returns a report of eight to ten pages. Turnaround: 15 working days.\n\nCopy-editing — €0.021 per word\nGrammar, consistency and house style. Turnaround: 20 working days for texts under 90,000 words; 30 working days above that length.\n\nInterior Design and Typesetting — €640\nPrint-ready files in two formats, including one round of corrections. Further rounds are billed at €95 each.\n\nCover Design — €520\nThree initial concepts, then unlimited revisions of the concept you select.\n\nAuthors who book three or more services in a single order receive a 15% reduction on the total.\n\nAssessments booked before 30 September are returned in 10 working days rather than 15.\n\nTo begin, complete the form on our Contact page. We reply within two working days."},{"t":"TX.EMAIL","h":"To: studio@vellumandvine.example\nFrom: e.adeyemi@parrowlane.example\nDate: 12 September\nSubject: Order for “The Quiet Terminal”","x":"Dear Ms. Brandt,\n\nFollowing our telephone conversation on Tuesday, I would like to place an order for three of your services: the assessment, the copy-edit and the cover. The manuscript runs to 82,000 words.\n\nI am not taking the typesetting, as the distributor I have signed with supplies its own interior template and will not accept files prepared elsewhere.\n\nI am sending the manuscript for assessment this week rather than in October, because the ten-day turnaround matters to me: the book launches in March and the schedule leaves no room.\n\nCould you confirm one thing before I pay? The reduction for booking three services — does it still apply when one of the three is priced per word rather than at a fixed rate?\n\nKind regards,\n\nEfemena Adeyemi"}],"qs":["MXC-T02-176","MXC-T02-177","MXC-T02-178","MXC-T02-179","MXC-T02-180"]},{"id":"MXC-T02-P7-D2","p":7,"f":"MXT02","k":"double","tt":"TX.DOUBLE","docs":[{"t":"TX.ARTICLE","h":"Press release","x":"FOR IMMEDIATE RELEASE\nContact: Iwona Baran, Communications Manager — press@nordhaven.example\n\nNORDHAVEN INTERMODAL OPENS KOLVIK RAIL TERMINAL\n\nKOLVIK, 3 May — Nordhaven Intermodal today opened its fourth inland terminal, a 24-hectare rail-served facility 40 kilometres south of the port of Aalgard.\n\nThe site has two 750-metre loading tracks and capacity for 180,000 containers a year. Shuttle trains will run to the port six days a week, removing an estimated 62,000 lorry journeys from the coastal motorway annually.\n\n“Customers have been asking us for an inland option since 2019,” said Petra Solheim, Chief Operating Officer. “Kolvik lets a container leave the quay in the evening and be ready for collection inland before breakfast.”\n\nConstruction took 19 months and cost €114 million, of which €31 million came from a regional transport fund. Ninety-four people have been recruited. A further 40 posts will follow when the second phase, a temperature-controlled warehouse, opens next spring."},{"t":"TX.ARTICLE","h":"Article","x":"Kolvik opens — but hauliers want the gate open longer\nby Marek Ostrowski, Freight Quarterly, 11 May\n\nRegional forwarders have given a guarded welcome to the container terminal that opened at Kolvik last week. The six-day shuttle to Aalgard was widely praised; the road gate was not.\n\nAt present the gate accepts road collections between 6 A.M. and 8 P.M. only. “If a box is ready for us before breakfast, we would like to collect it before breakfast,” said Anneke Ruys, who runs a forwarding firm in Bregge. “At the moment we cannot get through the gate until the morning peak has already started.”\n\nMs. Solheim told Freight Quarterly that a 24-hour gate was “under review” and that any decision would rest on the volumes handled in the first two quarters of operation. She declined to give a date.\n\nThe temperature-controlled warehouse remains on schedule for next spring."}],"qs":["MXC-T02-181","MXC-T02-182","MXC-T02-183","MXC-T02-184","MXC-T02-185"]},{"id":"MXC-T02-P7-T1","p":7,"f":"MXT02","k":"triple","tt":"TX.TRIPLE","docs":[{"t":"TX.SCHEDULE","h":"Itinerary","x":"NORDIC HOSPITALITY FORUM — DELEGATE ITINERARY\nRosenhof Congress Hotel, Bergstad\nPrepared for: Ms. Lucia Ferreira, Camelia Group\n\nTuesday 14 October\n15:00  Check-in (Executive Double)\n18:30  Welcome reception — Orangery\n\nWednesday 15 October\n09:00  Opening plenary — Hall A\n11:00  Workshop as selected: Menu costing — Salon 3\n13:00  Lunch — Terrace Restaurant\n15:00  Workshop as selected: Recruiting seasonal kitchen staff — Salon 5\n19:30  Forum dinner — Grand Ballroom\n\nThursday 16 October\n09:30  Panel: regional sourcing — Hall A\n12:00  Close; rooms to be vacated by 12:00\n\nNotes: workshop places may be exchanged up to 48 hours before the session; write to the registrations desk. Airport transfer is included for delegates landing before 14:00;
