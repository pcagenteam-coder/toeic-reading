<!doctype html>
<html lang="zh-CN">
<head>

<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mut:#6b7684;--pri:#1d3557;--acc:#e76f51;--ok:#2a9d8f;--bad:#d62839;--warn:#f4a261;--line:#e3e7ec;--hl:#fff1a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{max-width:480px;margin:0 auto;padding-bottom:72px}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--pri);color:#fff}
.who{font-size:12px;opacity:.85}
.banner{background:#fff3cd;color:#7a5200;padding:8px 12px;font-size:13px}
main{padding:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:6px 0 8px;font-size:12px;color:var(--mut)}
.tabs button i{display:block;font-style:normal;font-size:18px}
.tabs button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:10px 0 6px}
.mut{color:var(--mut);font-size:13px}.sm{font-size:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.big{font-size:30px;font-weight:700;color:var(--pri)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font-size:15px}
.btn.ghost{background:#eef1f5;color:var(--ink)}.btn.acc{background:var(--acc)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:#eef1f5;font-size:12px;margin:2px}
.chip.on{background:var(--pri);color:#fff}
.tasks{display:grid;grid-template-columns:1fr;gap:8px}
.task{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.task b{font-size:20px;color:var(--acc)}
.bar{height:8px;background:#e9edf2;border-radius:6px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--ok)}
.gauge{position:relative;height:14px;background:#e9edf2;border-radius:8px;margin:12px 0 4px}
.gauge .rng{position:absolute;top:0;bottom:0;background:rgba(29,53,87,.35);border-radius:8px}
.gauge .pt{position:absolute;top:-3px;width:4px;height:20px;background:var(--pri);border-radius:2px}
.gauge .tg{position:absolute;top:-6px;width:2px;height:26px;background:var(--acc)}
.list .li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border:0}
.li .nm{flex:1;min-width:0;font-size:14px}
.q-top{position:sticky;top:44px;z-index:4;background:var(--bg);padding:6px 0}
.tbar{height:4px;background:#e9edf2;border-radius:3px;overflow:hidden}.tbar>i{display:block;height:100%;background:var(--ok);transition:width .5s linear}
.tbar.over>i{background:var(--bad)}
.passage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap;max-height:48vh;overflow:auto}
.passage.fold{max-height:4.8em;overflow:hidden}
.ph{font-weight:600;margin-bottom:4px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--acc);color:var(--acc);font-weight:600;text-align:center;padding:0 2px}
.blank.cur{background:#fde4dc}
.sen.hl{background:var(--hl)}
.w.vw{background:#d6ecff;border-radius:3px}
.stem{font-size:16px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px;color:var(--ink)}
.opt.sel{border-color:var(--pri);background:#eef3fb}
.opt.ok{border-color:var(--ok);background:#e6f6f3}.opt.no{border-color:var(--bad);background:#fdecee}
.fb{border-left:4px solid var(--ok);background:#fff;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.fb.bad{border-color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tools .chip{cursor:pointer}
.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.qnav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 0;font-size:11px}
.qnav .an{background:#dbe7f6}.qnav .cu{border-color:var(--acc);border-width:2px}.qnav .fl{background:#ffe8a3}
.tabsx{display:flex;gap:6px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;background:#fff}
textarea{min-height:80px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#f7f9fb;border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:20px;color:var(--pri)}
.up{color:var(--ok)}.dn{color:var(--bad)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.rank{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--acc);color:#fff;font-size:12px}
</style>
</head>

<script>window.TDATA={"v":"v2-2026-10-21","items":[{"id":"PL5-001","p":5,"f":"P5-A","q":124,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.COLLO.VERB_NOUN","VO.SCENE.OFFICE_ADMIN","QT.P5.IDENTIFY"],"s":"Please ------- the attached form and return it to the front desk by Friday.","o":["attend","achieve","perform","complete"],"a":3,"e":"四个都是动词 → 词汇题。宾语是 the attached form（附件表格），“填写表格”固定说 complete a form，所以选 complete。","d":2,"t":29,"src":"pilot","dr":{"0":"attend 搭配会议/活动（attend a meeting）","1":"achieve 搭配目标/结果（achieve a goal），不说 achieve a form","2":"perform 搭配任务/表演（perform a task）"}},{"id":"PL5-002","p":5,"f":"P5-A","q":101,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN","VO.SCENE.RETAIL_SHOPPING","QT.P5.IDENTIFY"],"s":"Customers who spend more than $50 will receive a 10 percent ------- on their next purchase.","o":["receipt","discount","deposit","budget"],"a":1,"e":"线索是 10 percent 和 next purchase：消费满 50 美元，下次购物打九折，“折扣”= discount。","d":1,"t":26,"src":"pilot","dr":{"0":"receipt 是收据，不能是“10%”","2":"deposit 是押金/定金，不是优惠","3":"budget 是预算，和顾客下次购物无关"}},{"id":"PL5-003","p":5,"f":"P5-A","q":109,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADJ","VO.CONF.SYN_ADJ","VO.CONF.FORM_ADJ","VO.SCENE.HOTEL_LODGING","QT.P5.IDENTIFY"],"s":"The hotel offers ------- breakfast to all guests who book directly through its Web site.","o":["complimentary","complementary","previous","considerate"],"a":0,"e":"酒店给直接在官网订房的客人提供“免费”早餐，complimentary = free。小心形近词 complementary（互补的）。","d":3,"t":32,"src":"pilot","dr":{"1":"complementary 是“互补的”，只差一个字母的形近词","2":"previous 是“之前的”，“之前的早餐”不通","3":"considerate 是“体贴的”，形容人，不形容早餐"}},{"id":"PL5-004","p":5,"f":"P5-A","q":113,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADV","VO.CONF.ADV_TIME","VO.SCENE.TRAVEL_FLIGHT","QT.P5.IDENTIFY"],"s":"Mr. Patel's flight was delayed, so he arrived ------- after the presentation had started.","o":["highly","closely","shortly","nearly"],"a":2,"e":"shortly after = “……之后不久”，是固定的时间表达。航班晚点，所以演讲开始后不久才到。","d":3,"t":32,"src":"pilot","dr":{"0":"highly 修饰程度（highly recommended），不修饰时间","1":"closely 是“密切地/仔细地”，不是“不久”","3":"nearly 是“几乎”，不放在 after 前表示时间"}},{"id":"PL5-005","p":5,"f":"P5-A","q":126,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.COLLO.VERB_NOUN","VO.SCENE.RECRUIT","QT.P5.IDENTIFY"],"s":"The position requires the ability to ------- several projects at the same time.","o":["manage","contain","attract","operate"],"a":0,"e":"招聘要求：能同时“管理”好几个项目，manage projects 是固定搭配。","d":2,"t":29,"src":"pilot","dr":{"1":"contain 是“包含”，人不能 contain 项目","2":"attract 是“吸引”，意思不通","3":"operate 搭配机器/设备（operate a machine），不搭 projects"}},{"id":"PL5-006","p":5,"f":"P5-A","q":110,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN","VO.SCENE.EVENT_CONFERENCE","QT.P5.IDENTIFY"],"s":"Due to high demand, ------- for the marketing workshop has been extended until April 12.","o":["attendance","registration","location","invitation"],"a":1,"e":"因为报名的人多，“报名”截止被延长到 4 月 12 日。has been extended until + 日期，能被延长的是 registration（报名期）。","d":2,"t":29,"src":"pilot","dr":{"0":"attendance 是出席人数/出席，不会被“延长到某天”","2":"location 是地点，和延长日期无关","3":"invitation 是邀请，不是可延长的期限"}},{"id":"PL5-007","p":5,"f":"P5-A","q":123,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADJ","VO.COLLO.ADJ_PREP","VO.SCENE.FINANCE_ACCOUNT","QT.P5.IDENTIFY"],"s":"All travel costs are ------- for reimbursement if receipts are submitted within 30 days.","o":["aware","capable","eligible","responsible"],"a":2,"e":"be eligible for = “有资格获得”：交了收据，差旅费就“可以报销”。看形容词后面的介词 for 和主语（费用）。","d":3,"t":32,"src":"pilot","dr":{"0":"aware 后接 of，且主语要是人","1":"capable 后接 of，不接 for","3":"responsible for 是“负责”，主语要是人，费用不能负责"}},{"id":"PL5-008","p":5,"f":"P5-A","q":102,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADV","VO.SCENE.CONSTRUCTION_MAINT","QT.P5.IDENTIFY"],"s":"The work on the lobby is ------- complete, and the main entrance will reopen next week.","o":["hardly","closely","lately","nearly"],"a":3,"e":"大厅工程“快”完成了，所以下周入口重开。nearly complete = almost finished。","d":2,"t":29,"src":"pilot","dr":{"0":"hardly 是“几乎不”，和“下周重新开放”矛盾","1":"closely 是“密切地”，不能修饰 complete","2":"lately 是“最近”，不修饰 complete 的程度"}},{"id":"PL5-009","p":5,"f":"P5-A","q":112,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.CONF.SYN_VERB_PATTERN","VO.SCENE.ORDER_SHIP","QT.P5.IDENTIFY"],"s":"If your package has not arrived within five business days, please ------- our customer service team.","o":["reply","contact","inform","respond"],"a":1,"e":"空格后直接接宾语 our customer service team，“联系客服”用及物动词 contact。respond/reply 都要加 to。","d":2,"t":29,"src":"pilot","dr":{"0":"reply 后要加 to 才能接对象","2":"inform 是“通知某人某事”，要 inform sb of sth，这里缺内容且意思不对","3":"respond 是不及物动词，要说 respond to"}},{"id":"PL5-010","p":5,"f":"P5-A","q":106,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN","VO.SCENE.TECH_IT","QT.P5.IDENTIFY"],"s":"Employees should report any ------- with their computers to the IT help desk immediately.","o":["problems","requirements","solutions","conditions"],"a":0,"e":"电脑有“问题”要马上报告给技术部，problems with 是常见搭配。","d":1,"t":26,"src":"pilot","dr":{"1":"requirements 是要求，和 report…immediately 不搭","2":"solutions 是解决办法，员工不用向技术部报告“办法”","3":"conditions 是条件/状况，意思不具体"}},{"id":"PL5-011","p":5,"f":"P5-A","q":107,"n":"QT.P5.VOCAB","ns":["VO.LEX.ADJ","VO.COLLO.ADJ_NOUN","VO.SCENE.CORP_STRATEGY","QT.P5.IDENTIFY"],"s":"Thanks to its ------- growth in Asia, Delmont Electronics plans to open three new offices next year.","o":["urgent","frequent","eager","rapid"],"a":3,"e":"因为在亚洲“快速”增长，所以要开新办公室。rapid growth 是固定搭配。","d":2,"t":29,"src":"pilot","dr":{"0":"urgent 是“紧急的”，意思不对","1":"frequent 是“频繁的”，不说 frequent growth","2":"eager 形容人“渴望的”，不修饰 growth"}},{"id":"PL5-012","p":5,"f":"P5-A","q":127,"n":"QT.P5.VOCAB","ns":["VO.LEX.VERB","VO.SCENE.MEETING_SCHEDULE","QT.P5.IDENTIFY"],"s":"The board meeting has been ------- until next Thursday because several members are traveling.","o":["canceled","attended","postponed","located"],"a":2,"e":"几位董事在出差，所以会议“推迟”到下周四。postpone … until + 时间。","d":2,"t":29,"src":"pilot","dr":{"0":"canceled 是取消，取消了就不会再“到下周四”","1":"attended 是出席，不能接 until next Thursday","3":"located 是“位于”，意思不通"}},{"id":"PL5-013","p":5,"f":"P5-A","q":121,"n":"QT.P5.VOCA ssive after a modal, “must be + past participle”.","d":3,"t":22,"src":"open"},{"id":"MXC-T01-123","p":5,"f":"MXT01","q":123,"n":"QT.P5.CONNECTOR_MIX","ns":["GR.CONN.PREP_VS_CONJ"],"s":"The company installed additional lighting ------- the parking area would be safer at night.","o":["so that","in order to","due to","as well as"],"a":0,"e":"“so that” introduces a full clause with its own subject and verb; “in order to” would be followed by an infinitive.","d":3,"t":22,"src":"open"},{"id":"MXC-T01-124","p":5,"f":"MXT01","q":124,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.VERB_SLOT"],"s":"The programme is designed to ------- new hires with the company's safety procedures.","o":["familiar","familiarity","familiarize","familiarly"],"a":2,"e":"After “to”, the bare infinitive is required: “familiarize someone with something”.","d":3,"t":22,"src":"open"},{"id":"MXC-T01-125","p":5,"f":"MXT01","q":125,"n":"QT.P5.RELATIVE","ns":["GR.REL.REL_PRONOUN"],"s":"The Hartwell Building, ------- was completed in 1998, will undergo a full renovation next spring.","o":["that","which","where","who"],"a":1,"e":"A non-defining relative clause between commas with an inanimate antecedent takes “which”; “that” cannot follow a comma.","d":3,"t":22,"src":"open"},{"id":"MXC-T01-126","p":5,"f":"MXT01","q":126,"n":"QT.P5.PAIR_GRAMMAR","ns":["GR.PRON.DETERMINER_QUANT"],"s":"------- of the two remaining candidates holds the required certification, so we will reopen the search.","o":["Both","Either","Neither","None"],"a":2,"e":"The sense is negative — the search is being reopened — and there are only two candidates, so “Neither”, agreeing in the singular with “holds”. “None” would imply at least three.","d":3,"t":22,"src":"open"},{"id":"MXC-T01-127","p":5,"f":"MXT01","q":127,"n":"QT.P5.VOCAB","ns":["VO.LEX.NOUN"],"s":"Ridgeway Consulting has built a strong ------- for delivering projects ahead of schedule.","o":["reputation","recognition","reference","reaction"],"a":0,"e":"“build a reputation for m computers inside the building.","Reimbursement rates have been revised for the coming year."],"a":0,"e":"The previous sentence explains that receipts are photographed, so the logical consequence is that no paper copies need keeping. Still mailing paper receipts, or restricting the portal to office computers, would contradict the paragraph.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B1"},{"id":"MXC-T01-133","p":6,"f":"MXT01","q":133,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","TX.EMAIL","VO.SCENE.TECH_IT"],"s":"","o":["recommend","recommended","recommending","recommendation"],"a":0,"e":"The subject “we” needs a finite present-tense verb: “we strongly recommend it”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B1"},{"id":"MXC-T01-134","p":6,"f":"MXT01","q":134,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.NOUN_AFTER_DET","TX.EMAIL","VO.SCENE.TECH_IT"],"s":"","o":["patient","patience","patiently","patients"],"a":1,"e":"After the possessive determiner “your”, a singular uncountable noun is needed: “your patience”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B1"},{"id":"MXC-T01-135","p":6,"f":"MXT01","q":135,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADV_AUX_SLOT","TX.LETTER","VO.SCENE.ORDER_SHIP"],"s":"","o":["temporary","temporarily","temporariness","temporaries"],"a":1,"e":"The word modifies the adjectival phrase “out of stock”, so an adverb is needed.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B2"},{"id":"MXC-T01-136","p":6,"f":"MXT01","q":136,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.LETTER","VO.SCENE.ORDER_SHIP"],"s":"","o":["We are therefore able to offer an alternative model in the same price range.","Your payment has been refunded in full.","The chairs were unfortunately delivered to the wrong address.","Our showroom is open seven days a week."],"a":0,"e":"The next sentence opens with “It is identical in design”, so the pronoun requires that a replacement model has just been introduced.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B2"},{"id":"MXC-T01-137","p":6,"f":"MXT01","q":137,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","TX.LETTER","VO.SCENE.ORDER_SHIP"],"s":"","o":["waive","raise","charge","require"],"a":0,"e":"“waive a charge” means to drop it — the only sense compatible with “as a gesture of goodwill”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B2"},{"id":"MXC-T01-138","p":6,"f":"MXT01","q":138,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.VERB_SLOT","TX.LETTER","VO.SCENE.ORDER_SHIP"],"s":"","o":["appreciate","appreciated","appreciating","appreciation"],"a":0,"e":"A present-tense closing formula: “We appreciate your understanding”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B2"},{"id":"MXC-T01-139","p":6,"f":"MXT01","q":139,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","TX.MEMO"],"s":"","o":["will","would","were","are"],"a":0,"e":"A certain future consequence of an instruction: “will be placed”. “would” would imply an unreal hypothesis.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B3"},{"id":"MXC-T01-140","p":6,"f":"MXT01","q":140,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.MEMO"],"s":"","o":["This is a good opportunity to reduce the volume of material you store.","The fourth floor has just been completely renovated.","The movers will pack your personal belongings for you.","The relocation has been postponed until July."],"a":0,"e":"The next sentence invites people to discard what they no longer need, so the paragraph must open on sorting. Having the movers pack for you contradicts the labelling instruction, and a July postponement contradicts the memo's own dates.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B3"},{"id":"MXC-T01-141","p":6,"f":"MXT01","q":141,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ","TX.MEMO"],"s":"","o":["responsible","responsibly","responsibility","responsibilities"],"a":2,"e":"“accept responsibility for something”: after the verb, the singular uncountable noun is required.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B3"},{"id":"MXC-T01-142","p":6,"f":"MXT01","q":142,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","TX.MEMO"],"s":"","o":["arrive","arrived","arriving","will arrive"],"a":0,"e":"After a future-referring “when”, English uses the present tense, never “will”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B3"},{"id":"MXC-T01-143","p":6,"f":"MXT01","q":143,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADJ_COMPLEMENT","TX.NOTICE"],"s":"","o":["eligible","eligibly","eligibility","elect"],"a":0,"e":"After the verb “is”, a predicative adjective is needed: “is eligible to apply”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B4"},{"id":"MXC-T01-144","p":6,"f":"MXT01","q":144,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.NOTICE"],"s":"","o":["gives","is given","giving","to give"],"a":1,"e":"“priority” undergoes the action, so the passive: “priority is given to”.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B4"},{"id":"MXC-T01-145","p":6,"f":"MXT01","q":145,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.NOTICE"],"s":"","o":["Every application must include a written endorsement from your line manager.","The grant may also be used towards personal travel.","Applications are accepted at any time during the year.","The programme was suspended for the whole of last year."],"a":0,"e":"“Applications submitted without one” requires that a single mandatory item has just been mentioned — the manager's endorsement. Accepting applications year-round would contradict the April and October rounds.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B4"},{"id":"MXC-T01-146","p":6,"f":"MXT01","q":146,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADV_VERB","TX.NOTICE"],"s":"","o":["serious","seriously","seriousness","more serious"],"a":1,"e":"“take something seriously”: the adverb modifies the verb, in the passive as much as the active.","d":3,"t":30,"src":"open","b":"MXC-T01-P6-B4"},{"id":"MXC-T01-147","p":7,"f":"MXT01","q":147,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.NOTICE","TX.NOTICE","FD.READ.SKIM","VO.SCENE.COMMUNITY_CULTURE"],"s":"What is the purpose of the notice?","o":["To advertise a new membership plan","To announce earlier weekday opening hours","To describe a renovation project","To introduce a new swimming instructor"],"a":1,"e":"“the pool will open at 6:00 A.M. on weekdays instead of 7:00 A.M.”: the point of the notice is the earlier weekday opening.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S1"},{"id":"MXC-T01-148","p":7,"f":"MXT01","q":148,"n":"QT.P7.TRUE_INDICATED","ns":["TX.NOTICE","VO.PARA.WORD_SYNONYM","VO.SCENE.COMMUNITY_CULTURE"],"s":"What is indicated about the early morning hour?","o":["It is open to non-members.","It requires a lane reservation.","It is limited to children.","It costs an additional fee."],"a":1,"e":"“must reserve a lane through the Hillcrest app”. The notice mentions neither an extra fee nor access for non-members.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S1"},{"id":"MXC-T01-149","p":7,"f":"MXT01","q":149,"n":"QT.P7.MAIN_PURPOSE","ns":["TX.TEXT_MSG","FD.READ.SKIM","VO.SCENE.TECH_IT"],"s":"Why does Ms. Whitfield contact Mr. Baptiste?","o":["To reserve a meeting room","To report a piece of equipment that is not working","To request additional chairs","To reschedule a client visit"],"a":1,"e":"Her first message reports that the projector will not turn on. Moving rooms comes later, and at Mr. Baptiste's suggestion.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S2"},{"id":"MXC-T01-150","p":7,"f":"MXT01","q":150,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.TEXT_MSG","TX.TEXT_MSG","FD.READ.DISCOURSE","VO.SCENE.TECH_IT"],"s":"At 10:49 A.M., what does Ms. Whitfield most likely mean when she writes, \"You're a lifesaver\"?","o":["She is grateful for a workable solution.","She wants Mr. Baptiste to attend the meeting.","She is surprised that the projector now works.","She thinks reception has made a mistake."],"a":0,"e":"She is responding to a concrete fix — change rooms, bring a cable — so the phrase expresses gratitude.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S2"},{"id":"MXC-T01-151","p":7,"f":"MXT01","q":151,"n":"QT.P7.INFER_WHO","ns":["TX.AD","VO.PARA.ROLE_REFERENCE","VO.SCENE.RECRUIT"],"s":"What is stated about the barista position?","o":["It requires a year of previous experience.","It includes paid training.","It is available part time only.","It begins early in the morning."],"a":1,"e":"“no experience necessary; paid four-week training provided”. The 4 A.M. start applies to bakers and the year of experience to shift leaders.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S3"},{"id":"MXC-T01-152","p":7,"f":"MXT01","q":152,"n":"QT.P7.DETAIL","ns":["TX.AD","FD.READ.SCAN","VO.SCENE.RECRUIT"],"s":"What benefit is available to every employee?","o":["Enrolment in the health plan","A monthly transit allowance","A private office","Paid leave in December"],"a":1,"e":"“All employees receive […] transit reimbursement of up to £70 per month”. The health plan is limited to full-time staff after ninety days.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S3"},{"id":"MXC-T01-153","p":7,"f":"MXT01","q":153,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.AD","TX.AD","FD.READ.SKIM","VO.SCENE.RECRUIT"],"s":"Why does the advertisement mention the store managers?","o":["To list the company's locations","To explain a recent change in management","To emphasise opportunities for advancement","To identify who conducts the interviews"],"a":2,"e":"“We promote from within” comes immediately before the statistic, so it serves to illustrate prospects for advancement.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S3"},{"id":"MXC-T01-154","p":7,"f":"MXT01","q":154,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.EMAIL","TX.EMAIL","FD.READ.SKIM","VO.SCENE.SALES_DEAL"],"s":"What is the main purpose of the e-mail?","o":["To reject a design proposal","To request an updated price quotation","To confirm an installation date","To ask for additional design samples"],"a":1,"e":"The central request is “Could you send a revised quotation covering both changes by 18 October?”. The original proposal is in fact well received.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S4"},{"id":"MXC-T01-155","p":7,"f":"MXT01","q":155,"n":"QT.P7.TRUE_INDICATED","ns":["TX.EMAIL","VO.PARA.WORD_SYNONYM","VO.SCENE.SALES_DEAL"],"s":"What is indicated about the third floor?","o":["Its signage will be installed first.","Its renovation has been postponed.","It will be permanently closed to the public.","It needs more panels than expected."],"a":1,"e":"“The renovation of the third floor has been deferred to next year” — hence its signage leaving the current phase.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S4"},{"id":"MXC-T01-156","p":7,"f":"MXT01","q":156,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.EMAIL","TX.EMAIL","FD.READ.SCAN","VO.SCENE.SALES_DEAL"],"s":"What restriction does Mr. Aduba mention?","o":["Work in public areas must be done in the evening.","Only library staff may handle the panels.","The budget cannot exceed the original figure.","Installation must be completed before 22 October."],"a":0,"e":"“any work in public areas must take place after 6:00 P.M.”. 22 October is the board meeting, not an installation deadline.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S4"},{"id":"MXC-T01-157","p":7,"f":"MXT01","q":157,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.ARTICLE","TX.ARTICLE","FD.READ.SKIM","VO.SCENE.REAL_ESTATE"],"s":"What is the article mainly about?","o":["A decline in local manufacturing","The reopening of a converted warehouse","A dispute between a city and its lenders","A new residential development"],"a":1,"e":"The subject is the opening of the Porthaven Makers' Yard inside a converted warehouse.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S5"},{"id":"MXC-T01-158","p":7,"f":"MXT01","q":158,"n":"QT.P7.INFERENCE","ns":["QT.P7X.INFERENCE.ARTICLE","TX.ARTICLE","VO.PARA.GENERALIZE","VO.SCENE.REAL_ESTATE"],"s":"What does Ms. Cardozo suggest about conventional bank financing?","o":["It was not available when the project began.","It proved cheaper than expected.","It required a longer lease term.","It was arranged by the city."],"a":0,"e":"Her quotation describes a deadlock: banks wanted a finished building, but money was needed to finish one. Hence the grants-plus-advance-rent arrangement.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S5"},{"id":"MXC-T01-159","p":7,"f":"MXT01","q":159,"n":"QT.P7.INSERTION","ns":["QT.P7X.INSERTION.ARTICLE","TX.ARTICLE","FD.READ.REFERENCE","FD.READ.DISCOURSE","VO.SCENE.REAL_ESTATE"],"s":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong?\n\"The saving comes with an obligation.\"","o":["[1]","[2]","[3]","[4]"],"a":2,"e":"The sentence bridges the low rents mentioned before [3] and the obligation introduced by “In exchange” immediately after.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S5"},{"id":"MXC-T01-160","p":7,"f":"MXT01","q":160,"n":"QT.P7.MAIN_PURPOSE","ns":["TX.CHAT","FD.READ.SKIM"],"s":"Why did Ms. Achebe start the discussion?","o":["To reschedule a Thursday meeting","To obtain data she needs for a presentation","To report an error in a spreadsheet","To ask why a colleague is absent"],"a":1,"e":"“I need them for the deck by Thursday”: she is after the third-quarter figures for her presentation.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S6"},{"id":"MXC-T01-161","p":7,"f":"MXT01","q":161,"n":"QT.P7.INFERENCE","ns":["TX.CHAT","VO.PARA.GENERALIZE"],"s":"What is suggested about the September returns figures?","o":["They have already been finalised.","They will not be included at all.","They were reported incorrectly.","They may still change."],"a":3,"e":"“Those close on Friday, so the total could still move by half a percent.”","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S6"},{"id":"MXC-T01-162","p":7,"f":"MXT01","q":162,"n":"QT.P7.INFERENCE","ns":["TX.CHAT","VO.PARA.GENERALIZE"],"s":"At 2:10 P.M., what does Mr. Lindqvist imply?","o":["Ravi should prepare the slide instead.","The presentation should be postponed.","The July figures turned out to be incorrect.","Presenting an unlabelled estimate has caused a problem before."],"a":3,"e":"He recommends the “provisional” label by citing an awkward precedent: the problem came from the missing caveat, not from the figure itself.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S6"},{"id":"MXC-T01-163","p":7,"f":"MXT01","q":163,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.LETTER","TX.LETTER","FD.READ.SKIM","VO.SCENE.SAFETY"],"s":"Why did Ms. Hoyle write the letter?","o":["To arrange a site inspection","To decline a proposed project","To request payment for a completed report","To provide preliminary findings"],"a":3,"e":"“to summarise my findings ahead of the full report”: these are preliminary conclusions, the inspection having already taken place on 28 October.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S7"},{"id":"MXC-T01-164","p":7,"f":"MXT01","q":164,"n":"QT.P7.DETAIL","ns":["TX.LETTER","FD.READ.SCAN","VO.SCENE.SAFETY"],"s":"What did Ms. Hoyle determine about the staining on the wall?","o":["It indicates corrosion of the steel frame.","Its cause could not be identified.","It requires replacing the entire roof covering.","It was caused by a drainage problem."],"a":3,"e":"“the result of a blocked gutter rather than any failure of the roof covering”: a blocked gutter, so a drainage problem.","d":3,"t":55,"src":"open","b":"MXC-T01-P7-S7"},{"id":"MXC-T01-165","p":7,"f":"MXT01","q":165,"n":"QT.P7.DETAIL","ns":["TX.LETTER","FD.READ.SCAN","VO.SCENE.SAFETY"],"s":"What does Ms. Hoyle recommend concerning the roof lights?","o":["Repairing them before the MXT02","q":137,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","TX.NOTICE","VO.SCENE.HOTEL_LODGING"],"s":"","o":["decide","are deciding","will decide","decided"],"a":3,"e":"“Would cause” is the reported form of “will cause”, which requires a past reporting verb; the timing of the work has already been chosen.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B2"},{"id":"MXC-T02-138","p":6,"f":"MXT02","q":138,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","TX.NOTICE","VO.SCENE.HOTEL_LODGING"],"s":"","o":["related","subject","according","owing"],"a":1,"e":"The set phrase is “subject to availability”, meaning the move depends on a free room. “Owing to” would give availability as the reason for the move.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B2"},{"id":"MXC-T02-139","p":6,"f":"MXT02","q":139,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.COMP.COMPARATIVE","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["later","late","latest","lately"],"a":0,"e":"The comparative pattern “no later than” sets a deadline; “than” cannot follow the superlative “latest”.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B3"},{"id":"MXC-T02-140","p":6,"f":"MXT02","q":140,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.NONFIN.PARTICIPLE_ADJ","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["write","writes","writing","written"],"a":3,"e":"A past participle works as an adjective before the noun: “written approval”, that is, approval given in writing.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B3"},{"id":"MXC-T02-141","p":6,"f":"MXT02","q":141,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.AGREE_SV","FD.SENT.MODIFIER_STRIP","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["depend","depending","depends","to depend"],"a":2,"e":"The subject of the clause is the singular “goodwill”, so the verb takes the third-person -s.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B3"},{"id":"MXC-T02-142","p":6,"f":"MXT02","q":142,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_CLOSING","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["The printer has agreed to absorb the cost of the change.","I know these dates are tighter than usual, and I am grateful for the extra effort.","Please do not commission any new photography this quarter.","The spring issue will be twelve pages longer than the winter one."],"a":1,"e":"The memo has just asked for extra care under a compressed schedule, so a word of thanks closes it naturally before the pointer to the calendar. Banning new photography would contradict the paragraph that explains how to commission a shoot.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B3"},{"id":"MXC-T02-143","p":6,"f":"MXT02","q":143,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADV_VERB","TX.AD","VO.SCENE.MEETING_SCHEDULE"],"s":"","o":["easy","ease","easiness","easily"],"a":3,"e":"The blank modifies the participle “reached”, so an adverb is required: “easily reached by rail”.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B4"},{"id":"MXC-T02-144","p":6,"f":"MXT02","q":144,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.AD","VO.SCENE.MEETING_SCHEDULE"],"s":"","o":["All rooms have been refurbished since the centre changed hands.","Parking is limited to twenty spaces in the summer season.","Evening meals and overnight accommodation are quoted separately.","Delegates are welcome to bring their own audiovisual equipment."],"a":2,"e":"The sentence before lists exactly what the day rate covers, so the natural follow-on states what it does not, and it leads into the paragraphs on dining and rooms.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B4"},{"id":"MXC-T02-145","p":6,"f":"MXT02","q":145,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.REL.REL_WHAT","TX.AD","VO.SCENE.MEETING_SCHEDULE"],"s":"","o":["what","which","that","whose"],"a":0,"e":"The preposition “around” needs an object, and “what” both supplies it and heads the clause, meaning “the things that”. “Which” and “that” would need a noun to attach to.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B4"},{"id":"MXC-T02-146","p":6,"f":"MXT02","q":146,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.AD","VO.SCENE.MEETING_SCHEDULE"],"s":"","o":["assign","are assigned","assigning","have assigned"],"a":1,"e":"The bookings receive a coordinator rather than allocating one, so the passive is needed: “are assigned a dedicated coordinator”.","d":3,"t":30,"src":"open","b":"MXC-T02-P6-B4"},{"id":"MXC-T02-147","p":7,"f":"MXT02","q":147,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MEMO","TX.MEMO","FD.READ.SKIM","VO.SCENE.MEETING_SCHEDULE"],"s":"Why was the memo written?","o":["To introduce a booking system for warehouse customers","To explain how deliveries will be managed during resurfacing work","To announce a permanent reduction in the number of loading bays","To report a rise in the cost of terminal operations"],"a":1,"e":"The memo announces a two-week closure of six bays and then sets out the arrangements — booked arrival windows and revised collection times — that will apply while the yard is resurfaced. The reduction is temporary, not permanent.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S1"},{"id":"MXC-T02-148","p":7,"f":"MXT02","q":148,"n":"QT.P7.REQUEST_ACTION","ns":["QT.P7X.REQUEST_ACTION.MEMO","TX.MEMO","FD.READ.SCAN","VO.SCENE.MEETING_SCHEDULE"],"s":"What are supervisors asked to do about the afternoon container collections?","o":["Divide them between two bays","Suspend them until 27 March","Transfer them to a partner terminal","Move them to an early-morning slot"],"a":3,"e":"“Supervisors should also move the two afternoon container collections to the 6 A.M. slot”. Nothing suggests the collections stop or are given to another terminal.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S1"},{"id":"MXC-T02-149","p":7,"f":"MXT02","q":149,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.CHAT","TX.CHAT","FD.READ.DISCOURSE","VO.SCENE.MARKETING_AD"],"s":"At 10:17, what does Mr. Okonjo most likely mean when he writes, “The photographs are the book”?","o":["The images matter too much to risk a lower-quality paper","The book contains photographs but very little text","The photographer should be credited on the cover","The photographs have not yet been delivered"],"a":0,"e":"Ms. Raghunathan has just said the substitute stock would cost the photographs their depth, and he answers by refusing to print on the wrong paper — so the remark is about how much the images are worth to the book.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S2"},{"id":"MXC-T02-150","p":7,"f":"MXT02","q":150,"n":"QT.P7.DETAIL","ns":["TX.CHAT","FD.READ.SCAN","VO.SCENE.MARKETING_AD"],"s":"What does Mr. Okonjo agree to do?","o":["Approach a second printer","Choose a substitute paper stock","Discuss the schedule with the marketing team","Attend both food festivals"],"a":2,"e":"“I will speak to Marketing this afternoon” — the festivals they booked for April will have to be rearranged. It is Ms. Raghunathan, not Mr. Okonjo, who will contact the printer.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S2"},{"id":"MXC-T02-151","p":7,"f":"MXT02","q":151,"n":"QT.P7.DETAIL","ns":["TX.AD","FD.READ.SCAN","VO.SCENE.MEETING_SCHEDULE"],"s":"What does the hire of every room include?","o":["A choice of outside caterers","Overnight accommodation for guests","Access to the river-facing terrace","The services of a technician"],"a":3,"e":"“Hire of any of the three rooms includes […] a technician on site for the whole of your booking”. The terrace belongs to The Loft alone, and outside caterers are expressly refused.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S3"},{"id":"MXC-T02-152","p":7,"f":"MXT02","q":152,"n":"QT.P7.INFERENCE","ns":["TX.AD","VO.PARA.GENERALIZE","VO.SCENE.MEETING_SCHEDULE"],"s":"Which room would suit a seated dinner for one hundred guests?","o":["The Vault","The Loft","The Mill Room","Any of the three rooms"],"a":1,"e":"Only The Loft seats more than one hundred, at 120. The Mill Room seats 60 and can take 90 only for a standing event, which a dinner is not.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S3"},{"id":"MXC-T02-153","p":7,"f":"MXT02","q":153,"n":"QT.P7.TRUE_INDICATED","ns":["TX.AD","VO.PARA.WORD_SYNONYM","VO.SCENE.MEETING_SCHEDULE"],"s":"What is stated about bookings made well in advance?","o":["They are charged at this year's prices.","They require a larger deposit.","They include additional parking spaces.","They may be cancelled without a fee."],"a":0,"e":"“Bookings confirmed more than six months ahead are held at the current year's rates”, so a later price rise does not reach them.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S3"},{"id":"MXC-T02-154","p":7,"f":"MXT02","q":154,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.EMAIL","TX.EMAIL","FD.READ.SKIM"],"s":"Why did Mr. Zielinski write the e-mail?","o":["To confirm a delivery date for a new consignment","To ask that damaged goods be returned to Gdansk","To explain how a complaint is being handled","To request payment of an overdue invoice"],"a":2,"e":"He replies to Ms. Almeida's message about damaged packaging and sets out each step: the enquiry to the partner carrier, the surveyor's visit, then settlement. The cartons are to stay in Rotterdam, not go back to Gdansk.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S4"},{"id":"MXC-T02-155","p":7,"f":"MXT02","q":155,"n":"QT.P7.REQUEST_ACTION","ns":["QT.P7X.REQUEST_ACTION.EMAIL","TX.EMAIL","FD.READ.SCAN"],"s":"What is Ms. Almeida asked to do?","o":["Photograph the pallets herself","Contact the partner carrier directly","Send a signed copy of clause 9","Keep the damaged cartons until 15 October"],"a":3,"e":"“please do not dispose of the damaged cartons”, because the surveyor arrives on 15 October to inspect them. Northgate is dealing with the partner carrier itself.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S4"},{"id":"MXC-T02-156","p":7,"f":"MXT02","q":156,"n":"QT.P7.INFERENCE","ns":["QT.P7X.INFERENCE.EMAIL","TX.EMAIL","VO.PARA.GENERALIZE"],"s":"What does the e-mail suggest about the damage?","o":["It may have occurred after the goods left Gdansk.","It was limited to one of the twelve pallets.","It was caused by the driver's handheld device.","It has already been paid for in full."],"a":0,"e":"The records show the consignment leaving Gdansk intact, which points to something happening later — hence the request for the partner carrier's loading photographs from Hanover.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S4"},{"id":"MXC-T02-157","p":7,"f":"MXT02","q":157,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.ARTICLE","TX.ARTICLE","VO.PARA.WORD_SYNONYM","VO.SCENE.MEDIA_PUBLISH"],"s":"What is stated about the first twelve recordings?","o":["They will be produced in a rented studio.","They will be made on the company's own premises.","They will all be new titles.","They will be released in a single month."],"a":1,"e":"The studio has been built “inside its Bergen offices, rather than hired by the day as it has done until now”. The imprint covers the backlist as well as new books, and releases come at two a month.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S5"},{"id":"MXC-T02-158","p":7,"f":"MXT02","q":158,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.ARTICLE","TX.ARTICLE","VO.PARA.WORD_SYNONYM","VO.SCENE.MEDIA_PUBLISH"],"s":"What is indicated about Mr. Ferreira?","o":["He founded Halden House.","He has written several travel books.","He previously worked in broadcasting.","He will narrate the first twelve titles."],"a":2,"e":"He “joins from a broadcasting background”. His role is casting narrators and scheduling the studio, not reading the books himself.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S5"},{"id":"MXC-T02-159","p":7,"f":"MXT02","q":159,"n":"QT.P7.INSERTION","ns":["QT.P7X.INSERTION.ARTICLE","TX.ARTICLE","FD.READ.REFERENCE","FD.READ.DISCOURSE","VO.SCENE.MEDIA_PUBLISH"],"s":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong? “He takes up the post on 1 July.”","o":["[1]","[2]","[3]","[4]"],"a":3,"e":"“He” and “the post” need an appointment to refer back to, and the only one described is Mr. Ferreira's, in the sentence immediately before [4]. At [3] the nearest person named is Ms. Berntsen, who is already in her role.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S5"},{"id":"MXC-T02-160","p":7,"f":"MXT02","q":160,"n":"QT.P7.REASON","ns":["TX.TEXT_MSG","VO.PARA.CAUSE_EFFECT"],"s":"Why was Ms. Nwachukwu unaware of the change to the guest list?","o":["The revised list went to an address she no longer uses.","She reached the venue after the tables had been laid.","The organiser made the change during the event.","The conference centre failed to pass on a message."],"a":0,"e":"“I sent the new list to your old address by mistake”, which is why she is still working from a list of 90.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S6"},{"id":"MXC-T02-161","p":7,"f":"MXT02","q":161,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TEXT_MSG","TX.TEXT_MSG","FD.READ.SCAN"],"s":"What does Mr. Weber suggest as a precaution?","o":["Delaying the start of the event","Borrowing chairs from the venue","Reducing the number of courses served","Sending the van out twice"],"a":1,"e":"“Ask the centre for their stacking chairs as a fallback” — something to fall back on if Piotr is late. Ms. Nwachukwu confirms the food is sufficient, so the menu is not in question.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S6"},{"id":"MXC-T02-162","p":7,"f":"MXT02","q":162,"n":"QT.P7.INTENT","ns":["QT.P7X.INTENT.TEXT_MSG","TX.TEXT_MSG","FD.READ.DISCOURSE"],"s":"At 16:50, what does Ms. Nwachukwu mean when she writes, “Cutting it fine”?","o":["The portions will have to be made smaller.","The van is carrying more than it should.","The guest list ought to be shortened.","The delivery will arrive with little time to spare."],"a":3,"e":"She follows the remark with “Doors at six”, and the van is due at half past five — only thirty minutes to set twenty extra places.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S6"},{"id":"MXC-T02-163","p":7,"f":"MXT02","q":163,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"What will happen to some guests booked on the upper floors?","o":["They will be given a discount on the room rate.","They will be asked to check out earlier than planned.","They may be offered a different room at no extra cost.","They will have breakfast brought to their rooms."],"a":2,"e":"Guests with reduced mobility on floors 4 to 6 “will be moved to equivalent rooms on floors 1 and 2 at no extra cost”. The rate itself is not reduced, and breakfast moves to the Harbour Room for everyone.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S7"},{"id":"MXC-T02-164","p":7,"f":"MXT02","q":164,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN","VO.SCENE.HOTEL_LODGING"],"s":"What is available to guests between 06:30 and midnight?","o":["A service lift with a porter","Luggage storage in the Harbour Room","The sixth-floor restaurant","Parking at no charge"],"a":0,"e":"“A porter will operate it from 06:30 until midnight”, referring to the service lift beside the kitchen. The sixth-floor restaurant is closed for breakfast during the works.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S7"},{"id":"MXC-T02-165","p":7,"f":"MXT02","q":165,"n":"QT.P7.NOT_TRUE","ns":["TX.NOTICE","ST.ELIM.OPTIONS","VO.SCENE.HOTEL_LODGING"],"s":"What is NOT mentioned in the notice as being affected by the work?","o":["Where breakfast is served","The hotel's check-out times","Room assignments for certain guests","Use of the north wing lifts"],"a":1,"e":"The notice covers the breakfast room, the reallocation of rooms on floors 4 to 6 and the closure of the north wing lifts, but says nothing about check-out.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S7"},{"id":"MXC-T02-166","p":7,"f":"MXT02","q":166,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What advantage of bonded storage does the page describe?","o":["Deliveries to retailers arrive sooner.","Handling is charged at a lower rate.","Packaged food keeps for longer.","Tax is not due until the goods are sold."],"a":3,"e":"“Goods held in a bonded facility are not taxed until they are released for sale, which frees capital”. Handling is billed separately and at a flat rate.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S8"},{"id":"MXC-T02-167","p":7,"f":"MXT02","q":167,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.WEB","TX.WEB","FD.READ.SCAN","VO.SCENE.TECH_IT"],"s":"What kind of cargo will Kestrel Line accept?","o":["Frozen seafood","Potted plants","Bottled wine","Industrial solvents"],"a":2,"e":"“wines and spirits” appear on the list of goods held. Frozen cargo, live plants and hazardous material are all excluded.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S8"},{"id":"MXC-T02-168","p":7,"f":"MXT02","q":168,"n":"QT.P7.SYNONYM","ns":["TX.WEB","VO.CONF.POLYSEMY_CONTEXT","VO.PARA.WORD_SYNONYM","VO.SCENE.TECH_IT"],"s":"In the section “What it costs”, the word “falling” is closest in meaning to","o":["decreasing","dropping out","collapsing","arriving"],"a":0,"e":"The rate goes down for customers who store more than 200 pallets, so “falling” here means decreasing rather than collapsing, which would suggest a sudden failure.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S8"},{"id":"MXC-T02-169","p":7,"f":"MXT02","q":169,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.WEB","TX.WEB","VO.PARA.WORD_SYNONYM","VO.SCENE.TECH_IT"],"s":"What is stated about stock reports?","o":["They are produced once a week.","Customers can generate them whenever they wish.","They must be requested before noon.","They are posted to the customer's office."],"a":1,"e":"Customers “can also run the same report from the customer portal at any hour”. Noon is the deadline for raising a discrepancy, not for asking for a report.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S8"},{"id":"MXC-T02-170","p":7,"f":"MXT02","q":170,"n":"QT.P7.DETAIL_NUMBER","ns":["QT.P7X.DETAIL_NUMBER.FORM","TX.INVOICE","QT.P7X.CALC_LOOKUP.INVOICE","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.BANK_PAYMENT"],"s":"How much did the client pay on 22 November?","o":["€500.00","€900.00","€1,275.00","€2,262.00"],"a":3,"e":"“Balance received 22 November … €2,262.00”, that is the subtotal of €2,762.00 less the €500.00 deposit paid in October.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S9"},{"id":"MXC-T02-171","p":7,"f":"MXT02","q":171,"n":"QT.P7.REQUEST_ACTION","ns":["TX.INVOICE","FD.READ.SCAN","VO.SCENE.BANK_PAYMENT"],"s":"What is the client asked to do?","o":["Replace any broken glasses before returning them","Pay the deposit within three working days","Notify the caterer of any breakages","Collect the glassware from Ravnholt Hall"],"a":2,"e":"“Please report breakages to accounts@lindvalldaughters.example rather than replacing items yourself” — the receipt asks for the opposite of replacement.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S9"},{"id":"MXC-T02-172","p":7,"f":"MXT02","q":172,"n":"QT.P7.DETAIL_NUMBER","ns":["TX.NOTICE","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.MEDIA_PUBLISH"],"s":"When are print copies of the March issue sent out?","o":["In late February","On 1 March","In the last week of March","In early April"],"a":0,"e":"“Print copies are posted in the last week of the preceding month”, which for a March issue is the end of February. The first of the month is the date for digital editions.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S10"},{"id":"MXC-T02-173","p":7,"f":"MXT02","q":173,"n":"QT.P7.DETAIL_NUMBER","ns":["TX.NOTICE","FD.READ.SCAN","VO.PARA.NUMBER_TIME","VO.SCENE.MEDIA_PUBLISH"],"s":"How much does a student pay for a print and digital subscription?","o":["€19.00","€37.00","€62.00","€74.00"],"a":1,"e":"Students pay half the print-and-digital rate of €74, that is €37. Halving the digital-only rate instead would give €19.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S10"},{"id":"MXC-T02-174","p":7,"f":"MXT02","q":174,"n":"QT.P7.TRUE_INDICATED","ns":["TX.NOTICE","VO.PARA.WORD_SYNONYM","VO.SCENE.MEDIA_PUBLISH"],"s":"What is stated about a copy returned as undeliverable?","o":["It is posted again at no cost.","It is added to the website archive.","It extends the subscription by one issue.","A replacement has to be paid for."],"a":3,"e":"Such copies “are not replaced free of charge; a replacement costs €9 including postage”.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S10"},{"id":"MXC-T02-175","p":7,"f":"MXT02","q":175,"n":"QT.P7.TRUE_INDICATED","ns":["TX.NOTICE","VO.PARA.WORD_SYNONYM","VO.SCENE.MEDIA_PUBLISH"],"s":"What is indicated about gift subscriptions?","o":["They cost less than ordinary subscriptions.","They cannot be bought once an issue has appeared.","They start with the following issue.","The announcement card goes to the buyer."],"a":2,"e":"They “begin with the next issue to be published rather than the current one”, and the card announcing the gift goes to the recipient.","d":3,"t":55,"src":"open","b":"MXC-T02-P7-S10"},{"id":"MXC-T02-176","p":7,"f":"MXT02","q":176,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.DOUBLE","TX.EMAIL","TX.WEB","FD.READ.SKIM","VO.SCENE.MEDIA_PUBLISH"],"s":"What is the purpose of the e-mail?","o":["To ask for a revised delivery date","To place an order for editorial services","To object to a charge on an invoice","To request samples of previous cover designs"],"a":1,"e":"“I would like to place an order for three of your services”. The launch date is mentioned only to explain the timing, not to request a change.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-D1"},{"id":"MXC-T02-177","p":7,"f":"MXT02","q":177,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.EMAIL","TX.WEB","FD.READ.SCAN","VO.SCENE.MEDIA_PUBLISH"],"s":"According to the web page, what is offered with the cover design service?","o":["A choice of three designers","A printed proof copy","A reduced rate for a series","Unlimited revisions of the selected concept"],"a":3,"e":"“Three initial concepts, then unlimited revisions of the concept you select.” The number three refers to concepts, not designers.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-D1"},{"id":"MXC-T02-178","p":7,"f":"MXT02","q":178,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.DETAIL","QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.EMAIL","TX.WEB","FD.READ.SCAN","VO.SCENE.MEDIA_PUBLISH"],"s":"What must Mr. Adeyemi do in order to receive his assessment in ten working days?","o":["Book the service before 30 September","Pay the full amount in advance","Submit a text of fewer than 90,000 words","Order at least three services together"],"a":0,"e":"The web page grants the shorter turnaround to assessments booked before 30 September, which is why he is sending the manuscript this week. The 90,000-word limit governs copy-editing, and the three-service rule gives a price reduction, not faster delivery.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-D1"},{"id":"MXC-T02-179","p":7,"f":"MXT02","q":179,"n":"QT.P7X.CROSS_REF.DOUBLE","ns":["QT.P7.TRUE_INDICATED","TX.DOUBLE","TX.EMAIL","TX.WEB","VO.PARA.WORD_SYNONYM","VO.SCENE.MEDIA_PUBLISH"],"s":"What is indicated about the copy-editing of Mr. Adeyemi's novel?","o":["It will be done before the assessment.","It will be charged at a fixed rate.","It is expected to take 20 working days.","It requires the distributor's template."],"a":2,"e":"The manuscript is 82,000 words, and the web page promises 20 working days for texts under 90,000 words.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-D1"},{"id":"MXC-T02-180","p":7,"f":"MXT02","q":180,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.DOUBLE","TX.DOUBLE","TX.EMAIL","TX.WEB","FD.READ.SCAN","VO.SCENE.MEDIA_PUBLISH"],"s":"What does Mr. Adeyemi ask Vellum & Vine to confirm?","o":["Whether his distributor's template can be used","Whether the multiple-service reduction covers a per-word price","Whether pa gle narrator read every book","That the studio answered her messages quickly","That the files arrived through a portal","That the rate was the lowest she had found"],"a":0,"e":"“the promise that mattered most to us was kept: one narrator read all four titles”. She calls the rate competitive, not the lowest available.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T2"},{"id":"MXC-T02-194","p":7,"f":"MXT02","q":194,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.REASON","TX.TRIPLE","TX.AD","TX.REVIEW","VO.PARA.CAUSE_EFFECT","VO.SCENE.RETAIL_SHOPPING"],"s":"Why was the error in the second book corrected at no cost?","o":["The narrator agreed to work without a fee.","Larkfell Editions had ordered four titles.","Every Northgate price covers one short re-record.","The error was found before the file was delivered."],"a":2,"e":"The advertisement includes “one free re-record of up to fifteen minutes should you find an error after delivery”, which is the clause Mr. Okonkwo refers to. A single place name falls well inside fifteen minutes.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T2"},{"id":"MXC-T02-195","p":7,"f":"MXT02","q":195,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TRIPLE","TX.TRIPLE","TX.AD","TX.REVIEW","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"What change has Northgate Audio made since December?","o":["It has raised the rate for extra re-recording.","It has doubled the size of its narrator roster.","It has shortened its standard delivery time.","It informs clients automatically when a date moves."],"a":3,"e":"“Since December every client receives an automatic message the moment a delivery date moves.” The free studio time is offered to Larkfell alone, not adopted as a policy.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T2"},{"id":"MXC-T02-196","p":7,"f":"MXT02","q":196,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.MULTI","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.SCHEDULE","FD.READ.SKIM","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What is the purpose of the notice?","o":["To announce a permanent change of address","To set out temporary arrangements during construction work","To advertise vacancies in the yard team","To introduce a charge for overnight parking"],"a":1,"e":"Every instruction in the notice is limited to the two weeks of resurfacing, after which the yard reverts to normal.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T3"},{"id":"MXC-T02-197","p":7,"f":"MXT02","q":197,"n":"QT.P7.REQUEST_ACTION","ns":["TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.SCHEDULE","FD.READ.SCAN","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What are drivers required to do?","o":["Reserve an arrival time at least a day beforehand","Report to the driver facilities before unloading","Carry a printed copy of the notice","Unload their vehicles without assistance"],"a":0,"e":"“Every vehicle must hold a booked arrival slot made at least 24 hours in advance.” Vehicles without one are turned away.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T3"},{"id":"MXC-T02-198","p":7,"f":"MXT02","q":198,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.TRUE_INDICATED","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.SCHEDULE","VO.PARA.WORD_SYNONYM","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What is indicated about the bay Kestrel Haulage normally uses?","o":["It has been reserved for chilled loads.","It can be booked only through Ms. Lindqvist.","It is the bay closest to Gate 4.","It will be out of service for the whole fortnight."],"a":3,"e":"Ms. Nwankwo's chilled runs use bay 9, and the notice closes bays 7 to 12 for the whole period — which is why she expects to move to bays 1 to 6.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T3"},{"id":"MXC-T02-199","p":7,"f":"MXT02","q":199,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.TRUE_INDICATED","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.SCHEDULE","VO.PARA.WORD_SYNONYM","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What is true about Kestrel Haulage's Saturday delivery?","o":["It will have to be moved to a weekday.","It arrives after the last shuttle has run.","It arrives before the first shuttle of the day.","It cannot be given a booked arrival slot."],"a":2,"e":"The run reaches Rendell Park at 07:00, but on Saturdays the first bus leaves Gate 4 at 08:15, which is why she asks about walking.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T3"},{"id":"MXC-T02-200","p":7,"f":"MXT02","q":200,"n":"QT.P7X.CROSS_REF.TRIPLE","ns":["QT.P7.INFERENCE","TX.TRIPLE","TX.EMAIL","TX.NOTICE","TX.SCHEDULE","VO.PARA.GENERALIZE","VO.SCENE.TRANSPORT_COMMUTE"],"s":"What does Ms. Nwankwo correctly assume about her company's Thursday trailers?","o":["They will have to enter through Gate 1.","They cannot be left in the yard overnight.","They must be collected by another carrier.","They will be charged a fee at the overflow park."],"a":1,"e":"The notice states that no trailer may be left in the yard overnight during the works, so the Thursday-to-Friday drop is indeed suspended. Gate 1 is closed to vehicles altogether, and no fee is mentioned for the overflow park.","d":3,"t":65,"src":"open","b":"MXC-T02-P7-T3"},{"id":"MXC-T03-101","p":5,"f":"MXT03","q":101,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADV_VERB"],"s":"Warehouse staff at Solvenda Pharma record each incoming shipment ------- so that the month-end audit finds no discrepancies.","o":["care","careful","carefully","caring"],"a":2,"e":"The blank modifies the verb “record”, so an adverb is needed: “record each shipment carefully”.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-102","p":5,"f":"MXT03","q":102,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_PERFECT"],"s":"By the time the new distribution centre opens in March, Marleaux Retail ------- its warehouse team by nearly a third.","o":["will have expanded","expands","had expanded","is expanding"],"a":0,"e":"“By the time” with a present-tense verb points to a future deadline, so the main clause takes the future perfect.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-103","p":5,"f":"MXT03","q":103,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_TIME"],"s":"All temperature-sensitive medicines to a firm based in Gdansk last month.","o":["awarded","has awarded","was awarded","is awarding"],"a":2,"e":"The contract receives the action, and “last month” fixes it in finished past time, so the past passive is required.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-119","p":5,"f":"MXT03","q":119,"n":"QT.P5.COMPARATIVE","ns":["GR.COMP.COMPARATIVE"],"s":"The prefabricated wall panels proved far ------- to install than the masonry design originally specified.","o":["easy","easiest","as easy","easier"],"a":3,"e":"“Than” signals a comparison of two things, so the comparative is required; “far” intensifies it.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-120","p":5,"f":"MXT03","q":120,"n":"QT.P5.PREP","ns":["GR.CONN.PREP_MEANING"],"s":"All suppliers must comply ------- the storage standards set out in Appendix 2.","o":["to","with","for","on"],"a":1,"e":"“Comply” is fixed with the preposition “with”.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-121","p":5,"f":"MXT03","q":121,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.ADJ_COMPLEMENT"],"s":"The revised floor plan is ------- with the fire regulations issued last year.","o":["consistent","consistently","consistency","consist"],"a":0,"e":"After the linking verb “is”, an adjective is needed: “is consistent with”.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-122","p":5,"f":"MXT03","q":122,"n":"QT.P5.CONJ","ns":["GR.CONN.CONJ_ADVERBIAL","VO.SCENE.RETAIL_SHOPPING"],"s":"The store will stay open throughout the refit ------- the paint fumes make it unsafe for customers.","o":["so that","in case","unless","whereas"],"a":2,"e":"The clause names the single condition that would end the opening, which is what “unless” expresses; “in case” would describe a precaution taken in advance.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-123","p":5,"f":"MXT03","q":123,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.TENSE_FUTURE_CLAUSE"],"s":"The design team will begin the interior drawings as soon as the client ------- the revised budget.","o":["will approve","approves","approved","is approving"],"a":1,"e":"A time clause introduced by “as soon as” takes the present simple even when the reference is to the future.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-124","p":5,"f":"MXT03","q":124,"n":"QT.P5.RELATIVE","ns":["GR.REL.REL_PRONOUN"],"s":"The refrigeration units ------- we ordered in April are still waiting for customs clearance.","o":["what","who","whose","that"],"a":3,"e":"The relative pronoun refers to things and is the object of “ordered”, so “that” is required; “what” cannot follow the noun it describes.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-125","p":5,"f":"MXT03","q":125,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.CONDITIONAL_INVERSION"],"s":"If the planning committee ------- the revised drawings next week, construction could start in October.","o":["approves","will approve","had approved","would approve"],"a":0,"e":"A realistic future condition puts the present simple in the if-clause, with the modal in the main clause.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-126","p":5,"f":"MXT03","q":126,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ"],"s":"Applicants for the pharmacy technician post must provide proof of professional -------.","o":["certify","certified","certification","certifiable"],"a":2,"e":"The preposition “of” and the adjective “professional” both call for a noun.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-127","p":5,"f":"MXT03","q":127,"n":"QT.P5.PRONOUN","ns":["GR.PRON.INDEFINITE"],"s":"Although the two shelving units look identical, one is ten centimetres deeper than -------.","o":["another","other","each other","the other"],"a":3,"e":"With exactly two items, the second one is “the other”; “another” would imply a third unit.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-128","p":5,"f":"MXT03","q":128,"n":"QT.P5.VOCAB","ns":[],"s":"The revised layout makes ------- use of the limited floor space behind the dispensary counter.","o":["eager","efficient","urgent","willing"],"a":1,"e":"Limited space calls for use that wastes nothing, which is what “efficient” describes.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-129","p":5,"f":"MXT03","q":129,"n":"QT.P5.WORD_FORM","ns":["FD.VOC.AFFIX","GR.POS.NOUN_SUBJ_OBJ"],"s":"The building's ------- with the new accessibility code was confirmed during Monday's inspection.","o":["compliance","comply","complying","compliant"],"a":0,"e":"The subject of “was confirmed” is a noun phrase headed by “the building's”, so the noun “compliance” is required.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-130","p":5,"f":"MXT03","q":130,"n":"QT.P5.VERB_FORM","ns":["GR.VERB.MODAL_BASE"],"s":"Site visitors ------- wear a high-visibility jacket at all times in the loading area.","o":["might","would","must","used to"],"a":2,"e":"A site rule states an obligation, which “must” conveys; “might” would reduce it to a possibility.","d":3,"t":22,"src":"open"},{"id":"MXC-T03-131","p":6,"f":"MXT03","q":131,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","FD.VOC.AFFIX","TX.LETTER","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["revise","revised","revising","revision"],"a":1,"e":"“We have” needs a past participle to complete the present perfect: “we have revised the drawings”.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B1"},{"id":"MXC-T03-132","p":6,"f":"MXT03","q":132,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.PREP_PLACE","TX.LETTER","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["between","among","across","within"],"a":0,"e":"Two rooms are named, and “between” is the preposition used with exactly two reference points; “among” would need three or more.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B1"},{"id":"MXC-T03-133","p":6,"f":"MXT03","q":133,"n":"QT.P6.CTX_CONJ_ADV","ns":["QT.P6.CLASSIFY","GR.CONN.CONJ_ADVERB","FD.READ.DISCOURSE","TX.LETTER","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["Nevertheless","Instead","In addition","For example"],"a":2,"e":"The cupboard is a further change on top of the ones just listed, so an additive transition is needed; “Instead” would mean it replaced them.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B1"},{"id":"MXC-T03-134","p":6,"f":"MXT03","q":134,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_CLOSING","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.LETTER","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["The planning office rejected an earlier version of this scheme.","Construction of the extension was finished earlier this year.","We have therefore cancelled the site meeting arranged for that week.","A decision normally follows within eight weeks of submission."],"a":3,"e":"The sentence before gives the submission date, so a note on how long the decision takes continues the thought. A finished extension would make the whole letter pointless, and nothing in the letter suggests a rejection or a cancelled meeting.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B1"},{"id":"MXC-T03-135","p":6,"f":"MXT03","q":135,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.EMAIL","VO.SCENE.ORDER_SHIP"],"s":"","o":["The pilot in our three largest stores has run since November without difficulty.","The service will be limited to branches in the northern region.","Online orders will no longer be accepted after that date.","Parcels must be returned to the supplier within seven days."],"a":0,"e":"A reference to the pilot supports the launch announcement it follows. Limiting the service to one region contradicts “every branch”, and ending online orders would remove the reason for the counter described next.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B2"},{"id":"MXC-T03-136","p":6,"f":"MXT03","q":136,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.CONN.PREP_VS_CONJ","TX.EMAIL","VO.SCENE.ORDER_SHIP"],"s":"","o":["during","so that","before","unless"],"a":2,"e":"The clearing has to happen ahead of the delivery, which “before” expresses; “during” cannot introduce a clause with a subject and verb.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B2"},{"id":"MXC-T03-137","p":6,"f":"MXT03","q":137,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.EMAIL","VO.SCENE.ORDER_SHIP"],"s":"","o":["must prepare","must be prepared","are preparing","have prepared"],"a":1,"e":"Parcels are acted on rather than acting, so the passive is required after the modal.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B2"},{"id":"MXC-T03-138","p":6,"f":"MXT03","q":138,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","TX.EMAIL","VO.SCENE.ORDER_SHIP"],"s":"","o":["handles","handled","has handled","will be handling"],"a":3,"e":"“By the end of that month” looks forward from a launch still to come, so a future form is needed.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B2"},{"id":"MXC-T03-139","p":6,"f":"MXT03","q":139,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.REL.REL_PRONOUN","TX.WEB","VO.SCENE.ORDER_SHIP"],"s":"","o":["who","what","that","they"],"a":2,"e":"The relative pronoun stands for “prescriptions”, which are things, and introduces a clause describing them: “prescriptions that are issued”.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B3"},{"id":"MXC-T03-140","p":6,"f":"MXT03","q":140,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","TX.WEB","VO.SCENE.ORDER_SHIP"],"s":"","o":["verify","verifying","will verify","have been verified"],"a":3,"e":"The details undergo the checking, so a passive form is needed, and the perfect shows the checking is complete before a delivery can be requested.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B3"},{"id":"MXC-T03-141","p":6,"f":"MXT03","q":141,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.WEB","VO.SCENE.ORDER_SHIP"],"s":"","o":["You may choose a two-hour slot when you place your order.","Orders placed on Sunday are delivered the same afternoon.","Our couriers cannot carry medicines that need refrigeration.","The district's only pharmacy closed at the end of last year."],"a":0,"e":"A note on choosing a slot develops the delivery-hours sentence it follows. Sunday delivery contradicts the Monday-to-Saturday schedule, and refusing refrigerated items contradicts the sentence immediately after the blank.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B3"},{"id":"MXC-T03-142","p":6,"f":"MXT03","q":142,"n":"QT.P6.CTX_VOCAB","ns":["QT.P6.CLASSIFY","VO.LEX.VERB","TX.WEB","VO.SCENE.ORDER_SHIP"],"s":"","o":["cancel","postpone","confirm","repeat"],"a":1,"e":"“To the following day” shows the delivery is moved rather than dropped, which is what “postpone” means.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B3"},{"id":"MXC-T03-143","p":6,"f":"MXT03","q":143,"n":"QT.P6.CTX_TENSE","ns":["QT.P6.CLASSIFY","GR.VERB.TENSE_SIMPLE","GR.VERB.VOICE_PASSIVE","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["closes","has closed","was closed","will be closed"],"a":3,"e":"The closure starts on a date still ahead of the 9 June memo, and the car park is acted on, so the future passive is required.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B4"},{"id":"MXC-T03-144","p":6,"f":"MXT03","q":144,"n":"QT.P6.INSERTION","ns":["QT.P6.CLASSIFY","QT.P6.INS_TRANSITION","FD.READ.DISCOURSE","FD.READ.REFERENCE","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["The laundry building will also be shut to staff that week.","A shuttle will run from there to the main entrance every fifteen minutes.","Visitors may continue to park in the main car park as usual.","The new surface will be laid in a single day."],"a":1,"e":"The shuttle explains how staff get from the overflow area to the building, following directly from the instruction to park there. Open access to the main car park and a one-day job both contradict the announcement.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B4"},{"id":"MXC-T03-145","p":6,"f":"MXT03","q":145,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","FD.VOC.AFFIX","GR.POS.ADV_ADJ","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["particular","particulars","particularly","particularity"],"a":2,"e":"An adverb is needed to modify the adjective “noticeable”.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B4"},{"id":"MXC-T03-146","p":6,"f":"MXT03","q":146,"n":"QT.P6.INDEPENDENT","ns":["QT.P6.CLASSIFY","GR.VERB.VOICE_PASSIVE","FD.VOC.AFFIX","TX.MEMO","VO.SCENE.OFFICE_ADMIN"],"s":"","o":["arranged","arranging","arrangement","arrange"],"a":0,"e":"After “can be”, a past participle forms the passive: the space is arranged by the office, not by the person asking.","d":3,"t":30,"src":"open","b":"MXC-T03-P6-B4"},{"id":"MXC-T03-147","p":7,"f":"MXT03","q":147,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.NOTICE","TX.NOTICE","FD.READ.SKIM"],"s":"What is the purpose of the notice?","o":["To introduce a new system for ordering supplies","To announce a temporary change to a collection point","To recruit additional staff for a supply department","To explain an increase in the cost of supplies"],"a":1,"e":"The notice announces that the Level 1 window closes from 11 to 22 May and that collections move to Loading Bay B for that period. Nothing in it changes how supplies are ordered — standing orders continue unchanged.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S1"},{"id":"MXC-T03-148","p":7,"f":"MXT03","q":148,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.NOTICE","TX.NOTICE","FD.READ.SCAN"],"s":"What should a coordinator do to receive an extra item on the same day?","o":["Go to the Level 1 window in person","Add the item to the ward's standing order","Collect the item from the rear car park before noon","Telephone the supply department before 3:00 P.M."],"a":3,"e":"“should telephone extension 4180 before 3:00 P.M. so that it can be brought to Loading Bay B the same afternoon”. Requests made later wait until the next working day.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S1"},{"id":"MXC-T03-149","p":7,"f":"MXT03","q":149,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.TEXT_MSG","TX.TEXT_MSG","FD.READ.SCAN"],"s":"What problem does Mr. Wieczorek report?","o":["A delivery contains more boxes than expected.","A shipment has arrived later than scheduled.","Several boxes were damaged in transit.","An order was never placed with the supplier."],"a":0,"e":"The driver's paperwork lists 60 boxes while the site manifest lists 48, so twelve more boxes have turned up than were ordered.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S2"},{"id":"MXC-T03-150","p":7,"f":"MXT03","q":150,"n":"QT.P7.INFERENCE","ns":["TX.TEXT_MSG","VO.PARA.GENERALIZE"],"s":"What will most likely happen tomorrow?","o":["The driver will return to the gate for a collection.","The Fenwick crew will begin work on the lobby.","Ms. Raghunathan will move twelve boxes to another site.","The stair nosing will be unpacked beside the hoist."],"a":2,"e":"“I will take the twelve across in the van tomorrow” — across to Fenwick, whose crew starts on Thursday. Mr. Wieczorek stores the boxes by the hoist precisely so that they are not opened.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S2"},{"id":"MXC-T03-151","p":7,"f":"MXT03","q":151,"n":"QT.P7.INFER_WHO","ns":["QT.P7X.INFER_WHO.JOB_POSTING","TX.JOB_POSTING","VO.PARA.ROLE_REFERENCE","VO.SCENE.HEALTH_MEDICAL"],"s":"What is indicated about the position?","o":["It is offered on a temporary contract.","It requires occasional weekend availability.","It involves supervising two schedulers.","It can be carried out from any of fourteen countries."],"a":1,"e":"“Willingness to be on call one weekend in five” appears among the requirements. The coordinator works alongside the two schedulers, not above them.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S3"},{"id":"MXC-T03-152","p":7,"f":"MXT03","q":152,"n":"QT.P7.TRUE_INDICATED","ns":["QT.P7X.TRUE_INDICATED.JOB_POSTING","TX.JOB_POSTING","VO.PARA.WORD_SYNONYM","VO.SCENE.HEALTH_MEDICAL"],"s":"What is stated about a second European language?","o":["It must be certified before the interview.","It is tested during the first year of employment.","It raises the starting salary above $52,000.","It is useful but not required."],"a":3,"e":"“Fluent English; a second European language is an advantage” — an advantage, not a requirement. Only English fluency is obligatory.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S3"},{"id":"MXC-T03-153","p":7,"f":"MXT03","q":153,"n":"QT.P7.MAIN_PURPOSE","ns":["TX.JOB_POSTING","FD.READ.SKIM","VO.SCENE.HEALTH_MEDICAL"],"s":"Why does the posting mention a funded course?","o":["To indicate that a certificate is not needed at the time of hiring","To explain why the salary begins at $52,000","To describe a benefit available to every employee","To set out a condition for being invited to an interview"],"a":0,"e":"The course is offered to “a candidate who does not yet hold a certificate”, which tells applicants they may apply without one. It is not open to all staff, only to those lacking the qualification.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S3"},{"id":"MXC-T03-154","p":7,"f":"MXT03","q":154,"n":"QT.P7.DETAIL","ns":["TX.LETTER","FD.READ.SCAN","VO.SCENE.COMMUNITY_CULTURE"],"s":"What did the survey drawings establish?","o":["That the annexe will have to be demolished","That additional piling must be installed","That the north wall can support another storey","That the boundary line was recorded incorrectly"],"a":2,"e":"“The drawings confirm that the north wall can carry the proposed second storey without additional piling”. Piling is what the drawings rule out, not what they require.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S4"},{"id":"MXC-T03-155","p":7,"f":"MXT03","q":155,"n":"QT.P7.MAIN_PURPOSE","ns":["QT.P7X.MAIN_PURPOSE.LETTER","TX.LETTER","FD.READ.SKIM","VO.SCENE.COMMUNITY_CULTURE"],"s":"Why has Mr. Berenguer held the work at stage C?","o":["An invoice from his practice remains unpaid.","The structural engineer has not finished the review.","A planning application has already been refused.","The ground floor may still have to be altered."],"a":3,"e":"He stops “so that we do not have to redraw the ground floor twice”, since the drainage question is unresolved. The engineer's review is complete — that is what the letter reports.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S4"},{"id":"MXC-T03-156","p":7,"f":"MXT03","q":156,"n":"QT.P7.DETAIL","ns":["TX.LETTER","FD.READ.SCAN","VO.SCENE.COMMUNITY_CULTURE"],"s":"What does Mr. Berenguer propose if the confirmation is slow to arrive?","o":["Removing the second storey from the design","Making two separate planning applications","Purchasing the neighbouring car park","Commissioning a second survey"],"a":1,"e":"“If it is likely to take more than a month, I would suggest submitting the annexe and the drainage works as two separate applications.”","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S4"},{"id":"MXC-T03-157","p":7,"f":"MXT03","q":157,"n":"QT.P7.DETAIL","ns":["QT.P7X.DETAIL.ARTICLE","TX.ARTICLE","FD.READ.SCAN","VO.SCENE.RETAIL_SHOPPING"],"s":"What did Halvorsen & Reed do at its Ashgrove Street store?","o":["It turned storage areas into a dispatch centre.","It extended the sales floor onto two more levels.","It closed the shop to customers for nine months.","It moved its stock to a warehouse beside a motorway."],"a":0,"e":"The chain converted “two levels of stockrooms into a parcel hub”. The nine months refers to the length of the conversion work, not to a closure — the article never says the shop shut.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S5"},{"id":"MXC-T03-158","p":7,"f":"MXT03","q":158,"n":"QT.P7.SYNONYM","ns":["QT.P7X.SYNONYM.ARTICLE","TX.ARTICLE","VO.CONF.POLYSEMY_CONTEXT","VO.PARA.WORD_SYNONYM","VO.SCENE.RETAIL_SHOPPING"],"s":"In paragraph 3, the word “flat” is closest in meaning to","o":["level in surface","sharply reduced","unchanged","inexpensive"],"a":2,"e":"The contrast is with collections that “rose by 34 percent”, so home deliveries neither rose nor fell. A fall would need “down”, not “flat”.","d":3,"t":55,"src":"open","b":"MXC-T03-P7-S5"},{"id":"MXC-T03-159","p":7,"f":"MXT03","q":159,"n":"QT.P7.INSERTION","ns":["QT.P7X.INSERTION.ARTI
