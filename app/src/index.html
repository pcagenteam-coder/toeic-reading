<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>托业阅读提分</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="托业阅读">
<style>/*CSS*/</style>
</head>
<body>
<div id="app" class="app">
  <nav id="nav" class="nav">
    <b class="brand">Halvorsen</b>
    <button data-tab="today" title="今天的工作和其他练习"><i>◐</i><span>今天</span></button>
    <button data-tab="review" title="错题和生词按记忆曲线回来"><i>↻</i><span>复习</span><em id="revN"></em></button>
    <button data-tab="progress" title="预测分、职级、本周小结"><i>◎</i><span>进度</span></button>
    <button data-tab="me" title="计时、字号、目标和数据"><i>⚙</i><span>设置</span></button>
  </nav>
  <main id="main" class="main"><div class="wrap" aria-busy="true"><div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:70%"></div></div><div class="card"><div class="skel" style="width:60%"></div><div class="skel"></div></div></div></main>
</div>
<div id="banner" class="banner hide"></div>
<div id="offl" class="offl hide" role="status">离线中，进度已保存在本机</div>
<div id="upd" class="upd hide" role="status">有新版本 <button class="link" data-act="updGo">刷新获取新版</button></div>
<div id="pop" class="pop hide"></div>
<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>
<script>/*DATA*/</script>
<script>/*JS*/</script>
</body>
</html>
