    <script type="application/json" id="bank">{"meta":{"version":"v0-prototype","style_anchor":"ETS TOEIC L&R official sample test (format and directions only; no ETS text reused)","vocab_constraint":"NGSL 1.2 + TSL 1.2 (Browne & Culligan, CC BY-SA 4.0); proper nouns and numbers exempt","blank_marker":"-------"},"nodes":[{"id":"G1","name":"词性判断","layer":"语法","prereq":[],"freq":0.14},{"id":"G2","name":"形容词/副词位置","layer":"语法","prereq":["G1"],"freq":0.08},{"id":"G3","name":"主谓一致","layer":"语法","prereq":[],"freq":0.04},{"id":"G4","name":"时态与时间状语","layer":"语法","prereq":[],"freq":0.07},{"id":"G5","name":"被动语态","layer":"语法","prereq":["G4"],"freq":0.05},{"id":"G6","name":"关系代词","layer":"语法","prereq":["G3"],"freq":0.03},{"id":"G7","name":"连词/介词辨析","layer":"语法","prereq":["G1"],"freq":0.09},{"id":"G8","name":"代词格","layer":"语法","prereq":[],"freq":0.04},{"id":"V1","name":"会议与日程词汇","layer":"词汇","prereq":[],"freq":0.06},{"id":"V2","name":"人事与招聘词汇","layer":"词汇","prereq":[],"freq":0.05},{"id":"V3","name":"采购与报价词汇","layer":"词汇","prereq":[],"freq":0.05},{"id":"V4","name":"易混词","layer":"词汇","prereq":["G1"],"freq":0.04},{"id":"R1","name":"细节定位","layer":"题型","prereq":[],"freq":0.12},{"id":"R2","name":"同义替换识别","layer":"题型","prereq":["R1"],"freq":0.08},{"id":"R3","name":"推断题","layer":"题型","prereq":["R1","R2"],"freq":0.06},{"id":"R4","name":"NOT/TRUE 题","layer":"题型","prereq":["R1"],"freq":0.04},{"id":"R5","name":"多篇跨文定位","layer":"题型","prereq":["R1","R2"],"freq":0.1},{"id":"R6","name":"句子插入","layer":"题型","prereq":["G7","R1"],"freq":0.05},{"id":"S1","name":"限时阅读速度","layer":"策略","prereq":["R1"],"freq":0.1},{"id":"S2","name":"放弃与时间分配","layer":"策略","prereq":["S1"],"freq":0.05}],"diagnostic_part5":[{"id":"d1","node":"G1","stem":"The new booking system has made the scheduling of client meetings much more -------.","options":["efficiency","efficient","efficiently","efficiencies"],"answer":1,"explain_zh":"make + 宾语 + 形容词：made the scheduling much more ___，more 后面要形容词 efficient。"},{"id":"d2","node":"G4","stem":"Ms. Tanaka ------- the quarterly sales report before the board meeting began yesterday.","options":["finishes","has finished","had finished","will finish"],"answer":2,"explain_zh":"“在昨天会议开始之前”已完成，是过去的过去，用过去完成时 had finished。"},{"id":"d3","node":"G7","stem":"------- the heavy rain, the outdoor product launch went ahead as planned.","options":["Although","Despite","Because","Unless"],"answer":1,"explain_zh":"空后是名词短语 the heavy rain，不是从句，只能用介词 Despite；Although 后面要接完整句子。"},{"id":"d4","node":"G3","stem":"Each of the job applicants ------- required to submit two letters of reference.","options":["are","were","is","be"],"answer":2,"explain_zh":"主语核心是 Each，单数，用 is。of the job applicants 是干扰。"},{"id":"d5","node":"G5","stem":"The service contract ------- by both companies by the end of next week.","options":["will sign","will be signed","signing","has signed"],"answer":1,"explain_zh":"合同是“被签”，by both companies 是动作执行者，且是将来，用 will be signed。"},{"id":"d6","node":"G6","stem":"The manager ------- team won the design award will speak at the annual dinner.","options":["who","which","whose","whom"],"answer":2,"explain_zh":"空后直接跟名词 team，表示“他的团队”，用所有格关系代词 whose。"},{"id":"d7","node":"G2","stem":"Mr. Lee completed the expense report -------, so it was approved on the first submission.","options":["careful","carefully","care","cared"],"answer":1,"explain_zh":"修饰动词 completed，放在句末，用副词 carefully。"},{"id":"d8","node":"V4","stem":"The rising cost of materials has ------- the production schedule for the spring line.","options":["effected","affected","raised","risen"],"answer":1,"explain_zh":"affect 是动词“影响”；effect 多作名词；raise/rise 是“提高/上升”，语义不通。"}],"inbox":[{"id":"m1","type":"single","from":"Daniel Reyes, Facilities Manager","to":"All Staff","subject":"East elevators closed on Thursday","body":"Please be advised that the east elevators will be out of service on Thursday, November 5, from 8:00 A.M. to 2:00 P.M. while technicians replace the control panels. The west elevators will operate as usual, but we expect them to be crowded during the morning. Staff with meetings on the 12th floor are encouraged to allow extra time or to use the stairs beside the cafeteria. Deliveries scheduled for Thursday morning will be sent to the loading area on Pine Street. If you have any questions, please contact me at extension 4471.","questions":[{"node":"R2","q":"What is the purpose of the e-mail?","options":["To announce a temporary closure","To introduce a new facilities manager","To request repairs to the stairs","To change the location of a meeting"],"answer":0,"explain_zh":"out of service 被替换成 temporary closure，这就是同义替换。"},{"node":"R1","q":"What are staff with meetings on the 12th floor advised to do?","options":["Reschedule their meetings","Allow extra travel time","Call extension 4471","Use the loading area"],"answer":1,"explain_zh":"原文 encouraged to allow extra time，直接定位。"},{"node":"R4","q":"What is NOT mentioned in the e-mail?","options":["When the work will take place","Why the elevators will be closed","Where deliveries will be sent","How much the repairs will cost"],"answer":3,"explain_zh":"NOT 题逐项排除：时间、原因（replace the control panels）、送货地点都提到了，费用没有。"}]},{"id":"m2","type":"double","from":"Brightline Office Supply","to":"Priya Nair, Office Manager","subject":"Your price quote","body":"Dear Ms. Nair,\nThank you for your inquiry about our Model K2 office chairs. As requested, here is a quote for 40 chairs at $185 each. Please note that orders of 50 chairs or more receive a 10 percent discount, and delivery is free for all orders over $5,000. Orders are normally delivered within 10 business days.\nSincerely,\nTom Ashby, Sales Department","second":{"label":"Team chat","text":"Priya Nair (9:12 A.M.): We just hired 12 more staff for the support team. Let's order chairs for them too, along with the original 40.\nKevin Cho (9:14 A.M.): Got it. I'll place the order with Brightline today."},"questions":[{"node":"R5","q":"How many chairs will most likely be ordered?","options":["12","40","50","52"],"answer":3,"explain_zh":"跨两篇：报价是 40 把，聊天说再加 12 人，40+12=52。"},{"node":"R5","q":"What will the company most likely receive?","options":["A discount and free delivery","Free delivery only","A discount only","Neither a discount nor free delivery"],"answer":0,"explain_zh":"52≥50 拿到 9 折；52×185 远超 5,000 美元，免运费。多篇题常要把数字带回第一篇的条件里。"},{"node":"R2","q":"In the e-mail, the word \"inquiry\" in line 1 is closest in meaning to","options":["complaint","question","payment","survey"],"answer":1,"explain_zh":"inquiry = question（询问）。同义词题看上下文：Thank you for your inquiry…here is a quote。"}]}],"drafts":[{"id":"p6a","from":"Amira Hassan, Marketing","title":"Draft: Client appreciation event","text_parts":["Dear team,\nOur annual client appreciation event [1] on Friday, December 4. This year, we have reserved the top floor dining room at the Marlowe Hotel. [2] Please send your guest list to me [3] November 20 so that I can confirm the final numbers with the hotel."],"blanks":[{"n":1,"node":"G5","options":["held","will be held","holding","has held"],"answer":1,"explain_zh":"活动是“被举办”，且在将来，用 will be held。"},{"n":2,"node":"R6","options":["Guests will be able to enjoy a view of the harbor.","The hotel was built in 1920 and has been renovated twice.","Please submit your expense reports by Monday.","Our sales figures rose sharply last quarter."],"answer":0,"explain_zh":"句子插入看上下文衔接：上一句讲订了顶层餐厅，接“客人能看到港口景色”最自然。"},{"n":3,"node":"G7","options":["by","until","during","within"],"answer":0,"explain_zh":"截止期限用 by（在…之前完成）；until 表示动作持续到某时。"}]}],"urgent":[{"id":"u1","node":"S1","seconds":90,"thread":["Mark Ellis (2:05 P.M.): Kenji's flight from Seoul lands at 3:40, so he can't make our 4:00 meeting. Can we move it to 5:30?","Lena Park (2:07 P.M.): Room B is booked until 6:00, but Room C is free all afternoon.","Mark Ellis (2:08 P.M.): Perfect. Please book it and let everyone know."],"q":"Where will the meeting most likely take place?","options":["In Room B at 4:00","In Room B at 5:30","In Room C at 5:30","At the airport"],"answer":2,"explain_zh":"推断：会议改到 5:30，B 房间到 6 点都被占，C 整个下午空，所以是 C 房间 5:30。“Please book it” 的 it 指 Room C。"}]}</script>

        var LAYERS = ["语法", "词汇", "题型", "策略"];

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }
        function pct(p) { return Math.round(p * 100) + "%"; }

        /* ---------- state ---------- */
        var S = {
          screen: "onboard",
          tab: "home",
          target: 400,
          days: 30,
          nodes: {},
          events: [],
          answered: {},
          diagIndex: 0,
          current: null,
          plan: [],
          selNode: null,
          timer: null
        };
        BANK.nodes.forEach(function (n) {
          S.nodes[n.id] = { id: n.id, name: n.name, layer: n.layer, prereq: n.prereq, freq: n.freq, p: 0.5, n: 0, measured: false, inferred: false };
        });

        /* ---------- item bank index ---------- */
        var ITEMS = [];
        BANK.diagnostic_part5.forEach(function (it) {
          ITEMS.push({ key: "p5:" + it.id, kind: "practice", node: it.node, label: "Part 5 单句填空", ref: it });
        });
        BANK.inbox.forEach(function (mail) {
          mail.questions.forEach(function (q, i) {
            ITEMS.push({ key: "p7:" + mail.id + ":" + i, kind: "inbox", node: q.node, label: "Part 7 " + (mail.type === "double" ? "双篇" : "单篇") + "阅读", mail: mail, qi: i, ref: q });
          });
        });
        BANK.drafts.forEach(function (d) {
          d.blanks.forEach(function (b) {
            ITEMS.push({ key: "p6:" + d.id + ":" + b.n, kind: "draft", node: b.node, label: "Part 6 改稿", draft: d, ref: b });
          });
        });
        BANK.urgent.forEach(function (u) {
          ITEMS.push({ key: "ug:" + u.id, kind: "urgent", node: u.node, label: "紧急任务", ref: u });
        });
        function targetTime(kind) { return kind === "inbox" ? 60 : kind === "draft" ? 30 : kind === "urgent" ? 90 : 25; }

        /* ---------- learner model ---------- */
        function score() {
          var num = 0, den = 0;
          BANK.nodes.forEach(function (n) { var m = S.nodes[n.id]; num += m.freq * m.p; den += m.freq; });
          var v = 5 + 490 * (num / den);
          v = Math.round(v / 5) * 5;
          return Math.min(495, Math.max(5, v));
        }
        function band() { return Math.max(15, Math.round(80 / Math.sqrt(S.events.length + 1))); }
        function rank(sc) { return sc < 250 ? "实习生" : sc < 350 ? "专员" : sc < 430 ? "主管" : "经理"; }
        function gain(id) {
          var m = S.nodes[id];
          return (m.freq * (1 - m.p) * 490) / COST[m.layer];
        }
        function gateFor(id) {
          var m = S.nodes[id];
          for (var i = 0; i < m.prereq.length; i++) if (S.nodes[m.prereq[i]].p < 0.6) return S.nodes[m.prereq[i]];
          return null;
        }
        function planTop(k) {
          var ranked = BANK.nodes.map(function (n) { return n.id; }).sort(function (a, b) { return gain(b) - gain(a); });
          var out = [], seen = {};
          ranked.forEach(function (id) {
            if (out.length >= k) return;
            var g = gateFor(id);
            var pick = g ? g.id : id;
            if (seen[pick]) return;
            seen[pick] = 1;
            out.push({ id: pick, via: g ? id : null });
          });
          return out;
        }
        function hoursToTarget() {
          var sc = score();
          if (sc >= S.target) return 0;
          var top = BANK.nodes.map(function (n) { return n.id; }).sort(function (a, b) { return gain(b) - gain(a); }).slice(0, 5);
          var avg = top.reduce(function (s, id) { return s + gain(id); }, 0) / top.length;
          if (avg <= 0) return 0;
          return Math.max(1, Math.round((S.target - sc) / avg));
        }
        function reasonFor(e) {
          var m = S.nodes[e.id];
          if (e.via) return "先补前置：" + m.name + "（" + S.nodes[e.via].name + " 收益高，但前置仅 " + pct(m.p) + "）";
          return (m.freq >= 0.08 ? "考频高 " : "考频 ") + Math.round(m.freq * 100) + "%，你的掌握度 " + pct(m.p) + (m.measured ? "" : m.inferred ? "（推断）" : "（未测）");
        }
        function planIds() { return S.plan.map(function (x) { return x.id; }); }

        function apply(nodeId, correct, seconds, limit) {
          var before = {};
          function snap(id) { if (!(id in before)) before[id] = S.nodes[id].p; }
          var m = S.nodes[nodeId];
          snap(nodeId);
          var slow = seconds > limit;
          if (correct && !slow) m.p += (1 - m.p) * 0.35;
          else if (correct && slow) {
            m.p += (1 - m.p) * 0.15;
            if (nodeId !== "S1") { snap("S1"); S.nodes.S1.p *= 0.9; S.nodes.S1.inferred = !S.nodes.S1.measured; }
            else m.p *= 0.9;
          } else m.p *= 0.55;
          m.n += 1;
          m.measured = true;
          m.inferred = false;
          m.prereq.forEach(function (pid) {
            snap(pid);
            var q = S.nodes[pid];
            if (correct) q.p += (1 - q.p) * 0.1;
            else q.p *= 0.85;
            if (!q.measured) q.inferred = true;
          });
          var changes = Object.keys(before).map(function (id) {
            return { id: id, name: S.nodes[id].name, from: before[id], to: S.nodes[id].p, inferred: S.nodes[id].inferred, main: id === nodeId };
          }).filter(function (c) { return Math.abs(c.to - c.from) > 0.0005; });
          return { changes: changes, slow: slow };
        }

        function record(item, choice, correct, seconds, res, scoreBefore, planBefore, lim) {
          var main = res.changes.filter(function (c) { return c.main; })[0];
          S.events.push({
            seq: S.events.length + 1,
            item: item.key,
            screen: item.label,
            node: S.nodes[item.node].name + "（" + item.node + "）",
            choice: choice < 0 ? "超时未答" : LETTERS[choice] + " " + optText(item, choice),
            correct: correct,
            seconds: seconds,
            limit: lim || targetTime(item.kind),
            mastery_before: main ? +main.from.toFixed(3) : null,
            mastery_after: main ? +main.to.toFixed(3) : null,
            score_before: scoreBefore,
            score_after: score(),
            plan_before: planBefore
          });
        }
        function optText(item, i) {
          var r = item.ref;
          return (r.options || [])[i] || "";
        }

        /* ---------- answering ---------- */
        function answer(item, choice, seconds, limit) {
          var lim = limit || targetTime(item.kind);
          var scoreBefore = score();
          var planBefore = S.plan.length ? planIds() : planTop(3).map(function (x) { return x.id; });
          var correct = choice === item.ref.answer;
          var res = apply(item.node, correct, seconds, lim);
          S.answered[item.key] = true;
          record(item, choice, correct, seconds, res, scoreBefore, planBefore.map(function (id) { return S.nodes[id].name; }), lim);
          var planAfter = planTop(3);
          S.plan = planAfter;
          var changedPlan = planAfter.map(function (x, i) {
            return planBefore[i] === x.id ? null : "第 " + (i + 1) + " 项 " + (planBefore[i] ? S.nodes[planBefore[i]].name : "—") + " → " + S.nodes[x.id].name;
          }).filter(Boolean);
          return { correct: correct, res: res, scoreBefore: scoreBefore, scoreAfter: score(), planChanged: changedPlan, seconds: seconds, choice: choice, item: item };
        }

        function nextItem() {
          var ranked = BANK.nodes.map(function (n) { return n.id; }).sort(function (a, b) { return gain(b) - gain(a); });
          var order = [];
          ranked.forEach(function (id) {
            var g = gateFor(id);
            if (g && order.indexOf(g.id) < 0) order.push(g.id);
            if (order.indexOf(id) < 0) order.push(id);
          });
          for (var i = 0; i < order.length; i++) {
            var pool = ITEMS.filter(function (it) { return it.node === order[i] && !S.answered[it.key]; });
            if (pool.length) return pool[0];
          }
          var rest = ITEMS.filter(function (it) { return !S.answered[it.key]; });
          return rest.length ? rest[0] : null;
        }

        function toast(msg) {
          toastEl.textContent = msg;
          toastEl.hidden = false;
          clearTimeout(toast.t);
          toast.t = setTimeout(function () { toastEl.hidden = true; }, 2600);
        }

        /* ---------- feedback sheet ---------- */
        function changeLine(c) {
          return "<li><b>" + esc(c.name) + "</b> " + pct(c.from) + " → " + pct(c.to) + (c.main ? "" : "（前置连带）") + (c.inferred ? " · 推断" : "") + "</li>";
        }
        function showFeedback(out, onNext, nextLabel) {
          var it = out.item;
          var r = it.ref;
          var correctText = LETTERS[r.answer] + " " + esc(r.options[r.answer]);
          var planTxt = out.planChanged.length
            ? "<b>计划已调整</b>：" + out.planChanged.map(esc).join("；")
            : "<b>计划不变</b>：今日任务前 3 项没有变化";
          sheetPanel.innerHTML =
            '<p class="x-verdict ' + (out.correct ? "is-right" : "is-wrong") + '" id="sheetTitle">' +
            (out.choice < 0 ? "✗ 超时未答复，记为答错且慢" : (out.correct ? "✓ 答对" : "✗ 答错") + (out.res.slow ? "（超时 " + out.seconds + "s / " + targetTime(it.kind) + "s）" : "（用时 " + out.seconds + "s）")) + "</p>" +
            '<p class="x-sub">正确答案 ' + correctText + "</p>" +
            '<div class="x-card"><p>' + esc(r.explain_zh) + "</p></div>" +
            '<div class="x-group"><p class="x-label">掌握度变化</p><ul class="x-planlist">' +
            out.res.changes.map(changeLine).join("") + "</ul></div>" +
            '<div class="x-split"><span class="x-label">预测分（原型估算）</span><strong>' + out.scoreBefore + " → " + out.scoreAfter + "</strong></div>" +
            '<p class="x-sub">' + planTxt + "</p>" +
            '<button class="x-cta" id="sheetNext">' + esc(nextLabel || "下一题") + "</button>";
          sheet.hidden = false;
          document.getElementById("sheetNext").onclick = function () {
            sheet.hidden = true;
            onNext();
          };
          document.getElementById("sheetNext").focus();
        }

        /* ---------- timer ---------- */
        function startTimer(el, opts) {
          stopTimer();
          var t0 = Date.now();
          S.timer = setInterval(function () {
            var s = Math.round((Date.now() - t0) / 1000);
            if (opts && opts.countdown) {
              var left = opts.countdown - s;
              el.textContent = (left > 0 ? left : 0) + "s";
              if (left <= 0) { stopTimer(); opts.onEnd(); }
            } else {
              el.textContent = s + "s";
              if (opts && opts.limit && s > opts.limit) el.classList.add("is-over");
            }
          }, 250);
          return function () { return Math.max(1, Math.round((Date.now() - t0) / 1000)); };
        }
        function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

        /* ---------- shell ---------- */
        var TABS = [
          { id: "home", label: "工作台" },
          { id: "inbox", label: "收件箱" },
          { id: "draft", label: "改稿" },
          { id: "urgent", label: "紧急" },
          { id: "graph", label: "图谱" }
        ];
        function badge(id) {
          if (id === "inbox") {
            var n = BANK.inbox.filter(function (m) { return m.questions.some(function (q, i) { return !S.answered["p7:" + m.id + ":" + i]; }); }).length;
            return n;
          }
          if (id === "draft") return ITEMS.filter(function (it) { return it.kind === "draft" && !S.answered[it.key]; }).length;
          if (id === "urgent") return ITEMS.filter(function (it) { return it.kind === "urgent" && !S.answered[it.key]; }).length;
          return 0;
        }
        function drawTabs() {
          var bare = ["onboard", "diag", "result", "session", "sessEnd", "examIntro"].indexOf(S.screen) >= 0;
          tabbar.hidden = bare;
          app.classList.toggle("is-bare", bare);
          if (bare) return;
          tabbar.innerHTML = TABS.map(function (t) {
            var b = badge(t.id);
            return '<button class="x-tab" data-tab="' + t.id + '"' + (S.tab === t.id ? ' aria-current="page"' : "") + ">" + t.label +
              (b ? '<span class="x-tab__badge" aria-label="' + b + ' 待做">' + b + "</span>" : "") + "</button>";
          }).join("");
        }
        tabbar.addEventListener("click", function (e) {
          var b = e.target.closest("[data-tab]");
          if (!b) return;
          var t = b.getAttribute("data-tab");
          if (t === "home") go("home");
          else if (t === "inbox") go("inbox");
          else if (t === "draft") openDraft(null);
          else if (t === "urgent") openUrgent();
          else go("graph");
        });

        function go(screen, tab) {
          stopTimer();
          S.screen = screen;
          S.tab = tab || (["home", "inbox", "graph"].indexOf(screen) >= 0 ? screen : S.tab);
          var fn = { onboard: rOnboard, diag: rDiag, result: rResult, home: rHome, inbox: rInbox, graph: rGraph }[screen];
          if (fn) fn();
          drawTabs();
          window.scrollTo(0, 0);
        }
        function top(title, meta, back) {
          return '<div class="x-top">' + (back ? '<button class="x-back" data-back="' + back + '">‹ ' + esc(title) + "</button>" : '<p class="x-top__title">' + esc(title) + "</p>") +
            '<p class="x-top__meta">' + meta + "</p></div>";
        }
        function optsHTML(options, act) {
          return '<div class="x-opts">' + options.map(function (o, i) {
            return '<button class="x-opt" data-' + act + '="' + i + '"><b>(' + LETTERS[i] + ")</b><span>" + esc(o) + "</span></button>";
          }).join("") + "</div>";
        }
        function bindOpts(act, fn) {
          [].slice.call(app.querySelectorAll("[data-" + act + "]")).forEach(function (b) {
            b.onclick = function () { fn(+b.getAttribute("data-" + act)); };
          });
        }
        function bindBack() {
          [].slice.call(app.querySelectorAll("[data-back]")).forEach(function (b) {
            b.onclick = function () { go(b.getAttribute("data-back")); };
          });
        }
        function whyLine(item) {
          if (!item || !item.why) return "";
          return '<p class="x-why">自适应选题 · <b>' + esc(S.nodes[item.node].name) + "</b> · " + esc(item.why) + "</p>";
        }

        /* ---------- 1 onboarding ---------- */
        function rOnboard() {
          function group(label, key, vals, unit, sub) {
            return '<div class="x-group"><p class="x-label">' + label + '</p><div class="x-choices" role="group" aria-label="' + label + '">' +
              vals.map(function (v) {
                return '<button class="x-choice" data-set="' + key + ":" + v + '" aria-pressed="' + (S[key] === v) + '">' + v + "<small>" + unit + "</small></button>";
              }).join("") + "</div>" + (sub ? '<p class="x-sub">' + sub + "</p>" : "") + "</div>";
          }
          app.innerHTML =
            '<section class="hero"><div class="hero__copy"><p class="hero__eyebrow">Halvorsen 公司 · 新员工入职</p><h1>托业阅读提分</h1>' +
            '<p class="hero__sub">你是 Halvorsen 新入职的员工。每读一封邮件、改一份稿，都是一道托业阅读题；每答一题，系统重新估算你的分数，并改写下一题。</p></div></section>' +
            '<div class="x-card x-card--line">' +
            group("目标阅读分", "target", [350, 400, 450], "分") +
            group("距离考试", "days", [14, 30, 60], "天") +
            '<p class="x-sub">先做 8 道 Part 5 入职测试（约 4 分钟），定出你的起点。</p>' +
            '<button class="x-cta" id="startDiag">开始入职测试</button></div>';
          [].slice.call(app.querySelectorAll("[data-set]")).forEach(function (b) {
            b.onclick = function () {
              var kv = b.getAttribute("data-set").split(":");
              S[kv[0]] = +kv[1];
              rOnboard();
            };
          });
          document.getElementById("startDiag").onclick = function () { S.diagIndex = 0; go("diag"); };
        }

        /* ---------- 2 diagnostic ---------- */
        function part5HTML(it) {
          return '<div class="x-card x-card--line"><p class="x-label">Part 5 · 选出最适合填入空格的选项</p><p class="x-stem">' + esc(it.ref.stem) + "</p></div>" + optsHTML(it.ref.options, "opt");
        }
        function rDiag() {
          var i = S.diagIndex;
          var it = ITEMS.filter(function (x) { return x.kind === "practice"; })[i];
          app.innerHTML =
            top("入职测试", "第 " + (i + 1) + " / 8 题") +
            '<div class="x-bar" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="' + i + '"><i style="width:' + (i / 8) * 100 + '%"></i></div>' +
            '<div class="x-split"><span class="x-sub">目标用时 25 秒</span><span class="x-timer" id="tm">0s</span></div>' +
            part5HTML(it);
          var el = document.getElementById("tm");
          var elapsed = startTimer(el, { limit: 25 });
          bindOpts("opt", function (c) {
            var s = elapsed();
            stopTimer();
            var out = answer(it, c, s);
            S.events[S.events.length - 1].screen = "入职测试";
            delete S.answered[it.key];
            showFeedback(out, function () {
              S.diagIndex += 1;
              if (S.diagIndex >= 8) go("result");
              else rDiag();
            }, S.diagIndex >= 7 ? "查看测试结果" : "下一题");
          });
        }

        /* ---------- result ---------- */
        function rResult() {
          var sc = score(), b = band();
          var weak = Object.keys(S.nodes).map(function (id) { return S.nodes[id]; }).filter(function (m) { return m.measured; })
            .sort(function (a, b2) { return a.p - b2.p || b2.freq - a.freq; }).slice(0, 3);
          var correct = S.events.filter(function (e) { return e.correct; }).length;
          app.innerHTML =
            top("入职测试结果", "答对 " + correct + " / 8") +
            '<div class="x-card"><p class="x-label">预测阅读分 · 原型估算</p><div class="x-score"><span class="x-score__fig">' + sc + '</span><span class="x-score__pm">± ' + b + "</span></div>" +
            '<p class="x-sub">区间 ' + Math.max(5, sc - b) + "–" + Math.min(495, sc + b) + " 分 · 目标 " + S.target + " 分</p>" +
            '<p>入职职级 <span class="chip chip--solid">' + rank(sc) + "</span></p></div>" +
            '<section class="x-group"><p class="x-label">最弱的 3 个能力点</p><div class="breakdown"><dl>' +
            weak.map(function (m) {
              return '<div class="row"><dt>' + esc(m.name) + "<small>" + LNAME[m.layer] + " · 考频 " + Math.round(m.freq * 100) + "% · 基于 " + m.n + " 次作答</small></dt><dd>" + pct(m.p) + "</dd></div>";
            }).join("") + "</dl></div></section>" +
            '<button class="x-cta" id="toHome">进入工作台</button>';
          document.getElementById("toHome").onclick = function () { go("home"); };
        }

        /* ---------- 3 home ---------- */
        function kindName(k) { return { practice: "Part 5 练习", inbox: "收件箱 · Part 7", draft: "改稿 · Part 6", urgent: "紧急任务 · 限时" }[k]; }
        function rHome() {
          var sc = score(), b = band(), h = hoursToTarget();
          var prog = Math.min(100, Math.round((sc / S.target) * 100));
          var nx = nextItem();
          var perDay = h ? Math.max(5, Math.round((h * 60) / S.days / 5) * 5) : 0;
          app.innerHTML =
            top("工作台 · Halvorsen", "已作答 " + S.events.length + " 题") +
            '<div class="x-card"><div class="x-split"><p class="x-label">预测阅读分</p><span class="chip">原型估算</span></div>' +
            '<div class="x-score"><span class="x-score__fig">' + sc + '</span><span class="x-score__pm">± ' + b + "</span></div>" +
            '<div class="x-bar" role="progressbar" aria-label="距目标进度" aria-valuemin="0" aria-valuemax="' + S.target + '" aria-valuenow="' + sc + '"><i style="width:' + prog + '%"></i></div>' +
            '<div class="x-barlabels"><span>当前 ' + sc + "</span><span>" + (sc >= S.target ? "已达目标" : "还差 " + (S.target - sc) + " 分") + "</span><span>目标 " + S.target + "</span></div></div>" +
            '<section class="stats"><div class="stat"><span class="stat__fig">' + rank(sc) + '</span><span class="stat__label">职级</span></div>' +
            '<div class="stat"><span class="stat__fig">' + S.days + ' 天</span><span class="stat__label">距离考试</span></div>' +
            '<div class="stat"><span class="stat__fig">' + (h ? "约 " + h + " 小时" : "已达标") + '</span><span class="stat__label">' + (h ? "预计学习时长 · 每天约 " + perDay + " 分钟" : "保持手感即可") + "</span></div></section>" +
            '<section class="x-group"><div class="x-split"><p class="x-h2">今日任务</p><span class="x-sub">按提分收益排序</span></div><ul class="checklist">' +
            S.plan.map(function (e, i) {
              return '<li><span class="checklist__item">' + (i + 1) + ". " + esc(S.nodes[e.id].name) + "<small>" + esc(reasonFor(e)) + "</small></span>" +
                '<span class="chip' + (i === 0 ? " chip--solid" : "") + '">+' + gain(e.id).toFixed(1) + " 分/时</span></li>";
            }).join("") + "</ul></section>" +
            '<section class="x-group"><div class="x-split"><p class="x-h2">开始一场</p><span class="x-sub">先选模式</span></div>' +
            '<div class="x-choices" role="group" aria-label="练习模式">' +
            ["quick", "standard", "exam"].map(function (k) {
              return '<button class="x-choice" data-mode="' + k + '" aria-pressed="' + (S.mode === k) + '">' + MODES[k].short + "<small>" + MODES[k].sub + "</small></button>";
            }).join("") + "</div>" +
            '<p class="x-sub">' + esc(modeDesc(S.mode)) + "</p></section>" +
            '<button class="x-cta" id="goSess">开始<small>' + MODES[S.mode].name + " · 倒计时 " + fmt(MODES[S.mode].secs) + "</small></button>" +
            (nx

          stopTimer();
          S.screen = "empty"; S.tab = "home";
          app.innerHTML = top("工作台", "") + '<div class="x-card"><p class="x-h2">题库已用完，下一版将按节点自动生成更多题</p><p class="x-sub">当前预测分 ' + score() + " ± " + band() + "（原型估算）。去能力图谱看看哪些节点还没达标。</p></div>" +
            '<div class="links"><button class="btn" id="eGraph">看能力图谱</button></div>';
          document.getElementById("eGraph").onclick = function () { go("graph"); };
          drawTabs();
        }

        /* ---------- practice (Part 5 reuse) ---------- */
        function openPractice(it) {
          stopTimer();
          S.screen = "practice"; S.tab = "home";
          app.innerHTML = top("工作台", "专项练习 · 目标 25 秒", "home") + whyLine(it) +
            '<div class="x-split"><span class="x-sub">Part 5 · ' + esc(S.nodes[it.node].name) + '</span><span class="x-timer" id="tm">0s</span></div>' + part5HTML(it);
          bindBack();
          var elapsed = startTimer(document.getElementById("tm"), { limit: 25 });
          bindOpts("opt", function (c) {
            var s = elapsed(); stopTimer();
            showFeedback(answer(it, c, s), launchNext);
            drawTabs();
          });
          drawTabs();
          window.scrollTo(0, 0);
        }

        /* ---------- 4 inbox ---------- */
        function rInbox() {
          app.innerHTML = top("收件箱", "Part 7 阅读理解") +
            '<div class="x-card x-card--line"><div class="x-rows">' +
            BANK.inbox.map(function (m) {
              var done = m.questions.filter(function (q, i) { return S.answered["p7:" + m.id + ":" + i]; }).length;
              var unread = !S.opened || !S.opened[m.id];
              return '<button class="x-row' + (unread ? " is-unread" : "") + '" data-mail="' + m.id + '"><span class="x-row__dot' + (unread ? "" : " is-read") + '"></span>' +
                "<span><strong>" + esc(m.from) + "</strong><small>" + esc(m.subject) + (m.type === "double" ? " · 附团队聊天" : "") + "</small></span>" +
                '<span class="pill">' + done + "/" + m.questions.length + " 已答</span></button>";
            }).join("") + "</div></div>" +
            '<p class="x-sub">每封邮件下面有老板的提问，一次一题，目标每题 60 秒。</p>';
          [].slice.call(app.querySelectorAll("[data-mail]")).forEach(function (b) {
            b.onclick = function () { openMail(b.getAttribute("data-mail"), null); };
          });
        }
        function openMail(id, qi, fromNext) {
          stopTimer();
          S.screen = "mail"; S.tab = "inbox";
          S.opened = S.opened || {};
          S.opened[id] = true;
          var m = BANK.inbox.filter(function (x) { return x.id === id; })[0];
          if (qi == null || S.answered["p7:" + id + ":" + qi]) {
            qi = null;
            for (var i = 0; i < m.questions.length; i++) if (!S.answered["p7:" + id + ":" + i]) { qi = i; break; }
          }
          var it = qi == null ? null : ITEMS.filter(function (x) { return x.key === "p7:" + id + ":" + qi; })[0];
          if (it && fromNext && fromNext.key === it.key) it.why = fromNext.why; else if (it) it.why = null;
          var chat = m.second
            ? '<div class="x-card"><p class="x-label">' + esc(m.second.label) + '</p><div class="x-chat">' +
              m.second.text.split("\n").map(function (line) {
                var k = line.indexOf("):");
                var who = k > 0 ? line.slice(0, k + 1) : "";
                var say = k > 0 ? line.slice(k + 2).trim() : line;
                return '<p class="x-bubble"><small>' + esc(who) + "</small>" + esc(say) + "</p>";
              }).join("") + "</div></div>"
            : "";
          app.innerHTML = top("收件箱", m.type === "double" ? "双篇阅读" : "单篇阅读", "inbox") + whyLine(it) +
            '<article class="x-card x-card--line"><p class="x-h2">' + esc(m.subject) + '</p><div class="x-mailhead"><span class="x-avatar" aria-hidden="true">' + esc(m.from.charAt(0)) + "</span>" +
            '<p class="x-sub"><strong>' + esc(m.from) + "</strong><br>收件人：" + esc(m.to) + '</p></div><p class="x-mailbody">' + esc(m.body) + "</p></article>" + chat +
            (it
              ? '<section class="x-card x-card--line"><div class="x-split"><p class="x-label">问题 ' + (qi + 1) + " / " + m.questions.length + ' · 目标 60 秒</p><span class="x-timer" id="tm">0s</span></div>' +
                '<p class="x-q">老板问你：' + esc(it.ref.q) + "</p>" + optsHTML(it.ref.options, "opt") + "</section>"
              : '<div class="x-card"><p class="x-h2">这封邮件的问题都答完了</p><button class="x-cta" id="goNext">开始下一题</button></div>');
          bindBack();
          if (it) {
            var elapsed = startTimer(document.getElementById("tm"), { limit: 60 });
            bindOpts("opt", function (c) {
              var s = elapsed(); stopTimer();
              showFeedback(answer(it, c, s), launchNext);
              drawTabs();
            });
          } else document.getElementById("goNext").onclick = launchNext;
          drawTabs();
          window.scrollTo(0, 0);
        }

        /* ---------- 5 draft ---------- */
        S.fills = {};
        function openDraft(n, fromNext) {
          stopTimer();
          S.screen = "draft"; S.tab = "draft";
          var d = BANK.drafts[0];
          var open = d.blanks.filter(function (b) { return !S.answered["p6:" + d.id + ":" + b.n]; });
          if (n == null || S.answered["p6:" + d.id + ":" + n]) n = open.length ? open[0].n : null;
          S.draftSlot = n;
          var blank = n == null ? null : d.blanks.filter(function (b) { return b.n === n; })[0];
          var it = blank ? ITEMS.filter(function (x) { return x.key === "p6:" + d.id + ":" + n; })[0] : null;
          if (it) it.why = fromNext && fromNext.key === it.key ? fromNext.why : null;
          var text = esc(d.text_parts.join("")).replace(/\[(\d)\]/g, function (all, k) {
            k = +k;
            var f = S.fills[k];
            var b = d.blanks.filter(function (x) { return x.n === k; })[0];
            if (f != null) return '<button class="x-slot ' + (f === b.answer ? "is-right" : "is-wrong") + '" disabled>[' + k + "] " + esc(b.options[f]) + (f === b.answer ? " ✓" : " ✗") + "</button>";
            return '<button class="x-slot' + (k === n ? " is-active" : "") + '" data-slot="' + k + '" aria-label="第 ' + k + ' 空，点开选项">[' + k + "] ______</button>";
          });
          app.innerHTML = top("改稿", "Part 6 · 每空目标 30 秒") + whyLine(it) +
            '<p class="x-sub">' + esc(d.from) + " 发来草稿，请帮忙把空填好再发出。点编号查看选项。</p>" +
            '<article class="x-card x-card--line"><p class="x-h2">' + esc(d.title) + '</p><p class="x-memo">' + text + "</p></article>" +
            (blank
              ? '<section class="x-card x-card--line"><div class="x-split"><p class="x-label">第 [' + n + "] 空 · " + esc(S.nodes[blank.node].name) + '</p><span class="x-timer" id="tm">0s</span></div>' + optsHTML(blank.options, "opt") + "</section>"
              : '<div class="x-card"><p class="x-h2">草稿已改完，已发回给 Amira</p><button class="x-cta" id="goNext">开始下一题</button></div>');
          [].slice.call(app.querySelectorAll("[data-slot]")).forEach(function (b) {
            b.onclick = function () { openDraft(+b.getAttribute("data-slot")); };
          });
          if (blank) {
            if (S.draftClock == null) S.draftClock = Date.now();
            var t0 = S.draftClock;
            var tm = document.getElementById("tm");
            S.timer = setInterval(function () {
              var s = Math.round((Date.now() - t0) / 1000);
              tm.textContent = s + "s";
              tm.classList.toggle("is-over", s > 30);
            }, 250);
            bindOpts("opt", function (c) {
              var s = Math.max(1, Math.round((Date.now() - t0) / 1000));
              stopTimer();
              S.fills[n] = c;
              S.draftClock = null;
              var out = answer(it, c, s);
              openDraft(null);
              showFeedback(out, launchNext);
            });
          } else document.getElementById("goNext").onclick = launchNext;
          drawTabs();
          window.scrollTo(0, 0);
        }

        /* ---------- 6 urgent ---------- */
        function openUrgent(fromNext) {
          stopTimer();
          S.screen = "urgent"; S.tab = "urgent";
          var it = ITEMS.filter(function (x) { return x.kind === "urgent"; })[0];
          var u = it.ref;
          var done = S.answered[it.key];
          it.why = fromNext ? fromNext.why : null;
          var last = S.events.filter(function (e) { return e.item === it.key; })[0];
          app.innerHTML = top("紧急任务", "限时 " + u.seconds + " 秒") + (done ? "" : whyLine(it)) +
            '<div class="x-banner' + (done ? " is-done" : "") + '" role="timer"><div><p class="x-h2">Mark 需要 90 秒内答复</p><p class="x-sub">' +
            (done ? (last && last.correct ? "已按时答复" : "已处理（记为答错）") : "倒计时结束算作答错且慢") + '</p></div><span class="x-banner__count" id="cd">' + (done ? "—" : u.seconds + "s") + "</span></div>" +
            '<div class="x-card"><p class="x-label">#ops-team</p><div class="x-chat">' +
            u.thread.map(function (line) {
              var k = line.indexOf("):");
              return '<p class="x-bubble"><small>' + esc(line.slice(0, k + 1)) + "</small>" + esc(line.slice(k + 2).trim()) + "</p>";
            }).join("") + "</div></div>" +
            (done
              ? '<div class="x-card"><p class="x-h2">这条已经处理完</p><button class="x-cta" id="goNext">开始下一题</button></div>'
              : '<section class="x-card x-card--line"><p class="x-q">老板问你：' + esc(u.q) + "</p>" + optsHTML(u.options, "opt") + "</section>");
          if (done) { document.getElementById("goNext").onclick = launchNext; drawTabs(); return; }
          if (S.urgentStart == null) S.urgentStart = Date.now();
          var t0 = S.urgentStart, cd = document.getElementById("cd");
          function finish(c) {
            stopTimer();
            var s = c < 0 ? u.seconds : Math.max(1, Math.round((Date.now() - t0) / 1000));
            if (c < 0) s = u.seconds + 1;
            var out = answer(it, c, s);
            openUrgent();
            showFeedback(out, launchNext);
          }
          function tick() {
            var left = u.seconds - Math.floor((Date.now() - t0) / 1000);
            cd.textContent = Math.max(0, left) + "s";
            if (left <= 0) finish(-1);
          }
          S.timer = setInterval(tick, 250);
          tick();
          bindOpts("opt", finish);
          drawTabs();
          window.scrollTo(0, 0);
        }

        /* ---------- 7 graph + 8 log ---------- */
        var W = 90, H = 44, COLX = [20, 132, 244, 356], ROW0 = 48, GAP = 54;
        var LNAME = { 语法: "考察点 · 语法", 词汇: "考察点 · 词汇", 题型: "题型", 策略: "应试技巧" };
        var POS = {};
        LAYERS.forEach(function (L, c) {
          BANK.nodes.filter(function (n) { return n.layer === L; }).forEach(function (n, r) { POS[n.id] = { x: COLX[c], y: ROW0 + r * GAP, c: c }; });
        });
        function mclass(m) {
          if (!m.measured) return m.inferred ? "x-m--inferred" : "x-m--none";
          return m.p < 0.4 ? "x-m--red" : m.p <= 0.7 ? "x-m--amber" : "x-m--green";
        }
        function graphSVG() {
          var sel = S.selNode;
          var maxRows = 8, hgt = ROW0 + maxRows * GAP;
          var edges = "";
          BANK.nodes.forEach(function (n) {
            n.prereq.forEach(function (pid) {
              var a = POS[pid], b = POS[n.id];
              var on = sel && (sel === n.id || sel === pid);
              var d;
              if (a.c === b.c) {
                var x = a.x, bulge = Math.min(18, 8 + 2 * Math.abs(b.y - a.y) / GAP);
                d = "M" + x + "," + (a.y + H / 2) + " C" + (x - bulge) + "," + (a.y + H / 2) + " " + (x - bulge) + "," + (b.y + H / 2) + " " + (x - 2) + "," + (b.y + H / 2);
              } else {
                var x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
                d = "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2;
              }
              edges += '<path class="x-edge' + (on ? " is-on" : "") + '" d="' + d + '" marker-end="url(#arr)"/>';
            });
          });
          var heads =
            '<text class="x-colhead" x="' + (COLX[0] + COLX[1] + W) / 2 + '" y="14" text-anchor="middle">考察点</text>' +
            '<path class="x-edge" d="M' + COLX[0] + ",21 H" + (COLX[1] + W) + '"/>' +
            '<text class="x-nsub" x="' + (COLX[0] + W / 2) + '" y="36" text-anchor="middle">语法</text>' +
            '<text class="x-nsub" x="' + (COLX[1] + W / 2) + '" y="36" text-anchor="middle">词汇</text>' +
            '<text class="x-colhead" x="' + (COLX[2] + W / 2) + '" y="14" text-anchor="middle">题型</text>' +
            '<text class="x-colhead" x="' + (COLX[3] + W / 2) + '" y="14" text-anchor="middle">应试技巧</text>';
          var nodes = BANK.nodes.map(function (n) {
            var m = S.nodes[n.id], p = POS[n.id];
            var sub = m.measured ? n.id + " · " + pct(m.p) : m.inferred ? n.id + " · 推断 " + pct(m.p) : n.id + " · 未测";
            return '<g class="x-node ' + mclass(m) + (sel === n.id ? " is-sel" : "") + '" data-node="' + n.id + '" tabindex="0" role="button" aria-label="' + esc(n.name + "，" + sub) + '">' +
              '<rect x="' + p.x + '" y="' + p.y + '" width="' + W + '" height="' + H + '" rx="10"/>' +
              '<text x="' + (p.x + W / 2) + '" y="' + (p.y + 18) + '" text-anchor="middle">' + esc(n.name) + "</text>" +
              '<text class="x-nsub" x="' + (p.x + W / 2) + '" y="' + (p.y + 35) + '" text-anchor="middle">' + sub + "</text></g>";
          }).join("");
          return '<svg width="' + (COLX[3] + W + 4) + '" height="' + hgt + '" viewBox="0 0 ' + (COLX[3] + W + 4) + " " + hgt + '" role="group" aria-label="能力图谱：20 个节点，分为考察点（语法、词汇）、题型、应试技巧">' +
            '<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill: var(--text-secondary)"/></marker></defs>' +
            heads + edges + nodes + "</svg>";
        }
        function nodeDetail(id) {
          var m = S.nodes[id];
          var left = ITEMS.filter(function (it) { return it.node === id && !S.answered[it.key]; }).length;
          var pre = m.prereq.length
            ? m.prereq.map(function (pid) {
                var q = S.nodes[pid];
                return '<div class="row"><dt>' + esc(q.name) + "<small>" + pid + " · " + (q.measured ? "基于 " + q.n + " 次作答" : q.inferred ? "推断" : "未测") + "</small></dt><dd>" + pct(q.p) + (q.p < 0.6 ? " · 待补" : " · 已过线") + "</dd></div>";
              }).join("")
            : '<div class="row"><dt>前置</dt><dd>无</dd></div>';
          var g = gateFor(id);
          return '<div class="x-card x-card--line"><div class="x-split"><p class="x-h2">' + esc(m.name) + '</p><span class="pill">' + id + " · " + LNAME[m.layer] + "</span></div>" +
            '<div class="breakdown"><dl>' +
            '<div class="row"><dt>掌握度<small>' + (m.measured ? "基于 " + m.n + " 次作答" : m.inferred ? "推断：只受前置/后续题连带更新" : "尚未测量，默认 50%") + "</small></dt><dd>" + pct(m.p) + "</dd></div>" +
            '<div class="row"><dt>考试频率</dt><dd>' + Math.round(m.freq * 100) + "%</dd></div>" +
            '<div class="row"><dt>提分收益<small>freq × (1−p) × 490 ÷ ' + COST[m.layer] + " 小时</small></dt><dd>+" + gain(id).toFixed(1) + " 分/时</dd></div>" +
            pre + "</dl></div>" +
            (g ? '<p class="x-sub">先补前置：' + esc(g.name) + "（" + pct(g.p) + " &lt; 60%），系统会先安排它。</p>" : "") +
            '<button class="x-cta" id="drill"' + (left ? "" : " disabled") + ">" + (left ? "练这个<small>还有 " + left + " 道题</small>" : "这个节点的题已做完") + "</button></div>";
        }
        function logTable() {
          if (!S.events.length) return '<p class="x-sub">还没有作答记录。</p>';
          var cols = ["题目", "节点", "选择", "对错", "用时", "掌握度"];
          return '<div class="table-wrap"><table><caption>每一条作答都是数据集：用来校准题目难度和图谱依赖</caption><thead><tr>' +
            cols.map(function (c) { return '<th scope="col">' + c + "</th>"; }).join("") + "</tr></thead><tbody>" +
            S.events.slice().reverse().map(function (e) {
              return '<tr><th scope="row">' + esc(e.item) + "<small>#" + e.seq + " · " + esc(e.screen) + "</small></th>" +
                '<td data-label="节点">' + esc(e.node) + "</td>" +
                '<td data-label="选择">' + esc(e.choice) + "</td>" +
                '<td data-label="对错">' + (e.correct ? "✓ 对" : "✗ 错") + "</td>" +
                '<td data-label="用时" class="num">' + e.seconds + "s <small>目标 " + e.limit + "s</small></td>" +
                '<td data-label="掌握度" class="num">' + pct(e.mastery_before) + " → " + pct(e.mastery_after) + "</td></tr>";
            }).join("") + "</tbody></table></div>";
        }
        function rGraph() {
          if (!S.selNode) S.selNode = S.plan.length ? S.plan[0].id : "G1";
          app.innerHTML = top("能力图谱", "预测 " + score() + " ± " + band() + " · 原型估算") +
            '<ul class="x-legend"><li><i style="background: color-mix(in srgb, var(--fill-system-red) 24%, var(--fill-primary-on)); border-color: var(--fill-system-red)"></i>&lt;40%</li>' +
            '<li><i style="background: color-mix(in srgb, var(--fill-system-orange) 22%, var(--fill-primary-on)); border-color: var(--fill-system-orange)"></i>40–70%</li>' +
            '<li><i style="background: color-mix(in srgb, var(--fill-system-green) 24%, var(--fill-primary-on)); border-color: var(--fill-system-green)"></i>&gt;70%</li>' +
            '<li><i style="background: var(--fill-tertiary); border-color: var(--stroke-primary)"></i>未测</li>' +
            '<li><i style="background: var(--fill-tertiary); border-color: var(--text-secondary); border-style: dashed"></i>推断</li></ul>' +
            '<div class="x-graph">' + graphSVG() + "</div>" +
            '<p class="x-sub">箭头从前置指向后续。点节点看详情，左右滑动看全部 4 列。</p>' +
            '<p class="fineprint">原型只放了 20 个节点；完整版约 300 个，含三篇阅读、文章类型（广告、表格、文章、短信）等</p>' +
            nodeDetail(S.selNode) +
            '<section class="x-group"><div class="x-split"><p class="x-h2">作答记录</p><span class="x-sub">' + S.events.length + " 条</span></div>" + logTable() +
            '<div class="links"><button class="btn" id="exportBtn">导出 JSON</button></div><div id="exportBox"></div></section>' +
            '<div class="x-group"><p class="fineprint">题目为原创，风格对标 ETS 官方样题格式，词汇限定在 NGSL + TOEIC Service List（Browne &amp; Culligan, CC BY-SA 4.0）范围内，人名地名除外。</p>' +
            '<p class="fineprint">预测分与学习时长为原型算法估算，需用真实作答数据校准。</p></div>';
          [].slice.call(app.querySelectorAll("[data-node]")).forEach(function (g) {
            function pick() { S.selNode = g.getAttribute("data-node"); var y = window.scrollY; rGraph(); drawTabs(); window.scrollTo(0, y); }
            g.addEventListener("click", pick);
            g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
          });
          document.getElementById("drill").onclick = function () {
            var id = S.selNode;
            var it = ITEMS.filter(function (x) { return x.node === id && !S.answered[x.key]; })[0];
            if (!it) { toast("这个节点的题已做完，下一版将按节点自动生成更多题"); return; }
            it.why = "你在图谱里选了这个节点";
            launch(it);
          };
          document.getElementById("exportBtn").onclick = function () {
            var payload = {
              exported_at: new Date().toISOString(),
              bank_version: BANK.meta.version,
              settings: { target: S.target, days: S.days },
              predicted: { score: score(), band: band(), label: "原型估算" },
              mastery: BANK.nodes.map(function (n) { var m = S.nodes[n.id]; return { id: n.id, name: n.name, p: +m.p.toFixed(3), n: m.n, status: m.measured ? "measured" : m.inferred ? "inferred" : "unmeasured" }; }),
              events: S.events
            };
            document.getElementById("exportBox").innerHTML = '<label class="x-label" for="exportTa">全部作答事件（可全选复制）</label><textarea class="x-textarea" id="exportTa" readonly></textarea>';
            var ta = document.getElementById("exportTa");
            ta.value = JSON.stringify(payload, null, 2);
            ta.focus(); ta.select();
          };
        }

        S.plan = planTop(3);
        go("onboard");
      })();
    </script>
  </body>
</html>
